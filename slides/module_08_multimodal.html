<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMs 0 to 100</title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <!-- KaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>

  <!-- Module-specific <head> includes (e.g. Chart.js); empty for most modules -->
  

  <!-- Shared styles + per-module overrides, inlined by the build -->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

/* ===========================================
   CSS VARIABLES
   =========================================== */
:root {
  --background-color: #0a0e1a;
  --section-divider-bg: #0d1225;

  --heading-font: "Space Grotesk", Helvetica, sans-serif;
  --body-font: "Inter", Helvetica, sans-serif;
  --base-font-size: 32px;
  --text-size: 16pt;
  --h1-size: 48pt;
  --h2-size: 36pt;
  --h3-size: 24pt;
  --footnote-size: 11pt;

  --primary-color: #4a9eff;
  --secondary-color: #f5a623;
  --text-color: #e8eaf0;
  --muted-color: #8892a4;
  --line-color: #2a3450;

  --slide-padding: 60px;
  --slide-padding-top: 24px;
  --content-gap: 18px;

  --box-radius: 8px;
}

/* ===========================================
   BASE STYLES
   =========================================== */

.reveal {
  font-family: var(--body-font);
  font-size: var(--base-font-size);
}

.reveal strong,
.reveal b {
  font-weight: bold;
}

.reveal a {
  color: var(--primary-color);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.reveal a:hover {
  color: var(--text-color);
}

.reveal-viewport {
  background-color: var(--background-color);
}

.reveal-viewport.is-section-divider .slide-background.present {
  background-color: var(--section-divider-bg) !important;
}

.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4,
.reveal h5,
.reveal h6 {
  font-family: var(--heading-font);
  text-transform: none;
  color: var(--text-color);
  font-weight: 600;
  line-height: 1.2;
}

.reveal h1 { font-size: var(--h1-size); }
.reveal h2 { font-size: var(--h2-size); margin-bottom: 0; }
.reveal h3 { font-size: var(--h3-size); }

.reveal p,
.reveal li,
.reveal td,
.reveal th,
.reveal blockquote {
  font-size: var(--text-size);
  color: var(--text-color);
  line-height: 1.5;
}

/* Vertical separation between newline-separated sentences on text slides.
   Scoped to a slide's top-level paragraphs (the prose flow); paragraphs
   nested inside components (terminal captions, figure cards, grid columns)
   keep their own tighter spacing so dense component slides do not overflow.
   Adjacent margins collapse, so the gap between two paragraphs is 0.9em. */
.reveal .slides section > p {
  margin: 0.4em 0 0.9em 0;
}

/* ===========================================
   LISTS
   =========================================== */

.reveal ul {
  list-style: none;
  padding-left: 0;
  margin: 15px 0;
}

.reveal ul li {
  position: relative;
  padding-left: 25px;
  margin-bottom: 10px;
}

.reveal ul li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.6em;
  width: 8px;
  height: 8px;
  background: var(--primary-color);
  border-radius: 50%;
}

.reveal ul ul li::before {
  background: var(--muted-color);
  width: 6px;
  height: 6px;
}

.reveal blockquote p {
  font-size: inherit;
}

/* ===========================================
   SLIDE LAYOUT
   =========================================== */

.reveal .slides section {
  height: 100%;
  display: flex !important;
  flex-direction: column !important;
  padding: var(--slide-padding-top) var(--slide-padding) var(--slide-padding) var(--slide-padding) !important;
  box-sizing: border-box;
  text-align: left;
  /* Any slide whose content runs past the bottom scrolls instead of clipping.
     The scrollbar only appears when needed. */
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: #30363d transparent;
}

.reveal .slides section::-webkit-scrollbar {
  width: 8px;
}

.reveal .slides section::-webkit-scrollbar-thumb {
  background: #30363d;
  border-radius: 4px;
}

.reveal .slides section.stack {
  padding: 0 !important;
}

.reveal .slides section > .content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: var(--content-gap);
  text-align: left;
}

.reveal .slides section > .footnote {
  position: absolute;
  bottom: 15px;
  left: var(--slide-padding);
  right: var(--slide-padding);
  font-size: var(--footnote-size);
  color: var(--muted-color);
}

/* ===========================================
   SECTION DIVIDERS
   =========================================== */

.reveal .slides section.section-divider {
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}

.reveal .slides section.section-divider h1 {
  font-size: 56pt;
  text-align: center;
  color: var(--primary-color);
}

.reveal .slides section.section-divider p {
  font-size: 20pt;
  color: var(--muted-color);
}

/* ===========================================
   TEXT SIZE UTILITIES
   =========================================== */

.text-lg { font-size: 18pt !important; }
.text-xl { font-size: 20pt !important; }
.text-2xl { font-size: 24pt !important; }
.text-3xl { font-size: 28pt !important; }
.text-4xl { font-size: 32pt !important; }

.text-muted { color: var(--muted-color) !important; }
.text-center { text-align: center !important; }
.text-uppercase { text-transform: uppercase; letter-spacing: 0.1em; }
.font-light { font-weight: 300; }
.font-bold { font-weight: 600; }

/* ===========================================
   BLOCKQUOTES
   =========================================== */

.reveal blockquote {
  border-left: 4px solid var(--primary-color);
  padding-left: 20px;
  margin: 20px 0;
  font-style: italic;
  background: none;
  box-shadow: none;
  width: 100%;
  max-width: none;
}

.reveal blockquote cite {
  display: block;
  margin-top: 10px;
  font-style: normal;
  color: var(--muted-color);
}

/* ===========================================
   ACCENT UNDERLINE ON TITLES
   =========================================== */

.reveal .slides section > h2 {
  flex-shrink: 0;
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line-color);
}

/* ===========================================
   FIGURE CARD - for notable figures slides
   =========================================== */

.figure-card {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  align-items: start;
}

.figure-card img {
  border-radius: var(--box-radius);
  width: 100%;
  box-shadow: 0 4px 20px rgba(74, 158, 255, 0.15);
}

.figure-card .figure-info h3 {
  margin: 0 0 5px 0;
  color: var(--secondary-color);
  font-size: 14pt;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ===========================================
   ERA BADGE - for timeline labels
   =========================================== */

.era-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12pt;
  font-weight: 500;
}

.era-badge.summer {
  background: rgba(245, 166, 35, 0.2);
  color: var(--secondary-color);
}

.era-badge.winter {
  background: rgba(74, 158, 255, 0.15);
  color: #6cb4ff;
}

.era-badge.spring {
  background: rgba(80, 200, 120, 0.2);
  color: #50c878;
}

/* ===========================================
   HIGHLIGHT BOX
   =========================================== */

.highlight-box {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
}

/* Exercise hint: a single fragment that reveals the whole hint at once.
   The wrapping .fragment div is what animates; this just sizes the text
   (matching the old text-lg intent) and removes the global paragraph
   margin so the one-line hint is not double-spaced. */
.reveal .hint-box p {
  font-size: 18pt;
  margin: 0;
}

/* ===========================================
   COURSE STRUCTURE
   =========================================== */

.course-summary {
  max-width: 1120px;
  margin: 0 0 16px 0;
  color: #f0f4fb;
  font-size: 18pt !important;
  line-height: 1.4 !important;
}

.course-track-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

.module-track-card {
  background: rgba(74, 158, 255, 0.07);
  border: 1px solid rgba(74, 158, 255, 0.22);
  border-radius: var(--box-radius);
  padding: 20px 22px;
}

.module-track-kicker {
  font-size: 12pt;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--secondary-color);
  margin-bottom: 8px;
}

.module-track-card h3 {
  margin: 0 0 8px 0;
}

.module-track-intro {
  font-size: 14pt !important;
  color: #d7ddea !important;
  margin: 0 0 10px 0;
  line-height: 1.4 !important;
}

.compact-list {
  margin: 0;
}

.reveal ul.compact-list li {
  font-size: 16pt;
  line-height: 1.35;
  margin-bottom: 7px;
  padding-left: 20px;
}

.course-note {
  margin-top: 14px;
  color: #d7ddea;
  font-size: 15pt !important;
  line-height: 1.35 !important;
}

.course-glossary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  margin-top: 14px;
}

.glossary-item {
  background: rgba(245, 166, 35, 0.08);
  border: 1px solid rgba(245, 166, 35, 0.18);
  border-radius: var(--box-radius);
  padding: 12px 14px;
}

.glossary-item strong {
  color: var(--secondary-color);
}

.glossary-item p {
  font-size: 13pt !important;
  color: #d7ddea !important;
  margin: 6px 0 0 0;
  line-height: 1.4;
}

/* ===========================================
   TERMINAL OUTPUT
   =========================================== */

.terminal-output {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 0;
  max-width: 800px;
  margin: 0 auto;
  text-align: left;
}

.terminal-output .terminal-bar {
  background: #161b22;
  border-radius: 8px 8px 0 0;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.terminal-output .terminal-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.terminal-output .terminal-dot.red { background: #ff5f57; }
.terminal-output .terminal-dot.yellow { background: #febc2e; }
.terminal-output .terminal-dot.green { background: #28c840; }

.terminal-output .terminal-title {
  color: #8b949e;
  font-family: monospace;
  font-size: 10pt;
  margin-left: 8px;
}

.terminal-output .terminal-body {
  padding: 15px 20px;
}

.terminal-output .terminal-body pre {
  margin: 0;
  background: none !important;
  box-shadow: none !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output.dense .terminal-body {
  padding: 10px 20px;
}

.reveal .terminal-output.dense .terminal-body pre.terminal-pre {
  font-size: 9pt;
  line-height: 1.28;
}

.reveal .terminal-output .terminal-body pre.terminal-pre span {
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre p {
  display: inline;
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
  margin: 0 !important;
  color: inherit;
}

.reveal .terminal-output .terminal-body pre code {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output .terminal-body .prompt {
  color: #8b949e;
}

.terminal-output .terminal-body .success {
  color: #3fb950;
}

.terminal-output .terminal-body .header {
  font-weight: bold;
}

.terminal-output .terminal-body .skipped {
  color: #8b949e;
  font-style: italic;
}

/* ===========================================
   TURNING POINT SLIDE
   =========================================== */

.turning-point h2 {
  border-bottom-color: var(--secondary-color) !important;
}

/* ===========================================
   CODE BLOCKS
   =========================================== */

.reveal pre {
  margin-bottom: 0;
  width: 100%;
  box-sizing: border-box;
  box-shadow: none !important;
  background: none !important;
}

.reveal pre code {
  font-size: 14pt;
  line-height: 1.4;
  padding: 10px 20px;
  border-radius: var(--box-radius);
  background: rgba(20, 25, 45, 0.8);
  color: var(--text-color);
  max-height: 400px;
}

.reveal pre code .hljs-keyword,
.reveal pre code .hljs-built_in {
  color: #c792ea;
}

.reveal pre code .hljs-string {
  color: #c3e88d;
}

.reveal pre code .hljs-comment {
  color: #546e7a;
}

.reveal pre code .hljs-number {
  color: #f78c6c;
}

.reveal code {
  color: var(--text-color);
}

/* ===========================================
   MATH (KaTeX)
   =========================================== */

.katex {
  color: var(--text-color);
  font-size: 1.1em;
}

.katex-display {
  margin: 15px 0;
}

.katex-display > .katex {
  font-size: 1.3em;
}

/* ===========================================
   VIDEO CONTAINERS
   =========================================== */

.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-container video,
.video-container img {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--box-radius);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
}

/* ===========================================
   SIDE QUEST BADGE
   =========================================== */

.side-quest-badge {
  display: inline-block;
  background: rgba(245, 166, 35, 0.15);
  color: var(--secondary-color);
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12pt;
  font-weight: 500;
  margin-bottom: 10px;
}

/* ===========================================
   TERMINAL OUTPUT - ANSI COLOR PALETTE
   Replaces inline `style="color:#..."` on spans
   inside .terminal-pre. A rule on the span itself
   overrides the color inherited from .terminal-pre.
   =========================================== */

.terminal-output .terminal-body .t-red    { color: #e06c75; }
.terminal-output .terminal-body .t-orange { color: #d19a66; }
.terminal-output .terminal-body .t-yellow { color: #e5c07b; }
.terminal-output .terminal-body .t-green  { color: #98c379; }
.terminal-output .terminal-body .t-cyan   { color: #56b6c2; }
.terminal-output .terminal-body .t-blue   { color: #61afef; }
.terminal-output .terminal-body .t-gray   { color: #8b949e; }
.terminal-output .terminal-body .t-fg     { color: #e8eaf0; }
.terminal-output .terminal-body .t-fail   { color: #e74c3c; }

.terminal-caption {
  margin-top: 15px;
  text-align: center;
}

/* ===========================================
   TIMELINE (module 1) - per-node structure
   Positional left/width and per-era colors stay
   inline; this captures the repeated boilerplate.
   =========================================== */

.tl-node  { position: absolute; transform: translateX(-50%); text-align: center; }
/* .reveal prefix needed: `.reveal p` (0,1,1) sets color/font-size and would
   otherwise beat a bare .tl-* class. The original used inline styles. */
.reveal .tl-label { font-size: 10pt; color: var(--muted-color); white-space: nowrap; margin: 0; }
.reveal .tl-year  { font-size: 11pt; font-weight: 600; margin: 2px 0 0 0; }
.tl-stem  { width: 1px; opacity: 0.5; margin: 2px auto 0; }
.tl-dot   { width: 10px; height: 10px; border-radius: 50%; margin: 0 auto; }

.tl-node.below .tl-stem  { margin: 0 auto; }
.tl-node.below .tl-year  { margin: 0; }
.tl-node.below .tl-label { margin: 2px 0 0 0; }

/* ===========================================
   CANONICAL SLIDE TYPES
   Backs the :::divider / :::columns / :::note /
   :::quiz / :::step / :::interactive fences so
   slides.md carries no inline layout styles.
   (.section-divider, .figure-card, .terminal-output,
    .hint-box are defined above and reused.)
   =========================================== */

/* :::columns - grid; template/gap/valign supplied by the build */
.reveal .slide-columns {
  display: grid;
  align-items: start;
  margin: 10px 0;
}

/* :::note - callout box (canonical replacement for .highlight-box) */
.reveal .note {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
  margin: 20px 0;
}

.reveal .note p {
  font-size: 18pt;
  margin: 0;
}

.reveal .note p + p {
  margin-top: 0.6em;
}

/* :::note variant="hint" - lighter, boxless (also used inside :::step) */
.reveal .note.hint-box {
  background: none;
  border: none;
  padding: 0;
}

/* :::quiz - prompt scales up; its last line is the question */
.reveal .quiz-prompt p {
  font-size: 18pt;
  margin: 0 0 0.6em 0;
}

.reveal .quiz-prompt p:last-child {
  font-size: 24pt;
  color: var(--text-color);
  margin: 0.5em 0 0 0;
}

.reveal .quiz-answer {
  margin-top: 30px;
}

/* :::step - spacing between code, hint, and answer */
.reveal .hint-box {
  margin-top: 22px;
}

.reveal .hint-box + .note {
  margin-top: 8px;
  padding: 12px 18px;
}

/* :::interactive - widget fills the slide body like a video */
.reveal .interactive-host {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

/* ===========================================
   SHARED INTERACTIVE WIDGET CHROME (.iw-*)
   Used by the :::interactive widgets defined in each module's config.js.
   Module 3 predates this and keeps its own .m3-* chrome.
   =========================================== */

.iw {
  display: flex;
  flex-direction: column;
  justify-content: center;   /* only bites when the content does not fill the slide */
  gap: 12px;
  width: 100%;
  height: 100%;
}

.iw-canvas-wrap {
  flex: 1;
  min-height: 0;
  width: 100%;
}

.iw-canvas {
  width: 100%;
  height: 100%;
  min-height: 0;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.iw-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.iw-btn {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: rgba(74, 158, 255, 0.10);
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 6px;
  padding: 7px 16px;
  cursor: pointer;
}

.iw-btn:hover {
  background: rgba(74, 158, 255, 0.22);
}

.iw-btn.iw-primary,
.iw-btn.active {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: #0a0e1a;
  font-weight: 600;
}

.iw-btn.iw-reset {
  background: rgba(245, 166, 35, 0.12);
  border-color: rgba(245, 166, 35, 0.40);
  color: var(--secondary-color);
}

.iw-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.iw-label {
  font-size: 12pt;
  color: var(--muted-color);
  margin: 0 2px 0 10px;
}

.reveal .iw-readout {
  font-size: 13pt;
  color: var(--muted-color);
  text-align: center;
  margin: 0;
  min-height: 1.4em;
}

.reveal .iw-readout strong {
  color: var(--secondary-color);
}

.iw-sliders {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 4px 18px;
  width: 100%;
  max-width: 100%;
  margin: 0 auto;
}

.iw-slider {
  display: grid;
  grid-template-columns: minmax(72px, auto) 1fr 58px;
  align-items: center;
  gap: 9px;
}

.reveal .iw-slider label {
  font-size: 11.5pt;
  color: var(--primary-color);
  font-weight: 600;
  margin: 0;
}

.iw-slider input[type="range"] {
  width: 100%;
  accent-color: var(--primary-color);
}

.reveal .iw-slider .iw-val {
  font-size: 11.5pt;
  color: var(--text-color);
  font-family: monospace;
  text-align: right;
  margin: 0;
}

.iw-text-input {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: 6px;
  padding: 7px 12px;
  width: 100%;
  max-width: 620px;
}

/* DOM-based widget pieces: token chips, panels, and two-column bodies. */

.iw-body {
  flex: 1;

# LLMs 0 to 100

Module 8: Multimodal Models


---

<!-- .slide: id="review-post-training" -->

## Review: Where Module 7 Left Us

The modern stack so far:

- **Pretraining** gives broad capability
- **SFT** teaches instruction-following
- **RL** / preference optimization shapes behavior with scalar feedback

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Unchanged since Modules 3-4**

- Embeddings enter a sequence model
- **Attention** mixes information
- **Logits** predict the next token
- **Gradients** update weights

</div>

<div>

**What changes now**

- The **input space**
- Images, audio, video, and sensor streams must become representations the model can use

</div>

</div>

This module's question: **how do we turn non-text data into tokens or embeddings that live beside words?** <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="review-callback" -->

## Review: The Through-Line Still Holds

Module 5: **next-token pretraining**. Module 6: **response format**. Module 7: **behavior from feedback**. Module 8 adds **perceptual conditions** to the context.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Reused wholesale**

- The Module 4 transformer, unchanged
- Cross-entropy and the masked SFT loss of Modules 5 and 6
- The same SFT, preference, and RLHF post-training of Module 7

</div>

<div>

**Newly hard**

- **Reward and evaluation**
- Visual and audio mistakes can be subtle, spatial, temporal, or safety-critical

</div>

</div>

<!-- .slide: id="divider-what" class="section-divider" data-state="is-section-divider" -->

# What Multimodal Means

Connecting language to perception


---

<!-- .slide: id="what-modality" -->

## A Modality Is a Type of Signal

- A **modality** is a signal with its own structure: text, image, audio, video, depth, sensor readings, code-execution traces
- A **multimodal model** connects two or more in one system

<div class="card-grid cols-2">
<div class="card"><h4>Understanding</h4><p>Condition on an image, clip, video, or document and answer in <strong>text</strong>.</p></div>
<div class="card"><h4>Retrieval</h4><p>Match images to captions, speech to transcripts, screenshots to descriptions.</p></div>
<div class="card"><h4>Action</h4><p>Perceive a state, decide, and call a tool, control a robot, or drive a UI.</p></div>
</div>

Main object: the **multimodal LLM**, a language model whose context includes non-text representations interleaved with text tokens. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="what-why" -->

## Why It Matters

Many real tasks connect **language to perception**:

- Read a chart, debug a screenshot, describe a medical image
- Transcribe speech, understand a lecture video, use a computer

The unifying abstraction: **every modality gets compressed into a sequence**, either

- **discrete tokens** (text tokens, audio codec tokens), or
- continuous **embedding vectors** (image patch features projected into the LLM's hidden size)

The recipe: **choose a representation, align it with language, train the model to use it.** <!-- .element: class="text-lg" style="margin-top: 10px;" -->

---

<!-- .slide: id="what-tensions" -->

## Two Tensions That Shape Everything

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Bandwidth**

- Text: symbolic, low-bandwidth
- Pixels and waveforms: continuous, high-bandwidth
- One high-resolution image or one minute of audio dwarfs a 1,000-token paragraph

</div>

<div>

**Order**

- Language: ordered left to right
- Images: 2-D layout. Audio: fine-grained time. Video: both
- Flattening into a sequence throws away structure unless positional information restores it

</div>

</div>

The whole module answers these two tensions: **compress the high-bandwidth signal, keep its structure once flattened.** <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="divider-tokenization" class="section-divider" data-state="is-section-divider" -->

# Images Are Not Words

Visual tokenization


---

<!-- .slide: id="tok-raw" -->

## Start With the Raw Object

An image is a **tensor**, usually $H \times W \times C$, not a list of words.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**What makes images different**

- Neighboring pixels matter
- Two-dimensional position matters
- Small translations often should *not* change the meaning

</div>

<div>

**Two recipes**

- **CNNs** build local edge and texture features with sliding filters (the older computer-vision path)
- **Transformers** treat an image as a **sequence of patches** (the recipe that unified vision with language models)

</div>

</div>

To feed an image to a transformer, cut it into a sequence. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="fig-dosovitskiy" -->

<div class="figure-card">

![Alexey Dosovitskiy and the ViT team](module_08_multimodal/images/dosovitskiy.png)

<div class="figure-info">

## Alexey Dosovitskiy and the ViT team <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale (ViT, Google Research, 2020)

- Split the image into fixed patches and treated each one as a token
- With enough training data, a plain transformer matches or beats convolutional networks
- The rest of the module builds on this framing

</div>

</div>

</div>

---

<section id="tok-patchify">
  <div class="video-container">
    <video class="manim-stepper" data-manim-scene="patchify" preload="auto"></video>
  </div>
</section>

---

<!-- .slide: id="tok-math" -->

## The Arithmetic of Patches

Split the image into non-overlapping $P \times P$ patches. The number of visual tokens is

$$N = \frac{H}{P} \cdot \frac{W}{P}$$

A $224 \times 224$ image with $16 \times 16$ patches gives $\textcolor{#4a9eff}{196}$ patch tokens. Each patch is projected, the visual analog of a token embedding:

$$z_i = W_{\text{patch}}\ \mathrm{flatten}(p_i) + b_{\text{patch}}$$

- Smaller patches: more detail, more tokens
- Attention cost grows with the **square** of sequence length (Module 4)

---

<!-- .slide: id="tok-position-resolution" -->

## Position and Resolution Are Not Optional

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Position embeddings**

- Flattening to 1-D **throws away layout**
- Row/column positions let the model tell "top" from "bottom"

</div>

<div>

**Resolution**

- Many tasks live in **fine detail**: small text, tick labels, tiny objects, medical findings
- If the relevant pixels were never represented, the model fails

</div>

</div>

A model can be "looking at" the image and still be blind to the part that matters. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="sq-registers" -->

## Side Quest: Vision Transformers Need Registers

<div class="img-figure">
  <img src="module_08_multimodal/images/register_attention.png" alt="Two 16x16 patch-norm heatmaps: without registers a few patches have very high norm; with register tokens the features are clean and uniform" style="max-height: 380px;">
</div>

- Some ViTs hijack a few patches as high-norm scratch space (left)
- **Register tokens** add dedicated slots for that global computation, cleaning up the dense features (right)
- Attention over patches does not guarantee every patch token has a readable meaning

Darcet et al., "Vision Transformers Need Registers," <a href="https://arxiv.org/abs/2309.16588">arXiv:2309.16588</a> <!-- .element: class="text-lg" style="margin-top: 6px;" -->

---

<!-- .slide: id="divider-clip" class="section-divider" data-state="is-section-divider" -->

# CLIP

Contrastive image-text pretraining


---

<!-- .slide: id="fig-radford-clip" -->

<div class="figure-card">

![Alec Radford and the CLIP team](module_08_multimodal/images/radford.jpg)

<div class="figure-info">

## Alec Radford and the CLIP team <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Learning Transferable Visual Models From Natural Language Supervision (CLIP, OpenAI, 2021)

- Aligned images and text in one shared embedding space with **natural-language supervision**
- Learned from 400M noisy web image-caption pairs, not a hand-labeled class list
- Generalized zero-shot to tasks it was never explicitly trained on

</div>

</div>

</div>

---

<!-- .slide: id="clip-architecture" -->

## CLIP Learns a Shared Space, Not Language

CLIP **does not generate language**. It only learns where images and text sit relative to each other.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Two encoders**

- **Image encoder**: image to vector
- **Text encoder**: caption to vector

</div>

<div>

**One objective**

- Pull **matched** image-text pairs together
- Push **mismatched** pairs apart

</div>

</div>

Result: an **alignment foundation**, a coordinate system where "a photo of a dog" lands near pictures of dogs. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="clip-matrix" -->

## The Batch Is the Supervision

For a batch of $B$ image-caption pairs, compute a $B \times B$ similarity matrix:

$$s_{ij} = \frac{\langle \hat{v}_i, \hat{t}_j \rangle}{\tau}$$

Rows are images, columns are captions. The **diagonal** is the matched pairs: maximize it, minimize everything off it. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="clip-loss" -->

## The Loss Is Cross-Entropy You Already Know

The contrastive loss is **two** cross-entropies over the similarity matrix, one per direction:

$$\mathcal{L} = \tfrac{1}{2}\left( \mathrm{CE}(\text{image} \to \text{text}) + \mathrm{CE}(\text{text} \to \text{image}) \right)$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Same math, new classes**

- The cross-entropy of Modules 2 and 5
- The "classes" are the **other examples in the batch**, not vocabulary tokens

</div>

<div>

**The target**

- Row $i$: correct class is caption $i$
- Column $j$: correct class is image $j$
- The question: *"which caption belongs with this image?"*

</div>

</div>

Larger batches: **harder negatives**, sharper embedding space. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="clip-zeroshot" -->

## Zero-Shot Classification Falls Out for Free

CLIP has no classifier head, yet it can classify:

1. Write **one text prompt per class**: "a photo of a cat", "a photo of a dog", &hellip;
2. **Embed** each prompt and embed the image
3. Pick the class prompt with the **highest similarity**

- The "classifier" is just more text: swap the prompts, get a new classifier, no retraining
- Noisy but abundant captions teach categories, attributes, styles, and concepts without a hand-labeled class list

---

<!-- .slide: id="clip-limits" -->

## What CLIP Is Not

CLIP aligns **global** image and text embeddings. That is all.

<div class="card-grid cols-2">
<div class="card"><h4>It cannot, by itself</h4><p>Produce detailed answers, follow instructions, count reliably, localize objects precisely, or reason over multiple images.</p></div>
<div class="card"><h4>What it is</h4><p>An <strong>alignment foundation</strong>: a shared space to build on, not a full visual assistant.</p></div>
</div>

An assistant needs the language model to **condition on visual information while it generates**. Next section. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="sq-weak-supervision" -->

## Side Quest: Why Captions Are Weak Supervision

- A caption rarely names every object, relation, style, and spatial detail: "a dog" ignores the breed, the grass, the ball in its mouth
- Contrastive learning still works: **scale and diversity** create useful pressure across millions of pairs
- The cost: **caption bias**, missing whatever the captions systematically leave out

Weak, abundant supervision beats strong, scarce supervision. A recurring theme across web-scale pretraining. <!-- .element: class="text-lg" style="margin-top: 10px;" -->

---

<!-- .slide: id="divider-bridge" class="section-divider" data-state="is-section-divider" -->

# Connecting Vision to Language

The bridge


---

<!-- .slide: id="bridge-recipe" -->

## The Stitched Recipe: Three Pieces

The language model must **condition on an image while generating text autoregressively**. The cascaded recipe bolts together three parts:

The vision encoder is often **pretrained separately** (like CLIP). The connector and how the LLM reads visual features are the new work. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="bridge-projector" -->

## The Simplest Connector Is a Linear Projector

Map each visual feature $h_i$ into the LLM's token-embedding width:

$$u_i = W_{\text{proj}}\ h_i + b_{\text{proj}}$$

Then **prepend** the projected vectors ahead of the text:

<div class="diagram"><svg viewBox="0 0 920 175" width="900" role="img" aria-label="visual feature projected by W_proj into an LLM-width vector, then prepended in front of the text tokens">
<g text-anchor="middle"><rect x="20" y="60" width="66" height="60" rx="6" fill="#1b2436" stroke="#4a9eff" stroke-width="2"/><text x="53" y="86" fill="#e8eaf0" font-size="14">h_i</text><text x="53" y="103" fill="#8fa0bd" font-size="10">vision space</text>
<rect x="150" y="55" width="86" height="70" rx="6" fill="#1b2436" stroke="#50c878" stroke-width="2"/><text x="193" y="85" fill="#e8eaf0" font-size="14">W_proj</text><text x="193" y="103" fill="#8fa0bd" font-size="10">linear</text>
<rect x="300" y="60" width="66" height="60" rx="6" fill="#1b2436" stroke="#a06bd4" stroke-width="2"/><text x="333" y="86" fill="#e8eaf0" font-size="14">u_i</text><text x="333" y="103" fill="#8fa0bd" font-size="10">LLM width</text></g>
<g stroke="#8fa0bd" stroke-width="2" fill="none" marker-end="url(#ahp)"><line x1="86" y1="90" x2="147" y2="90"/><line x1="236" y1="90" x2="297" y2="90"/><line x1="366" y1="90" x2="432" y2="90"/></g>
<text x="399" y="80" fill="#c7d0e0" font-size="10.5" text-anchor="middle">prepend</text>
<g text-anchor="middle" font-size="13"><rect x="440" y="62" width="52" height="56" rx="5" fill="#12331f" stroke="#50c878" stroke-width="2"/><text x="466" y="94" fill="#e8eaf0">u_1</text><rect x="497" y="62" width="52" height="56" rx="5" fill="#12331f" stroke="#50c878" stroke-width="2"/><text x="523" y="94" fill="#e8eaf0">u_k</text><rect x="566" y="62" width="52" height="56" rx="5" fill="#1b2436" stroke="#4a9eff" stroke-width="2"/><text x="592" y="94" fill="#e8eaf0">e_1</text><rect x="623" y="62" width="52" height="56" rx="5" fill="#1b2436" stroke="#4a9eff" stroke-width="2"/><text x="649" y="94" fill="#e8eaf0">e_2</text><rect x="680" y="62" width="52" height="56" rx="5" fill="#1b2436" stroke="#4a9eff" stroke-width="2"/><text x="706" y="94" fill="#e8eaf0">e_3</text></g>
<g text-anchor="middle" font-size="11"><text x="529" y="52" fill="#50c878">visual prefix</text><text x="649" y="52" fill="#4a9eff">text tokens</text></g>

The LLM never learns whether the first vectors came from words or pixels. Attention mixes vectors; a visual prefix is just a prefix the text attends back to. <!-- .element: class="text-lg" style="margin-top: 10px;" -->

---

<!-- .slide: id="bridge-loss" -->

## The Loss Is Still Next-Token Prediction

Training is **causal next-token prediction over the text response**, now conditioned on the image:

$$\mathcal{L} = -\frac{1}{|R|}\sum_{t \in R}\log p_\theta\left(x_t \mid \textcolor{#f5a623}{\text{image}}, x_{<t}\right)$$

- **Module 6's masked SFT loss**: score only the response tokens $R$
- New: an image condition in the context
- The transformer is unchanged; we added vectors to the front of the sequence and kept the same objective

---

<!-- .slide: id="bridge-variants" -->

## Four Ways to Build the Bridge

<div class="taxonomy-table">
<table>
<thead><tr><th>Approach</th><th>Idea</th><th>Who</th></tr></thead>
<tbody>
<tr><td><strong>LLaVA projector</strong></td><td>Frozen vision encoder, project features into the LLM, instruction-tune on image dialogue</td><td>Liu et al.</td></tr>
<tr><td><strong>BLIP-2 Q-Former</strong></td><td>Learn a small set of query tokens that <em>extract</em> the useful visual information first</td><td>Li et al.</td></tr>
<tr><td><strong>Flamingo cross-attn</strong></td><td>Keep the LLM mostly intact; insert cross-attention layers that attend to visual features</td><td>Alayrac et al.</td></tr>
<tr><td><strong>Early fusion</strong></td><td>Tokenize every modality into one shared sequence; train a single transformer over all of it</td><td>Chameleon, others</td></tr>
</tbody>
</table>
</div>

They differ in **how much of the stack is trained** and **where the visual information enters**. All four end at a transformer predicting the next text token. <!-- .element: class="text-lg" -->

<!-- .slide: id="bridge-stitched-native" -->

## Stitched vs Native

A main architecture shift of 2024&ndash;2025.

<div class="compare-table">
<table>
<thead><tr><th>Stitched (cascaded)</th><th>Natively multimodal</th></tr></thead>
<tbody>
<tr><td>Bolt together strong pretrained parts: an encoder, a projector or cross-attention bridge, and an LLM</td><td>Train the modality interface and the core model <strong>together</strong>, often end to end across text, image, audio, video</td></tr>
<tr><td>Modular, cheaper, easy to debug</td><td>The old voice stack was speech&rarr;text, a text model, then text&rarr;speech; <strong>GPT-4o</strong> was trained as one model across text, vision, audio</td></tr>
<tr><td>The LLM never learned every modality from the start</td><td>The model learns the modalities together rather than inheriting a frozen text-only core</td></tr>
</tbody>
</table>
</div>

"Native" does not mean raw pixels into attention. Real systems still use learned front ends (patching, conv stems, spectrograms, audio codecs). The difference: those front ends are **trained as part of one model**. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="bridge-projector-matters" -->

## The Projector Is Small but Not Trivial

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Why it looks trivial**

- Often a single linear layer
- A few hundred thousand parameters against a multi-billion-parameter LLM

</div>

<div>

**Why it is not**

- It learns a **coordinate transformation** from vision-feature space to LLM language space
- A bad projector makes a strong vision encoder **useless** to the LLM

</div>

</div>

Tradeoff: **freezing** large encoders is cheaper and more stable; **jointly tuning** more of the stack can improve alignment at higher cost. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

The exercise builds this bridge: project a tiny image embedding into NanoGPT's hidden size, train it to caption. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="divider-sft" class="section-divider" data-state="is-section-divider" -->

# Instruction Tuning and Grounding

Teaching assistant behavior


---

<!-- .slide: id="sft-interleaved" -->

## Interleaved Documents

Alignment gives matching, **not** assistant behavior. Modern pretraining adds **interleaved image-text documents**: web pages, papers, manuals, notebooks.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**A caption teaches**

Global matching: this whole image goes with this whole sentence.

</div>

<div>

**A document teaches reference**

- "The **second** diagram," "**this** chart," "the example **above**"
- The data shape needed to reason across **multiple** images

</div>

</div>

---

<!-- .slide: id="sft-unit" -->

## The Instruction-Tuning Unit

After alignment, the data unit is an **image plus a prompt-response pair**:

- "What color is the triangle?"
- "Read the axis label."
- "Describe the error message in this screenshot."
- "Which object is left of the chair?"

Chat templates gain a **placeholder** for the non-text input:

```text
<|user|> <image> What color is on top? <|end|>
<|assistant|> red <|end|>
```

`<image>` is **not** the image. The wrapper replaces it with the projected visual embeddings from the last section. <!-- .element: class="text-lg" style="margin-top: 8px;" -->

---

<!-- .slide: id="sft-data-sources" -->

## Where the Data Comes From

<div class="card-grid cols-3">
<div class="card"><h4>Captions and alt text</h4><p>Broad image-language alignment</p></div>
<div class="card"><h4>Interleaved documents</h4><p>PDFs, notebooks, manuals &mdash; multi-image context</p></div>
<div class="card"><h4>Visual QA</h4><p>Targeted answers to specific questions</p></div>
<div class="card"><h4>OCR and documents</h4><p>Reading text, forms, and layout in images</p></div>
<div class="card"><h4>Referring expressions</h4><p>Locating objects named by language</p></div>
<div class="card"><h4>Synthetic dialogue</h4><p>Generated by a stronger model, filtered, then finetuned &mdash; echoing Module 6</p></div>
</div>

The synthetic route repeats Module 6: a stronger model writes the training data, a filter keeps the good parts. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="sft-grounding" -->

## Grounding: Words to the Right Pixels

**Grounding**: connect words to the right parts of the input. "The red square" should refer to *the red square in this image*, not to red squares being common in the dataset.

The stress test is **spatial language**:

<div class="card-grid cols-4">
<div class="card"><p>left / right</p></div>
<div class="card"><p>above / below</p></div>
<div class="card"><p>inside / outside</p></div>
<div class="card"><p>count</p></div>
<div class="card"><p>same / different</p></div>
<div class="card"><p>nearest / farthest</p></div>
</div>

Trivial for humans; they expose whether the model **uses visual layout** or guesses from language patterns. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="sft-failure-modes" -->

## Two Failure Modes

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**OCR is separate from recognition**

- A model can recognize **objects** yet fail to **read** small text
- Or read the text but misunderstand the **layout** of a form, chart, or UI

</div>

<div>

**Visual hallucination**

- The multimodal analog of text hallucination
- The model **confidently describes** objects, text, colors, or relationships **not present** in the image

</div>

</div>

Instruction tuning makes the model more helpful. It can also teach **shortcut behavior**. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="sft-shortcuts" -->

## The Language-Prior Shortcut

If training answers carry **strong language priors**, the model learns to answer from **text patterns**, not the image.

- If 90% of "what color is the banana?" answers are "yellow," a model scores well without looking
- Defense: **controlled data**. Balance the answers so language alone cannot solve the task
- Then a correct answer is **evidence the image was used**

The exercise uses synthetic, **balanced** scenes for this reason: every color and shape is equally likely, so only reading the image answers "what color is on top?" <!-- .element: class="text-lg" style="margin-top: 10px;" -->

---

<!-- .slide: id="sq-ocr-trap" -->

## Side Quest: The OCR Trap

The answer depends on a **tiny** word or axis label. The model gets it wrong. Which failure was it?

<div class="card-grid cols-4">
<div class="card"><h4>Reasoning</h4><p>It read everything but reasoned wrongly</p></div>
<div class="card"><h4>Perception</h4><p>It never encoded the relevant region</p></div>
<div class="card"><h4>Resolution</h4><p>Resizing erased the pixels entirely</p></div>
<div class="card"><h4>OCR</h4><p>It saw the text but misread the characters</p></div>
</div>

Each has a **different fix**. Calling every visual mistake a "reasoning failure" hides that the model may never have had the information. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="divider-beyond" class="section-divider" data-state="is-section-divider" -->

# Beyond Still Images

Audio, speech, video, and sensors


---

<!-- .slide: id="beyond-audio" -->

## Audio Begins as a Waveform

A waveform is a **sequence of amplitude values**, thousands per second. Too raw and too long to feed directly, so we re-represent it:

<div class="card-grid cols-3">
<div class="card"><h4>Spectrograms</h4><p>Time-frequency images the model can patch like a picture</p></div>
<div class="card"><h4>Learned embeddings</h4><p>Continuous features from an audio encoder</p></div>
<div class="card"><h4>Codec tokens</h4><p>Discrete codebook entries &mdash; audio as a token sequence</p></div>
</div>

Same pattern as images: **compress the high-bandwidth signal into a sequence**, discrete or continuous. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="beyond-speech" -->

## Speech, Several Ways

<div class="taxonomy-table">
<table>
<thead><tr><th>Framing</th><th>Maps</th></tr></thead>
<tbody>
<tr><td><strong>ASR</strong> (recognition)</td><td>audio &rarr; text</td></tr>
<tr><td><strong>TTS</strong> (synthesis)</td><td>text &rarr; audio</td></tr>
<tr><td><strong>Speech-language model</strong></td><td>speech &rarr; text or speech</td></tr>
<tr><td><strong>Spoken assistant</strong></td><td>handles content <em>and</em> paralinguistics: timing, tone, speaker turns</td></tr>
</tbody>
</table>
</div>

A spoken assistant models more than the words: **how** something is said carries meaning too. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="fig-whisper" -->

<div class="figure-card">

![Alec Radford and the Whisper team](module_08_multimodal/images/radford.jpg)

<div class="figure-info">

## Alec Radford and the Whisper team <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Robust Speech Recognition via Large-Scale Weak Supervision (Whisper, OpenAI, 2022)

- Trained speech recognition on 680,000 hours of noisy, multilingual web audio
- Reached robust transcription without a small, clean, hand-labeled corpus
- The same lesson as CLIP: weak, abundant supervision at scale wins

</div>

</div>

</div>

---

<!-- .slide: id="beyond-video" -->

## Video Adds a Time Axis

- **Sample frames**, often sparsely
- Encode each with an image encoder
- Add **temporal** position information
- Feed the features into the language model

The catch: tokens grow with **frames &times; resolution &times; patch density**. A short clip can dwarf a long text document. <!-- .element: class="text-lg" style="margin-top: 8px;" -->

---

<section id="beyond-budget-anim">
  <div class="video-container">
    <video class="manim-stepper" data-manim-scene="videobudget" preload="auto"></video>
  </div>
</section>

---

<!-- .slide: id="beyond-budget-math" -->

## Brutal Token Cost

A 10-second clip at 30 fps is **300 frames**. At $224 \times 224$ with $16 \times 16$ patches, each frame is 196 tokens:

$$300 \times 196 = \textcolor{#f5a623}{58{,}800} \text{ visual tokens}$$

**More than half** a 100k context window, before the prompt, answer, or audio. Double the resolution to $448 \times 448$ and each frame is 784 tokens:

$$300 \times 784 = \textcolor{#e05252}{235{,}200} \text{ visual tokens}$$

Now it **does not fit** in 100k at all. Attention cost scales with the **square** of sequence length. <!-- .element: class="text-lg" style="margin-top: 8px;" -->

---

<!-- .slide: id="beyond-compress" -->

## So Video Models Compress Aggressively

<div class="card-grid cols-3">
<div class="card"><h4>Sample frames</h4><p>Keep a sparse subset, not every frame</p></div>
<div class="card"><h4>Pool patches</h4><p>Merge neighboring patch tokens</p></div>
<div class="card"><h4>Learned queries</h4><p>A few tokens summarize many (Q-Former style)</p></div>
<div class="card"><h4>Temporal encoders</h4><p>Compress across time before the LLM</p></div>
<div class="card"><h4>Retrieve segments</h4><p>Feed only the relevant part of the clip</p></div>
<div class="card"><h4>Longer context</h4><p>Gemini-scale windows push the ceiling up</p></div>
</div>

Context length is only half the problem. The quadratic attention cost comes with it. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="beyond-temporal" -->

## The Hard Part Is Time, Not Objects

Seeing objects frame by frame is easy. Many questions require **temporal reasoning**:

- What **changed** between these moments?
- Which event **caused** another?
- What happened **before** the person opened the door?
- Did the action **complete** successfully?

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**Rate mismatch**

- Audio-video models align streams at different rates
- A frame every ~33 ms; audio samples thousands of times per second

</div>

<div>

**Sensors generalize the idea**

- Depth, thermal, radar/RF, lidar, robot joint states, medical images, time series
- The representation changes; the **bridge problem stays the same**

</div>

</div>

---

<!-- .slide: id="divider-eval" class="section-divider" data-state="is-section-divider" -->

# Evaluation, Safety, and Failure Modes

Why seeing is not believing


---

<!-- .slide: id="eval-harder" -->

## Multimodal Evaluation Is Harder

Ground truth often depends on **visual detail, spatial relations, OCR, temporal events, or subjective judgment**. A keyword match captures none of these.

<div class="card-grid cols-3">
<div class="card"><h4>VQA and captioning</h4><p>Image-language understanding</p></div>
<div class="card"><h4>OCR and documents</h4><p>Reading text and layout</p></div>
<div class="card"><h4>Chart and diagram</h4><p>Marks, axes, legends, quantities</p></div>
<div class="card"><h4>MMMU</h4><p>College-level multi-discipline visual reasoning</p></div>
<div class="card"><h4>Video QA</h4><p>Temporal understanding</p></div>
<div class="card"><h4>MathVista</h4><p>Math reasoning in visual contexts</p></div>
</div>

**Exact match is brittle**: "two" and "there are two" are equivalent; a keyword can match while the answer is wrong. Module 11's evaluation tools return here. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="eval-hallucination" -->

## Hallucination Is Worse When It Looks Like Evidence

- Users treat image-grounded answers as **observational**: the model saw it, so it must be true
- The model can sound certain about an object, person, or detail **absent** from the image
- The danger: it borrows the credibility of a photograph for a claim the pixels never supported

---

<!-- .slide: id="eval-safety" -->

## Safety Issues Specific to Multimodal

<div class="card-grid cols-3">
<div class="card"><h4>Privacy</h4><p>Faces, addresses, screens, documents, children, bystanders</p></div>
<div class="card"><h4>Identity and biometrics</h4><p>Face recognition, emotion inference, attribute guessing &mdash; stricter rules than object description</p></div>
<div class="card"><h4>Prompt injection</h4><p>Text inside an image or document tries to override the user</p></div>
<div class="card"><h4>Adversarial examples</h4><p>Small pixel changes flip the prediction</p></div>
<div class="card"><h4>Deepfakes</h4><p>Generation can manufacture persuasive false evidence</p></div>
<div class="card"><h4>Accessibility</h4><p>Descriptions for blind users need calibrated uncertainty, not fluent guesses</p></div>
</div>

---

<!-- .slide: id="eval-preprocessing" -->

## Failures Before the Weights

**Preprocessing** can cause the failure before the model runs at all.

<div class="card-grid cols-2">
<div class="card"><h4>Resizing</h4><p>Erases small text before the encoder ever sees it</p></div>
<div class="card"><h4>Cropping</h4><p>Removes the relevant object from the frame</p></div>
<div class="card"><h4>Frame sampling</h4><p>Misses the key event in a video</p></div>
<div class="card"><h4>Compression</h4><p>Distorts the details the answer depends on</p></div>
</div>

Product lesson: expose uncertainty when perceptual evidence is weak; never overclaim on **identity, medical, legal, or safety-critical** decisions. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="sq-photography-bias" -->

## Side Quest: Photography Bias

Photography is not a neutral sample of reality.

- **Which images exist** and **how they were taken** shape the model's view of the world
- Cameras and datasets over-represent some subjects, viewpoints, lighting conditions, and skin tones
- The model inherits those blind spots and fails hardest on what was rarely photographed

More images do not make a model more objective. They bake in the **bias of who and what gets photographed.** <!-- .element: class="text-lg" style="margin-top: 10px;" -->

---

<!-- .slide: id="divider-stack" class="section-divider" data-state="is-section-divider" -->

# The Modern Multimodal Stack

And what evaluation and deployment inherit


---

<!-- .slide: id="stack-name-it" -->

## Name the Full Stack

<div class="card-grid cols-3">
<div class="card"><h4>1. Encoders</h4><p>Modality-specific front ends: vision, audio, and more</p></div>
<div class="card"><h4>2. Connector</h4><p>A projector, cross-attention bridge, or shared tokenizer</p></div>
<div class="card"><h4>3. Language model</h4><p>The transformer that ties it all together</p></div>
<div class="card"><h4>4. Multimodal SFT</h4><p>Instruction tuning on image-conditioned dialogue</p></div>
<div class="card"><h4>5. Preference / RL</h4><p>Post-training with feedback (Module 7)</p></div>
<div class="card"><h4>6. Retrieval and tools</h4><p>Plus the deployment infrastructure around it</p></div>
</div>

**Same transformer, larger interface.** The model still moves vectors through attention layers; the new work is deciding **which vectors represent the non-text input.** <!-- .element: class="text-lg" -->

<!-- .slide: id="stack-throughline" -->

## Side Quest: One Model, or a System of Models?

<div class="compare-table">
<table>
<thead><tr><th>Unified mixed-token model</th><th>Routed product stack</th></tr></thead>
<tbody>
<tr><td>One transformer over text, image, audio, video tokens</td><td>A language model, an image encoder, an OCR model, a retriever, and an image generator &mdash; wired together</td></tr>
<tr><td>The cleanest <strong>research</strong> objective</td><td>Often the cheaper, more <strong>reliable</strong> product</td></tr>
</tbody>
</table>
</div>

The cleanest research architecture is often **not** the best product architecture. A shipping system optimizes reliability, not elegance. <!-- .element: class="text-lg" -->

## Next Classes: Measuring It, Then Serving It

Two things get harder once the model reads more than text:

- **Scoring** it (Module 9): visual answers break exact match; benchmarks can often be passed without looking at the image
- **Running** it efficiently:

<div class="card-grid cols-2">
<div class="card"><h4>Vision encoders add latency</h4><p>Extra forward passes before the LLM even starts</p></div>
<div class="card"><h4>Images add preprocessing</h4><p>Resize, patch, encode &mdash; per request</p></div>
<div class="card"><h4>Visual tokens inflate context</h4><p>Bigger KV cache, more attention cost</p></div>
<div class="card"><h4>Video and audio strain memory</h4><p>Bandwidth becomes the bottleneck</p></div>
</div>

Batching, KV-cache size, preprocessing, memory bandwidth, quantization, and model routing become the practical constraints. **That is Module 10.** <!-- .element: class="text-lg" -->

def patchify(images: torch.Tensor, patch_size: int) -> torch.Tensor:
    """Split each image into a grid of non-overlapping square patches.

    An image is (C, H, W); a transformer wants a *sequence*. We cut the image into
    (H/P) x (W/P) patches and lay them out in row-major order, so the 2-D picture
    becomes a 1-D list of patches — the visual analog of splitting text into tokens.
    (The provided `src/ops.py` then flattens, projects, and adds positions for you.)

    Args:
        images: batch of images, shape (B, C, H, W).
        patch_size: side length P of each square patch.

    Returns:
        Patches of shape (B, N, C, P, P) where N = (H/P) * (W/P).
    """
    B, C, H, W = images.shape
    # TODO: Reshape (B, C, H, W) into (B, N, C, P, P) patches with N = (H/P)*(W/P).
    raise NotImplementedError("TODO: split each image into a sequence of patches")
```

<div class="fragment hint-box">

**Hint:** reshape to `(B, C, H/P, P, W/P, P)`, permute the two grid axes next to the batch, then reshape to `(B, N, C, P, P)`.

</div>

<div class="fragment note">

**Answer:**

```python
return (
    images.reshape(B, C, H // patch_size, patch_size, W // patch_size, patch_size)

## Step 5: clip_loss()

```python
def clip_loss(logits: torch.Tensor) -> torch.Tensor:
    """Symmetric CLIP contrastive loss: cross-entropy in both directions.

    For a batch of B matched pairs, the correct caption for image i is caption i (the
    diagonal), and the correct image for caption j is image j. So the targets are just
    0..B-1: cross-entropy over rows is image->text retrieval, over columns is
    text->image retrieval, and CLIP averages the two.

    Args:
        logits: similarity matrix, shape (B, B).

    Returns:
        A scalar loss.
    """
    # TODO: Average row-wise (image->text) and column-wise (text->image) cross-entropy
    #       against the diagonal targets 0..B-1.
    raise NotImplementedError("TODO: build the symmetric CLIP contrastive loss")
```

<div class="fragment hint-box">

**Hint:** row i's correct label is i, so `torch.arange` builds the labels; take `F.cross_entropy` on `logits` and again on its transpose, then average the two.

</div>

<div class="fragment note">

**Answer:**

```python
labels = torch.arange(logits.shape[0], device=logits.device)
return 0.5 * (F.cross_entropy(logits, labels) + F.cross_entropy(logits.t(), labels))
```

</div>

# Quiz

<!-- .slide: id="quiz-position" -->

## Why Patches Need Positions

<div class="quiz-prompt">

Why does a transformer need positional information **after** an image is split into patches?

</div>

<div class="fragment note quiz-answer">

**Short answer: flattening a 2-D grid into a 1-D sequence discards where each patch sat, and self-attention is permutation-invariant, so without positions the model cannot tell top from bottom.**

- Attention treats its inputs as an unordered set: same result in any patch order
- Flattening removes the 2-D layout (which patch is above which) from the values
- Position embeddings put it back: "the triangle is on top," not just "a triangle and a square are present"

</div>

---

<!-- .slide: id="quiz-token-types" -->

## Three Things Called Tokens

<div class="quiz-prompt">

What is the difference between a **text token**, a **patch embedding**, and a **discrete image token**?

</div>

<div class="fragment note quiz-answer">

**Short answer: a text token and a discrete image token are indices into a fixed vocabulary/codebook; a patch embedding is a continuous vector, not an index.**

- **Text token**: a discrete id looked up in an embedding table
- **Discrete image token** (VQ-VAE style): an index into a learned **codebook** of visual patterns
- **Patch embedding**: a **continuous vector** projected from raw pixels; no vocabulary, no lookup
- "Visual token" is ambiguous; only the discrete code is a token in the word sense

</div>

---

<!-- .slide: id="quiz-clip-diagonal" -->

## CLIP's Diagonal

<div class="quiz-prompt">

In CLIP, why does the similarity matrix have exactly **one correct caption per image** and **one correct image per caption**?

</div>

<div class="fragment note quiz-answer">

**Short answer: the batch is constructed from matched pairs, so image i belongs with caption i and nothing else in the batch; the correct answers are the diagonal.**

- The batch is $B$ **matched** pairs: image $i$'s caption is caption $i$; every other caption is a presumed negative
- **Rows**: image-to-text classification, correct class on the diagonal. **Columns**: text-to-image, same diagonal
- So the targets are $0..B{-}1$ and the loss is ordinary cross-entropy in both directions
- Caveat: two images sharing a caption create a false negative

</div>

---

<!-- .slide: id="quiz-zeroshot" -->

## Zero-Shot Without a Head

<div class="quiz-prompt">

Why can CLIP do zero-shot classification even though it was **never trained with a fixed classifier head**?

</div>

<div class="fragment note quiz-answer">

**Short answer: its "classifier" is text, so any set of class names becomes a classifier by embedding the names and comparing to the image embedding.**

- CLIP learned a **shared space** where images sit near their descriptions
- Write one prompt per class, embed each, embed the image, pick the nearest prompt
- Supervision came from **natural language**, so classes are open-ended: define them at inference time, swap label sets without touching the weights

</div>

---

<!-- .slide: id="quiz-projector" -->

## What the Projector Learns

<div class="quiz-prompt">

What does the **projector** between a vision encoder and an LLM actually learn?

</div>

<div class="fragment note quiz-answer">

**Short answer: a coordinate transformation from the vision encoder's feature space into the LLM's token-embedding space, so a visual vector "looks like" something the LLM can attend to.**

- The encoder and LLM were (often) trained separately, so their spaces are unrelated: a direction meaning "red" to the encoder means nothing to the LLM
- The projector learns the **mapping between the two spaces**, placing each visual feature where the LLM expects meaning, at the LLM's width
- Small in parameters but decisive: a bad projector lands visual vectors in nonsense directions, leaving the encoder **unreadable**

</div>

---

<!-- .slide: id="quiz-nexttoken" -->

## Still Next-Token

<div class="quiz-prompt">

Why is image-conditioned captioning still trained with a **next-token loss over text**?

</div>

<div class="fragment note quiz-answer">

**Short answer: the output is still a text sequence, so the objective is unchanged; the image only enters as extra context in the prefix.**

- The model still produces **words** one after another, the setup of pretraining and SFT
- The image changes what the model **conditions on**, not what it predicts
- The visual prefix sits in the context like extra tokens; attention mixes it into the hidden states
- Same masked cross-entropy over response tokens: $-\sum_{t\in R}\log p_\theta(x_t\mid \text{image}, x_{<t})$

</div>

---

<!-- .slide: id="quiz-priors" -->

## Answering From Priors

<div class="quiz-prompt">

What failure would suggest the model is answering from **language priors** instead of using the image?

</div>

<div class="fragment note quiz-answer">

**Short answer: the answer stays the same (or tracks the question's wording) when you change the image, or it matches the dataset's most common answer rather than the picture.**

- Swap the image and "describe the image" returns the **same** caption: the image is not being used
- Answering "yellow" for a green banana exploits what bananas **usually** are in training data
- The clean test is **controlled, balanced** data: every color and shape equally likely, so only reading the image can be right
- Then a correct answer is evidence of grounding; a constant answer exposes the shortcut

</div>

---

<!-- .slide: id="quiz-ocr" -->

## Not Always Reasoning

<div class="quiz-prompt">

Why are **OCR and chart-reading** failures not always **reasoning** failures?

</div>

<div class="fragment note quiz-answer">

**Short answer: the model may never have encoded the relevant pixels; if the text was erased by resizing or too small to represent, the information was gone before any reasoning happened.**

- Resizing can erase a tiny axis label; a coarse patch grid blurs small characters; compression destroys fine detail
- If the pixels carrying the answer were **never represented**, no reasoning can recover them
- The failure is perception, resolution, or OCR, not logic
- The distinction matters because the fixes differ: higher resolution, tighter cropping, or a dedicated OCR path, versus better reasoning

</div>

// deeper layers; the final boundary is the output neuron's zero-line.
// =====================================================================
var CLUSTER_MLP = (function() {
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function gauss(rnd) {
    var u = 1 - rnd(), v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v);
  }
  var CENTERS = [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]];

  function generateData() {
    var rnd = mulberry32(7);
    var pts = [];
    CENTERS.forEach(function(c) {
      for (var i = 0; i < 22; i++) {
        pts.push({ x: c[0] + gauss(rnd) * 0.045, y: c[1] + gauss(rnd) * 0.045, cls: 1 });
      }
    });
    var reds = 0;
    while (reds < 150) {
      var x = 0.03 + rnd() * 0.94, y = 0.03 + rnd() * 0.94;
      var near = CENTERS.some(function(c) { return Math.hypot(x - c[0], y - c[1]) < 0.17; });
      if (near) continue;
      pts.push({ x: x, y: y, cls: 0 });
      reds++;

  function makeNet(width, depth, seed) {
    var rnd = mulberry32(seed);

    for (var d = 0; d < depth; d++) {
      layers.push(initLayer(fanIn, width, rnd));

  }
  function initLayer(nIn, nOut, rnd) {

      b.push(gauss(rnd) * 0.1);
