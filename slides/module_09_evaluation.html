<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMs 0 to 100</title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <!-- KaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>

  <!-- Module-specific <head> includes (e.g. Chart.js); empty for most modules -->
  

  <!-- Shared styles + per-module overrides, inlined by the build -->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

/* ===========================================
   CSS VARIABLES
   =========================================== */
:root {
  --background-color: #0a0e1a;
  --section-divider-bg: #0d1225;

  --heading-font: "Space Grotesk", Helvetica, sans-serif;
  --body-font: "Inter", Helvetica, sans-serif;
  --base-font-size: 32px;
  --text-size: 16pt;
  --h1-size: 48pt;
  --h2-size: 36pt;
  --h3-size: 24pt;
  --footnote-size: 11pt;

  --primary-color: #4a9eff;
  --secondary-color: #f5a623;
  --text-color: #e8eaf0;
  --muted-color: #8892a4;
  --line-color: #2a3450;

  --slide-padding: 60px;
  --slide-padding-top: 24px;
  --content-gap: 18px;

  --box-radius: 8px;
}

/* ===========================================
   BASE STYLES
   =========================================== */

.reveal {
  font-family: var(--body-font);
  font-size: var(--base-font-size);
}

.reveal strong,
.reveal b {
  font-weight: bold;
}

.reveal a {
  color: var(--primary-color);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.reveal a:hover {
  color: var(--text-color);
}

.reveal-viewport {
  background-color: var(--background-color);
}

.reveal-viewport.is-section-divider .slide-background.present {
  background-color: var(--section-divider-bg) !important;
}

.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4,
.reveal h5,
.reveal h6 {
  font-family: var(--heading-font);
  text-transform: none;
  color: var(--text-color);
  font-weight: 600;
  line-height: 1.2;
}

.reveal h1 { font-size: var(--h1-size); }
.reveal h2 { font-size: var(--h2-size); margin-bottom: 0; }
.reveal h3 { font-size: var(--h3-size); }

.reveal p,
.reveal li,
.reveal td,
.reveal th,
.reveal blockquote {
  font-size: var(--text-size);
  color: var(--text-color);
  line-height: 1.5;
}

/* Vertical separation between newline-separated sentences on text slides.
   Scoped to a slide's top-level paragraphs (the prose flow); paragraphs
   nested inside components (terminal captions, figure cards, grid columns)
   keep their own tighter spacing so dense component slides do not overflow.
   Adjacent margins collapse, so the gap between two paragraphs is 0.9em. */
.reveal .slides section > p {
  margin: 0.4em 0 0.9em 0;
}

/* ===========================================
   LISTS
   =========================================== */

.reveal ul {
  list-style: none;
  padding-left: 0;
  margin: 15px 0;
}

.reveal ul li {
  position: relative;
  padding-left: 25px;
  margin-bottom: 10px;
}

.reveal ul li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.6em;
  width: 8px;
  height: 8px;
  background: var(--primary-color);
  border-radius: 50%;
}

.reveal ul ul li::before {
  background: var(--muted-color);
  width: 6px;
  height: 6px;
}

.reveal blockquote p {
  font-size: inherit;
}

/* ===========================================
   SLIDE LAYOUT
   =========================================== */

.reveal .slides section {
  height: 100%;
  display: flex !important;
  flex-direction: column !important;
  padding: var(--slide-padding-top) var(--slide-padding) var(--slide-padding) var(--slide-padding) !important;
  box-sizing: border-box;
  text-align: left;
}

.reveal .slides section.stack {
  padding: 0 !important;
}

.reveal .slides section > .content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: var(--content-gap);
  text-align: left;
}

.reveal .slides section > .footnote {
  position: absolute;
  bottom: 15px;
  left: var(--slide-padding);
  right: var(--slide-padding);
  font-size: var(--footnote-size);
  color: var(--muted-color);
}

/* ===========================================
   SECTION DIVIDERS
   =========================================== */

.reveal .slides section.section-divider {
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}

.reveal .slides section.section-divider h1 {
  font-size: 56pt;
  text-align: center;
  color: var(--primary-color);
}

.reveal .slides section.section-divider p {
  font-size: 20pt;
  color: var(--muted-color);
}

/* ===========================================
   TEXT SIZE UTILITIES
   =========================================== */

.text-lg { font-size: 18pt !important; }
.text-xl { font-size: 20pt !important; }
.text-2xl { font-size: 24pt !important; }
.text-3xl { font-size: 28pt !important; }
.text-4xl { font-size: 32pt !important; }

.text-muted { color: var(--muted-color) !important; }
.text-center { text-align: center !important; }
.text-uppercase { text-transform: uppercase; letter-spacing: 0.1em; }
.font-light { font-weight: 300; }
.font-bold { font-weight: 600; }

/* ===========================================
   BLOCKQUOTES
   =========================================== */

.reveal blockquote {
  border-left: 4px solid var(--primary-color);
  padding-left: 20px;
  margin: 20px 0;
  font-style: italic;
  background: none;
  box-shadow: none;
  width: 100%;
  max-width: none;
}

.reveal blockquote cite {
  display: block;
  margin-top: 10px;
  font-style: normal;
  color: var(--muted-color);
}

/* ===========================================
   ACCENT UNDERLINE ON TITLES
   =========================================== */

.reveal .slides section > h2 {
  flex-shrink: 0;
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line-color);
}

/* ===========================================
   FIGURE CARD - for notable figures slides
   =========================================== */

.figure-card {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  align-items: start;
}

.figure-card img {
  border-radius: var(--box-radius);
  width: 100%;
  box-shadow: 0 4px 20px rgba(74, 158, 255, 0.15);
}

.figure-card .figure-info h3 {
  margin: 0 0 5px 0;
  color: var(--secondary-color);
  font-size: 14pt;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ===========================================
   ERA BADGE - for timeline labels
   =========================================== */

.era-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12pt;
  font-weight: 500;
}

.era-badge.summer {
  background: rgba(245, 166, 35, 0.2);
  color: var(--secondary-color);
}

.era-badge.winter {
  background: rgba(74, 158, 255, 0.15);
  color: #6cb4ff;
}

.era-badge.spring {
  background: rgba(80, 200, 120, 0.2);
  color: #50c878;
}

/* ===========================================
   HIGHLIGHT BOX
   =========================================== */

.highlight-box {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
}

/* Exercise hint: a single fragment that reveals the whole hint at once.
   The wrapping .fragment div is what animates; this just sizes the text
   (matching the old text-lg intent) and removes the global paragraph
   margin so the one-line hint is not double-spaced. */
.reveal .hint-box p {
  font-size: 18pt;
  margin: 0;
}

/* ===========================================
   COURSE STRUCTURE
   =========================================== */

.course-summary {
  max-width: 1120px;
  margin: 0 0 16px 0;
  color: #f0f4fb;
  font-size: 18pt !important;
  line-height: 1.4 !important;
}

.course-track-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

.module-track-card {
  background: rgba(74, 158, 255, 0.07);
  border: 1px solid rgba(74, 158, 255, 0.22);
  border-radius: var(--box-radius);
  padding: 20px 22px;
}

.module-track-kicker {
  font-size: 12pt;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--secondary-color);
  margin-bottom: 8px;
}

.module-track-card h3 {
  margin: 0 0 8px 0;
}

.module-track-intro {
  font-size: 14pt !important;
  color: #d7ddea !important;
  margin: 0 0 10px 0;
  line-height: 1.4 !important;
}

.compact-list {
  margin: 0;
}

.reveal ul.compact-list li {
  font-size: 16pt;
  line-height: 1.35;
  margin-bottom: 7px;
  padding-left: 20px;
}

.course-note {
  margin-top: 14px;
  color: #d7ddea;
  font-size: 15pt !important;
  line-height: 1.35 !important;
}

.course-glossary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  margin-top: 14px;
}

.glossary-item {
  background: rgba(245, 166, 35, 0.08);
  border: 1px solid rgba(245, 166, 35, 0.18);
  border-radius: var(--box-radius);
  padding: 12px 14px;
}

.glossary-item strong {
  color: var(--secondary-color);
}

.glossary-item p {
  font-size: 13pt !important;
  color: #d7ddea !important;
  margin: 6px 0 0 0;
  line-height: 1.4;
}

/* ===========================================
   TERMINAL OUTPUT
   =========================================== */

.terminal-output {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 0;
  max-width: 800px;
  margin: 0 auto;
  text-align: left;
}

.terminal-output .terminal-bar {
  background: #161b22;
  border-radius: 8px 8px 0 0;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.terminal-output .terminal-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.terminal-output .terminal-dot.red { background: #ff5f57; }
.terminal-output .terminal-dot.yellow { background: #febc2e; }
.terminal-output .terminal-dot.green { background: #28c840; }

.terminal-output .terminal-title {
  color: #8b949e;
  font-family: monospace;
  font-size: 10pt;
  margin-left: 8px;
}

.terminal-output .terminal-body {
  padding: 15px 20px;
}

.terminal-output .terminal-body pre {
  margin: 0;
  background: none !important;
  box-shadow: none !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output.dense .terminal-body {
  padding: 10px 20px;
}

.reveal .terminal-output.dense .terminal-body pre.terminal-pre {
  font-size: 9pt;
  line-height: 1.28;
}

.reveal .terminal-output .terminal-body pre.terminal-pre span {
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre p {
  display: inline;
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
  margin: 0 !important;
  color: inherit;
}

.reveal .terminal-output .terminal-body pre code {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output .terminal-body .prompt {
  color: #8b949e;
}

.terminal-output .terminal-body .success {
  color: #3fb950;
}

.terminal-output .terminal-body .header {
  font-weight: bold;
}

.terminal-output .terminal-body .skipped {
  color: #8b949e;
  font-style: italic;
}

/* ===========================================
   TURNING POINT SLIDE
   =========================================== */

.turning-point h2 {
  border-bottom-color: var(--secondary-color) !important;
}

/* ===========================================
   CODE BLOCKS
   =========================================== */

.reveal pre {
  margin-bottom: 0;
  width: 100%;
  box-sizing: border-box;
  box-shadow: none !important;
  background: none !important;
}

.reveal pre code {
  font-size: 14pt;
  line-height: 1.4;
  padding: 10px 20px;
  border-radius: var(--box-radius);
  background: rgba(20, 25, 45, 0.8);
  color: var(--text-color);
  max-height: 400px;
}

.reveal pre code .hljs-keyword,
.reveal pre code .hljs-built_in {
  color: #c792ea;
}

.reveal pre code .hljs-string {
  color: #c3e88d;
}

.reveal pre code .hljs-comment {
  color: #546e7a;
}

.reveal pre code .hljs-number {
  color: #f78c6c;
}

.reveal code {
  color: var(--text-color);
}

/* ===========================================
   MATH (KaTeX)
   =========================================== */

.katex {
  color: var(--text-color);
  font-size: 1.1em;
}

.katex-display {
  margin: 15px 0;
}

.katex-display > .katex {
  font-size: 1.3em;
}

/* ===========================================
   VIDEO CONTAINERS
   =========================================== */

.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-container video,
.video-container img {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--box-radius);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
}

/* ===========================================
   SIDE QUEST BADGE
   =========================================== */

.side-quest-badge {
  display: inline-block;
  background: rgba(245, 166, 35, 0.15);
  color: var(--secondary-color);
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12pt;
  font-weight: 500;
  margin-bottom: 10px;
}

/* ===========================================
   TERMINAL OUTPUT - ANSI COLOR PALETTE
   Replaces inline `style="color:#..."` on spans
   inside .terminal-pre. A rule on the span itself
   overrides the color inherited from .terminal-pre.
   =========================================== */

.terminal-output .terminal-body .t-red    { color: #e06c75; }
.terminal-output .terminal-body .t-orange { color: #d19a66; }
.terminal-output .terminal-body .t-yellow { color: #e5c07b; }
.terminal-output .terminal-body .t-green  { color: #98c379; }
.terminal-output .terminal-body .t-cyan   { color: #56b6c2; }
.terminal-output .terminal-body .t-blue   { color: #61afef; }
.terminal-output .terminal-body .t-gray   { color: #8b949e; }
.terminal-output .terminal-body .t-fg     { color: #e8eaf0; }
.terminal-output .terminal-body .t-fail   { color: #e74c3c; }

.terminal-caption {
  margin-top: 15px;
  text-align: center;
}

/* ===========================================
   TIMELINE (module 1) - per-node structure
   Positional left/width and per-era colors stay
   inline; this captures the repeated boilerplate.
   =========================================== */

.tl-node  { position: absolute; transform: translateX(-50%); text-align: center; }
/* .reveal prefix needed: `.reveal p` (0,1,1) sets color/font-size and would
   otherwise beat a bare .tl-* class. The original used inline styles. */
.reveal .tl-label { font-size: 10pt; color: var(--muted-color); white-space: nowrap; margin: 0; }
.reveal .tl-year  { font-size: 11pt; font-weight: 600; margin: 2px 0 0 0; }
.tl-stem  { width: 1px; opacity: 0.5; margin: 2px auto 0; }
.tl-dot   { width: 10px; height: 10px; border-radius: 50%; margin: 0 auto; }

.tl-node.below .tl-stem  { margin: 0 auto; }
.tl-node.below .tl-year  { margin: 0; }
.tl-node.below .tl-label { margin: 2px 0 0 0; }

/* ===========================================
   CANONICAL SLIDE TYPES
   Backs the :::divider / :::columns / :::note /
   :::quiz / :::step / :::interactive fences so
   slides.md carries no inline layout styles.
   (.section-divider, .figure-card, .terminal-output,
    .hint-box are defined above and reused.)
   =========================================== */

/* :::columns - grid; template/gap/valign supplied by the build */
.reveal .slide-columns {
  display: grid;
  align-items: start;
  margin: 10px 0;
}

/* :::note - callout box (canonical replacement for .highlight-box) */
.reveal .note {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
  margin: 20px 0;
}

.reveal .note p {
  font-size: 18pt;
  margin: 0;
}

.reveal .note p + p {
  margin-top: 0.6em;
}

/* :::note variant="hint" - lighter, boxless (also used inside :::step) */
.reveal .note.hint-box {
  background: none;
  border: none;
  padding: 0;
}

/* :::quiz - prompt scales up; its last line is the question */
.reveal .quiz-prompt p {
  font-size: 18pt;
  margin: 0 0 0.6em 0;
}

.reveal .quiz-prompt p:last-child {
  font-size: 24pt;
  color: var(--text-color);
  margin: 0.5em 0 0 0;
}

.reveal .quiz-answer {
  margin-top: 30px;
}

/* :::step - spacing between code, hint, and answer */
.reveal .hint-box {
  margin-top: 22px;
}

.reveal .hint-box + .note {
  margin-top: 8px;
  padding: 12px 18px;
}

/* :::interactive - widget fills the slide body like a video */
.reveal .interactive-host {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

/* ===========================================
   FOLDING WIDGET  (:::interactive widget="folding")
   Linked input-space / hidden-space views with
   per-neuron weight & bias sliders.
   =========================================== */

.fold-widget {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  height: 100%;
}

.fold-views {
  display: grid;
  grid-template-columns: 1fr 1fr 0.85fr;
  gap: 18px;
  flex: 1;
  min-height: 0;
}

.fold-view {
  display: flex;
  flex-direction: column;
  margin: 0;
  min-height: 0;
}

.reveal .fold-view figcaption {
  font-size: 14pt;
  color: var(--primary-color);
  font-weight: 600;
  text-align: center;
  margin-bottom: 6px;
}

.fold-canvas {
  flex: 1;
  min-height: 0;
  width: 100%;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.fold-controls {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.fold-modes {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.fold-modes button {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: rgba(74, 158, 255, 0.10);
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
}

.fold-modes button.active {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: #0a0e1a;
  font-weight: 600;
}

.fold-modes button.fold-reset {
  background: rgba(245, 166, 35, 0.12);
  border-color: rgba(245, 166, 35, 0.40);
  color: var(--secondary-color);
}

.fold-sliders {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px 24px;
}

.fold-slider {
  display: grid;
  grid-template-columns: 70px 1fr 52px;
  align-items: center;
  gap: 10px;
}

.reveal .fold-slider label {
  font-size: 12pt;
  margin: 0;
  font-family: var(--body-font);
  font-weight: 600;
}

.fold-slider input[type="range"] {
  width: 100%;
  accent-color: var(--primary-color);
}

.reveal .fold-slider .fold-val {
  font-size: 12pt;
  color: var(--text-color);
  font-family: monospace;
  text-align: right;
  margin: 0;
}

.reveal .fold-readout {
  font-size: 13pt;
  color: var(--muted-color);
  text-align: center;
  margin: 0;
}

.reveal .fold-readout strong {
  color: var(--secondary-color);
}

/* ===========================================
   MLP BOUNDARY WIDGET  (:::interactive widget="mlpBoundary")
   =========================================== */

.mlp-widget {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  height: 100%;
}

.mlp-canvas-wrap {
  flex: 1;
  min-height: 0;
}

.mlp-canvas,
.land-canvas {
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.mlp-controls,
.land-controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(240px, 1fr));
  gap: 10px 24px;
  align-items: center;
}

.mlp-slider {
  display: grid;
  grid-template-columns: 70px 1fr 58px;
  align-items: center;
  gap: 10px;
}

.reveal .mlp-slider label,

# LLMs 0 to 100

Module 9: Evaluation and Benchmarking

How do we know whether a model is any good?

---

<!-- .slide: id="review-numbers" -->

## Review: Every Module So Far Ended With a Number

Each stage introduced its own metric. This module collects them and adds the standard benchmarks.

<div class="card-grid cols-4">
<div class="card"><h4>Module 5 &middot; Pretraining</h4><p>Held-out <strong>loss</strong> and <strong>perplexity</strong>. No labels needed, just text the model never saw.</p></div>
<div class="card"><h4>Module 6 &middot; SFT</h4><p><strong>Task accuracy</strong> after finetuning: does the model answer the instruction at all?</p></div>
<div class="card"><h4>Module 7 &middot; RL</h4><p>A <strong>reward curve</strong> and before/after accuracy on the reverse task.</p></div>
<div class="card"><h4>Module 8 &middot; Multimodal</h4><p>Exact-match scoring gets <strong>brittle</strong> once the answer is about an image.</p></div>
</div>

**Each training stage produces a different kind of model, so each stage gets a different measurement.** <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="review-question" -->

## Review: The Question This Module Answers

You are handed a checkpoint. **Is it any good? How does the industry report that?**

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**What carries over**

- Train/test splits from Module 2: a score on training data measures memorization
- Cross-entropy and perplexity from Module 5
- The chat template and answer format from Module 6
- Verifiable rewards from Module 7, reused here as **scoring** instead of training signal

</div>

<div>

**What is new**

- The standard **benchmarks**: MMLU, GSM8K, HumanEval, MMMU, SWE-bench
- Scoring answers that have **no single right answer**
- Why the same model gets **different scores** at different labs
- What a benchmark number does **not** tell you

</div>

</div>

---

<!-- .slide: id="divider-basics" class="section-divider" data-state="is-section-divider" -->

# Evaluations, Benchmarks, Leaderboards

Three words, three different things


---

<!-- .slide: id="three-words" -->

## Three Words, Three Different Things

<div class="card-grid cols-3">
<div class="card"><h4>Evaluation</h4><p>A <strong>dataset plus a scoring rule</strong>. Run the model on the cases, score the outputs, report a number.</p></div>
<div class="card"><h4>Benchmark</h4><p>An evaluation that is <strong>published and reused</strong>, so different labs can compare models on the same cases under the same rules.</p></div>
<div class="card"><h4>Leaderboard</h4><p>A <strong>public table</strong> of benchmark results. A summary of evaluations, not an evaluation itself.</p></div>
</div>

Every announced number is a benchmark result: somebody's dataset plus somebody's scoring rule. Both are choices. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="two-requirements" -->

## Two Things Every Evaluation Needs

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Held-out data**

- Test cases in training data: the score measures **memorization**, not ability
- Same idea as the Module 2 train/test split
- The web-scale version is **contamination**, later in this module

</div>

<div>

**An agreed scoring rule**

- "Accuracy" means nothing until you define **answer extraction** and **what counts as a match**
- Is "The answer is 4." the same as "4"? Somebody decides and publishes the code

</div>

</div>

Same benchmark, same weights, different numbers: usually the scoring rule, not fraud. <!-- .element: class="text-lg" style="margin-top: 10px;" -->

---

<!-- .slide: id="three-ways-to-score" -->

## Three Ways to Score an Output

<div class="card-grid cols-3">
<div class="card"><h4>Automatic and exact</h4><p>Compare against a key, run code against tests, check a number.</p><p style="margin-top: 8px;"><strong>Cheap and objective.</strong> Only works when there is a right answer.</p></div>
<div class="card"><h4>Human judgment</h4><p>People read the outputs and rate or rank them.</p><p style="margin-top: 8px;"><strong>Expensive and slow.</strong> Still the ground truth for open-ended work.</p></div>
<div class="card"><h4>Model judgment</h4><p>A strong model grades the outputs against a rubric.</p><p style="margin-top: 8px;"><strong>Cheap and scalable.</strong> A proxy that has to be checked against humans.</p></div>
</div>

**Which one you can use depends on the model you are measuring.** That is the rest of the module. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="two-shapes" -->

## Two Scoring Shapes, and How to Tell Them Apart

<div class="compare-table">
<table>
<thead><tr><th>Shape</th><th>What happens</th><th>Works on</th><th>Examples</th></tr></thead>
<tbody>
<tr><td><strong>Multiple choice, scored by likelihood</strong></td><td>Paste each choice onto the question; read the probability the model assigns to it. <strong>Most probable choice wins.</strong> Nothing is generated: one forward pass per choice.</td><td>Any model, including a base model that cannot follow instructions</td><td>MMLU, HellaSwag, ARC, WinoGrande</td></tr>
<tr><td><strong>Free generation, scored by a checker</strong></td><td>The model writes an answer; <strong>extract and check it</strong> against a key, a parser, or a test suite.</td><td>Instruction-tuned models that answer prompts</td><td>GSM8K, HumanEval, IFEval, most instruct benchmarks</td></tr>
</tbody>
</table>
</div>

The exercise implements both. They can disagree completely about the same two models. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="benchmark-history" -->

## Where This Whole Practice Came From

**ImageNet (2009)** showed that a shared test set with a public leaderboard can organize a field. AlexNet (Module 1) was an ImageNet result. NLP copied the pattern:

<div class="card-grid cols-3">
<div class="card"><h4>SQuAD (2016)</h4><p>100,000 reading-comprehension questions with a shared scoring script. Brought <strong>exact match and token F1</strong> into NLP.</p></div>
<div class="card"><h4>GLUE (2018)</h4><p>Nine tasks bundled into <strong>one score</strong>. Human performance was passed in about a year.</p></div>
<div class="card"><h4>SuperGLUE (2019)</h4><p>Built because GLUE saturated. Passed in about <strong>eighteen months</strong>.</p></div>
</div>

Every benchmark in this module descends from this: **a shared test set, a shared scoring rule, a public table.** <!-- .element: class="text-lg" -->

<!-- .slide: id="divider-base" class="section-divider" data-state="is-section-divider" -->

# Evaluating a Pretrained Model

What can you measure when the model will not answer you?


---

<!-- .slide: id="base-problem" -->

## A Base Model Does Not Follow Instructions

Ask a base model "what is the capital of France?" and it may continue with more questions (why Module 6 exists). Most abilities **cannot be asked for directly**. Two things can be measured anyway:

<div class="card-grid cols-2">
<div class="card"><h4>How well it predicts text</h4><p>Loss and perplexity on held-out text. <strong>No labels, no instructions, no generation.</strong></p></div>
<div class="card"><h4>What it knows</h4><p>Multiple-choice benchmarks scored by <strong>likelihood</strong>, which never require the model to write anything.</p></div>
</div>

---

<!-- .slide: id="base-perplexity" -->

## Perplexity: Module 5's Metric, Restated

$$\mathcal{L} = -\frac{1}{T}\sum_{t=1}^{T}\log p_\theta(x_t \mid x_{<t}), \qquad \mathrm{PPL} = \exp(\mathcal{L})$$

<div class="metric-box">
<p>Perplexity is the model's average <strong>branching factor</strong>: how many equally likely tokens it chooses among at each position. 1 = never surprised. 50,000 = guessing uniformly over the vocabulary.</p>
</div>

Lower is better. It needs no labels, only held-out text, so it works on any checkpoint at any point in training. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="base-bpb" -->

## Perplexity Does Not Compare Across Tokenizers

Perplexity is **per token**. A bigger vocabulary chops the same text into fewer, larger pieces (Module 4), so two **equally good** models can report very different perplexities.

Both models below spend 300 nats on the same 1,000-byte passage, so they model it equally well:

<div class="compare-table">
<table>
<thead><tr><th>Model</th><th>Vocabulary</th><th>Tokens used</th><th>Total loss</th><th>Perplexity</th><th>BPB</th></tr></thead>
<tbody>
<tr><td><strong>X</strong></td><td class="num">32,000</td><td class="num">250</td><td class="num">300 nats</td><td class="num">3.32</td><td class="num">0.433</td></tr>
<tr><td><strong>Y</strong></td><td class="num">128,000</td><td class="num">200</td><td class="num">300 nats</td><td class="num">4.48</td><td class="num">0.433</td></tr>
</tbody>
</table>
</div>

Model Y looks **35% worse** and is not worse at all. It answered fewer, harder questions. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="base-bpb-units" -->

## Bits per Byte: What the Two Units Are Doing

$$\mathrm{BPB} = \frac{\mathcal{L}_{\text{total}}}{\ln(2) \cdot \text{number of bytes}}$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Bytes: how much text there is**

- UTF-8 size of the held-out passage
- A property of the *file*
- Does not move when you swap tokenizers

</div>

<div>

**Bits: what the model spent**

- Total surprisal, converted from nats ($\div \ln 2$)
- Moves with the weights
- Barely moves with the tokenizer

</div>

</div>

Like **dollars per mile**: a cost, divided by a fixed distance to cover. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="base-bpb-compression" -->

## Which Makes It a Compression Rate

A byte holds **8 bits**. Bits per byte = how many bits the model needs to store one byte of English. 8 means no prediction at all.

<div class="card-grid cols-4">
<div class="card"><h4>8.0</h4><p>No model. Every byte equally likely; store the file as it came.</p></div>
<div class="card"><h4>~4.1</h4><p>A character histogram. Knows "e" is common and most byte values never appear.</p></div>
<div class="card"><h4>~1.0</h4><p>Shannon's 1951 estimate for English, measured by having people guess the next letter.</p></div>
<div class="card"><h4>~0.7</h4><p>A competent modern LLM on general text. Better than Shannon's humans.</p></div>
</div>

Multiply by the byte count: the compressed file size. Module 1 claimed **prediction and compression are the same operation**. This is that claim as a number. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="base-bpb-rule" -->

## When Each One Is Allowed

<div class="card-grid cols-2">
<div class="card"><h4>Perplexity is fine</h4><p>Same model family, same tokenizer, different checkpoints. Watching your own loss curve. This covers most of the day-to-day cases.</p></div>
<div class="card warn"><h4>Perplexity is meaningless</h4><p>Two labs' models with different tokenizers. Report bits per byte, or report nothing.</p></div>
</div>

---

<!-- .slide: id="base-perplexity-limits" -->

## Low Perplexity Is Not Usefulness

Perplexity rewards **fluent continuation**, not correct answers. Two models with nearly identical perplexity can differ by tens of points on tasks.

The exercise measures this directly: the RL model has **lower** perplexity than the instruct model, and is **far worse** at three of the four tasks. This is why nobody ships a model on a perplexity number. <!-- .element: class="text-lg" style="margin-top: 10px;" -->

---

<!-- .slide: id="base-benchmarks" -->

## Knowledge Benchmarks for Base Models

All scored by **likelihood**, so they work without instruction-following.

<div class="bench-table dense">
<table>
<thead><tr><th>Benchmark</th><th>Year</th><th>What it asks</th></tr></thead>
<tbody>
<tr><td><strong>MMLU</strong></td><td>2020</td><td>57 subjects of multiple choice, elementary to professional. For years, <em>the</em> headline number for a base model.</td></tr>
<tr><td><strong>HellaSwag</strong></td><td>2019</td><td>Which sentence plausibly continues this situation? Commonsense, adversarially filtered.</td></tr>
<tr><td><strong>ARC</strong></td><td>2018</td><td>Grade-school science questions, split into Easy and Challenge sets.</td></tr>
<tr><td><strong>WinoGrande, PIQA</strong></td><td>2019</td><td>Pronoun resolution and physical commonsense. The standard set in open-model reports.</td></tr>
<tr><td><strong>TriviaQA, Natural Questions</strong></td><td>2017, 2019</td><td>Factual recall with short free-form answers, scored by exact match and F1.</td></tr>
<tr><td><strong>GPQA</strong></td><td>2023</td><td>Graduate-level science, written to be hard <em>even with web search</em>. Built after MMLU began saturating.</td></tr>
</tbody>
</table>
</div>

---

<!-- .slide: id="base-fewshot" -->

## Few-Shot Prompting Is Part of the Protocol

Base models get `k` solved examples in the context, so the format comes from the prompt itself. This is GPT-3's in-context learning (Module 5).

<div class="card-grid cols-3">
<div class="card"><h4>0-shot</h4><p>Question only. Hardest for a base model: it may not produce an answer-shaped output at all.</p></div>
<div class="card"><h4>5-shot</h4><p>The MMLU convention. Five worked examples, then the question.</p></div>
<div class="card"><h4>25-shot</h4><p>Used for ARC on some leaderboards. Scores move with `k`.</p></div>
</div>

**A number without its shot count is not reproducible.** "MMLU 68" is incomplete. "MMLU 68, 5-shot, likelihood-scored" is checkable. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="base-daily-use" -->

## What Pretraining Evaluation Is Actually For

Nobody ships a base model. Its evaluations drive **training decisions**:

<div class="card-grid cols-3">
<div class="card"><h4>Checkpoint selection</h4><p>Compare checkpoints of the same run as training proceeds. Is it still improving?</p></div>
<div class="card"><h4>Data mixtures</h4><p>Does more code, or more filtered web text, move the numbers? A/B the corpus.</p></div>
<div class="card"><h4>Scaling checks</h4><p>Confirm a run is on the loss curve the scaling law predicted (Module 5).</p></div>
</div>

---

<div class="figure-card">

![Dan Hendrycks](module_09_evaluation/images/hendrycks.jpg)

<div class="figure-info">

## Dan Hendrycks <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### MMLU (2020) and MATH (2021)

Created the benchmarks that defined frontier comparison for years: **MMLU** for broad knowledge, **MATH** for competition mathematics. Both were built deliberately harder than models of the time could handle, which kept them useful longer.

Both are now largely saturated, which happens to every benchmark, faster each time.

</div>

</div>

</div>

<!-- .slide: id="divider-instruct" class="section-divider" data-state="is-section-divider" -->

# Evaluating an Instruction-Tuned Model

Now we can ask it questions and grade what it writes


---

<!-- .slide: id="instruct-two-families" -->

## After SFT, Two Kinds of Question

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Questions with a right answer**

"What is 17 times 24?" "Write a function that returns the median."

Scored **automatically**: compare to a key, parse a number, run the tests. Objective, cheap, reproducible.

</div>

<div>

**Questions without one**

"Summarize this report." "Explain recursion to a beginner."

Scored by **comparison**: humans or a model judge decide which of two answers is better. Expensive, subjective, unavoidable.

</div>

</div>

Most modern evaluation effort goes into moving questions from the right column to the left: making answers **checkable**. <!-- .element: class="text-lg" style="margin-top: 10px;" -->

---

<!-- .slide: id="instruct-accuracy" -->

## The Simplest Metric, and Why It Breaks

$$\mathrm{accuracy} = \frac{\text{number correct}}{\text{number evaluated}}$$

Exact match is the most transparent metric and the most brittle. Same answer, four strings:

<div class="card-grid cols-4">
<div class="card"><h4>"4"</h4><p>The key</p></div>
<div class="card"><h4>"4."</h4><p>Trailing punctuation</p></div>
<div class="card"><h4>" 4 "</h4><p>Whitespace</p></div>
<div class="card warn"><h4>"The answer is 4."</h4><p>Needs answer extraction</p></div>
</div>

Every benchmark ships two rules before it compares anything: <!-- .element: class="text-lg" -->

- **Normalization**: lowercase, strip punctuation and articles, collapse whitespace
- **Answer extraction**: text after `####`, the last number, the content of `\boxed{}`

---

<!-- .slide: id="instruct-f1" -->

## Partial Credit: Token-Level F1

When the answer is a phrase, exact match throws away information. Precision, recall, and F1 give partial credit:

$$\mathrm{precision} = \frac{TP}{TP+FP}, \qquad \mathrm{recall} = \frac{TP}{TP+FN}$$

$$F_1 = 2 \cdot \frac{\mathrm{precision}\cdot\mathrm{recall}}{\mathrm{precision}+\mathrm{recall}}$$

<div class="metric-box">
<p>Predicted <strong>"it is bluu"</strong> against reference <strong>"it is blue"</strong>: two of three predicted tokens are shared, two of three reference tokens are recovered. Exact match scores <strong>0.0</strong>. F1 scores <strong>0.67</strong>.</p>
</div>

These come from information retrieval, via SQuAD's scoring script. The exercise implements this exact computation. <!-- .element: class="text-lg" -->

---

<div class="figure-card">

![Karen Spärck Jones](module_09_evaluation/images/sparck_jones.jpg)

<div class="figure-info">

## Karen Spärck Jones <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Information retrieval; inverse document frequency (1972)

A founder of information retrieval, whose field gave NLP the vocabulary of **precision and recall**. Every F1 score in every model card traces back to this work.

Her often-quoted view that computing is too important to be left to men came with a matching insistence: measure systems **on real tasks**, not on their designers' intuitions.

</div>

</div>

</div>

---

<!-- .slide: id="instruct-checkable" -->

## Better Than String Comparison: Run the Answer

If the answer can be **executed**, do not compare strings:

<div class="card-grid cols-4">
<div class="card"><h4>Parse the number</h4><p>Extract the final numeric answer and compare it as a number, not text.</p></div>
<div class="card"><h4>Validate the schema</h4><p>Does the JSON parse, and does it match the required fields and types?</p></div>
<div class="card"><h4>Run the tests</h4><p>Execute the generated function against hidden unit tests.</p></div>
<div class="card"><h4>Check the constraint</h4><p>Exactly three bullet points? No use of the letter "e"? A parser can tell.</p></div>
</div>

Module 7's **verifiable reward** (a deterministic function that decides correctness), reused here for **scoring** instead of training. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="instruct-benchmarks" -->

## The Standard Instruct Benchmarks

<div class="bench-table">
<table>
<thead><tr><th>Benchmark</th><th>Year</th><th>What it tests, and how it is checked</th></tr></thead>
<tbody>
<tr><td><strong>GSM8K</strong></td><td>2021</td><td>Grade-school math word problems. Single numeric answer after a <code>####</code> marker. The canonical checkable-answer benchmark.</td></tr>
<tr><td><strong>MATH</strong></td><td>2021</td><td>Competition mathematics, much harder. Answers checked by <strong>symbolic equivalence</strong>, not string match.</td></tr>
<tr><td><strong>HumanEval, MBPP</strong></td><td>2021</td><td>Write a Python function from a docstring. Scored by <strong>running hidden tests</strong>.</td></tr>
<tr><td><strong>IFEval</strong></td><td>2023</td><td>Instructions with programmatically checkable constraints. Measures <strong>instruction-following itself</strong>, separately from knowledge.</td></tr>
<tr><td><strong>BBH, MMLU-Pro</strong></td><td>2022, 2024</td><td>Harder successors, built once the originals stopped separating models.</td></tr>
</tbody>
</table>
</div>

---

<!-- .slide: id="instruct-passk" -->

## Sampling Changes What the Number Means

**Greedy decoding** scores the single best answer. `pass@k` asks whether **any of k samples** is correct, the right metric when you can test candidates and keep the winner:

$$\mathrm{pass@}k = 1 - \frac{\binom{n-c}{k}}{\binom{n}{k}} \quad \text{for } c \text{ correct out of } n \text{ samples}$$

<div class="card-grid cols-3">
<div class="card"><h4>pass@1</h4><p>Ordinary accuracy of one sample. What a user experiences.</p></div>
<div class="card"><h4>pass@10</h4><p>Is the answer <strong>anywhere</strong> in the distribution across ten tries?</p></div>
<div class="card"><h4>The gap</h4><p>Measures how <strong>sharp</strong> the distribution is, which is what reasoning-model evaluation turns on.</p></div>
</div>

Introduced with HumanEval: for code, you really can generate ten candidates and run the tests. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="judge-no-key" -->

## When There Is No Right Answer

Summaries, explanations, advice, code review, tone: no key to compare against. The field has tried two answers.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Old: overlap with a reference**

- **BLEU** (2002, translation), **ROUGE** (2004, summarization)
- Count n-grams shared with human-written references
- Drove twenty years of measurable progress
- Cannot tell whether an answer is **true or useful**: a fluent wrong answer scores well

</div>

<div>

**Current: comparison**

- Show two answers to the same prompt, ask **which is better**
- No reference text, no vocabulary matching
- Measures what users care about
- Cost: you need a judge, and judges have biases

</div>

</div>

---

<div class="figure-card">

![Kishore Papineni and Chin-Yew Lin](module_09_evaluation/images/papineni_lin.jpg)

<div class="figure-info">

## Kishore Papineni &amp; Chin-Yew Lin <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### BLEU (IBM, 2002) and ROUGE (2004)

Papineni and collaborators scored translations by **n-gram overlap with human references**. Before BLEU, comparing two translation systems meant hiring translators. After it, a research group could iterate overnight.

Lin did the same for summarization. Both metrics correlate **weakly** with human judgment on modern systems and are still reported anyway: a flawed number everyone computes the same way is at least comparable.

</div>

</div>

</div>

---

<!-- .slide: id="judge-arena" -->

## Human Preference at Scale: Chatbot Arena

Anonymous side-by-side votes from **real users on real prompts**, aggregated into an Elo-style rating. The industry's de facto public scoreboard.

<div class="card-grid cols-2">
<div class="card"><h4>Why it worked</h4><p>Measures what people <strong>actually prefer</strong>, on prompts people actually send, not an academic test set.</p></div>
<div class="card warn"><h4>The caveat</h4><p><strong>Preference is not correctness.</strong> Longer, better-formatted, more agreeable answers win votes: Module 7's length and sycophancy bias, now measured instead of trained.</p></div>
</div>

A model can climb the Arena by getting friendlier and more verbose, not more accurate. <!-- .element: class="text-lg" -->

---

<div class="figure-card">

![Wei-Lin Chiang and Lianmin Zheng](module_09_evaluation/images/chiang_zheng.jpg)

<div class="figure-info">

## Wei-Lin Chiang &amp; Lianmin Zheng <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Chatbot Arena and MT-Bench (UC Berkeley and LMSYS, 2023)

With **Ying Sheng** and collaborators, they turned **anonymous preference votes** into a continuously updated public ranking, and published the paired-comparison data.

Their **MT-Bench** paper is the standard reference for LLM-as-a-judge: a strong model's verdicts agree with humans enough to be useful, and are biased enough to need controls.

Both rest on one shift: with no answer key, you can still ask **which of two answers is better.**

</div>

</div>

</div>

---

<!-- .slide: id="judge-llm" -->

## LLM-as-a-Judge

A strong model grades answers against a rubric, or picks a winner between two. Correlates well with human preference, costs almost nothing, now everywhere.

<div class="card-grid cols-2">
<div class="card"><h4>MT-Bench (2023)</h4><p>Eighty multi-turn questions, scored 1&ndash;10 by a strong judge model against a rubric.</p></div>
<div class="card"><h4>AlpacaEval (2023)</h4><p>Head-to-head win rate against a fixed reference model, judged automatically. Version 2 <strong>controls for length</strong> explicitly.</p></div>
</div>

A judge is a **proxy**. Validate it against a few hundred human-labeled examples **from your own task** before trusting its numbers. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="judge-biases" -->

## Judge Biases You Should Assume Are Present

<div class="card-grid cols-4">
<div class="card warn"><h4>Position bias</h4><p>Prefers whichever answer came first. <strong>Fix:</strong> run both orders and average.</p></div>
<div class="card warn"><h4>Verbosity bias</h4><p>Prefers longer answers. <strong>Fix:</strong> control for length, or report length alongside the win rate.</p></div>
<div class="card warn"><h4>Self-preference</h4><p>Favors outputs that look like its own. <strong>Fix:</strong> use a judge from a different family.</p></div>
<div class="card warn"><h4>Competence ceiling</h4><p>A judge cannot reliably grade work it could not do itself. <strong>Fix:</strong> no fix. Use humans.</p></div>
</div>

---

<!-- .slide: id="sq-swap-answers" -->

## Side Quest: Swap the Answers

Ask a judge model which of two answers is better. Record the verdict. Present **the same answers in the opposite order** and ask again.

<div class="card-grid cols-2">
<div class="card"><h4>What often happens</h4><p>The verdict flips. The judge preferred <strong>the first position</strong>, not the better answer.</p></div>
<div class="card"><h4>What it costs to fix</h4><p>Double the judge calls. Every serious LLM-judge harness randomizes or averages over order for exactly this reason.</p></div>
</div>

A two-minute experiment that changes how you read every LLM-judged leaderboard. The extra credit builds a rule-based version you can watch flip. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="divider-reasoning" class="section-divider" data-state="is-section-divider" -->

# Evaluating a Reasoning or RL-Trained Model

The reward went up. So what?


---

<!-- .slide: id="reasoning-reward-curve" -->

## A Reward Curve Is Not an Evaluation

Module 7's climbing reward curve says **the optimizer works**. The reward is exactly what was optimized, so the curve says nothing about whether the model got better.

<div class="card-grid cols-2">
<div class="card"><h4>What the reward curve measures</h4><p>Training progress on the training prompts, under the training reward. A <strong>diagnostic</strong>.</p></div>
<div class="card warn"><h4>What it cannot measure</h4><p>Whether the ability generalizes, whether other abilities survived, or whether the model found a way to score without solving anything.</p></div>
</div>

Evaluate an RL model with the **same held-out benchmarks as before**, plus new ones for RL's failure modes. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="reasoning-benchmarks" -->

## Hard Problems With Checkable Answers

This is the RLVR setup from Module 7 used as a **test set** rather than a training signal.

<div class="bench-table">
<table>
<thead><tr><th>Benchmark</th><th>What it asks</th></tr></thead>
<tbody>
<tr><td><strong>AIME</strong> and competition math</td><td>Short integer answers, hard enough to be unsaturated. The standard headline number in reasoning-model announcements.</td></tr>
<tr><td><strong>GPQA Diamond</strong></td><td>The hardest slice of GPQA: graduate science questions that resist web search.</td></tr>
<tr><td><strong>Competitive programming</strong></td><td>Codeforces-style problems, scored by running the judge's tests. Often reported as an Elo rating.</td></tr>
<tr><td><strong>SWE-bench</strong></td><td>Resolve a real GitHub issue so the project's test suite passes. Covered under agent evaluation.</td></tr>
<tr><td><strong>ARC-AGI</strong></td><td>Abstract visual puzzles designed to resist memorization. The most-cited "is it really reasoning" benchmark.</td></tr>
</tbody>
</table>
</div>

---

<!-- .slide: id="reasoning-reporting" -->

## Two Reporting Rules That Matter More Here

Reasoning models are **stochastic and expensive**. Without these two numbers, the score is meaningless:

<div class="card-grid cols-2">
<div class="card"><h4>1. How the samples were combined</h4><p>Is this <strong>pass@1</strong>, <strong>majority vote</strong> over n samples (self-consistency), or <strong>best-of-n with a verifier</strong>?</p><p style="margin-top: 8px;">These can differ by tens of points on the same model and the same benchmark.</p></div>
<div class="card"><h4>2. The reasoning budget</h4><p>Test-time compute is a dial (Module 7). The same model at 2,000 thinking tokens and at 32,000 is not the same system.</p><p style="margin-top: 8px;">A score without a token budget is <strong>not reproducible</strong>.</p></div>
</div>

---

<!-- .slide: id="reasoning-passk" -->

## The pass@k Lesson, Restated as an Evaluation Principle

Module 7: RL **sharpens** the sampling distribution rather than expanding ability. As measurement, that is a claim about the pass@1 versus pass@k gap:

<div class="card-grid cols-3">
<div class="card"><h4>pass@1 rises sharply</h4><p>The model now puts its probability mass on the answer it could already sometimes find.</p></div>
<div class="card"><h4>pass@k at large k stays flat</h4><p>The set of problems it can solve <em>at all</em> did not grow.</p></div>
<div class="card warn"><h4>The consequence</h4><p>Measuring only pass@1 <strong>systematically overstates</strong> what RL added.</p></div>
</div>

In the exercise: the RL model's QA pass@1 falls to 70% while pass@5 stays at 100%. The right answer is still in there, just no longer on top. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="reasoning-breakage" -->

## What RL Breaks That the Target Benchmark Will Not Show

<div class="card-grid cols-2">
<div class="card warn"><h4>Regressions on other tasks</h4><p>Training hard on one objective degrades unrelated behavior: the <strong>alignment tax</strong> from Module 7. The fix is boring. Keep running the old evaluations.</p></div>
<div class="card warn"><h4>Reward hacking that survives to test time</h4><p>Padding, hedging, and formatting tricks that scored well during training do not disappear when training stops.</p></div>
</div>

> The exercise makes this concrete: GRPO on the reverse task alone gains **+17 points** on reverse and loses **50 to 75 points** on the three tasks nobody was watching.

The KL penalty does not save you: it constrains the policy on training prompts and does nothing on prompts it never sees. <!-- .element: class="text-lg" style="margin-top: 8px;" -->

---

<!-- .slide: id="reasoning-refusal" -->

## Behavior Evaluations Always Come in Pairs

<div class="card-grid cols-2">
<div class="card"><h4>Refusal rate</h4><p>Does the model decline genuinely harmful requests? Measured on harmful-instruction suites and jailbreak-robustness tests.</p></div>
<div class="card"><h4>False-refusal rate</h4><p>Does it also decline <strong>benign</strong> requests that merely sound alarming? Measured on over-refusal suites such as <strong>XSTest</strong>.</p></div>
</div>

Either number alone is trivially gamed: refuse everything, or refuse nothing. **Only the pair means anything.** <!-- .element: class="text-lg" -->

---

<!-- .slide: id="reasoning-goodhart" -->

## Goodhart's Law Is the Theme of This Section

> When a measure becomes a target, it ceases to be a good measure.

<div class="card-grid cols-2">
<div class="card"><h4>Training-side (Module 7)</h4><p><strong>Reward hacking.</strong> The policy finds a way to score that the reward designer did not intend.</p></div>
<div class="card"><h4>Industry-side (this module)</h4><p><strong>Benchmark chasing.</strong> The field optimizes what is published, and the published number stops predicting real usefulness.</p></div>
</div>

Same mechanism, different scale. It is why the practical advice ends with "build your own held-out set." <!-- .element: class="text-lg" -->

---

<!-- .slide: id="divider-multimodal" class="section-divider" data-state="is-section-divider" -->

# Evaluating Multimodal Models

The answer depends on something a string cannot see


---

<!-- .slide: id="mm-why-harder" -->

## Why Multimodal Scoring Is Harder

Module 8 built models that take images. Grading them is harder for two reasons:

<div class="card-grid cols-2">
<div class="card"><h4>The evidence is not in the text</h4><p>Correctness depends on <strong>visual detail</strong> (spatial relations, small print, a chart's axis) that no string comparison can inspect.</p></div>
<div class="card"><h4>Free-form visual answers break exact match</h4><p>"two" and "there are two people" are the same answer. Multimodal suites lean on <strong>multiple choice and LLM judges</strong> more than text suites do.</p></div>
</div>

---

<!-- .slide: id="mm-understanding" -->

## Understanding Benchmarks

<div class="bench-table dense">
<table>
<thead><tr><th>Benchmark</th><th>Year</th><th>What it stresses</th></tr></thead>
<tbody>
<tr><td><strong>VQAv2</strong></td><td>2017</td><td>Short-answer questions about natural images, scored against ten human answers. Defined visual question answering.</td></tr>
<tr><td><strong>TextVQA, DocVQA, ChartQA, AI2D</strong></td><td>2019&ndash;2022</td><td>Reading text in images, documents, charts, and diagrams. Where OCR ability shows up, and what most business use of vision models needs.</td></tr>
<tr><td><strong>MMMU</strong></td><td>2023</td><td>College-level multi-discipline questions with figures and diagrams. The current headline multimodal number.</td></tr>
<tr><td><strong>MathVista</strong></td><td>2023</td><td>Mathematical reasoning over visual inputs.</td></tr>
<tr><td><strong>MMBench, MME</strong></td><td>2023</td><td>Broad capability suites with per-ability breakdowns: recognition, spatial relations, counting, OCR.</td></tr>
<tr><td><strong>Video-MME</strong></td><td>2024</td><td>Video understanding: temporal reasoning over much longer inputs.</td></tr>
<tr><td><strong>POPE</strong></td><td>2023</td><td>Hallucination probe. Ask about objects that are <strong>not in the image</strong> and see whether the model agrees they are.</td></tr>
</tbody>
</table>
</div>

---

<!-- .slide: id="mm-generation" -->

## Captioning and Generation Need Different Machinery

<div class="card-grid cols-4">
<div class="card"><h4>CIDEr, SPICE</h4><p>Captioning on MS COCO, scored against several reference captions.</p></div>
<div class="card"><h4>CLIPScore</h4><p>Uses a contrastive image-text model (Module 8) to measure image-caption agreement. <strong>No reference caption is needed.</strong></p></div>
<div class="card"><h4>FID</h4><p>Image generation: distributional similarity to real images. Human preference is still the standard for quality.</p></div>
<div class="card"><h4>Word error rate</h4><p>Speech recognition. One of the oldest and cleanest automatic metrics in the field.</p></div>
</div>

The instruction-tuned pattern repeats: with a reference, compare to it; without one, ask a judge to compare two outputs. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="sq-no-image" -->

## Side Quest: Can It Be Answered Without the Image?

Many visual benchmarks can be **partly answered from language priors alone**. "What color is the banana?" has a good guess that never looks at the picture.

<div class="card-grid cols-2">
<div class="card"><h4>The ablation</h4><p>Run the benchmark with the <strong>image removed</strong>, leaving only the question and options. Whatever score survives came from the text.</p></div>
<div class="card warn"><h4>What people find</h4><p>On several popular suites, a text-only model scores far above chance. The reported number is partly a <strong>language</strong> benchmark.</p></div>
</div>

Module 8 fixed this shortcut by balancing the dataset: every answer equally likely a priori, so the only way to be right is to look. <!-- .element: class="text-lg" -->

<!-- .slide: id="divider-agents" class="section-divider" data-state="is-section-divider" -->

# Evaluating Agents

Not `is this answer right` but `did the task get done`


---

<!-- .slide: id="agents-shift" -->

## The Question Changes

An agent is a model **plus tools, plus many turns**. Scoring shifts from inspecting a string to inspecting the **final state of an environment**.

<div class="card-grid cols-2">
<div class="card"><h4>Answer evaluation</h4><p>Compare the output to a key. One turn, one string, deterministic scoring.</p></div>
<div class="card"><h4>Task evaluation</h4><p>Run the project's test suite. Query the database. Check whether the file exists and contains what it should. <strong>The environment is the grader.</strong></p></div>
</div>

Evaluation stops being a metric on outputs and becomes an **integration test**: engineering practice, not research practice. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="agents-benchmarks" -->

## The Agent Benchmarks You Will Hear About

<div class="bench-table">
<table>
<thead><tr><th>Benchmark</th><th>Environment</th><th>How it is scored</th></tr></thead>
<tbody>
<tr><td><strong>SWE-bench</strong> (2023)</td><td>A real GitHub repository with a real issue</td><td>Apply the model's patch and run the project's test suite. <strong>SWE-bench Verified</strong> is the human-filtered subset everyone reports.</td></tr>
<tr><td><strong>GAIA</strong></td><td>Browsing, files, and tools</td><td>General-assistant questions with short verifiable answers.</td></tr>
<tr><td><strong>WebArena, OSWorld</strong></td><td>A simulated browser or desktop</td><td>Inspect the end state: was the form submitted, the file saved, the setting changed?</td></tr>
<tr><td><strong>tau-bench</strong></td><td>Multi-turn customer service with tool calls</td><td>Did the agent follow the policy rules and reach the correct final state?</td></tr>
</tbody>
</table>
</div>

Modules 10 and 11 build the systems these benchmarks measure. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="agents-hard" -->

## Why Agent Evaluation Is Hard

<div class="card-grid cols-4">
<div class="card"><h4>Expensive</h4><p>Runs are long and multi-turn. A full sweep costs real money and hours.</p></div>
<div class="card"><h4>Stateful and flaky</h4><p>Environments drift, networks fail, and a rerun is not the same run.</p></div>
<div class="card"><h4>Partial progress</h4><p>Getting 80% of the way is real value and hard to score. Most suites score pass/fail anyway.</p></div>
<div class="card warn"><h4>Right for the wrong reason</h4><p>The agent edits the tests instead of the code. The grader says pass.</p></div>
</div>

The last one is reward hacking where it is hardest to notice: **the scoring function is a program the agent can reach.** <!-- .element: class="text-lg" -->

---

<!-- .slide: id="divider-protocol" class="section-divider" data-state="is-section-divider" -->

# Why the Same Model Gets Different Scores

A benchmark number belongs to a model AND a protocol


---

<!-- .slide: id="protocol-knobs" -->

## Same Weights, Different Number

The same checkpoint can move several points on MMLU from choices unrelated to the weights:

<div class="card-grid cols-3">
<div class="card"><h4>Prompt template</h4><p>Chat formatting, system prompt, whether the options are labeled A&ndash;D or 1&ndash;4.</p></div>
<div class="card"><h4>Shot count</h4><p>Zero-shot versus few-shot, and how many examples, and which ones.</p></div>
<div class="card"><h4>Scoring shape</h4><p>Free generation versus option-likelihood, and whether likelihoods are length-normalized.</p></div>
<div class="card"><h4>Answer extraction</h4><p>The regex that pulls the answer out of the generated text.</p></div>
<div class="card"><h4>Normalization</h4><p>Lowercasing, punctuation, articles, unit handling.</p></div>
<div class="card"><h4>Decoding</h4><p>Greedy versus sampled, temperature, seed, number of samples.</p></div>
</div>

**A benchmark number describes a model and a protocol together.** Reproducible reports log the model revision, dataset version, prompt, decoding settings, and harness version. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="sq-two-scores" -->

## Side Quest: One Model, Two Scores

Take one checkpoint. Run it twice, changing exactly one thing about the protocol.

<div class="card-grid cols-2">
<div class="card"><h4>Change the template</h4><p>Add a space after the assistant marker. Reword the instruction. Keep the weights identical.</p></div>
<div class="card"><h4>Change the scoring shape</h4><p>Score the multiple-choice set by likelihood, then by reading the generated letter.</p></div>
</div>

The scores move; the model did not change. This is the first extra credit in the exercise, and the fastest way to stop treating a leaderboard cell as a property of the weights. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="protocol-contamination" -->

## Contamination

If test items (or near-duplicates) appear in the training data, a high score measures **recall**, not generalization. Web-scale training makes this impossible to rule out completely. Partial defenses:

<div class="card-grid cols-3">
<div class="card"><h4>N-gram overlap checks</h4><p>Search the training corpus for the test items. Finds exact and near-exact copies; misses paraphrases.</p></div>
<div class="card"><h4>Time-based splits</h4><p>Test on material published <strong>after</strong> the training cutoff. Expensive, and only works once per benchmark.</p></div>
<div class="card"><h4>Private held-out sets</h4><p>Never publish the test answers. The approach GLUE, SuperGLUE, and ARC-AGI all take.</p></div>
</div>

---

<!-- .slide: id="sq-in-training" -->

## Side Quest: Was the Test in the Training Set?

The exercise bundles the finetuning data and the evaluation cases, so you can **look**.

<div class="card-grid cols-2">
<div class="card"><h4>What you will find</h4><p>The <code>uppercase</code>, <code>repeat</code>, and <code>reverse</code> cases use words that appear nowhere in training. All eight <code>qa</code> facts appear <strong>verbatim</strong>.</p></div>
<div class="card warn"><h4>The uncomfortable part</h4><p><code>qa</code> is the task the instruct model scores 100% on. That number is <strong>recall of memorized facts</strong>, and the report does not say so.</p></div>
</div>

This check took one `grep` on 1,500 examples. What could it mean for a model trained on much of the public internet? <!-- .element: class="text-lg" -->

---

<!-- .slide: id="protocol-saturation-chart" -->

## Saturation: How Long a Benchmark Stays Useful

Each bar runs from **publication** to the year the best systems reached the human or expert ceiling. The axis is to scale. <!-- .element: class="text-lg" style="margin-top: 6px;" -->

---

<!-- .slide: id="protocol-saturation-meaning" -->

## What Saturation Costs You

Once the best models sit near the ceiling, a benchmark stops separating them. Remaining gains are mostly **noise and overfitting**.

<div class="card-grid cols-2">
<div class="card"><h4>Why the field keeps building successors</h4><p>GLUE to SuperGLUE, MMLU to MMLU-Pro and GPQA, GSM8K to AIME, ARC to ARC-AGI. Each one exists because its predecessor stopped discriminating.</p></div>
<div class="card"><h4>Why the window keeps shrinking</h4><p>Fourteen years for MNIST. Roughly two for the recent ones. A benchmark published today should be assumed to have a <strong>short useful life</strong>.</p></div>
</div>

**Public benchmarks compare models in general. A small private test set from your own task is the only one nobody can train on.** <!-- .element: class="text-lg" -->

# Running Evaluations in Practice

Nobody writes this from scratch

## The Tooling to Know by Name

<div class="card-grid cols-2">
<div class="card"><h4>lm-evaluation-harness (EleutherAI)</h4><p>The de facto standard for likelihood-scored academic benchmarks, and the engine behind the Open LLM Leaderboard. If two labs report the same MMLU number, this is usually why.</p></div>

![Percy Liang](module_09_evaluation/images/percy_liang.jpg)

<div class="figure-info">

## Percy Liang <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Holistic Evaluation of Language Models (Stanford CRFM, 2022)

Argued that one headline accuracy hides most of what matters, then built infrastructure to evaluate many **scenarios** against many **metrics**: accuracy, calibration, robustness, fairness, bias, toxicity, efficiency. HELM also reports **what was not measured**.

Before HELM, a model report was a row of accuracies. After it, a grid, with the empty cells visible.

</div>

<!-- .slide: id="practice-three-tiers" -->

## A Workable Setup for a Real Project

<div class="card-grid cols-3">
<div class="card"><h4>1. Fast eval</h4><p>A small set you run on <strong>every change</strong> during development. Seconds, not hours. Catches obvious breakage immediately.</p></div>
<div class="card"><h4>2. Regression suite</h4><p>Cases that <strong>used to fail and must keep passing</strong>. Grows every time you fix something. This is the file that saves you.</p></div>
<div class="card"><h4>3. Release eval</h4><p>Slower and broader, run before you swap models in production. Includes the public benchmarks and your own private set.</p></div>
</div>

**Keep the per-case outputs, not just the averages.** Reading failures turns evaluation into a fix. An aggregate can hide a total regression on one task inside a small overall gain. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="practice-handoff" -->

## Quality Is One Axis of a Deployment Decision

The other axis is **cost**: latency, memory, and throughput.

<div class="card-grid cols-2">
<div class="card"><h4>This module</h4><p>Model A is two points better than model B: <strong>at what</strong>, <strong>under what protocol</strong>, <strong>with what confidence</strong>.</p></div>
<div class="card"><h4>Not this module</h4><p>Whether two points are worth four times the latency and eight times the memory. A model you cannot afford to serve is not a better product.</p></div>
</div>

**Next class: Deployment and Inference.** Where the two points meet the memory bandwidth. <!-- .element: class="text-lg" -->

# Quiz


---

<!-- .slide: id="quiz-base-model" -->

## Measuring a Model That Will Not Answer

<div class="quiz-prompt">

A base model cannot follow instructions. What can you still measure about it, and why is perplexity not enough?

</div>

<div class="fragment note quiz-answer">

**Short answer: you can measure how well it predicts held-out text (loss and perplexity) and what it knows (multiple choice scored by likelihood). Perplexity is not enough because it rewards fluent continuation, not correct answers.**

- Neither requires the model to produce an answer on demand
- Perplexity rewards **plausible** next tokens, not **right** ones
- Near-identical perplexity can hide tens of points of task difference
- In the exercise, the lower-perplexity model is the one that collapsed on three of four tasks

</div>

---

<!-- .slide: id="quiz-tokenizer" -->

## Why Perplexity Does Not Travel

<div class="quiz-prompt">

Why are perplexity numbers not comparable between two models with different tokenizers, and what is reported instead?

</div>

<div class="fragment note quiz-answer">

**Short answer: perplexity is per token, and a bigger vocabulary means fewer, larger tokens per unit of text. Report bits per byte instead.**

- Model A splits a word into five tokens, model B into two: five predictions versus two, over different vocabularies
- The per-token averages measure different things
- **Bits per byte** divides by text length instead of token count
- The denominator becomes a property of the data, so the number compares across model families

</div>

---

<!-- .slide: id="quiz-likelihood" -->

## Why Score by Likelihood at All

<div class="quiz-prompt">

Why do most academic benchmarks score multiple choice by likelihood rather than by reading the model's generated answer?

</div>

<div class="fragment note quiz-answer">

**Short answer: likelihood scoring works on models that cannot follow instructions, and it removes answer extraction (a large source of protocol variance) from the measurement.**

- A base model asked "A, B, C, or D?" may not produce a letter at all
- Likelihood scoring appends each candidate, scores it, takes the highest: no generation
- Runs on any checkpoint; the number depends on weights, not a regex
- Cost: a model whose generation collapsed can still score perfectly, as in the exercise

</div>

---

<!-- .slide: id="quiz-protocol" -->

## Same Model, Different Numbers

<div class="quiz-prompt">

Two labs report different MMLU scores for the same open-weight model. Give three things about the protocol that could explain the gap.

</div>

<div class="fragment note quiz-answer">

**Short answer: shot count, prompt template, and scoring shape. Also answer extraction, normalization, and length normalization of the likelihoods.**

Each of these moves the number by points on identical weights:

- Few-shot example count, and which examples
- Prompt formatting: chat markers, option labels A&ndash;D versus 1&ndash;4
- Likelihood scoring versus reading generated text, and length normalization
- The answer-extraction regex and normalization rules

A benchmark number belongs to a model *and* a protocol. Reproducible reports log the harness version.

</div>

---

<!-- .slide: id="quiz-reward-curve" -->

## The Reward Went Up

<div class="quiz-prompt">

The GRPO model's reward curve climbed steadily during training. Why is that not evidence that the model got better?

</div>

<div class="fragment note quiz-answer">

**Short answer: the reward is exactly what was optimized, measured on the training prompts. A climbing curve shows the optimizer works, not that any ability generalized or survived.**

The curve is a **training diagnostic**, like a falling loss curve. It cannot tell you whether:

- The gain transfers to held-out prompts
- The model found a degenerate way to score
- Unrelated abilities were destroyed on the way

All three need separate held-out evaluations. In the exercise, the reward climbed from 0.5 to 0.93 and the suite score fell 33 points.

</div>

---

<!-- .slide: id="quiz-passk" -->

## pass@1 Up, pass@10 Flat

<div class="quiz-prompt">

A model's pass@1 improves after RL but pass@10 does not. What does that suggest about what RL changed?

</div>

<div class="fragment note quiz-answer">

**Short answer: RL sharpened the sampling distribution rather than expanding the set of problems the model can solve.**

- pass@10 asks whether the answer is **anywhere** in ten tries; flat means the set of solvable problems did not grow
- pass@1 asks whether the answer is **on top**; rising means probability mass moved onto answers the model could already produce
- Reporting only pass@1 systematically overstates what RL added

</div>

---

<!-- .slide: id="quiz-contamination" -->

## What Contamination Does to a Score

<div class="quiz-prompt">

What does benchmark contamination do to the meaning of a high score, and why can it never be fully ruled out for a model trained on the web?

</div>

<div class="fragment note quiz-answer">

**Short answer: it turns the score into a measure of recall rather than generalization, and web-scale training data cannot be exhaustively searched for paraphrases of test items.**

- A test item in training means a correct answer shows **memorization**, not problem-solving
- N-gram checks catch near-exact copies; a question discussed on a forum, translated, or reworded will not match
- Partial defenses: time-based splits, private held-out test sets
- The reliable defense: a test set you wrote yourself and never published

</div>

---

<!-- .slide: id="quiz-arena" -->

## Climbing Without Improving

<div class="quiz-prompt">

Chatbot Arena ranks models by human preference votes. Name a way a model can climb that ranking without becoming more correct.

</div>

<div class="fragment note quiz-answer">

**Short answer: get longer, better formatted, and more agreeable. Preference is not correctness.**

- Voters reward answers that look thorough and feel accommodating
- More structure, less hedging, more agreement wins votes without changing a single fact
- Module 7's length and sycophancy bias, now in the **measurement** instead of the training signal
- Why AlpacaEval 2.0 explicitly controls for length

</div>

---

<!-- .slide: id="quiz-refusal" -->

## Why Two Numbers, Not One

<div class="quiz-prompt">

Why must refusal rate and false-refusal rate always be reported together?

</div>

<div class="fragment note quiz-answer">

**Short answer: each one alone is trivially maximized by a degenerate model: refuse everything, or refuse nothing.**

- Refuse everything: perfect refusal rate, useless model
- Refuse nothing: perfect false-refusal rate, unsafe model
- Only the **pair** exposes the trade-off, same structure as precision and recall: one number can always be bought with the other

</div>

---

<!-- .slide: id="quiz-image-ablation" -->

## Did It Look at the Picture?

<div class="quiz-prompt">

A multimodal benchmark reports 60% accuracy. What single ablation would tell you how much of that came from actually looking at the image?

</div>

<div class="fragment note quiz-answer">

**Short answer: run the same benchmark with the image removed. Whatever score survives came from language priors.**

- A text-only run scoring 45% (chance 25%) means most of the gap above chance came from the **question and options alone**
- Bananas are usually yellow; one option usually reads more plausibly
- The reported 60% is partly a language benchmark wearing a multimodal label
- Dataset fix: balancing, so every answer is equally likely a priori

</div>
