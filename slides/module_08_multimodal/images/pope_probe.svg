<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="POPE probing: the hardest absent objects are the ones that usually co-occur with what is present" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8fa0bd"/></marker><marker id="ahs" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 Z" fill="#8fa0bd"/></marker></defs>
<rect x="20" y="30" width="300" height="220" rx="6" fill="#141a28" stroke="#c7d0e0" stroke-width="1.5"/>
<rect x="40" y="120" width="260" height="110" rx="6" fill="#5a4330"/>
<ellipse cx="150" cy="170" rx="52" ry="30" fill="#e8eaf0"/>
<ellipse cx="150" cy="170" rx="34" ry="18" fill="#c7d0e0"/>
<rect x="222" y="138" width="5" height="62" rx="2" fill="#c7d0e0"/>
<rect x="217" y="128" width="2" height="14" fill="#c7d0e0"/>
<rect x="221" y="128" width="2" height="14" fill="#c7d0e0"/>
<rect x="225" y="128" width="2" height="14" fill="#c7d0e0"/>
<rect x="229" y="128" width="2" height="14" fill="#c7d0e0"/>
<rect x="250" y="146" width="30" height="36" rx="4" fill="#4a9eff"/>
<text x="170" y="62" fill="#8fa0bd" font-size="12" text-anchor="middle" font-weight="normal">Image contains: dining table,</text>
<text x="170" y="80" fill="#8fa0bd" font-size="12" text-anchor="middle" font-weight="normal">plate, fork, cup</text>
<rect x="360" y="44" width="610" height="44" rx="8" fill="#141a28" stroke="#50c878" stroke-width="1.5"/>
<text x="378" y="71" fill="#e8eaf0" font-size="13.5" text-anchor="start" font-weight="normal">Is there a fork in the image?</text>
<text x="780" y="71" fill="#8fa0bd" font-size="11.5" text-anchor="middle" font-weight="normal">present</text>
<text x="925" y="71" fill="#50c878" font-size="12.5" text-anchor="middle" font-weight="600">yes</text>
<rect x="360" y="102" width="610" height="44" rx="8" fill="#141a28" stroke="#50c878" stroke-width="1.5"/>
<text x="378" y="129" fill="#e8eaf0" font-size="13.5" text-anchor="start" font-weight="normal">Is there a giraffe in the image?</text>
<text x="780" y="129" fill="#8fa0bd" font-size="11.5" text-anchor="middle" font-weight="normal">random absent object</text>
<text x="925" y="129" fill="#50c878" font-size="12.5" text-anchor="middle" font-weight="600">easy no</text>
<rect x="360" y="160" width="610" height="44" rx="8" fill="#141a28" stroke="#f5a623" stroke-width="1.5"/>
<text x="378" y="187" fill="#e8eaf0" font-size="13.5" text-anchor="start" font-weight="normal">Is there a person in the image?</text>
<text x="780" y="187" fill="#8fa0bd" font-size="11.5" text-anchor="middle" font-weight="normal">popular absent object</text>
<text x="925" y="187" fill="#f5a623" font-size="12.5" text-anchor="middle" font-weight="600">harder</text>
<rect x="360" y="218" width="610" height="44" rx="8" fill="#141a28" stroke="#e05252" stroke-width="1.5"/>
<text x="378" y="245" fill="#e8eaf0" font-size="13.5" text-anchor="start" font-weight="normal">Is there a knife in the image?</text>
<text x="780" y="245" fill="#8fa0bd" font-size="11.5" text-anchor="middle" font-weight="normal">co-occurs with fork + plate</text>
<text x="925" y="245" fill="#e05252" font-size="12.5" text-anchor="middle" font-weight="600">hardest</text>
<text x="665" y="288" fill="#8fa0bd" font-size="11.5" text-anchor="middle" font-weight="normal">Errors climb as the absent object gets more likely given the scene: a language prior, not vision.</text>
</svg>
