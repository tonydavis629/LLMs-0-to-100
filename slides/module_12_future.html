<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMs 0 to 100</title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <!-- KaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>

  <!-- Module-specific <head> includes (e.g. Chart.js); empty for most modules -->
  

  <!-- Shared styles + per-module overrides, inlined by the build -->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

/* ===========================================
   CSS VARIABLES
   =========================================== */
:root {
  --background-color: #0a0e1a;
  --section-divider-bg: #0d1225;

  --heading-font: "Space Grotesk", Helvetica, sans-serif;
  --body-font: "Inter", Helvetica, sans-serif;
  --base-font-size: 32px;
  --text-size: 16pt;
  --h1-size: 48pt;
  --h2-size: 36pt;
  --h3-size: 24pt;
  --footnote-size: 11pt;

  --primary-color: #4a9eff;
  --secondary-color: #f5a623;
  --text-color: #e8eaf0;
  --muted-color: #8892a4;
  --line-color: #2a3450;

  --slide-padding: 60px;
  --slide-padding-top: 24px;
  --content-gap: 18px;

  --box-radius: 8px;
}

/* ===========================================
   BASE STYLES
   =========================================== */

.reveal {
  font-family: var(--body-font);
  font-size: var(--base-font-size);
}

.reveal strong,
.reveal b {
  font-weight: bold;
}

.reveal a {
  color: var(--primary-color);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.reveal a:hover {
  color: var(--text-color);
}

.reveal-viewport {
  background-color: var(--background-color);
}

.reveal-viewport.is-section-divider .slide-background.present {
  background-color: var(--section-divider-bg) !important;
}

.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4,
.reveal h5,
.reveal h6 {
  font-family: var(--heading-font);
  text-transform: none;
  color: var(--text-color);
  font-weight: 600;
  line-height: 1.2;
}

.reveal h1 { font-size: var(--h1-size); }
.reveal h2 { font-size: var(--h2-size); margin-bottom: 0; }
.reveal h3 { font-size: var(--h3-size); }

.reveal p,
.reveal li,
.reveal td,
.reveal th,
.reveal blockquote {
  font-size: var(--text-size);
  color: var(--text-color);
  line-height: 1.5;
}

/* Vertical separation between newline-separated sentences on text slides.
   Scoped to a slide's top-level paragraphs (the prose flow); paragraphs
   nested inside components (terminal captions, figure cards, grid columns)
   keep their own tighter spacing so dense component slides do not overflow.
   Adjacent margins collapse, so the gap between two paragraphs is 0.9em. */
.reveal .slides section > p {
  margin: 0.4em 0 0.9em 0;
}

/* ===========================================
   LISTS
   =========================================== */

.reveal ul {
  list-style: none;
  padding-left: 0;
  margin: 15px 0;
}

.reveal ul li {
  position: relative;
  padding-left: 25px;
  margin-bottom: 10px;
}

.reveal ul li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.6em;
  width: 8px;
  height: 8px;
  background: var(--primary-color);
  border-radius: 50%;
}

.reveal ul ul li::before {
  background: var(--muted-color);
  width: 6px;
  height: 6px;
}

.reveal blockquote p {
  font-size: inherit;
}

/* ===========================================
   SLIDE LAYOUT
   =========================================== */

.reveal .slides section {
  height: 100%;
  display: flex !important;
  flex-direction: column !important;
  padding: var(--slide-padding-top) var(--slide-padding) var(--slide-padding) var(--slide-padding) !important;
  box-sizing: border-box;
  text-align: left;
}

.reveal .slides section.stack {
  padding: 0 !important;
}

.reveal .slides section > .content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: var(--content-gap);
  text-align: left;
}

.reveal .slides section > .footnote {
  position: absolute;
  bottom: 15px;
  left: var(--slide-padding);
  right: var(--slide-padding);
  font-size: var(--footnote-size);
  color: var(--muted-color);
}

/* ===========================================
   SECTION DIVIDERS
   =========================================== */

.reveal .slides section.section-divider {
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}

.reveal .slides section.section-divider h1 {
  font-size: 56pt;
  text-align: center;
  color: var(--primary-color);
}

.reveal .slides section.section-divider p {
  font-size: 20pt;
  color: var(--muted-color);
}

/* ===========================================
   TEXT SIZE UTILITIES
   =========================================== */

.text-lg { font-size: 18pt !important; }
.text-xl { font-size: 20pt !important; }
.text-2xl { font-size: 24pt !important; }
.text-3xl { font-size: 28pt !important; }
.text-4xl { font-size: 32pt !important; }

.text-muted { color: var(--muted-color) !important; }
.text-center { text-align: center !important; }
.text-uppercase { text-transform: uppercase; letter-spacing: 0.1em; }
.font-light { font-weight: 300; }
.font-bold { font-weight: 600; }

/* ===========================================
   BLOCKQUOTES
   =========================================== */

.reveal blockquote {
  border-left: 4px solid var(--primary-color);
  padding-left: 20px;
  margin: 20px 0;
  font-style: italic;
  background: none;
  box-shadow: none;
  width: 100%;
  max-width: none;
}

.reveal blockquote cite {
  display: block;
  margin-top: 10px;
  font-style: normal;
  color: var(--muted-color);
}

/* ===========================================
   ACCENT UNDERLINE ON TITLES
   =========================================== */

.reveal .slides section > h2 {
  flex-shrink: 0;
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line-color);
}

/* ===========================================
   FIGURE CARD - for notable figures slides
   =========================================== */

.figure-card {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  align-items: start;
}

.figure-card img {
  border-radius: var(--box-radius);
  width: 100%;
  box-shadow: 0 4px 20px rgba(74, 158, 255, 0.15);
}

.figure-card .figure-info h3 {
  margin: 0 0 5px 0;
  color: var(--secondary-color);
  font-size: 14pt;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ===========================================
   ERA BADGE - for timeline labels
   =========================================== */

.era-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12pt;
  font-weight: 500;
}

.era-badge.summer {
  background: rgba(245, 166, 35, 0.2);
  color: var(--secondary-color);
}

.era-badge.winter {
  background: rgba(74, 158, 255, 0.15);
  color: #6cb4ff;
}

.era-badge.spring {
  background: rgba(80, 200, 120, 0.2);
  color: #50c878;
}

/* ===========================================
   HIGHLIGHT BOX
   =========================================== */

.highlight-box {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
}

/* Exercise hint: a single fragment that reveals the whole hint at once.
   The wrapping .fragment div is what animates; this just sizes the text
   (matching the old text-lg intent) and removes the global paragraph
   margin so the one-line hint is not double-spaced. */
.reveal .hint-box p {
  font-size: 18pt;
  margin: 0;
}

/* ===========================================
   COURSE STRUCTURE
   =========================================== */

.course-summary {
  max-width: 1120px;
  margin: 0 0 16px 0;
  color: #f0f4fb;
  font-size: 18pt !important;
  line-height: 1.4 !important;
}

.course-track-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

.module-track-card {
  background: rgba(74, 158, 255, 0.07);
  border: 1px solid rgba(74, 158, 255, 0.22);
  border-radius: var(--box-radius);
  padding: 20px 22px;
}

.module-track-kicker {
  font-size: 12pt;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--secondary-color);
  margin-bottom: 8px;
}

.module-track-card h3 {
  margin: 0 0 8px 0;
}

.module-track-intro {
  font-size: 14pt !important;
  color: #d7ddea !important;
  margin: 0 0 10px 0;
  line-height: 1.4 !important;
}

.compact-list {
  margin: 0;
}

.reveal ul.compact-list li {
  font-size: 16pt;
  line-height: 1.35;
  margin-bottom: 7px;
  padding-left: 20px;
}

.course-note {
  margin-top: 14px;
  color: #d7ddea;
  font-size: 15pt !important;
  line-height: 1.35 !important;
}

.course-glossary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  margin-top: 14px;
}

.glossary-item {
  background: rgba(245, 166, 35, 0.08);
  border: 1px solid rgba(245, 166, 35, 0.18);
  border-radius: var(--box-radius);
  padding: 12px 14px;
}

.glossary-item strong {
  color: var(--secondary-color);
}

.glossary-item p {
  font-size: 13pt !important;
  color: #d7ddea !important;
  margin: 6px 0 0 0;
  line-height: 1.4;
}

/* ===========================================
   TERMINAL OUTPUT
   =========================================== */

.terminal-output {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 0;
  max-width: 800px;
  margin: 0 auto;
  text-align: left;
}

.terminal-output .terminal-bar {
  background: #161b22;
  border-radius: 8px 8px 0 0;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.terminal-output .terminal-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.terminal-output .terminal-dot.red { background: #ff5f57; }
.terminal-output .terminal-dot.yellow { background: #febc2e; }
.terminal-output .terminal-dot.green { background: #28c840; }

.terminal-output .terminal-title {
  color: #8b949e;
  font-family: monospace;
  font-size: 10pt;
  margin-left: 8px;
}

.terminal-output .terminal-body {
  padding: 15px 20px;
}

.terminal-output .terminal-body pre {
  margin: 0;
  background: none !important;
  box-shadow: none !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output.dense .terminal-body {
  padding: 10px 20px;
}

.reveal .terminal-output.dense .terminal-body pre.terminal-pre {
  font-size: 9pt;
  line-height: 1.28;
}

.reveal .terminal-output .terminal-body pre.terminal-pre span {
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre p {
  display: inline;
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
  margin: 0 !important;
  color: inherit;
}

.reveal .terminal-output .terminal-body pre code {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output .terminal-body .prompt {
  color: #8b949e;
}

.terminal-output .terminal-body .success {
  color: #3fb950;
}

.terminal-output .terminal-body .header {
  font-weight: bold;
}

.terminal-output .terminal-body .skipped {
  color: #8b949e;
  font-style: italic;
}

/* ===========================================
   TURNING POINT SLIDE
   =========================================== */

.turning-point h2 {
  border-bottom-color: var(--secondary-color) !important;
}

/* ===========================================
   CODE BLOCKS
   =========================================== */

.reveal pre {
  margin-bottom: 0;
  width: 100%;
  box-sizing: border-box;
  box-shadow: none !important;
  background: none !important;
}

.reveal pre code {
  font-size: 14pt;
  line-height: 1.4;
  padding: 10px 20px;
  border-radius: var(--box-radius);
  background: rgba(20, 25, 45, 0.8);
  color: var(--text-color);
  max-height: 400px;
}

.reveal pre code .hljs-keyword,
.reveal pre code .hljs-built_in {
  color: #c792ea;
}

.reveal pre code .hljs-string {
  color: #c3e88d;
}

.reveal pre code .hljs-comment {
  color: #546e7a;
}

.reveal pre code .hljs-number {
  color: #f78c6c;
}

.reveal code {
  color: var(--text-color);
}

/* ===========================================
   MATH (KaTeX)
   =========================================== */

.katex {
  color: var(--text-color);
  font-size: 1.1em;
}

.katex-display {
  margin: 15px 0;
}

.katex-display > .katex {
  font-size: 1.3em;
}

/* ===========================================
   VIDEO CONTAINERS
   =========================================== */

.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-container video,
.video-container img {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--box-radius);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
}

/* ===========================================
   SIDE QUEST BADGE
   =========================================== */

.side-quest-badge {
  display: inline-block;
  background: rgba(245, 166, 35, 0.15);
  color: var(--secondary-color);
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12pt;
  font-weight: 500;
  margin-bottom: 10px;
}

/* ===========================================
   TERMINAL OUTPUT - ANSI COLOR PALETTE
   Replaces inline `style="color:#..."` on spans
   inside .terminal-pre. A rule on the span itself
   overrides the color inherited from .terminal-pre.
   =========================================== */

.terminal-output .terminal-body .t-red    { color: #e06c75; }
.terminal-output .terminal-body .t-orange { color: #d19a66; }
.terminal-output .terminal-body .t-yellow { color: #e5c07b; }
.terminal-output .terminal-body .t-green  { color: #98c379; }
.terminal-output .terminal-body .t-cyan   { color: #56b6c2; }
.terminal-output .terminal-body .t-blue   { color: #61afef; }
.terminal-output .terminal-body .t-gray   { color: #8b949e; }
.terminal-output .terminal-body .t-fg     { color: #e8eaf0; }
.terminal-output .terminal-body .t-fail   { color: #e74c3c; }

.terminal-caption {
  margin-top: 15px;
  text-align: center;
}

/* ===========================================
   TIMELINE (module 1) - per-node structure
   Positional left/width and per-era colors stay
   inline; this captures the repeated boilerplate.
   =========================================== */

.tl-node  { position: absolute; transform: translateX(-50%); text-align: center; }
/* .reveal prefix needed: `.reveal p` (0,1,1) sets color/font-size and would
   otherwise beat a bare .tl-* class. The original used inline styles. */
.reveal .tl-label { font-size: 10pt; color: var(--muted-color); white-space: nowrap; margin: 0; }
.reveal .tl-year  { font-size: 11pt; font-weight: 600; margin: 2px 0 0 0; }
.tl-stem  { width: 1px; opacity: 0.5; margin: 2px auto 0; }
.tl-dot   { width: 10px; height: 10px; border-radius: 50%; margin: 0 auto; }

.tl-node.below .tl-stem  { margin: 0 auto; }
.tl-node.below .tl-year  { margin: 0; }
.tl-node.below .tl-label { margin: 2px 0 0 0; }

/* ===========================================
   CANONICAL SLIDE TYPES
   Backs the :::divider / :::columns / :::note /
   :::quiz / :::step / :::interactive fences so
   slides.md carries no inline layout styles.
   (.section-divider, .figure-card, .terminal-output,
    .hint-box are defined above and reused.)
   =========================================== */

/* :::columns - grid; template/gap/valign supplied by the build */
.reveal .slide-columns {
  display: grid;
  align-items: start;
  margin: 10px 0;
}

/* :::note - callout box (canonical replacement for .highlight-box) */
.reveal .note {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
  margin: 20px 0;
}

.reveal .note p {
  font-size: 18pt;
  margin: 0;
}

.reveal .note p + p {
  margin-top: 0.6em;
}

/* :::note variant="hint" - lighter, boxless (also used inside :::step) */
.reveal .note.hint-box {
  background: none;
  border: none;
  padding: 0;
}

/* :::quiz - prompt scales up; its last line is the question */
.reveal .quiz-prompt p {
  font-size: 18pt;
  margin: 0 0 0.6em 0;
}

.reveal .quiz-prompt p:last-child {
  font-size: 24pt;
  color: var(--text-color);
  margin: 0.5em 0 0 0;
}

.reveal .quiz-answer {
  margin-top: 30px;
}

/* :::step - spacing between code, hint, and answer */
.reveal .hint-box {
  margin-top: 22px;
}

.reveal .hint-box + .note {
  margin-top: 8px;
  padding: 12px 18px;
}

/* :::interactive - widget fills the slide body like a video */
.reveal .interactive-host {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

/* ===========================================
   FOLDING WIDGET  (:::interactive widget="folding")
   Linked input-space / hidden-space views with
   per-neuron weight & bias sliders.
   =========================================== */

.fold-widget {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  height: 100%;
}

.fold-views {
  display: grid;
  grid-template-columns: 1fr 1fr 0.85fr;
  gap: 18px;
  flex: 1;
  min-height: 0;
}

.fold-view {
  display: flex;
  flex-direction: column;
  margin: 0;
  min-height: 0;
}

.reveal .fold-view figcaption {
  font-size: 14pt;
  color: var(--primary-color);
  font-weight: 600;
  text-align: center;
  margin-bottom: 6px;
}

.fold-canvas {
  flex: 1;
  min-height: 0;
  width: 100%;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.fold-controls {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.fold-modes {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.fold-modes button {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: rgba(74, 158, 255, 0.10);
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
}

.fold-modes button.active {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: #0a0e1a;
  font-weight: 600;
}

.fold-modes button.fold-reset {
  background: rgba(245, 166, 35, 0.12);
  border-color: rgba(245, 166, 35, 0.40);
  color: var(--secondary-color);
}

.fold-sliders {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px 24px;
}

.fold-slider {
  display: grid;
  grid-template-columns: 70px 1fr 52px;
  align-items: center;
  gap: 10px;
}

.reveal .fold-slider label {
  font-size: 12pt;
  margin: 0;
  font-family: var(--body-font);
  font-weight: 600;
}

.fold-slider input[type="range"] {
  width: 100%;
  accent-color: var(--primary-color);
}

.reveal .fold-slider .fold-val {
  font-size: 12pt;
  color: var(--text-color);
  font-family: monospace;
  text-align: right;
  margin: 0;
}

.reveal .fold-readout {
  font-size: 13pt;
  color: var(--muted-color);
  text-align: center;
  margin: 0;
}

.reveal .fold-readout strong {
  color: var(--secondary-color);
}

/* ===========================================
   MLP BOUNDARY WIDGET  (:::interactive widget="mlpBoundary")
   =========================================== */

.mlp-widget {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  height: 100%;
}

.mlp-canvas-wrap {
  flex: 1;
  min-height: 0;
}

.mlp-canvas,
.land-canvas {
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.mlp-controls,
.land-controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(240px, 1fr));
  gap: 10px 24px;
  align-items: center;
}

.mlp-slider {
  display: grid;
  grid-template-columns: 70px 1fr 58px;
  align-items: center;
  gap: 10px;
}

.reveal .mlp-slider label,

## The Five Most Durable Concepts

None of these depend on any particular architecture.

<div class="card-grid cols-3">
<div class="card"><h4>Information theory</h4><p>Cross-entropy is <strong>average surprise</strong>. Every loss you minimized was a bit count.</p></div>
<div class="card"><h4>Gradient descent</h4><p>The only learning algorithm this course ever used. Everything else was a choice of what to differentiate.</p></div>
<div class="card"><h4>Attention</h4><p>Attention is $\mathrm{softmax}(QK^\top/\sqrt{d_k})V$ and nothing more.</p></div>
<div class="card"><h4>Scaling laws</h4><p>Loss falls <strong>predictably</strong> with compute. That predictability is why anyone spends a billion dollars on a training run.</p></div>
<div class="card"><h4>Evaluation</h4><p>You cannot improve what you <strong>cannot measure</strong>, and most measurements are worse than they look.</p></div>
<div class="card"><h4>Where they come from</h4><p>Four of the five are from the first half of the course, before any of this was about language models.</p></div>
</div>

## Scaling, Updated

The power laws still hold. The supply of cheap training data does not.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The constraint**

- Chinchilla: more compute wants proportionally more tokens
- Usable public text is finite; estimates put exhaustion in this decade
- Each constant step down in loss costs a **constant multiple** of compute

</div>

<div>

**The responses**

- **Curate harder.** Filtered, textbook-quality data beats raw web text per token
- **Generate data.** Caveat: train on your own output and the tails disappear (model collapse)
- **Spend at inference.** The axis that actually moved, and it returns later in this lecture

</div>

</div>

---

<!-- .slide: id="sidequest-gnn" -->

## Side Quest: Transformers Are Graph Neural Networks

Attention is **message passing on a fully connected graph:**

- Every token is a node
- Attention weights are soft edges
- Value aggregation is the message step

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Graph neural networks**

The graph is given as input, and a node only exchanges messages with its neighbors.

</div>

<div>

**Attention**

No graph is given: every token can attend to every other, and the weights on those edges are learned per input. That costs $O(n^2)$.

</div>

</div>

Any nodes work: image patches, atoms, functions, users. The GNN literature covers the same machinery. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

<!-- .slide: id="divider-attention" class="section-divider" data-state="is-section-divider" -->

# Is Attention the Right Primitive?

What replaces quadratic attention


---

<!-- .slide: id="attention-bill" -->

## The Cost of Attention

Two costs, both paid on every request.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Compute: $O(n^2)$**

- Score matrix is $n \times n$
- Double the context, quadruple the work
- FlashAttention shrank the constant, not the exponent

</div>

<div>

**Memory: the KV cache**

- Stores a key and value per generated token
- Grows linearly with sequence length
- Dominates serving memory at long context

</div>

</div>

Removing these costs requires giving something up. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="attention-drop-softmax" -->

## Linear Attention: Removing the Softmax

Replace the exponential with any positive feature map $\phi$. The same computation now has **two forms.**

$$\mathbf y_t = \frac{\phi(\mathbf q_t)^\top \sum_{i \le t} \phi(\mathbf k_i) \mathbf v_i^\top}{\phi(\mathbf q_t)^\top \sum_{i \le t} \phi(\mathbf k_i)}$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**As a matrix**

- Build the $n \times n$ score matrix, mask, normalize, multiply by values
- Standard attention minus the softmax
- Cost: $O(n^2)$

</div>

<div>

**As a running sum**

- Keep $\mathbf S_t = \mathbf S_{t-1} + \phi(\mathbf k_t)\mathbf v_t^\top$
- An **RNN** with a matrix hidden state
- Cost: $O(n)$ time, $O(1)$ memory

</div>

</div>

Both produce the same numbers. Katharopoulos et al. (2020) titled the paper "Transformers are RNNs": the equivalence is a theorem. The exercise has you check it. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="attention-softmax-price" -->

## What the Softmax Provides

Dropping it costs two things.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Sharpness**

- The exponential lets **one key dominate**
- Attention can select one token out of thousands
- A linear kernel spreads weight across many keys

</div>

<div>

**Unbounded memory**

- All knowledge of the past must fit in $\mathbf S$, a **fixed-size** matrix
- A KV cache reproduces any earlier token exactly
- A fixed state cannot

</div>

</div>

This is the RNN bottleneck, reintroduced deliberately. Open question: is a fixed-size summary good enough? <!-- .element: class="text-lg" style="margin-top: 12px;" -->

### S4 (2021), Mamba (2023)

Built the state-space line, the most serious architectural challenger to the transformer since 2017. S4 derived a sequence model from a continuous-time dynamical system, an idea from control theory, not NLP. Mamba, with Tri Dao, made state transitions depend on the input and became competitive at scale.

Co-author Tri Dao wrote FlashAttention, the work that made exact attention fast on real hardware. The person who made attention efficient is also building its replacement. This is an engineering argument, not a fight between camps.

## Side Quest: The Bitter Lesson, Applied Here

Sutton's essay: for seventy years, general methods that leverage computation beat methods built on human insight. Discussion questions:

- Is Mamba's **selectivity** human-designed structure the lesson eliminates, or a better way to spend compute, which the lesson rewards?
- Hybrid layer allocations are **hand-designed**. Somebody picked "one attention layer in eight." Does that survive?
- Was **attention itself** the human-designed structure? The bitter lesson already displaced recurrent models once.

No answer key. "Does this scale" and "is this clever" are different questions. Only the first has predicted the winner. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

## Three Shared Assumptions

Every model in this section, transformer and state-space alike, still does all three:

<div class="card-grid cols-3">
<div class="card"><h4>Generates left to right</h4><p>One token at a time, never revising.</p></div>
<div class="card"><h4>Spends fixed compute per token</h4><p>The same layers, every time, regardless of difficulty.</p></div>
<div class="card"><h4>Freezes its weights</h4><p>Training ends, and learning ends with it.</p></div>
</div>

The next three sections question those. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<!-- .slide: id="divider-diffusion" class="section-divider" data-state="is-section-divider" -->

# Assumption One: Text Is Generated Left to Right

Diffusion language models


---

<!-- .slide: id="diffusion-assumption" -->

## Where the Assumption Is Encoded

Two mechanisms from earlier modules enforce left-to-right generation.

$$p(x_1, \dots, x_T) = \prod_{t=1}^{T} p(x_t \mid x_{<t})$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The chain-rule factorization**

- Exactly true for any ordering
- Left to right makes the likelihood **exactly computable** in one pass

</div>

<div>

**The causal mask**

- Position $t$ cannot see position $t+1$
- One forward pass gives a valid prediction at every position

</div>

</div>

Left-to-right is not a property of language. It is a factorization chosen for computational convenience. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="diffusion-costs" -->

## Costs of Left-to-Right Generation

<div class="card-grid cols-3">
<div class="card"><h4>Strictly sequential</h4><p>One forward pass per token. Generation is <strong>memory-bound</strong>: the time goes to moving weights, not arithmetic.</p></div>
<div class="card"><h4>No revision</h4><p>The model cannot change a token once it is generated, even after an early mistake becomes apparent.</p></div>
<div class="card"><h4>No infilling</h4><p>The model structurally cannot condition on text <strong>after</strong> a blank. Every editing workflow is a workaround for this.</p></div>
</div>

Only the first of these is about speed. The other two are about what the model can express at all. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<div class="figure-card">

![Jascha Sohl-Dickstein](module_12_future/images/jascha_sohl_dickstein.jpg)

<div class="figure-info">

## Jascha Sohl-Dickstein <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Deep Unsupervised Learning using Nonequilibrium Thermodynamics (2015)

Introduced diffusion models with an idea from statistical physics: destroy a structured distribution with noise until it becomes simple, then train a network to run the destruction backwards. The 2015 paper preceded the image-generation wave by years and text diffusion by a decade.

Diffusion appeared earlier in the course for images. Here it competes for text generation.

</div>

</div>

</div>

---

<!-- .slide: id="diffusion-mechanics" -->

## Diffusion: Generation Without an Ordering

Start fully masked. Unmask iteratively, refining the whole sequence over a few dozen steps.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Training**

- Mask a fraction of positions
- Predict **every masked position at once**
- Same denoising objective as span corruption in pretraining

</div>

<div>

**Generation**

- Start with everything masked
- Predict all positions, keep the **confident** ones
- Re-mask the rest, repeat

</div>

</div>

Step count is a dial: few steps means fast but lower quality, many steps approaches autoregressive quality with less speedup. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

<!-- .slide: id="diffusion-stack" -->

## The Serving Stack Is the Obstacle

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Why the KV cache exists**

- Past tokens **never change**
- Cache the past, compute only the new token
- The whole serving apparatus rests on this guarantee

</div>

<div>

**What diffusion does to it**

- Past tokens change on every step
- Caching, batching, and streaming must be **rebuilt from scratch**

</div>

</div>

A successor must beat the incumbent's loss curve **plus nine years of infrastructure** built on assumptions it violates. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="diffusion-hybrid" -->

## Block Diffusion

**Block diffusion**: autoregressive across blocks, diffusive within them.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**What you keep**

- KV caching between blocks
- Earlier blocks are finished and will not change

</div>

<div>

**What you gain**

- Parallel generation inside each block
- Revision within a block before committing it

</div>

</div>

The second hybrid in two sections. Autoregression won for computational convenience, not because language is inherently left to right. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<!-- .slide: id="sidequest-lecun" -->

## Side Quest: Is Autoregression a Dead End?

Yann LeCun's critique:

- Generating one token at a time **accumulates error**
- Each token conditions on earlier mistakes, with no world model to correct against
- On this view the paradigm cannot reach robust intelligence at any scale
- His alternative: predict in representation space, not token space

Debate questions:

- What **observation** would confirm or refute this? If none exists, is it a scientific claim?
- Reasoning models spend tokens **checking their own work** and revising. Does that count as the missing error correction, or is it the same error accumulation with extra steps?
- Diffusion models revise committed text by construction. Does that answer LeCun's objection, or a different one?

---

<!-- .slide: id="divider-looped" class="section-divider" data-state="is-section-divider" -->

# Assumption Two: Every Token Gets the Same Computation

Looped and recurrent depth


---


<!-- .slide: id="looped-assumption" -->

## Fixed Depth

The transformer has $L$ layers. Every token passes through all $L$ of them.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The word "the"**

Trivially predictable from context. Gets $L$ layers of computation.

</div>

<div>

**The last step of a hard proof**

Requires several dependent inferences. Gets $L$ layers of computation.

</div>

</div>

Depth is fixed at training time. The architecture cannot spend more computation on a harder token. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<!-- .slide: id="looped-cot" -->

## Chain of Thought: The Deployed Solution

Reasoning models buy more computation per answer by **emitting more tokens.** It works and it shipped. It accepts a constraint:

<div class="card-grid cols-3">
<div class="card"><h4>To compute more</h4><p>The model must <strong>serialize its thinking into words</strong>.</p></div>
<div class="card"><h4>Then read it back</h4><p>Through its own context window, one token at a time.</p></div>
<div class="card"><h4>Paying full price</h4><p>Every thought costs a forward pass, a KV cache entry, and output tokens you are billed for.</p></div>
</div>

More computation does not have to take the form of words. That gap is the rest of the section. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<div class="figure-card">

![Alex Graves](module_12_future/images/alex_graves.jpg)

<div class="figure-info">

## Alex Graves <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Adaptive Computation Time (2016), Neural Turing Machines (2014)

Asked both of this lecture's remaining questions a decade early. Adaptive Computation Time: a network decides **for itself** how many steps to spend on each input, with a learned halting rule. That is this section. Neural Turing Machines: give a network an external memory it can read and write during the forward pass. That is the next section.

His work on connectionist temporal classification and LSTM sequence generation is a large part of why recurrent networks worked well enough in the 2010s to be worth replacing.

</div>

</div>

</div>

<!-- .slide: id="looped-loop" -->

## Looped Transformers

An alternative way to spend more computation: **apply the same block repeatedly.**

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Universal Transformers (2018)**

- Shared weights applied recurrently in depth
- Learned halting rule per position
- Predates GPT-3

</div>

<div>

**What changes**

- Depth becomes a **runtime dial**, not a training-time constant
- Same weights: four iterations on an easy token, forty on a hard one

</div>

</div>

Recurrence in *depth*, not in sequence. Linear attention looped over tokens; this loops over layers. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

<!-- .slide: id="looped-theory" -->

## Fixed Depth Limits Expressiveness

A fixed-depth network computes a **fixed-length circuit.**

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The limit**

- A problem needing more sequential steps than layers is out of reach
- Width does not help: it buys parallel work, not more steps

</div>

<div>

**What a loop does**

- Runs the same parameters a **variable** number of steps
- Expresses iterative algorithms a fixed stack cannot represent

</div>

</div>

This is expressiveness, not efficiency. Some problems are not expensive for a fixed-depth transformer; they are unreachable. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="looped-latent" -->

## Latent Reasoning

More iterations at inference improves quality. **No extra tokens emitted.**

Geiping et al. (2025): a 3.5B recurrent-depth model, unrolled at test time, reaches the compute load of a **50B model** and improves reasoning benchmarks.

<div class="note hint-box">

Compute-equivalent, not performance-equivalent. Matching a 50B model's operations per answer is not matching a well-trained 50B model's benchmark scores. "A 3.5B model matches a 50B model" is the wrong summary.

</div>

---

<!-- .slide: id="looped-coconut" -->

## Coconut: Latent Chain of Thought

**Coconut**: feed the final hidden state back as the next input embedding, instead of decoding it into a token.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Chain of thought**

A chain of **tokens**. Legible and supervisable, but forced through the vocabulary bottleneck.

</div>

<div>

**Chain of continuous thought**

A chain of **vectors**. No vocabulary bottleneck and no tokens emitted, but also nothing to read or audit.

</div>

</div>

Both approaches separate **compute spent per answer** from **tokens emitted per answer**, two quantities this course has treated as one. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="looped-mod" -->

## Adaptive Compute: Width and Depth

<div class="bench-table">
<table>
<thead><tr><th>Axis</th><th>Mechanism</th><th>Effect</th></tr></thead>
<tbody>
<tr><td><strong>Width</strong></td><td>Mixture of experts</td><td>Each token activates a few experts out of many. Compute per token is sparse across width</td></tr>
<tr><td><strong>Depth</strong></td><td>Mixture-of-depths</td><td>Each token skips some layers entirely. Compute per token is sparse across depth</td></tr>
<tr><td><strong>Depth, unbounded</strong></td><td>Looped transformers</td><td>Each token can take <em>more</em> steps than the network has layers</td></tr>
</tbody>
</table>
</div>

All three mechanisms avoid spending the same compute on every token. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<!-- .slide: id="looped-verdict" -->

## Why Verbalized Reasoning Won

Looped transformers are parameter-efficient and date to 2018, yet verbalized chain of thought shipped. Two reasons:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Tooling**

- Serving, billing, and batching assume fixed work per token
- Variable depth breaks latency prediction and throughput planning

</div>

<div>

**Supervision**

- RL needs something to score: you can **reward a transcript you can read**
- Latent reasoning is hard to supervise for the same reason it is efficient: nobody can see it

</div>

</div>

You cannot audit reasoning that was never written down. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="sidequest-hardware" -->

## Side Quest: The Hardware Lottery

Sara Hooker (2020): ideas win or lose partly on **how well they fit the hardware of their era**. Transformers saturate GPUs; recurrent models do not, and lost the 2010s partly for it.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Applied to this section**

- Looped depth is parameter-efficient
- The incumbent holds the **hardware**, the **serving stack**, and the **RL tooling**
- A challenger must beat all three at once

</div>

<div>

**Applied to diffusion**

- Block diffusion exists specifically so diffusion can keep the KV cache

</div>

</div>

The idea that wins is not the best idea. It is the best idea that runs well on existing hardware. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="divider-learning" class="section-divider" data-state="is-section-divider" -->

# Assumption Three: Learning Stops at Deployment

Test-time training


---

<!-- .slide: id="learning-assumption" -->

## The Weights Are Frozen

- Everything a deployed model appears to learn lives in the **context window**
- The session ends and it is lost
- Debug a problem Monday, the model retains nothing Tuesday

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Workaround: retrieval**

- Put the past in the prompt
- Costs tokens on every call
- The model still has not learned anything

</div>

<div>

**Workaround: finetuning**

- Bake the past into the weights
- Slow, offline cycle
- Nothing like learning from experience as you go

</div>

</div>

Neither gives the model accumulated experience. This section covers approaches that would. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="learning-forgetting" -->

## Catastrophic Forgetting

**Catastrophic forgetting** (McCloskey and Cohen, 1989):

- Train on new data and old capabilities degrade
- Gradient descent on the new task walks the weights away from the old one
- Nothing in the objective says not to

<div class="card-grid cols-3">
<div class="card"><h4>Replay</h4><p>Mix old data in with the new. Effective, and it means you never actually stop paying for the old data.</p></div>
<div class="card"><h4>Constrain</h4><p>Penalize movement in weights that mattered before (elastic weight consolidation). Needs to know which ones mattered.</p></div>
<div class="card"><h4>Isolate</h4><p>Put new learning in added parameters. This is LoRA, reused as a <strong>memory mechanism</strong> rather than an efficiency trick.</p></div>
</div>

None of the three is a solved recipe at this scale. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<!-- .slide: id="learning-ttt" -->

## Test-Time Training: A Training Loop Inside the Forward Pass

Make the hidden state a **small neural network**. Update it with real gradient steps as the context streams past.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**What the state was**

A summary: a fixed-size buffer written by a hand-designed update rule.

</div>

<div>

**What the state becomes**

A **model**, trained on this document by gradient descent while the document is read.

</div>

</div>

- Sanity check: with a linear inner model, this reduces to linear attention. You write that update by hand in the exercise.
- The ancestor is Schmidhuber's fast weights (**1992**): a network that generates weight updates for another network during the forward pass.

---

<!-- .slide: id="learning-loops" -->

## The Two Nested Loops

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Outer loop: pretraining**

- Slow, expensive, done once
- Learns weights that make the inner loop **useful**
- Learns *how to learn*

</div>

<div>

**Inner loop: inference**

- Runs per token, on one sequence
- Learns the **document in front of it**
- Learns *the current input*

</div>

</div>

Every model in this course had the outer loop. The proposal: make the inner loop a real optimizer too. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

---

<!-- .slide: id="learning-titans" -->

## Titans: Persistent Memory

**Titans** pushes the inner loop from a per-sequence scratchpad toward persistent memory, with a rule for what gets written:

<div class="metric-box">

Store what the model predicted **badly**.

</div>

- A correctly predicted token carries no new information; a surprising one does
- Cross-entropy becomes a **memory-writing policy**, not a loss

**Nested learning** generalizes the frame:

- A model and its optimizer are **levels of one optimization** at different update frequencies
- Pretraining updates slowly, the inner loop updates per token
- No reason in principle to stop at two levels

---

<!-- .slide: id="learning-stakes" -->

## Consequences for Deployment

If this assumption falls, "deploying a model" stops meaning "shipping a frozen artifact."

<div class="bench-table">
<table>
<thead><tr><th>What breaks</th><th>Why</th></tr></thead>
<tbody>
<tr><td><strong>Evaluation</strong></td><td>Evaluate then ship assumes the thing you tested is the thing you serve. A learning model's eval results have an <strong>expiry date</strong></td></tr>
<tr><td><strong>Serving</strong></td><td>Weights are a read-only asset replicated across GPUs. Replicas that keep learning <strong>drift apart</strong>, and now you have a consistency problem</td></tr>
<tr><td><strong>Applications</strong></td><td>Retrieval exists because the model cannot remember. Some of that machinery becomes unnecessary, and some becomes load-bearing in a new way</td></tr>
</tbody>
</table>
</div>

---

<!-- .slide: id="learning-verdict" -->

## Current Status

The least settled of the three sections, by a wide margin.

<div class="card-grid cols-3">
<div class="card"><h4>Published</h4><p>Test-time training layers exist and work, demonstrated at <strong>small scale</strong>.</p></div>
<div class="card"><h4>Research program</h4><p>Nested learning is a framing and a set of results, <strong>not a product</strong>.</p></div>
<div class="card"><h4>Still open</h4><p>The distance between a frozen model you prompt and a system that <strong>accumulates experience over months</strong> is wide.</p></div>
</div>

The assumption whose removal would change the most, with the least agreement about how. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

<!-- .slide: id="close-keeping-up" -->

## How to Keep Up After This Course

Anything specific will be stale within a year, so this is deliberately generic.

<div class="card-grid cols-3">
<div class="card"><h4>Read the paper</h4><p>Not the thread about the paper. Most confusion in this field comes from the gap between what a paper claims and what gets said about it.</p></div>
<div class="card"><h4>Hold demos to eval standards</h4><p>What is the baseline? What is the eval set? Was it contaminated? A demo is not a measurement.</p></div>

<!-- .slide: id="close-shannon" -->

## Shannon, Revisited

In 1951, Shannon measured the information in English text by having people **guess the next character.** He landed on roughly one bit each.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Where the course began**

- You counted n-grams and measured the entropy of text
- Same question, same direction as Shannon

</div>

<div>

**Where it went**

- You built a transformer, pretrained it, finetuned it, improved it with RL
- Every step descended the same curve

</div>

</div>

Frontier labs now spend nine figures of compute on that curve. It has not flattened yet. Where it does is an open question. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

<!-- .slide: id="exercise-step1" -->

## Step 1: feature_map()

```python
def feature_map(x: Tensor) -> Tensor:
    """Map queries and keys into a space where every coordinate is positive."""
    # TODO: Return elu(x) + 1, the positive feature map.
    raise NotImplementedError("TODO: return the positive feature map of x")
```

<div class="fragment hint-box">

**Hint:** `torch.nn.functional` is imported as `F`, and it has an `elu` function. Add 1 to its result.

</div>

<div class="fragment note">

**Answer:**

```python
return F.elu(x) + 1
```

Softmax used `exp` to keep scores positive and to let one key dominate. This keeps them positive and gives up the domination. That lost sharpness is the price.

</div>

<!-- .slide: id="exercise-step2" -->

## Step 2: masked_scores()

```python
def masked_scores(q_phi: Tensor, k_phi: Tensor) -> Tensor:
    """Score every query against every key, then delete the future."""
    n = q_phi.shape[-2]
    mask = torch.tril(torch.ones(n, n, dtype=q_phi.dtype, device=q_phi.device))
    # TODO: Return the masked scores: multiply q_phi by the transpose of k_phi
    #       to get every query-key pair, then multiply elementwise by `mask` to
    #       zero out the future.
    raise NotImplementedError("TODO: return the causally masked score matrix")
```

<div class="fragment hint-box">

**Hint:** `@` does matrix multiplication, `.transpose(-2, -1)` swaps the last two dimensions, and `*` multiplies elementwise.

</div>

<div class="fragment note">

**Answer:**

```python
return (q_phi @ k_phi.transpose(-2, -1)) * mask
```

Note how the masking changed. Softmax attention sets future entries to $-\infty$ so `exp` sends them to zero. With no `exp`, you multiply by zero instead.

</div>

```

<div class="fragment hint-box">

**Hint:** `@` for the matrix multiply, `/` for the division. The shapes work out: `(n, n) @ (n, d_v)` is `(n, d_v)`, divided by `(n, 1)`.

</div>

<div class="fragment note">

**Answer:**

```python
return (scores @ V) / normalizer
```

Softmax normalized the weights for you. Here you do it by hand, or later positions would produce larger outputs purely because they attend to more of the past.

</div>

## Step 7: time_forward()

```python
def time_forward(fn, repeats: int = 3) -> float:
    """Time one forward pass, in milliseconds."""
    # Warm-up run, not timed: pays one-time allocation costs up front.
    fn()
    timings: list[float] = []
    for _ in range(repeats):
        start = time.perf_counter()
        fn()
        # TODO: Append this run's elapsed time in milliseconds to `timings`.
        raise NotImplementedError("TODO: record this run's elapsed time")
    return min(timings)
```

<div class="fragment hint-box">

**Hint:** call `time.perf_counter()` again and subtract `start`. That gives seconds, so multiply by 1000 for milliseconds.

</div>

<div class="fragment note">

**Answer:**

```python
timings.append((time.perf_counter() - start) * 1000)
```

Two details make this honest: the warm-up absorbs one-time allocation costs, and taking the **minimum** reports the cleanest run rather than the noisiest, since background processes can only slow a run down.

</div>

## The Scaling Plot

On log-log axes a power law is a straight line whose slope is the exponent. Two lines bend upward. One does not. <!-- .element: class="text-lg" -->

<!-- .slide: id="exercise-takeaway" -->

## What the Crossover Means

The recurrent form is **ten times slower** at 512 tokens and **faster** at 8192. Both facts matter.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Why it starts slow**

- A Python loop with huge per-step overhead
- Big-O says nothing about constants, and these constants are terrible

</div>

<div>

**Why it wins anyway**

- It never builds the $n \times n$ matrix
- The exponent eventually beats the constant, at a context length people actually use

</div>

</div>

The recurrent form gave up exact recall of earlier tokens. That tradeoff is why production models hybridize instead of choosing. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

# Quiz


---

<!-- .slide: id="quiz-softmax-price" -->

## What the Softmax Was For

<div class="quiz-prompt">

Removing the softmax lets attention be computed as a recurrence with a fixed-size state. What was the softmax buying, and which class of tasks exposes the loss?

</div>

<div class="fragment note quiz-answer">

**Short answer: sharp selection. The tasks that expose it are the ones needing exact recall of a specific earlier token.**

- The exponential lets one key dominate: attention picks one token out of thousands
- A linear kernel spreads weight across many keys: a blur, not a lookup
- The fixed-size state cannot store every past token anyway
- Result: fine on perplexity, behind on copying and needle-in-a-haystack retrieval

</div>

---

<!-- .slide: id="quiz-kv-vs-state" -->

## Two Kinds of Memory Cost

<div class="quiz-prompt">

A serving system stores a KV cache that grows with every generated token. What is the corresponding cost for a state-space model, and what does that mean for very long conversations?

</div>

<div class="fragment note quiz-answer">

**Short answer: constant. The state is a fixed-size matrix, so memory does not grow with the conversation at all.**

- KV cache: one key and value per token per layer, growing linearly forever
- Recurrent state: $\mathbf S$ and $\mathbf z$, sized by head dimension, not sequence length
- A million-token conversation costs the same memory as a ten-token one
- The catch: constant memory is *why* exact recall is impossible
- Hybrids pay the cache only on the few layers where random access earns its cost

</div>

---

<!-- .slide: id="quiz-selectivity" -->

## What Mamba Rebuilt

<div class="quiz-prompt">

Mamba's contribution is usually described as "selective" state transitions. Which earlier architecture's mechanism is that a rebuild of, and what did Mamba have to preserve that the original did not?

</div>

<div class="fragment note quiz-answer">

**Short answer: LSTM gating. Mamba had to preserve parallel training, which gating originally destroyed.**

- LSTM forget and input gates decide what enters and leaves the state, conditioned on the input. That is "selective"
- The idea was never wrong; it was slow. Gating made training sequential, unable to parallelize across positions
- Mamba's contribution is engineering: an associative scan keeps the recurrence parallel during training, and the state stays in fast GPU memory
- The version that won is the one that fits the hardware

</div>

---

<!-- .slide: id="quiz-left-to-right" -->

## Where the Assumption Lives

<div class="quiz-prompt">

Left-to-right generation was called a choice rather than a fact. Which two pieces of machinery encode that choice?

</div>

<div class="fragment note quiz-answer">

**Short answer: the chain-rule factorization of the joint probability, and the causal mask that enforces it in the architecture.**

- The factorization $p(x_1,\dots,x_T) = \prod_t p(x_t \mid x_{<t})$ is exactly true for *any* ordering
- Left to right makes the likelihood exactly computable in one pass, so training is cheap and stable
- The causal mask enforces it: position $t$ sees nothing after it, so one forward pass predicts every position
- A design decision for convenience, not a claim about how language works

</div>

---

<!-- .slide: id="quiz-infilling" -->

## Why the Model Cannot Fill in a Blank

<div class="quiz-prompt">

A diffusion language model can fill in a blank in the middle of a document. A standard autoregressive model cannot. What component is responsible for that inability?

</div>

<div class="fragment note quiz-answer">

**Short answer: the causal mask.**

- Filling a blank requires conditioning on *both* sides
- The mask forbids a position from attending to anything after it
- Prompting cannot fix it: the constraint is enforced in the attention pattern, not learned
- Diffusion has no mask: every position attends to every other at every denoising step, so infilling is the default behavior

</div>

---

<!-- .slide: id="quiz-diffusion-adoption" -->

## Why Diffusion Adoption Is Slow

<div class="quiz-prompt">

Diffusion language models generate many tokens per forward pass, yet adoption has been slow. Explain the obstacle in terms of the serving stack rather than model quality.

</div>

<div class="fragment note quiz-answer">

**Short answer: the KV cache exists because past tokens never change, and under diffusion they do.**

- Every serving optimization assumes causality: caching, continuous batching, streaming, prefix caching
- Diffusion revises the whole sequence every step, so none of those hold
- A successor must beat the incumbent's loss curve *plus* a decade of infrastructure built on assumptions it violates
- Block diffusion (autoregressive across blocks, diffusive within) exists mainly so KV caching survives

</div>

---

<!-- .slide: id="quiz-hybrids" -->

## A Pattern Across Two Sections

<div class="quiz-prompt">

Both the architecture section and the diffusion section ended with hybrids winning. What do the two cases have in common?

</div>

<div class="fragment note quiz-answer">

**Short answer: in both, the challenger is better on one axis and strictly worse on another, so the practical answer is to pay for each property only where it earns its cost.**

- Recurrence buys constant memory, loses exact recall: hybrids keep a few attention layers for random access
- Diffusion buys parallel generation, loses KV caching: block diffusion keeps autoregression across blocks
- Neither challenger dominates; each trades
- Successors get absorbed as components where their tradeoff is favorable. Expect the next architecture to arrive as a layer type, not a replacement

</div>

---

<!-- .slide: id="quiz-fixed-depth" -->

## Two Ways to Think Harder

<div class="quiz-prompt">

A fixed-depth transformer spends the same computation on the word "the" as on the last step of a hard proof. Describe the two ways the lecture gave for spending more on the hard one, and what each costs.

</div>

<div class="fragment note quiz-answer">

**Short answer: emit more tokens (chain of thought), or loop the layers (recurrent depth). The first costs tokens and latency; the second costs supervisability and infrastructure.**

- Chain of thought: write intermediate steps and read them back. Costs latency and billing for every word
- Looped layers: more computation without emitting anything; depth becomes a runtime dial
- Looping breaks every serving assumption about fixed work per token
- Bigger cost: you cannot reward a reasoning process you cannot read. RL needs a transcript to score

</div>

---

<!-- .slide: id="quiz-compute-equivalent" -->

## Reading a Result Carefully

<div class="quiz-prompt">

A paper reports that a 3.5B recurrent-depth model reaches the compute load of a 50B model. Why is "this 3.5B model matches a 50B model" the wrong summary?

</div>

<div class="fragment note quiz-answer">

**Short answer: the claim is about compute-equivalence, not performance-equivalence. Matching the computational load of a 50B model is not the same as matching what a well-trained 50B dense model can do.**

- Unrolling depth means the small model performs as many operations per answer as a larger one
- Real result: the compute of a large model from a small memory footprint
- But a 50B dense model also has 50B parameters of stored knowledge. Looping cannot give a 3.5B model that
- Coverage of this field converts compute-equivalence into performance-equivalence constantly

</div>

---

<!-- .slide: id="quiz-state-gradient" -->

## What the State Update Really Is

<div class="quiz-prompt">

The exercise's state update is `S = S + phi(k) v^T`. What is that update actually performing, and what does it imply about linear-attention models?

</div>

<div class="fragment note quiz-answer">

**Short answer: a single step of gradient descent, on a squared reconstruction loss for a linear map from keys to values.**

- The outer product is exactly the gradient for a linear model predicting $\mathbf v$ from $\phi(\mathbf k)$
- The hidden state is not a buffer. It is the weight matrix of a tiny model, one training step per token
- Every linear-attention model has been doing test-time training all along
- The generalization: bigger inner model, more steps, better optimizer. That is test-time training

</div>

---

<!-- .slide: id="quiz-nested-loops" -->

## Naming the Two Loops

<div class="quiz-prompt">

Test-time training puts a training loop inside the forward pass. Name the two nested loops, say what each learns, and identify which one you already know.

</div>

<div class="fragment note quiz-answer">

**Short answer: the outer loop is ordinary pretraining, and the inner loop runs at inference on one sequence. The outer loop learns how to learn; the inner loop learns the document in front of it.**

- Outer loop: the one you know. Gradient descent over a corpus, slow, done once
- Its objective changes: learn weights that make the inner loop effective
- Inner loop: runs during inference, updating a small model that serves as the hidden state, trained on the context
- The proposal: make the inner loop a real optimizer, not a hand-designed rule that secretly already was one

</div>

---

<!-- .slide: id="quiz-continual-eval" -->

## The Cost of Never Freezing

<div class="quiz-prompt">

Continual learning on a deployed model sounds like free improvement. What failure mode does it hit, and what happens to the evaluate-then-ship workflow?

</div>

<div class="fragment note quiz-answer">

**Short answer: catastrophic forgetting. And evaluation stops being something you do once before shipping.**

- Catastrophic forgetting (McCloskey and Cohen, 1989): train on new data and old capabilities degrade
- Mitigations: replay, penalize movement in weights that mattered, isolate new learning in added parameters. None solved at this scale
- Evaluate-then-ship assumes the artifact you tested is the artifact you serve
- With changing weights, every eval result has an expiry date, and replicas trained on different traffic become different models

</div>
