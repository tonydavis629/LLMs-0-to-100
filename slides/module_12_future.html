<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMs 0 to 100</title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <!-- KaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>

  <!-- Module-specific <head> includes (e.g. Chart.js); empty for most modules -->
  

  <!-- Shared styles + per-module overrides, inlined by the build -->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

/* ===========================================
   CSS VARIABLES
   =========================================== */
:root {
  --background-color: #0a0e1a;
  --section-divider-bg: #0d1225;

  --heading-font: "Space Grotesk", Helvetica, sans-serif;
  --body-font: "Inter", Helvetica, sans-serif;
  --base-font-size: 32px;
  --text-size: 16pt;
  --h1-size: 48pt;
  --h2-size: 36pt;
  --h3-size: 24pt;
  --footnote-size: 11pt;

  --primary-color: #4a9eff;
  --secondary-color: #f5a623;
  --text-color: #e8eaf0;
  --muted-color: #8892a4;
  --line-color: #2a3450;

  --slide-padding: 60px;
  --slide-padding-top: 24px;
  --content-gap: 18px;

  --box-radius: 8px;
}

/* ===========================================
   BASE STYLES
   =========================================== */

.reveal {
  font-family: var(--body-font);
  font-size: var(--base-font-size);
}

.reveal strong,
.reveal b {
  font-weight: bold;
}

.reveal a {
  color: var(--primary-color);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.reveal a:hover {
  color: var(--text-color);
}

.reveal-viewport {
  background-color: var(--background-color);
}

.reveal-viewport.is-section-divider .slide-background.present {
  background-color: var(--section-divider-bg) !important;
}

.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4,
.reveal h5,
.reveal h6 {
  font-family: var(--heading-font);
  text-transform: none;
  color: var(--text-color);
  font-weight: 600;
  line-height: 1.2;
}

.reveal h1 { font-size: var(--h1-size); }
.reveal h2 { font-size: var(--h2-size); margin-bottom: 0; }
.reveal h3 { font-size: var(--h3-size); }

.reveal p,
.reveal li,
.reveal td,
.reveal th,
.reveal blockquote {
  font-size: var(--text-size);
  color: var(--text-color);
  line-height: 1.5;
}

/* Vertical separation between newline-separated sentences on text slides.
   Scoped to a slide's top-level paragraphs (the prose flow); paragraphs
   nested inside components (terminal captions, figure cards, grid columns)
   keep their own tighter spacing so dense component slides do not overflow.
   Adjacent margins collapse, so the gap between two paragraphs is 0.9em. */
.reveal .slides section > p {
  margin: 0.4em 0 0.9em 0;
}

/* ===========================================
   LISTS
   =========================================== */

.reveal ul {
  list-style: none;
  padding-left: 0;
  margin: 15px 0;
}

.reveal ul li {
  position: relative;
  padding-left: 25px;
  margin-bottom: 10px;
}

.reveal ul li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.6em;
  width: 8px;
  height: 8px;
  background: var(--primary-color);
  border-radius: 50%;
}

.reveal ul ul li::before {
  background: var(--muted-color);
  width: 6px;
  height: 6px;
}

.reveal blockquote p {
  font-size: inherit;
}

/* ===========================================
   SLIDE LAYOUT
   =========================================== */

.reveal .slides section {
  height: 100%;
  display: flex !important;
  flex-direction: column !important;
  padding: var(--slide-padding-top) var(--slide-padding) var(--slide-padding) var(--slide-padding) !important;
  box-sizing: border-box;
  text-align: left;
  /* Any slide whose content runs past the bottom scrolls instead of clipping.
     The scrollbar only appears when needed. */
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: #30363d transparent;
}

.reveal .slides section::-webkit-scrollbar {
  width: 8px;
}

.reveal .slides section::-webkit-scrollbar-thumb {
  background: #30363d;
  border-radius: 4px;
}

.reveal .slides section.stack {
  padding: 0 !important;
}

.reveal .slides section > .content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: var(--content-gap);
  text-align: left;
}

.reveal .slides section > .footnote {
  position: absolute;
  bottom: 15px;
  left: var(--slide-padding);
  right: var(--slide-padding);
  font-size: var(--footnote-size);
  color: var(--muted-color);
}

/* ===========================================
   SECTION DIVIDERS
   =========================================== */

.reveal .slides section.section-divider {
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}

.reveal .slides section.section-divider h1 {
  font-size: 56pt;
  text-align: center;
  color: var(--primary-color);
}

.reveal .slides section.section-divider p {
  font-size: 20pt;
  color: var(--muted-color);
}

/* ===========================================
   TEXT SIZE UTILITIES
   =========================================== */

.text-lg { font-size: 18pt !important; }
.text-xl { font-size: 20pt !important; }
.text-2xl { font-size: 24pt !important; }
.text-3xl { font-size: 28pt !important; }
.text-4xl { font-size: 32pt !important; }

.text-muted { color: var(--muted-color) !important; }
.text-center { text-align: center !important; }
.text-uppercase { text-transform: uppercase; letter-spacing: 0.1em; }
.font-light { font-weight: 300; }
.font-bold { font-weight: 600; }

/* ===========================================
   BLOCKQUOTES
   =========================================== */

.reveal blockquote {
  border-left: 4px solid var(--primary-color);
  padding-left: 20px;
  margin: 20px 0;
  font-style: italic;
  background: none;
  box-shadow: none;
  width: 100%;
  max-width: none;
}

.reveal blockquote cite {
  display: block;
  margin-top: 10px;
  font-style: normal;
  color: var(--muted-color);
}

/* ===========================================
   ACCENT UNDERLINE ON TITLES
   =========================================== */

.reveal .slides section > h2 {
  flex-shrink: 0;
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line-color);
}

/* ===========================================
   FIGURE CARD - for notable figures slides
   =========================================== */

.figure-card {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  align-items: start;
}

.figure-card img {
  border-radius: var(--box-radius);
  width: 100%;
  box-shadow: 0 4px 20px rgba(74, 158, 255, 0.15);
}

.figure-card .figure-info h3 {
  margin: 0 0 5px 0;
  color: var(--secondary-color);
  font-size: 14pt;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ===========================================
   ERA BADGE - for timeline labels
   =========================================== */

.era-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12pt;
  font-weight: 500;
}

.era-badge.summer {
  background: rgba(245, 166, 35, 0.2);
  color: var(--secondary-color);
}

.era-badge.winter {
  background: rgba(74, 158, 255, 0.15);
  color: #6cb4ff;
}

.era-badge.spring {
  background: rgba(80, 200, 120, 0.2);
  color: #50c878;
}

/* ===========================================
   HIGHLIGHT BOX
   =========================================== */

.highlight-box {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
}

/* Exercise hint: a single fragment that reveals the whole hint at once.
   The wrapping .fragment div is what animates; this just sizes the text
   (matching the old text-lg intent) and removes the global paragraph
   margin so the one-line hint is not double-spaced. */
.reveal .hint-box p {
  font-size: 18pt;
  margin: 0;
}

/* ===========================================
   COURSE STRUCTURE
   =========================================== */

.course-summary {
  max-width: 1120px;
  margin: 0 0 16px 0;
  color: #f0f4fb;
  font-size: 18pt !important;
  line-height: 1.4 !important;
}

.course-track-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

.module-track-card {
  background: rgba(74, 158, 255, 0.07);
  border: 1px solid rgba(74, 158, 255, 0.22);
  border-radius: var(--box-radius);
  padding: 20px 22px;
}

.module-track-kicker {
  font-size: 12pt;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--secondary-color);
  margin-bottom: 8px;
}

.module-track-card h3 {
  margin: 0 0 8px 0;
}

.module-track-intro {
  font-size: 14pt !important;
  color: #d7ddea !important;
  margin: 0 0 10px 0;
  line-height: 1.4 !important;
}

.compact-list {
  margin: 0;
}

.reveal ul.compact-list li {
  font-size: 16pt;
  line-height: 1.35;
  margin-bottom: 7px;
  padding-left: 20px;
}

.course-note {
  margin-top: 14px;
  color: #d7ddea;
  font-size: 15pt !important;
  line-height: 1.35 !important;
}

.course-glossary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  margin-top: 14px;
}

.glossary-item {
  background: rgba(245, 166, 35, 0.08);
  border: 1px solid rgba(245, 166, 35, 0.18);
  border-radius: var(--box-radius);
  padding: 12px 14px;
}

.glossary-item strong {
  color: var(--secondary-color);
}

.glossary-item p {
  font-size: 13pt !important;
  color: #d7ddea !important;
  margin: 6px 0 0 0;
  line-height: 1.4;
}

/* ===========================================
   TERMINAL OUTPUT
   =========================================== */

.terminal-output {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 0;
  max-width: 800px;
  margin: 0 auto;
  text-align: left;
}

.terminal-output .terminal-bar {
  background: #161b22;
  border-radius: 8px 8px 0 0;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.terminal-output .terminal-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.terminal-output .terminal-dot.red { background: #ff5f57; }
.terminal-output .terminal-dot.yellow { background: #febc2e; }
.terminal-output .terminal-dot.green { background: #28c840; }

.terminal-output .terminal-title {
  color: #8b949e;
  font-family: monospace;
  font-size: 10pt;
  margin-left: 8px;
}

.terminal-output .terminal-body {
  padding: 15px 20px;
}

.terminal-output .terminal-body pre {
  margin: 0;
  background: none !important;
  box-shadow: none !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output.dense .terminal-body {
  padding: 10px 20px;
}

.reveal .terminal-output.dense .terminal-body pre.terminal-pre {
  font-size: 9pt;
  line-height: 1.28;
}

.reveal .terminal-output .terminal-body pre.terminal-pre span {
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre p {
  display: inline;
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
  margin: 0 !important;
  color: inherit;
}

.reveal .terminal-output .terminal-body pre code {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output .terminal-body .prompt {
  color: #8b949e;
}

.terminal-output .terminal-body .success {
  color: #3fb950;
}

.terminal-output .terminal-body .header {
  font-weight: bold;
}

.terminal-output .terminal-body .skipped {
  color: #8b949e;
  font-style: italic;
}

/* ===========================================
   TURNING POINT SLIDE
   =========================================== */

.turning-point h2 {
  border-bottom-color: var(--secondary-color) !important;
}

/* ===========================================
   CODE BLOCKS
   =========================================== */

.reveal pre {
  margin-bottom: 0;
  width: 100%;
  box-sizing: border-box;
  box-shadow: none !important;
  background: none !important;
}

.reveal pre code {
  font-size: 14pt;
  line-height: 1.4;
  padding: 10px 20px;
  border-radius: var(--box-radius);
  background: rgba(20, 25, 45, 0.8);
  color: var(--text-color);
  max-height: 400px;
}

.reveal pre code .hljs-keyword,
.reveal pre code .hljs-built_in {
  color: #c792ea;
}

.reveal pre code .hljs-string {
  color: #c3e88d;
}

.reveal pre code .hljs-comment {
  color: #546e7a;
}

.reveal pre code .hljs-number {
  color: #f78c6c;
}

.reveal code {
  color: var(--text-color);
}

/* ===========================================
   MATH (KaTeX)
   =========================================== */

.katex {
  color: var(--text-color);
  font-size: 1.1em;
}

.katex-display {
  margin: 15px 0;
}

.katex-display > .katex {
  font-size: 1.3em;
}

/* ===========================================
   VIDEO CONTAINERS
   =========================================== */

.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-container video,
.video-container img {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--box-radius);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
}

/* ===========================================
   SIDE QUEST BADGE
   =========================================== */

.side-quest-badge {
  display: inline-block;
  background: rgba(245, 166, 35, 0.15);
  color: var(--secondary-color);
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12pt;
  font-weight: 500;
  margin-bottom: 10px;
}

/* ===========================================
   TERMINAL OUTPUT - ANSI COLOR PALETTE
   Replaces inline `style="color:#..."` on spans
   inside .terminal-pre. A rule on the span itself
   overrides the color inherited from .terminal-pre.
   =========================================== */

.terminal-output .terminal-body .t-red    { color: #e06c75; }
.terminal-output .terminal-body .t-orange { color: #d19a66; }
.terminal-output .terminal-body .t-yellow { color: #e5c07b; }
.terminal-output .terminal-body .t-green  { color: #98c379; }
.terminal-output .terminal-body .t-cyan   { color: #56b6c2; }
.terminal-output .terminal-body .t-blue   { color: #61afef; }
.terminal-output .terminal-body .t-gray   { color: #8b949e; }
.terminal-output .terminal-body .t-fg     { color: #e8eaf0; }
.terminal-output .terminal-body .t-fail   { color: #e74c3c; }

.terminal-caption {
  margin-top: 15px;
  text-align: center;
}

/* ===========================================
   TIMELINE (module 1) - per-node structure
   Positional left/width and per-era colors stay
   inline; this captures the repeated boilerplate.
   =========================================== */

.tl-node  { position: absolute; transform: translateX(-50%); text-align: center; }
/* .reveal prefix needed: `.reveal p` (0,1,1) sets color/font-size and would
   otherwise beat a bare .tl-* class. The original used inline styles. */
.reveal .tl-label { font-size: 10pt; color: var(--muted-color); white-space: nowrap; margin: 0; }
.reveal .tl-year  { font-size: 11pt; font-weight: 600; margin: 2px 0 0 0; }
.tl-stem  { width: 1px; opacity: 0.5; margin: 2px auto 0; }
.tl-dot   { width: 10px; height: 10px; border-radius: 50%; margin: 0 auto; }

.tl-node.below .tl-stem  { margin: 0 auto; }
.tl-node.below .tl-year  { margin: 0; }
.tl-node.below .tl-label { margin: 2px 0 0 0; }

/* ===========================================
   CANONICAL SLIDE TYPES
   Backs the :::divider / :::columns / :::note /
   :::quiz / :::step / :::interactive fences so
   slides.md carries no inline layout styles.
   (.section-divider, .figure-card, .terminal-output,
    .hint-box are defined above and reused.)
   =========================================== */

/* :::columns - grid; template/gap/valign supplied by the build */
.reveal .slide-columns {
  display: grid;
  align-items: start;
  margin: 10px 0;
}

/* :::note - callout box (canonical replacement for .highlight-box) */
.reveal .note {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
  margin: 20px 0;
}

.reveal .note p {
  font-size: 18pt;
  margin: 0;
}

.reveal .note p + p {
  margin-top: 0.6em;
}

/* :::note variant="hint" - lighter, boxless (also used inside :::step) */
.reveal .note.hint-box {
  background: none;
  border: none;
  padding: 0;
}

/* :::quiz - prompt scales up; its last line is the question */
.reveal .quiz-prompt p {
  font-size: 18pt;
  margin: 0 0 0.6em 0;
}

.reveal .quiz-prompt p:last-child {
  font-size: 24pt;
  color: var(--text-color);
  margin: 0.5em 0 0 0;
}

.reveal .quiz-answer {
  margin-top: 30px;
}

/* :::step - spacing between code, hint, and answer */
.reveal .hint-box {
  margin-top: 22px;
}

.reveal .hint-box + .note {
  margin-top: 8px;
  padding: 12px 18px;
}

/* :::interactive - widget fills the slide body like a video */
.reveal .interactive-host {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

/* ===========================================
   SHARED INTERACTIVE WIDGET CHROME (.iw-*)
   Used by the :::interactive widgets defined in each module's config.js.
   Module 3 predates this and keeps its own .m3-* chrome.
   =========================================== */

.iw {
  display: flex;
  flex-direction: column;
  justify-content: center;   /* only bites when the content does not fill the slide */
  gap: 12px;
  width: 100%;
  height: 100%;
}

.iw-canvas-wrap {
  flex: 1;
  min-height: 0;
  width: 100%;
}

.iw-canvas {
  width: 100%;
  height: 100%;
  min-height: 0;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.iw-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.iw-btn {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: rgba(74, 158, 255, 0.10);
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 6px;
  padding: 7px 16px;
  cursor: pointer;
}

.iw-btn:hover {
  background: rgba(74, 158, 255, 0.22);
}

.iw-btn.iw-primary,
.iw-btn.active {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: #0a0e1a;
  font-weight: 600;
}

.iw-btn.iw-reset {
  background: rgba(245, 166, 35, 0.12);
  border-color: rgba(245, 166, 35, 0.40);
  color: var(--secondary-color);
}

.iw-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.iw-label {
  font-size: 12pt;
  color: var(--muted-color);
  margin: 0 2px 0 10px;
}

.reveal .iw-readout {
  font-size: 13pt;
  color: var(--muted-color);
  text-align: center;
  margin: 0;
  min-height: 1.4em;
}

.reveal .iw-readout strong {
  color: var(--secondary-color);
}

.iw-sliders {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 4px 18px;
  width: 100%;
  max-width: 100%;
  margin: 0 auto;
}

.iw-slider {
  display: grid;
  grid-template-columns: minmax(72px, auto) 1fr 58px;
  align-items: center;
  gap: 9px;
}

.reveal .iw-slider label {
  font-size: 11.5pt;
  color: var(--primary-color);
  font-weight: 600;
  margin: 0;
}

.iw-slider input[type="range"] {
  width: 100%;
  accent-color: var(--primary-color);
}

.reveal .iw-slider .iw-val {
  font-size: 11.5pt;
  color: var(--text-color);
  font-family: monospace;
  text-align: right;
  margin: 0;
}

.iw-text-input {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: 6px;
  padding: 7px 12px;
  width: 100%;
  max-width: 620px;
}

/* DOM-based widget pieces: token chips, panels, and two-column bodies. */

.iw-body {
  flex: 1;

## The Five Most Durable Concepts

None of these depend on any particular architecture.

<div class="card-grid cols-3">
<div class="card"><h4>Information theory</h4><p>Cross-entropy is <strong>average surprise</strong>. Every loss you minimized was a bit count.</p></div>
<div class="card"><h4>Gradient descent</h4><p>The only learning algorithm this course ever used. Everything else was a choice of what to differentiate.</p></div>
<div class="card"><h4>Attention</h4><p>Attention is $\mathrm{softmax}(QK^\top/\sqrt{d_k})V$ and nothing more.</p></div>
<div class="card"><h4>Scaling laws</h4><p>Loss falls <strong>predictably</strong> with compute. That predictability is why anyone spends a billion dollars on a training run.</p></div>
<div class="card"><h4>Evaluation</h4><p>You cannot improve what you <strong>cannot measure</strong>, and most measurements are worse than they look.</p></div>
</div>

<!-- .slide: id="sidequest-gnn" -->

## <span class="side-quest-badge">Side Quest</span> Transformers Are Graph Neural Networks

Attention is **message passing on a fully connected graph:**

- Every token is a node
- Attention weights are soft edges
- Value aggregation is the message step

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Graph neural networks**

The graph is given as input, and a node only exchanges messages with its neighbors.

</div>

<div>

**Attention**

No graph is given: every token can attend to every other, and the weights on those edges are learned per input. That costs $O(n^2)$.

</div>

</div>

Any nodes work: image patches, atoms, functions, users. The GNN literature covers the same machinery. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

# What Should a Model Predict?

Tokens, bytes, or whole sentences


---

<!-- .slide: id="units-tokens" -->

## Every Model in This Course Predicted Tokens

Module 4 called this the **unit problem**. Bytes give tiny vocabularies and very long sequences. Words give huge vocabularies and break on typos. BPE was the compromise.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**What BPE fixed**

- A vocabulary of tens of thousands of subwords
- Any string stays representable
- Common words cost one token

</div>

<div>

**What it left behind**

- The vocabulary is frozen before training starts
- Letters hide inside tokens, so spelling and counting characters are hard
- Every token gets one prediction step, whether it is "the" or the key word of a proof

</div>

</div>

Research now pushes the unit both ways: smaller than a token, and much larger. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="units-bytes" -->

## Byte Models Drop the Tokenizer

<div class="bench-table dense">
<table>
<thead><tr><th>Model</th><th>How it groups bytes</th><th>Result</th></tr></thead>
<tbody>
<tr><td><strong>ByT5</strong> (Google, 2021)</td><td>No grouping. The T5 encoder-decoder runs on raw UTF-8 bytes, with a deeper encoder</td><td>Competitive with token-based mT5 and more robust to typos, but sequences are several times longer and slower to run</td></tr>
<tr><td><strong>MEGABYTE</strong> (Meta, 2023)</td><td>Fixed-size patches of bytes</td><td>Models sequences of over a million bytes</td></tr>
<tr><td><strong>BLT</strong> (Meta, 2024)</td><td>Variable patches, cut where the next byte is hard to predict</td><td>Matches Llama 3 at equal training compute, up to 8B parameters</td></tr>
<tr><td><strong>H-Net</strong> (2025)</td><td>Chunk boundaries learned end to end with the model</td><td>Reports beating a BPE transformer at equal compute</td></tr>
</tbody>
</table>
</div>

Each step keeps raw bytes as input but groups them before the large model sees them, so the sequence stays short. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

<!-- .slide: id="divider-attention" class="section-divider" data-state="is-section-divider" -->

# Is Attention the Right Primitive?

What replaces quadratic attention


---

<!-- .slide: id="attention-bill" -->

## The Cost of Attention

Two costs, both paid on every request.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Compute: $O(n^2)$**

- Score matrix is $n \times n$
- Double the context, quadruple the work
- FlashAttention shrank the constant, not the exponent

</div>

<div>

**Memory: the KV cache**

- Stores a key and value per generated token
- Grows linearly with sequence length
- Dominates serving memory at long context

</div>

</div>

Removing these costs requires giving something up. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="attention-drop-softmax" -->

## Linear Attention Removes the Softmax

$$\text{softmax attention:} \quad \mathbf y_t = \frac{\sum_{i \le t} \textcolor{#f5a623}{\exp(\mathbf q_t^\top \mathbf k_i)} \mathbf v_i}{\sum_{i \le t} \textcolor{#f5a623}{\exp(\mathbf q_t^\top \mathbf k_i)}}$$

$$\text{linear attention:} \quad \mathbf y_t = \frac{\sum_{i \le t} \textcolor{#f5a623}{\phi(\mathbf q_t)^\top \phi(\mathbf k_i)} \mathbf v_i}{\sum_{i \le t} \textcolor{#f5a623}{\phi(\mathbf q_t)^\top \phi(\mathbf k_i)}}$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The terms**

- $\mathbf q_t$: the query of the current token $t$. $\mathbf k_i, \mathbf v_i$: the key and value of an earlier token $i$
- $\phi$: a function applied to each entry that keeps it positive. A common choice equals $x + 1$ for $x > 0$ and $e^x$ for $x \le 0$
- Top: earlier values, weighted by score. Bottom: the total weight, so the weights add to 1

</div>

<div>

**Why the change matters**

- $\exp(\mathbf q_t^\top \mathbf k_i)$ cannot be split into a query part and a key part
- In the new score, $\phi(\mathbf q_t)$ is the same for every $i$, so it factors out of the sum
- The query still sets the output. It is applied once, after the sum, instead of once per earlier token

</div>

</div>

---

This $\mathbf S_t = \sum_{i \le t} \phi(\mathbf k_i) \mathbf v_i^\top$ is the linear-attention state. Every variant since 2020 changes one thing: the rule for writing to it. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="attention-softmax-price" -->

## What the Softmax Provides

Dropping it costs two things.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Sharpness**

- The exponential lets **one key dominate**
- Attention can select one token out of thousands
- A linear kernel spreads weight across many keys

</div>

<div>

**Unbounded memory**

- All knowledge of the past must fit in $\mathbf S$, a **fixed-size** matrix
- A KV cache reproduces any earlier token exactly
- A fixed state cannot

</div>

</div>

This is the RNN bottleneck, reintroduced deliberately. Open question: is a fixed-size summary good enough? <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="attention-write-rules" -->

## Five Rules for Writing to the State

Plain linear attention only adds. A full memory needs a way to **forget** and a way to **overwrite**.

<div class="bench-table dense">
<table>
<thead><tr><th>Model</th><th>Update rule</th><th>What changed</th></tr></thead>
<tbody>
<tr><td><strong>Linear attention</strong> (2020)</td><td>$\mathbf S_t = \mathbf S_{t-1} + \mathbf k_t \mathbf v_t^\top$</td><td>Adds forever and never forgets</td></tr>
<tr><td><strong>RetNet</strong> (2023)</td><td>$\mathbf S_t = \gamma \mathbf S_{t-1} + \mathbf k_t \mathbf v_t^\top$</td><td>Old memories fade at a fixed rate $\gamma$</td></tr>
<tr><td><strong>Mamba-2</strong>, <strong>GLA</strong> (2024)</td><td>$\mathbf S_t = \alpha_t \mathbf S_{t-1} + \mathbf k_t \mathbf v_t^\top$</td><td>The fade rate $\alpha_t$ is computed from the current token</td></tr>
<tr><td><strong>DeltaNet</strong> (2021, 2024)</td><td>$\mathbf S_t = \mathbf S_{t-1} + \beta_t \mathbf k_t (\mathbf v_t - \mathbf S_{t-1}^\top \mathbf k_t)^\top$</td><td>Writes only the error, so a new value replaces the old one</td></tr>
<tr><td><strong>Gated DeltaNet</strong> (2025)</td><td>$\alpha_t$ gate plus the delta write</td><td>Forgets and overwrites. Used in Qwen3-Next and Kimi Linear</td></tr>
</tbody>
</table>
</div>

In this table, $\mathbf k_t$ stands for $\phi(\mathbf k_t)$. Every rule still updates one fixed-size $\mathbf S$ per token, so the cost grows linearly with sequence length. <!-- .element: class="text-lg" style="margin-top: 10px;" -->

- DeltaNet's rule: $\mathbf S_t = \mathbf S_{t-1} + \beta_t \mathbf k_t (\mathbf v_t - \mathbf S_{t-1}^\top \mathbf k_t)^\top$. The term in parentheses is the error
- $\beta_t$ sets how much of the error to write: $\beta_t = 1$ replaces the value, $\beta_t = 0.5$ moves it halfway
- If the key is new, the read returns about zero, so the error is just $\mathbf v_t$ and the write is an ordinary add
- The model learns during training to give both sentences' tokens a similar key, so the second write lands in the same row

---

<!-- .slide: id="attention-delta" -->

## The Delta Rule Is a Gradient Step

Treat $\mathbf S$ as a tiny linear model. Each token is one training example: input $\mathbf k_t$, target $\mathbf v_t$.

1. Prediction, what the memory returns now: $\hat{\mathbf v} = \mathbf S^\top \mathbf k_t$
2. Loss: $\ell = \frac{1}{2} \lVert \hat{\mathbf v} - \mathbf v_t \rVert^2$
3. Gradient: $\nabla_{\mathbf S} \ell = \mathbf k_t (\hat{\mathbf v} - \mathbf v_t)^\top$
4. One step with learning rate $\beta_t$: $\mathbf S \leftarrow \mathbf S + \beta_t \mathbf k_t (\mathbf v_t - \hat{\mathbf v})^\top$, which is the delta rule

<div class="bench-table">
<table>
<thead><tr><th>Loss on one key-value pair</th><th>One gradient step gives</th></tr></thead>
<tbody>
<tr><td>Dot product $-\langle \mathbf S^\top \mathbf k_t, \mathbf v_t \rangle$: push the read toward $\mathbf v_t$ without limit</td><td>$\mathbf S + \beta_t \mathbf k_t \mathbf v_t^\top$, plain linear attention</td></tr>
<tr><td>Squared error $\frac{1}{2} \lVert \mathbf S^\top \mathbf k_t - \mathbf v_t \rVert^2$: make the read equal $\mathbf v_t$</td><td>$\mathbf S + \beta_t \mathbf k_t (\mathbf v_t - \mathbf S^\top \mathbf k_t)^\top$, DeltaNet</td></tr>
</tbody>
</table>
</div>

The state is a model trained while it reads, one step per token. The section on continual learning builds on this. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

## Albert Gu <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### S4 (2021), Mamba (2023)

Built the state-space line, the most serious architectural challenger to the transformer since 2017. S4 derived a sequence model from a continuous-time dynamical system, an idea from control theory, not NLP. Mamba, with Tri Dao, made state transitions depend on the input and became competitive at scale.

Co-author Tri Dao wrote FlashAttention, the work that made exact attention fast on real hardware. The person who made attention efficient is also building its replacement. This is an engineering argument, not a fight between camps.

## S4 Starts From a Differential Equation

S4 stands for **Structured State Space Sequence** model (Gu, Goel, and Ré, 2021).

$$h'(t) = A h(t) + B x(t) \qquad y(t) = C h(t)$$

- $x$: the input, one number per channel
- $h$: the state, a running summary of the input so far

<div>

**What each word of the name means**

- **State space**: the model is this equation
- **Structured**: $A$ has a special form (**HiPPO**) so $h$ summarizes the whole history and is fast to compute
- **Sequence**: built for long inputs like audio and text

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**One step forward**

- $h$ changes by about $\Delta \cdot h'$ per step: $h_t \approx h_{t-1} + \Delta (A h_{t-1} + B x_t)$
- Group terms: $h_t = \bar A h_{t-1} + \bar B x_t$, with $\bar A \approx I + \Delta A$ and $\bar B \approx \Delta B$
- S4 uses the exact form $\bar A = \exp(\Delta A)$

</div>

<div>

**A one-number example**

- $A = -1$ and $\Delta = 0.1$ give $h_t = 0.9 h_{t-1} + 0.1 x_t$
- Each token keeps 90% of the state and mixes in the input, the same shape as RetNet's update
- A bigger $\Delta$ forgets faster. Mamba turns that into a per-token knob

</div>

</div>

## S4 Trains as One Long Convolution

Unroll the recurrence. The output is a weighted sum of past inputs, and the list of weights is called the **kernel** $K$.

$$y_t = K_0 x_t + K_1 x_{t-1} + K_2 x_{t-2} + \cdots \qquad K_j = C \bar A^j \bar B$$

<div class="svg-figure">

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**What $K_j$ means**

- How much an input from $j$ tokens ago still affects the output now
- $\bar B$ writes it in, $\bar A$ shrinks it $j$ times, $C$ reads it out
- One-number example: $K_j = 0.1 \times 0.9^j$, so $0.1, 0.09, 0.081, \dots$

</div>

<div>

**Why it matters**

- $K$ is the **same at every position**, so one kernel slides along the sequence
- Training: apply $K$ to the whole sequence at once with an FFT
- Inference: run the recurrence token by token

</div>

</div>

<!-- .slide: id="sidequest-bitter" -->

## <span class="side-quest-badge">Side Quest</span> The Bitter Lesson for Architectures

In "The Bitter Lesson" (2019), Rich Sutton argued that across seventy years of AI research, general methods that scale with computation have beaten methods built on human knowledge. Try applying that to this section.

- People designed Mamba's selectivity by hand. Is that the kind of built-in structure Sutton says eventually loses, or a cheaper way to use compute, which his argument favors?
- Someone decided Qwen3-Next should use one attention layer in every four. Will hand-picked ratios like that last, or will models learn them?
- Attention replaced recurrent models once. Could attention itself turn out to be hand-built structure that something more general replaces?

Nobody knows yet. So far, how well a method scales with compute has predicted the winning architecture better than how clever the method is. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

## Three Shared Assumptions

Transformers and state-space models alike still do all three:

<div class="card-grid cols-3">
<div class="card"><h4>Generates left to right</h4><p>One token at a time, never revising.</p></div>
<div class="card"><h4>Spends fixed compute per token</h4><p>The same layers, every time, regardless of difficulty.</p></div>
<div class="card"><h4>Freezes its weights</h4><p>Training ends, and learning ends with it.</p></div>
</div>

<!-- .slide: id="divider-diffusion" class="section-divider" data-state="is-section-divider" -->

# Generating Text Out of Order

Assumption: text is generated left to right


---

<!-- .slide: id="diffusion-assumption" -->

## Where the Assumption Is Encoded

Two mechanisms from earlier modules enforce left-to-right generation.

$$p(x_1, \dots, x_T) = \prod_{t=1}^{T} p(x_t \mid x_{<t})$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The chain-rule factorization**

- Exactly true for any ordering
- Left to right makes the likelihood **exactly computable** in one pass

</div>

<div>

**The causal mask**

- Position $t$ cannot see position $t+1$
- One forward pass gives a valid prediction at every position

</div>

</div>

Left-to-right is not a property of language. It is a factorization chosen for computational convenience. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="diffusion-costs" -->

## Costs of Left-to-Right Generation

<div class="card-grid cols-3">
<div class="card"><h4>Strictly sequential</h4><p>One forward pass per token. Generation is <strong>memory-bound</strong>: the time goes to moving weights, not arithmetic.</p></div>
<div class="card"><h4>No revision</h4><p>The model cannot change a token once it is generated, even after an early mistake becomes apparent.</p></div>
<div class="card"><h4>No infilling</h4><p>The model structurally cannot condition on text <strong>after</strong> a blank. Every editing workflow is a workaround for this.</p></div>
</div>

Only the first of these is about speed. The other two are about what the model can express at all. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<div class="figure-card">

![Jascha Sohl-Dickstein](module_12_future/images/jascha_sohl_dickstein.jpg)

<div class="figure-info">

## Jascha Sohl-Dickstein <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Deep Unsupervised Learning using Nonequilibrium Thermodynamics (2015)

Introduced diffusion models with an idea from statistical physics: destroy a structured distribution with noise until it becomes simple, then train a network to run the destruction backwards. The 2015 paper preceded the image-generation wave by years and text diffusion by a decade.

Diffusion appeared earlier in the course for images. Here it competes for text generation.

</div>

</div>

</div>

<!-- .slide: id="diffusion-mechanics" -->

## Diffusion Generates Without an Ordering

Start fully masked. Unmask iteratively, refining the whole sequence over a few dozen steps.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Training**

- Mask a fraction of positions
- Predict **every masked position at once**
- Same denoising objective as span corruption in pretraining

</div>

<div>

**Generation**

- Start with everything masked
- Predict all positions, keep the **confident** ones
- Re-mask the rest, repeat

</div>

</div>

Step count is a dial: few steps means fast but lower quality, many steps approaches autoregressive quality with less speedup. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

<!-- .slide: id="diffusion-stack" -->

## The Serving Stack Is the Obstacle

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Why the KV cache exists**

- Past tokens **never change**
- Cache the past, compute only the new token
- The whole serving apparatus rests on this guarantee

</div>

<div>

**What diffusion does to it**

- Past tokens change on every step
- Caching, batching, and streaming must be **rebuilt from scratch**

</div>

</div>

A successor must beat the incumbent's loss curve **plus nine years of infrastructure** built on assumptions it violates. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="diffusion-hybrid" -->

## Block Diffusion

**Block diffusion**: autoregressive across blocks, diffusive within them.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**What you keep**

- KV caching between blocks
- Earlier blocks are finished and will not change

</div>

<div>

**What you gain**

- Parallel generation inside each block
- Revision within a block before committing it

</div>

</div>

The second hybrid in two sections. Autoregression won for computational convenience, not because language is inherently left to right. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<!-- .slide: id="sidequest-lecun" -->

## <span class="side-quest-badge">Side Quest</span> Is Autoregression a Dead End?

Yann LeCun's critique:

- Generating one token at a time **accumulates error**
- Each token conditions on earlier mistakes, with no world model to correct against
- On this view the paradigm cannot reach robust intelligence at any scale
- His alternative: predict in representation space, not token space

Debate questions:

- What **observation** would confirm or refute this? If none exists, is it a scientific claim?
- Reasoning models spend tokens **checking their own work** and revising. Does that count as the missing error correction, or is it the same error accumulation with extra steps?
- Diffusion models revise committed text by construction. Does that answer LeCun's objection, or a different one?

---

<!-- .slide: id="divider-looped" class="section-divider" data-state="is-section-divider" -->

# Spending More Compute on Hard Tokens

Assumption: every token gets the same computation


---


<!-- .slide: id="looped-assumption" -->

## Every Token Gets the Same Depth

The transformer has $L$ layers. Every token passes through all $L$ of them.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The word "the"**

Trivially predictable from context. Gets $L$ layers of computation.

</div>

<div>

**The last step of a hard proof**

Requires several dependent inferences. Gets $L$ layers of computation.

</div>

</div>

Depth is fixed at training time. The architecture cannot spend more computation on a harder token. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<!-- .slide: id="looped-cot" -->

## Chain of Thought Buys Compute With Tokens

Reasoning models buy more computation per answer by **emitting more tokens.** It works and it shipped. It accepts a constraint:

<div class="card-grid cols-3">
<div class="card"><h4>To compute more</h4><p>The model must <strong>serialize its thinking into words</strong>.</p></div>
<div class="card"><h4>Then read it back</h4><p>Through its own context window, one token at a time.</p></div>
<div class="card"><h4>Paying full price</h4><p>Every thought costs a forward pass, a KV cache entry, and output tokens you are billed for.</p></div>
</div>

More computation does not have to take the form of words. That gap is the rest of the section. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

## Alex Graves <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Adaptive Computation Time (2016), Neural Turing Machines (2014)

Two of his ideas came a decade early. Adaptive Computation Time lets a network decide **for itself** how many steps to spend on each input, with a learned halting rule. Neural Turing Machines give a network an external memory it can read and write during the forward pass.

His work on connectionist temporal classification and LSTM sequence generation is a large part of why recurrent networks worked well enough in the 2010s to be worth replacing.

</div>

</div>

</div>

<!-- .slide: id="looped-loop" -->

## Looped Transformers

An alternative way to spend more computation: **apply the same block repeatedly.**

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Universal Transformers (2018)**

- Shared weights applied recurrently in depth
- Learned halting rule per position
- Predates GPT-3

</div>

<div>

**What changes**

- Depth becomes a **runtime dial**, not a training-time constant
- Same weights: four iterations on an easy token, forty on a hard one

</div>

</div>

Recurrence in *depth*, not in sequence. Linear attention looped over tokens; this loops over layers. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

## Fixed Depth Limits Expressiveness

A fixed-depth network computes a **fixed-length circuit.**

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The limit**

- A problem needing more sequential steps than layers is out of reach
- Width does not help: it buys parallel work, not more steps

</div>

<div>

**What a loop does**

- Runs the same parameters a **variable** number of steps
- Expresses iterative algorithms a fixed stack cannot represent

</div>

</div>

This is expressiveness, not efficiency. Some problems are not expensive for a fixed-depth transformer; they are unreachable. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

## Adaptive Compute in Width and Depth

<div class="bench-table">
<table>
<thead><tr><th>Axis</th><th>Mechanism</th><th>Effect</th></tr></thead>
<tbody>
<tr><td><strong>Width</strong></td><td>Mixture of experts</td><td>Each token activates a few experts out of many. Compute per token is sparse across width</td></tr>
<tr><td><strong>Depth</strong></td><td>Mixture-of-depths</td><td>Each token skips some layers entirely. Compute per token is sparse across depth</td></tr>
<tr><td><strong>Depth, unbounded</strong></td><td>Looped transformers</td><td>Each token can take <em>more</em> steps than the network has layers</td></tr>
</tbody>
</table>
</div>

All three mechanisms avoid spending the same compute on every token. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

<!-- .slide: id="looped-verdict" -->

## Why Verbalized Reasoning Won

Looped transformers are parameter-efficient and date to 2018, yet verbalized chain of thought shipped. Two reasons:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Tooling**

- Serving, billing, and batching assume fixed work per token
- Variable depth breaks latency prediction and throughput planning

</div>

<div>

**Supervision**

- RL needs something to score: you can **reward a transcript you can read**
- Latent reasoning is hard to supervise for the same reason it is efficient: nobody can see it

</div>

</div>

You cannot audit reasoning that was never written down. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="sidequest-hardware" -->

## <span class="side-quest-badge">Side Quest</span> The Hardware Lottery

Sara Hooker (2020): ideas win or lose partly on **how well they fit the hardware of their era**. Transformers saturate GPUs; recurrent models do not, and lost the 2010s partly for it.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Applied to looped depth**

- Looped depth is parameter-efficient
- The incumbent holds the **hardware**, the **serving stack**, and the **RL tooling**
- A challenger must beat all three at once

</div>

<div>

**Applied to diffusion**

- Block diffusion exists specifically so diffusion can keep the KV cache

</div>

</div>

The idea that wins is not the best idea. It is the best idea that runs well on existing hardware. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

## Alan Turing <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### On Computable Numbers (1936), Computing Machinery and Intelligence (1950)

Defined what it means to compute. His 1936 machine has a tape, a head that reads and writes one cell at a time, and a finite table of rules. Anything a modern computer can calculate, that machine can too.

In 1950 he asked whether a machine could hold a conversation that people could not tell apart from a human's.

</div>

</div>

</div>

<!-- .slide: id="neuro-turing-complete" -->

## Transformers Are Turing Complete

Pérez, Marinković, and Barceló (2019) proved that a transformer can simulate any Turing machine.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**What the proof assumes**

- Numbers with unlimited precision
- Each attention head picks exactly one position
- The model writes its intermediate steps as tokens, and that growing output serves as the tape

</div>

<div>

**What real models have**

- 16-bit numbers, soft attention, and a finite context
- With no written steps, a fixed-depth transformer only solves problems that shallow parallel circuits can (Merrill and Sabharwal, 2023)
- With a polynomial number of chain-of-thought steps, it solves exactly the problems a computer solves in polynomial time (Merrill and Sabharwal, 2024)

</div>

</div>

Chain of thought is what turns a fixed-depth network into a general computer. Turing completeness says the weights exist; training still has to find them. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

<!-- .slide: id="neuro-gap" -->

## Networks Approximate Algorithms

A transformer that learned addition from text has not learned the addition algorithm. It fails on numbers longer than any it trained on.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Neural computation**

- Learns its rules from data
- Handles noise, images, and language
- Fails silently outside the training range
- Hard to inspect

</div>

<div>

**Symbolic computation**

- Rules are written down
- Exact on inputs of any length
- Breaks on messy, ambiguous input
- Every step can be checked

</div>

</div>

**Neurosymbolic** research tries to get both columns at once. The question is where the symbolic part lives. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

## RASP Is a Language for Transformers

Weiss, Goldberg, and Yahav (2021) wrote down what one transformer layer can do as two primitives.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The primitives**

- `select` compares every query position with every key position. That is an **attention pattern**
- `aggregate` averages values under that pattern. That is the **attention output**
- Elementwise operations on each position are the **MLP**

</div>

<div>

**Reversing a sequence**

```python
opp = length - indices - 1
flip = select(indices, opp, ==)
reverse = aggregate(flip, tokens)
```

Two attention layers: one to compute `length`, one to move each token to its mirrored position.

</div>

</div>

The longest chain of dependent `select` calls predicts how many layers a trained transformer needs for the task. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

<!-- .slide: id="neuro-alta" -->

## ALTA Compiles Loops and Tests Learnability

Shaw et al. (2024, TMLR 2025) extend RASP and Tracr in two directions.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Loops**

- ALTA programs can loop
- They compile to **Universal Transformer** weights, one shared block run repeatedly
- The looped block from the previous section, written by hand
- Length-invariant parity and addition, without scratchpad tokens

</div>

<div>

**Learnability**

- The weights exist. Does training on examples find them?
- Often it does not, even when the program is small
- Supervising each step of the program's execution trace helps
- Relative position encodings let some length generalization appear; absolute ones allow none

</div>

</div>

Expressiveness asks whether a solution exists in weight space. Learnability asks whether gradient descent on a given dataset reaches it. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

<!-- .slide: id="divider-learning" class="section-divider" data-state="is-section-divider" -->

# Models That Keep Learning

Assumption: learning stops at deployment


---

<!-- .slide: id="learning-assumption" -->

## The Weights Are Frozen

- Everything a deployed model appears to learn lives in the **context window**
- The session ends and it is lost
- Debug a problem Monday, the model retains nothing Tuesday

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Workaround: retrieval**

- Put the past in the prompt
- Costs tokens on every call
- The model still has not learned anything

</div>

<div>

**Workaround: finetuning**

- Bake the past into the weights
- Slow, offline cycle
- Nothing like learning from experience as you go

</div>

</div>

Neither gives the model accumulated experience. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="learning-forgetting" -->

## Catastrophic Forgetting

**Catastrophic forgetting** (McCloskey and Cohen, 1989):

- Train on new data and old capabilities degrade
- Gradient descent on the new task walks the weights away from the old one
- Nothing in the objective says not to

<div class="card-grid cols-3">
<div class="card"><h4>Replay</h4><p>Mix old data in with the new. Effective, and it means you never actually stop paying for the old data.</p></div>
<div class="card"><h4>Constrain</h4><p>Penalize movement in weights that mattered before (elastic weight consolidation). Needs to know which ones mattered.</p></div>
<div class="card"><h4>Isolate</h4><p>Put new learning in added parameters. This is LoRA, reused as a <strong>memory mechanism</strong> rather than an efficiency trick.</p></div>
</div>

None of the three is a solved recipe at this scale. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<!-- .slide: id="learning-ttt" -->

## Test-Time Training Fine-Tunes on Each Input

<div class="svg-figure">

<!-- .slide: id="learning-ttt-layers" -->

## TTT Layers Train a Small Model at Every Token

Sun et al. (2024) put the same idea inside a layer. The layer's memory is the **weights $W$ of a small model** $f_W$.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Each token**

- Training example: input $\mathbf k_t$, target $\mathbf v_t$, both projections of the token
- Update: one gradient step on $\lVert f_W(\mathbf k_t) - \mathbf v_t \rVert^2$
- Output: $f_W(\mathbf q_t)$, the small model applied to the query

</div>

<div>

**The choice of small model**

- **Linear** $f_W$: the update becomes the delta rule, a cousin of linear attention
- **Two-layer MLP** $f_W$: more capacity than any fixed-size matrix memory
- Ancestor: Schmidhuber's fast weights (1992), one network writing another's weights

</div>

</div>

---

<!-- .slide: id="learning-titans" -->

## Titans Remembers What Surprised It

**Titans** pushes the inner loop from a per-sequence scratchpad toward persistent memory, with a rule for what gets written:

<div class="metric-box">

Store what the model predicted **badly**.

</div>

- A correctly predicted token carries no new information; a surprising one does
- The loss doubles as the rule for **what to write** to memory

**Nested learning** (Behrouz et al., NeurIPS 2025) goes further. It drops the split between training and inference, and treats the optimizer as a memory too.

---

<!-- .slide: id="learning-sgd-memory" -->

## Gradient Descent Writes Like Linear Attention

Train one linear layer $\mathbf y = W\mathbf x$ with gradient descent. Each step has the same shape as a linear-attention write.

$$\text{linear attention:} \quad \mathbf S_t = \mathbf S_{t-1} + \mathbf k_t \textcolor{#50c878}{\mathbf v_t^\top}$$

$$\text{gradient descent:} \quad W_{t+1} = W_t - \eta \textcolor{#50c878}{\nabla_{\mathbf y} L} \mathbf x_t^\top$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Read the second line as a memory write**

- The key is the input $\mathbf x_t$
- The value is the **error signal** at the output
- The weights store which inputs led to which mistakes

</div>

<div>

**What follows**

- Training is the model memorizing its own surprise, one example at a time
- Pretraining and in-context memory are **the same kind of process**
- They differ in how often they update

</div>

</div>

## Deep Optimizers Are Neural Networks

<div class="svg-figure">

- Momentum stores past gradients in one vector, updated by a fixed rule. Deep momentum (DMGD) stores them in a small **neural network**
- Every optimizer step, that network trains on the new gradient with its own loss. The model's weights then move by the network's output
- A classic learned optimizer is trained once and frozen. This one keeps learning while it optimizes, which is the point for continual learning

## Nested Learning Upgrades Optimizer Memory

If momentum is a memory, the upgrades that improved linear attention apply to it too.

<div class="bench-table dense">
<table>
<thead><tr><th>Optimizer memory</th><th>Upgrade</th><th>Linear-attention analogue</th></tr></thead>
<tbody>
<tr><td><strong>Standard momentum</strong></td><td>A fading running sum of gradients</td><td>Linear attention with decay</td></tr>
<tr><td><strong>Adam</strong></td><td>Also stores each gradient's running variance</td><td>A second running sum, used as a normalizer</td></tr>
<tr><td><strong>Delta momentum</strong></td><td>Writes with the delta rule, so it can overwrite stale gradients</td><td>DeltaNet</td></tr>
<tr><td><strong>Deep momentum</strong> (DMGD)</td><td>Replaces the momentum vector with a small MLP</td><td>Test-time training with a nonlinear inner model</td></tr>
<tr><td><strong>M3</strong></td><td>A fast momentum updated every step and a slow one updated every $C$ steps</td><td>Memory at two timescales</td></tr>
</tbody>
</table>
</div>

- A standard transformer has two speeds: attention changes every token, and the MLP weights stop changing at release
- The **continuum memory system** (CMS) replaces the MLP with blocks that each keep updating on their own schedule, including after release
- Fast levels adapt quickly and forget quickly. Slow levels keep knowledge longer
- The paper's analogy is brain waves, from fast gamma (30 to 150 Hz) down to slow delta and theta (0.5 to 8 Hz)

<!-- .slide: id="learning-stakes" -->

## Consequences for Deployment

If this assumption falls, "deploying a model" stops meaning "shipping a frozen artifact."

<div class="bench-table">
<table>
<thead><tr><th>What breaks</th><th>Why</th></tr></thead>
<tbody>
<tr><td><strong>Evaluation</strong></td><td>Evaluate then ship assumes the thing you tested is the thing you serve. A learning model's eval results have an <strong>expiry date</strong></td></tr>
<tr><td><strong>Serving</strong></td><td>Weights are a read-only asset replicated across GPUs. Replicas that keep learning <strong>drift apart</strong>, and now you have a consistency problem</td></tr>
<tr><td><strong>Applications</strong></td><td>Retrieval exists because the model cannot remember. Some of that machinery becomes unnecessary, and some becomes load-bearing in a new way</td></tr>
</tbody>
</table>
</div>

## Agents Now Finish Tasks That Take Hours

METR measures the length of task, in human working time, that an agent completes half the time.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The trend**

- From 2019 to 2025 that length doubled about every **7 months** (Kwa et al., 2025)
- METR's January 2026 update puts the doubling since 2023 at about **4 months**
- Frontier agents now handle tasks that take a person several hours

</div>

<div>

**What it shifts**

- One agent in one context window stops being enough
- The limits become coordination, context management, and human oversight

</div>

</div>

A measurement on software tasks, with wide error bars. Module 9's rules apply: check the task set before extrapolating. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

<!-- .slide: id="agents-when" -->

## When Splitting the Work Helps

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Where splitting helps**

- The parts are independent: search many sources, review many files
- Each subagent's context stays small and on topic
- Wall-clock time drops with the critical path

</div>

<div>

**Where splitting hurts**

- The parts depend on each other's decisions, as in most code edits
- Subagents make conflicting assumptions they never see
- Cognition (2025) argued for one agent with one shared context for this reason

</div>

</div>

Cemri et al. (2025) sorted failures in multi-agent systems into three groups: unclear task specifications, agents misaligned with each other, and weak checking of the final result. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

## Step 1: feature_map()

```python
def feature_map(x: Tensor) -> Tensor:
    """Map queries and keys into a space where every coordinate is positive.

    Softmax attention scores a query against a key with exp(q . k), and the
    exponential guarantees two things: scores are never negative, and one large
    score can dominate all the others. Linear attention throws the exponential
    away, so it needs some other guarantee that scores stay positive. Without
    it, a "weighted average" could have negative weights summing to near zero,
    and the output would explode.

    The standard choice is elu(x) + 1, which is smooth, always positive, and
    close to x + 1 for positive inputs. Note what it does NOT do: it cannot make
    one score dominate the way exp can. That lost sharpness is the price linear
    attention pays, and section b of the lecture is about what it buys back.

    Args:
        x: A tensor of queries or keys, shape (n, d).

    Returns:
        A tensor of the same shape, every entry strictly positive.
    """
    # TODO: Return elu(x) + 1, the positive feature map.
    raise NotImplementedError("TODO: return the positive feature map of x")
```

<div class="fragment hint-box">

**Hint:** `torch.nn.functional` is imported as `F`, and it has an `elu` function. Add 1 to its result.

</div>

<div class="fragment note">

**Answer:**

```python
return F.elu(x) + 1
```

Softmax used `exp` to keep scores positive and to let one key dominate. This keeps them positive and gives up the domination. That lost sharpness is the price.

</div>

---

<!-- .slide: id="exercise-step2" -->

## Step 2: masked_scores()

```python
def masked_scores(q_phi: Tensor, k_phi: Tensor) -> Tensor:
    """Score every query against every key, then delete the future.

    This is the O(n^2) step: an n-by-n matrix where entry (i, j) says how much
    query i cares about key j. It is the same shape as the score matrix in
    Module 3, with one difference that matters enormously later: there is no
    softmax. The entries are raw dot products of positive vectors, so they are
    already positive, and nothing has normalized them yet.

    Causal masking works differently without a softmax. In Module 3 you set
    future entries to -inf so that exp() would send them to zero. Here there is
    no exp, so you delete them by multiplying by zero instead.

    Args:
        q_phi: Feature-mapped queries, shape (n, d).
        k_phi: Feature-mapped keys, shape (n, d).

    Returns:
        The causally masked score matrix, shape (n, n), with zeros above the
        diagonal.
    """
    # The causal mask: entry (i, j) is 1.0 when j <= i (past and present) and
    # 0.0 when j > i (the future). torch.tril keeps the lower triangle.
    n = q_phi.shape[-2]
    mask = torch.tril(torch.ones(n, n, dtype=q_phi.dtype, device=q_phi.device))
    # TODO: Return the masked scores: multiply q_phi by the transpose of k_phi
    #       to get every query-key pair, then multiply elementwise by `mask` to
    #       zero out the future.
    raise NotImplementedError("TODO: return the causally masked score matrix")
```

<div class="fragment hint-box">

**Hint:** `@` does matrix multiplication, `.transpose(-2, -1)` swaps the last two dimensions, and `*` multiplies elementwise.

</div>

<div class="fragment note">

**Answer:**

```python
return (q_phi @ k_phi.transpose(-2, -1)) * mask
```

Note how the masking changed. Softmax attention sets future entries to $-\infty$ so `exp` sends them to zero. With no `exp`, you multiply by zero instead.

</div>

<!-- .slide: id="exercise-step3" -->

## Step 3: parallel_linear_attention()

```python
def parallel_linear_attention(Q: Tensor, K: Tensor, V: Tensor) -> Tensor:
    """Compute linear attention the quadratic way, all positions at once.

    With the scores in hand this is the same weighted average of values that
    Module 3 computed. The only wrinkle is normalization: softmax normalized
    the weights for you, and here you have to do it by hand. Each row of the
    score matrix must sum to 1 before it multiplies the values, or long rows
    (later positions, which attend to more of the past) would produce larger
    outputs than short ones purely because they have more terms.

    Args:
        Q: Queries, shape (n, d).
        K: Keys, shape (n, d).
        V: Values, shape (n, d_v).

    Returns:
        The attention output, shape (n, d_v).
    """
    # Feature-map the queries and keys (step 1), then score them (step 2).
    q_phi = feature_map(Q)
    k_phi = feature_map(K)
    scores = masked_scores(q_phi, k_phi)
    # Each row's total weight. keepdim=True leaves it shaped (n, 1) so that it
    # broadcasts cleanly across the value dimension when we divide.

```python
def update_state(S: Tensor, z: Tensor, k_t_phi: Tensor, v_t: Tensor):
    """Absorb one token into the running state.

    This is the whole trick. Instead of storing every past key and value the
    way a KV cache does (Module 10), keep one matrix S that accumulates the

    keys. Both have a fixed size that does not depend on how many tokens have
    gone by, so a million-token conversation costs exactly as much memory as a

## Step 7: time_forward()

```python
def time_forward(fn, repeats: int = 3) -> float:
    """Time one forward pass, in milliseconds.

    Complexity claims are theory until you measure them. The runner calls this
    on each attention implementation at a range of sequence lengths, and the
    resulting curves are the point of the whole exercise: one bends upward on a
    log-log plot and one does not.

    Two details make the measurement honest. The warm-up call absorbs one-time
    costs like memory allocation, and taking the minimum of several runs rather
    than the mean reports the cleanest run instead of the noisiest, since
    background processes can only ever slow a run down.

    Args:
        fn: A zero-argument callable that runs one forward pass.
        repeats: How many timed runs to take.

    Returns:
        The fastest run, in milliseconds.
    """
    # Warm-up run, not timed: pays one-time allocation costs up front.
    fn()
    timings: list[float] = []
    for _ in range(repeats):
        start = time.perf_counter()
        fn()
        # TODO: Append this run's elapsed time in milliseconds to `timings`.
        raise NotImplementedError("TODO: record this run's elapsed time")
    return min(timings)
```

```

## What the Crossover Means

The recurrent form is **eight times slower** than the parallel linear form at 512 tokens and **faster** at 8192. Both facts matter.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Why it starts slow**

- A Python loop with huge per-step overhead
- Big-O says nothing about constants, and these constants are terrible

<div>

**Why it wins anyway**

- It never builds the $n \times n$ matrix
- The exponent eventually beats the constant, at a context length people actually use

</div>

The recurrent form gave up exact recall of earlier tokens. That tradeoff is why production models hybridize instead of choosing. <!-- .element: class="text-lg" style="margin-top: 12px;" -->
