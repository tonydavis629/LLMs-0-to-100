<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMs 0 to 100</title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <!-- KaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>

  <!-- Module-specific <head> includes (e.g. Chart.js); empty for most modules -->
  

  <!-- Shared styles + per-module overrides, inlined by the build -->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

/* ===========================================
   CSS VARIABLES
   =========================================== */
:root {
  --background-color: #0a0e1a;
  --section-divider-bg: #0d1225;

  --heading-font: "Space Grotesk", Helvetica, sans-serif;
  --body-font: "Inter", Helvetica, sans-serif;
  --base-font-size: 32px;
  --text-size: 16pt;
  --h1-size: 48pt;
  --h2-size: 36pt;
  --h3-size: 24pt;
  --footnote-size: 11pt;

  --primary-color: #4a9eff;
  --secondary-color: #f5a623;
  --text-color: #e8eaf0;
  --muted-color: #8892a4;
  --line-color: #2a3450;

  --slide-padding: 60px;
  --slide-padding-top: 24px;
  --content-gap: 18px;

  --box-radius: 8px;
}

/* ===========================================
   BASE STYLES
   =========================================== */

.reveal {
  font-family: var(--body-font);
  font-size: var(--base-font-size);
}

.reveal strong,
.reveal b {
  font-weight: bold;
}

.reveal a {
  color: var(--primary-color);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.reveal a:hover {
  color: var(--text-color);
}

.reveal-viewport {
  background-color: var(--background-color);
}

.reveal-viewport.is-section-divider .slide-background.present {
  background-color: var(--section-divider-bg) !important;
}

.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4,
.reveal h5,
.reveal h6 {
  font-family: var(--heading-font);
  text-transform: none;
  color: var(--text-color);
  font-weight: 600;
  line-height: 1.2;
}

.reveal h1 { font-size: var(--h1-size); }
.reveal h2 { font-size: var(--h2-size); margin-bottom: 0; }
.reveal h3 { font-size: var(--h3-size); }

.reveal p,
.reveal li,
.reveal td,
.reveal th,
.reveal blockquote {
  font-size: var(--text-size);
  color: var(--text-color);
  line-height: 1.5;
}

/* Vertical separation between newline-separated sentences on text slides.
   Scoped to a slide's top-level paragraphs (the prose flow); paragraphs
   nested inside components (terminal captions, figure cards, grid columns)
   keep their own tighter spacing so dense component slides do not overflow.
   Adjacent margins collapse, so the gap between two paragraphs is 0.9em. */
.reveal .slides section > p {
  margin: 0.4em 0 0.9em 0;
}

/* ===========================================
   LISTS
   =========================================== */

.reveal ul {
  list-style: none;
  padding-left: 0;
  margin: 15px 0;
}

.reveal ul li {
  position: relative;
  padding-left: 25px;
  margin-bottom: 10px;
}

.reveal ul li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.6em;
  width: 8px;
  height: 8px;
  background: var(--primary-color);
  border-radius: 50%;
}

.reveal ul ul li::before {
  background: var(--muted-color);
  width: 6px;
  height: 6px;
}

.reveal blockquote p {
  font-size: inherit;
}

/* ===========================================
   SLIDE LAYOUT
   =========================================== */

.reveal .slides section {
  height: 100%;
  display: flex !important;
  flex-direction: column !important;
  padding: var(--slide-padding-top) var(--slide-padding) var(--slide-padding) var(--slide-padding) !important;
  box-sizing: border-box;
  text-align: left;
  /* Any slide whose content runs past the bottom scrolls instead of clipping.
     The scrollbar only appears when needed. */
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: #30363d transparent;
}

.reveal .slides section::-webkit-scrollbar {
  width: 8px;
}

.reveal .slides section::-webkit-scrollbar-thumb {
  background: #30363d;
  border-radius: 4px;
}

.reveal .slides section.stack {
  padding: 0 !important;
}

.reveal .slides section > .content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: var(--content-gap);
  text-align: left;
}

.reveal .slides section > .footnote {
  position: absolute;
  bottom: 15px;
  left: var(--slide-padding);
  right: var(--slide-padding);
  font-size: var(--footnote-size);
  color: var(--muted-color);
}

/* ===========================================
   SECTION DIVIDERS
   =========================================== */

.reveal .slides section.section-divider {
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}

.reveal .slides section.section-divider h1 {
  font-size: 56pt;
  text-align: center;
  color: var(--primary-color);
}

.reveal .slides section.section-divider p {
  font-size: 20pt;
  color: var(--muted-color);
}

/* ===========================================
   TEXT SIZE UTILITIES
   =========================================== */

.text-lg { font-size: 18pt !important; }
.text-xl { font-size: 20pt !important; }
.text-2xl { font-size: 24pt !important; }
.text-3xl { font-size: 28pt !important; }
.text-4xl { font-size: 32pt !important; }

.text-muted { color: var(--muted-color) !important; }
.text-center { text-align: center !important; }
.text-uppercase { text-transform: uppercase; letter-spacing: 0.1em; }
.font-light { font-weight: 300; }
.font-bold { font-weight: 600; }

/* ===========================================
   BLOCKQUOTES
   =========================================== */

.reveal blockquote {
  border-left: 4px solid var(--primary-color);
  padding-left: 20px;
  margin: 20px 0;
  font-style: italic;
  background: none;
  box-shadow: none;
  width: 100%;
  max-width: none;
}

.reveal blockquote cite {
  display: block;
  margin-top: 10px;
  font-style: normal;
  color: var(--muted-color);
}

/* ===========================================
   ACCENT UNDERLINE ON TITLES
   =========================================== */

.reveal .slides section > h2 {
  flex-shrink: 0;
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line-color);
}

/* ===========================================
   FIGURE CARD - for notable figures slides
   =========================================== */

.figure-card {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  align-items: start;
}

.figure-card img {
  border-radius: var(--box-radius);
  width: 100%;
  box-shadow: 0 4px 20px rgba(74, 158, 255, 0.15);
}

.figure-card .figure-info h3 {
  margin: 0 0 5px 0;
  color: var(--secondary-color);
  font-size: 14pt;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ===========================================
   ERA BADGE - for timeline labels
   =========================================== */

.era-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12pt;
  font-weight: 500;
}

.era-badge.summer {
  background: rgba(245, 166, 35, 0.2);
  color: var(--secondary-color);
}

.era-badge.winter {
  background: rgba(74, 158, 255, 0.15);
  color: #6cb4ff;
}

.era-badge.spring {
  background: rgba(80, 200, 120, 0.2);
  color: #50c878;
}

/* ===========================================
   HIGHLIGHT BOX
   =========================================== */

.highlight-box {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
}

/* Exercise hint: a single fragment that reveals the whole hint at once.
   The wrapping .fragment div is what animates; this just sizes the text
   (matching the old text-lg intent) and removes the global paragraph
   margin so the one-line hint is not double-spaced. */
.reveal .hint-box p {
  font-size: 18pt;
  margin: 0;
}

/* ===========================================
   COURSE STRUCTURE
   =========================================== */

.course-summary {
  max-width: 1120px;
  margin: 0 0 16px 0;
  color: #f0f4fb;
  font-size: 18pt !important;
  line-height: 1.4 !important;
}

.course-track-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

.module-track-card {
  background: rgba(74, 158, 255, 0.07);
  border: 1px solid rgba(74, 158, 255, 0.22);
  border-radius: var(--box-radius);
  padding: 20px 22px;
}

.module-track-kicker {
  font-size: 12pt;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--secondary-color);
  margin-bottom: 8px;
}

.module-track-card h3 {
  margin: 0 0 8px 0;
}

.module-track-intro {
  font-size: 14pt !important;
  color: #d7ddea !important;
  margin: 0 0 10px 0;
  line-height: 1.4 !important;
}

.compact-list {
  margin: 0;
}

.reveal ul.compact-list li {
  font-size: 16pt;
  line-height: 1.35;
  margin-bottom: 7px;
  padding-left: 20px;
}

.course-note {
  margin-top: 14px;
  color: #d7ddea;
  font-size: 15pt !important;
  line-height: 1.35 !important;
}

.course-glossary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  margin-top: 14px;
}

.glossary-item {
  background: rgba(245, 166, 35, 0.08);
  border: 1px solid rgba(245, 166, 35, 0.18);
  border-radius: var(--box-radius);
  padding: 12px 14px;
}

.glossary-item strong {
  color: var(--secondary-color);
}

.glossary-item p {
  font-size: 13pt !important;
  color: #d7ddea !important;
  margin: 6px 0 0 0;
  line-height: 1.4;
}

/* ===========================================
   TERMINAL OUTPUT
   =========================================== */

.terminal-output {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 0;
  max-width: 800px;
  margin: 0 auto;
  text-align: left;
}

.terminal-output .terminal-bar {
  background: #161b22;
  border-radius: 8px 8px 0 0;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.terminal-output .terminal-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.terminal-output .terminal-dot.red { background: #ff5f57; }
.terminal-output .terminal-dot.yellow { background: #febc2e; }
.terminal-output .terminal-dot.green { background: #28c840; }

.terminal-output .terminal-title {
  color: #8b949e;
  font-family: monospace;
  font-size: 10pt;
  margin-left: 8px;
}

.terminal-output .terminal-body {
  padding: 15px 20px;
}

.terminal-output .terminal-body pre {
  margin: 0;
  background: none !important;
  box-shadow: none !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output.dense .terminal-body {
  padding: 10px 20px;
}

.reveal .terminal-output.dense .terminal-body pre.terminal-pre {
  font-size: 9pt;
  line-height: 1.28;
}

.reveal .terminal-output .terminal-body pre.terminal-pre span {
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre p {
  display: inline;
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
  margin: 0 !important;
  color: inherit;
}

.reveal .terminal-output .terminal-body pre code {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output .terminal-body .prompt {
  color: #8b949e;
}

.terminal-output .terminal-body .success {
  color: #3fb950;
}

.terminal-output .terminal-body .header {
  font-weight: bold;
}

.terminal-output .terminal-body .skipped {
  color: #8b949e;
  font-style: italic;
}

/* ===========================================
   TURNING POINT SLIDE
   =========================================== */

.turning-point h2 {
  border-bottom-color: var(--secondary-color) !important;
}

/* ===========================================
   CODE BLOCKS
   =========================================== */

.reveal pre {
  margin-bottom: 0;
  width: 100%;
  box-sizing: border-box;
  box-shadow: none !important;
  background: none !important;
}

.reveal pre code {
  font-size: 14pt;
  line-height: 1.4;
  padding: 10px 20px;
  border-radius: var(--box-radius);
  background: rgba(20, 25, 45, 0.8);
  color: var(--text-color);
  max-height: 400px;
}

.reveal pre code .hljs-keyword,
.reveal pre code .hljs-built_in {
  color: #c792ea;
}

.reveal pre code .hljs-string {
  color: #c3e88d;
}

.reveal pre code .hljs-comment {
  color: #546e7a;
}

.reveal pre code .hljs-number {
  color: #f78c6c;
}

.reveal code {
  color: var(--text-color);
}

/* ===========================================
   MATH (KaTeX)
   =========================================== */

.katex {
  color: var(--text-color);
  font-size: 1.1em;
}

.katex-display {
  margin: 15px 0;
}

.katex-display > .katex {
  font-size: 1.3em;
}

/* ===========================================
   VIDEO CONTAINERS
   =========================================== */

.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-container video,
.video-container img {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--box-radius);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
}

/* ===========================================
   SIDE QUEST BADGE
   =========================================== */

.side-quest-badge {
  display: inline-block;
  background: rgba(245, 166, 35, 0.15);
  color: var(--secondary-color);
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12pt;
  font-weight: 500;
  margin-bottom: 10px;
}

/* ===========================================
   TERMINAL OUTPUT - ANSI COLOR PALETTE
   Replaces inline `style="color:#..."` on spans
   inside .terminal-pre. A rule on the span itself
   overrides the color inherited from .terminal-pre.
   =========================================== */

.terminal-output .terminal-body .t-red    { color: #e06c75; }
.terminal-output .terminal-body .t-orange { color: #d19a66; }
.terminal-output .terminal-body .t-yellow { color: #e5c07b; }
.terminal-output .terminal-body .t-green  { color: #98c379; }
.terminal-output .terminal-body .t-cyan   { color: #56b6c2; }
.terminal-output .terminal-body .t-blue   { color: #61afef; }
.terminal-output .terminal-body .t-gray   { color: #8b949e; }
.terminal-output .terminal-body .t-fg     { color: #e8eaf0; }
.terminal-output .terminal-body .t-fail   { color: #e74c3c; }

.terminal-caption {
  margin-top: 15px;
  text-align: center;
}

/* ===========================================
   TIMELINE (module 1) - per-node structure
   Positional left/width and per-era colors stay
   inline; this captures the repeated boilerplate.
   =========================================== */

.tl-node  { position: absolute; transform: translateX(-50%); text-align: center; }
/* .reveal prefix needed: `.reveal p` (0,1,1) sets color/font-size and would
   otherwise beat a bare .tl-* class. The original used inline styles. */
.reveal .tl-label { font-size: 10pt; color: var(--muted-color); white-space: nowrap; margin: 0; }
.reveal .tl-year  { font-size: 11pt; font-weight: 600; margin: 2px 0 0 0; }
.tl-stem  { width: 1px; opacity: 0.5; margin: 2px auto 0; }
.tl-dot   { width: 10px; height: 10px; border-radius: 50%; margin: 0 auto; }

.tl-node.below .tl-stem  { margin: 0 auto; }
.tl-node.below .tl-year  { margin: 0; }
.tl-node.below .tl-label { margin: 2px 0 0 0; }

/* ===========================================
   CANONICAL SLIDE TYPES
   Backs the :::divider / :::columns / :::note /
   :::quiz / :::step / :::interactive fences so
   slides.md carries no inline layout styles.
   (.section-divider, .figure-card, .terminal-output,
    .hint-box are defined above and reused.)
   =========================================== */

/* :::columns - grid; template/gap/valign supplied by the build */
.reveal .slide-columns {
  display: grid;
  align-items: start;
  margin: 10px 0;
}

/* :::note - callout box (canonical replacement for .highlight-box) */
.reveal .note {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
  margin: 20px 0;
}

.reveal .note p {
  font-size: 18pt;
  margin: 0;
}

.reveal .note p + p {
  margin-top: 0.6em;
}

/* :::note variant="hint" - lighter, boxless (also used inside :::step) */
.reveal .note.hint-box {
  background: none;
  border: none;
  padding: 0;
}

/* :::quiz - prompt scales up; its last line is the question */
.reveal .quiz-prompt p {
  font-size: 18pt;
  margin: 0 0 0.6em 0;
}

.reveal .quiz-prompt p:last-child {
  font-size: 24pt;
  color: var(--text-color);
  margin: 0.5em 0 0 0;
}

.reveal .quiz-answer {
  margin-top: 30px;
}

/* :::step - spacing between code, hint, and answer */
.reveal .hint-box {
  margin-top: 22px;
}

.reveal .hint-box + .note {
  margin-top: 8px;
  padding: 12px 18px;
}

/* :::interactive - widget fills the slide body like a video */
.reveal .interactive-host {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

/* ===========================================
   SHARED INTERACTIVE WIDGET CHROME (.iw-*)
   Used by the :::interactive widgets defined in each module's config.js.
   Module 3 predates this and keeps its own .m3-* chrome.
   =========================================== */

.iw {
  display: flex;
  flex-direction: column;
  justify-content: center;   /* only bites when the content does not fill the slide */
  gap: 12px;
  width: 100%;
  height: 100%;
}

.iw-canvas-wrap {
  flex: 1;
  min-height: 0;
  width: 100%;
}

.iw-canvas {
  width: 100%;
  height: 100%;
  min-height: 0;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.iw-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.iw-btn {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: rgba(74, 158, 255, 0.10);
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 6px;
  padding: 7px 16px;
  cursor: pointer;
}

.iw-btn:hover {
  background: rgba(74, 158, 255, 0.22);
}

.iw-btn.iw-primary,
.iw-btn.active {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: #0a0e1a;
  font-weight: 600;
}

.iw-btn.iw-reset {
  background: rgba(245, 166, 35, 0.12);
  border-color: rgba(245, 166, 35, 0.40);
  color: var(--secondary-color);
}

.iw-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.iw-label {
  font-size: 12pt;
  color: var(--muted-color);
  margin: 0 2px 0 10px;
}

.reveal .iw-readout {
  font-size: 13pt;
  color: var(--muted-color);
  text-align: center;
  margin: 0;
  min-height: 1.4em;
}

.reveal .iw-readout strong {
  color: var(--secondary-color);
}

.iw-sliders {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 4px 18px;
  width: 100%;
  max-width: 100%;
  margin: 0 auto;
}

.iw-slider {
  display: grid;
  grid-template-columns: minmax(72px, auto) 1fr 58px;
  align-items: center;
  gap: 9px;
}

.reveal .iw-slider label {
  font-size: 11.5pt;
  color: var(--primary-color);
  font-weight: 600;
  margin: 0;
}

.iw-slider input[type="range"] {
  width: 100%;
  accent-color: var(--primary-color);
}

.reveal .iw-slider .iw-val {
  font-size: 11.5pt;
  color: var(--text-color);
  font-family: monospace;
  text-align: right;
  margin: 0;
}

.iw-text-input {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: 6px;
  padding: 7px 12px;
  width: 100%;
  max-width: 620px;
}

/* DOM-based widget pieces: token chips, panels, and two-column bodies. */

.iw-body {
  flex: 1;

# LLMs 0 to 100

Module 3: Attention Mechanisms


---

<!-- .slide: id="review-1" -->

## Review: Module 2

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**The MLP**

Repeated linear transformations with nonlinearities between them:

$$\mathbf{h} = \sigma(W\mathbf{x} + \mathbf{b})$$

With enough hidden units, an MLP can approximate any continuous function (universal approximation theorem).

</div>

<div>

**Limitations for Sequences**

- Fixed context window: token 1 cannot inform token 50
- A pattern learned at one position does not transfer to another
- Parameter count grows with context length
- No way for one token to select information from another

</div>

</div>

---

<!-- .slide: id="review-2" -->

## Review: Why the Architecture Matters

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**From Module 2**

- A single neuron cannot solve XOR: no linear boundary separates the classes
- The fix was architectural: a hidden layer with a nonlinearity

</div>

<div>

**Same Principle, Bigger Scale**

Language structure an MLP does not match:

- Any token can depend on any earlier token
- The same pattern ("the ___") appears at every position
- Relevant context length varies per token

**The architecture must match the structure of the data.**

</div>

</div>

# Why Attention?

From fixed windows to selective retrieval

- read a **fixed window** of recent tokens
- flatten them into one vector
- map that to a distribution over the vocabulary

<!-- .slide: id="mlp-two-failures" -->

## Two Things the MLP Cannot Do

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**Rigid positionality**

- Each slot has its own weights
- "the" in slot 1 and "the" in slot 4 use different parameters
- Anything learned at one position must be relearned at every other

</div>

<div>

**No selective retrieval**

- To predict "mat", the useful context is "sat" and "cat"
- The MLP treats every slot equally
- No mechanism for one token to pull information from another

</div>

</div>

<div class="note">

Language needs variable-length context, weight sharing across positions, and selective retrieval. A fixed-window MLP provides none of these.

</div>

- Any input length must fit through one fixed-size bottleneck
- The model decides what to keep before it knows what it will need
- Early tokens fade as the state is overwritten

## Bahdanau, Cho &amp; Bengio <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Made Attention a Central Mechanism

- Dzmitry Bahdanau, Kyunghyun Cho, and Yoshua Bengio (2014)
- "Neural Machine Translation by Jointly Learning to Align and Translate"
- Their translation model learned to **align** each output word to the most relevant input words
- Instead of one compressed vector, the decoder could look back at every input representation directly
- Attention began as a fix for the fixed-size bottleneck, then became a first-class mechanism

</div>

<!-- .slide: id="attention-concept-viz" -->

## What Attention Does

Every word builds its output by **pulling information from the other words**. Click a word to see what it attends to. Thicker arrow = more of that word's value flows in.

<div class="interactive-host" data-widget="attentionArrows"></div>

<div class="note">

Attention does not pick one token. Each token takes a weighted average over all the others; training decides which weights grow large.

</div>

# Softmax

Turning scores into probabilities


---

<!-- .slide: id="softmax-purpose" -->

## From Logits to a Distribution

Softmax turns a vector of raw scores (**logits**) into a probability distribution:

$$\text{softmax}(z)_i = \frac{e^{z_i}}{\sum_j e^{z_j}}$$

  </g>

    <rect x="355" y="148" width="24" height="24" rx="4" fill="rgba(245,166,35,0.20)"/><text x="398" y="165" fill="#e8eaf0">1.00</text>
    <text x="568" y="117" fill="#8892a4" font-size="24">&rarr;</text>
    <rect x="620" y="48" width="120" height="24" rx="4" fill="rgba(74,158,255,0.72)"/><text x="759" y="65" fill="#e8eaf0">0.67</text>

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 40px;">

<div>

**What is a logit?**

- the unnormalized score for one option
- any real number, positive or negative
- meaningful only *relative* to the other logits

</div>

<div>

**Why $e^{z}$?**

- makes every score positive
- widens gaps while preserving the ranking
- smooth and differentiable, so gradients flow
- dividing by the sum forces a total of 1

</div>

</div>

---

<!-- .slide: id="softmax-temperature" -->

## Temperature

Same formula, with every logit divided by a **temperature** $T$ first. $T$ controls how peaked the distribution is, and $T = 1$ gives back plain softmax:

$$\text{softmax}(z / T)_i = \frac{e^{z_i / T}}{\sum_j e^{z_j / T}}$$

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 20px;">

<div>

**$T < 1$**

Sharper. Commits to the top choice. More deterministic text.

</div>

<div>

**$T = 1$**

The distribution as the model produced it.

</div>

<div>

**$T > 1$**

Flatter. Mass spreads to other tokens. More varied, riskier text.

</div>

</div>

<div class="note">

Attention uses the same idea: dividing $QK^T$ by $\sqrt{d_k}$ is a fixed temperature that keeps softmax from saturating as dimension grows.

</div>

<!-- .slide: id="divider-scaled-dot-product" class="section-divider" data-state="is-section-divider" -->

# Scaled Dot-Product Attention

The compare-and-retrieve layer, with scaling and softmax added


---

<!-- .slide: id="scaled-softmax" -->

## From Scores to the Attention Map

$QK^T$ holds the raw scores. Divide by $\sqrt{d_k}$, then apply softmax to each row:

$$A = \text{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right)$$

- $QK^T$ is the $n \times n$ grid of scores from before: row $i$ compares token $i$'s query with every key
- The only new ingredient is the $\sqrt{d_k}$ divisor, a fixed temperature
- Softmax runs on each row separately, so every row of $A$ sums to 1
- $A$ is the **attention map**

---

<!-- .slide: id="scaling-problem" -->

## Why Scale by $\sqrt{d_k}$?

Dot products grow with dimension. For $d_k = 64$, the expected magnitude of $\mathbf{q} \cdot \mathbf{k}$ is about 8; for $d_k = 1024$, it is about 32.
<div style="text-align: center; margin: 8px 0;">
<svg viewBox="0 0 820 250" width="100%" style="max-height: 230px;">
  <text x="235" y="22" fill="#f5a623" font-size="13" text-anchor="middle" font-weight="600">without scaling: large logits saturate softmax</text>

Large softmax inputs produce a **sharply peaked** output: one entry near 1, the rest near 0. Tiny gradients follow, and training destabilizes.

<div class="note">

Dividing by $\sqrt{d_k}$ keeps the dot-product variance roughly constant at any dimension. Gradients keep flowing.

</div>

## The Complete Formula

**Scaled dot-product attention** (dot-product scores, divided by $\sqrt{d_k}$), for every token at once:

$$\text{Attention}(Q, K, V) = \text{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right) V$$

## Attention Is Not Just for Text

The same mechanism works on any sequence. In a vision-language model, each text token attends to **regions of an image**. Bright areas show where attention concentrates.

<!-- .slide: id="why-causal" -->

## Why Causal Masking?

In a language model, we predict the next token given all previous tokens:

$$P(w_t \mid w_1, w_2, \ldots, w_{t-1})$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**During training**

One sequence of length $n$ gives many supervised examples:

$$w_1 \rightarrow w_2,\quad w_1,w_2 \rightarrow w_3,\quad \ldots$$

- all positions train in parallel
- the mask keeps each prediction from seeing its own answer

</div>

<div>

**During inference**

- future tokens do not exist
- predict one token, append it, feed the longer sequence back in

</div>

</div>

<div class="note">

Causal masking makes training match generation: only itself and earlier tokens, never a future answer.

</div>

<!-- .slide: id="multi-head-mechanics" -->

## Multi-Head Mechanics

Each head $h$ has its own projections and runs attention independently:

$$\text{head}_h = \text{Attention}(XW_Q^h, XW_K^h, XW_V^h)$$

Concatenate the heads, then project through $W_O$:

$$\text{MultiHead}(X) = \text{Concat}(\text{head}_1, \ldots, \text{head}_H) W_O$$

<div class="note">

**Compute budget:** total projection size stays $d_{\text{model}}$. With 8 heads and $d_{\text{model}} = 512$, each head uses $d_k = 64$. Same compute as single-head, split into independent patterns.

</div>

<!-- .slide: id="cross-vs-self" -->

## Cross Attention vs. Self-Attention

<div style="text-align: center; margin: 6px 0;">

<!-- .slide: id="divider-positional" class="section-divider" data-state="is-section-divider" -->

# Positional Embeddings

Teaching the model that order matters


---

<!-- .slide: id="permutation-equivariance" -->

## Attention Ignores Order

- Attention compares every token to every other token
- The comparison ignores **where** tokens sit
- Shuffle the inputs, and the outputs come back in the same shuffle: **permutation equivariant**

<div class="note">

**Problem:** "dog bites man" and "man bites dog" are the same bag of tokens. Without position information, attention treats them identically.

</div>

---

<!-- .slide: id="permutation-demo" -->

<section id="perm-shuffle">
  <h2>Same Tokens, Reordered: Same Attention</h2>
  <div class="interactive-host" data-widget="permutationShuffle"></div>
</section>

---

<!-- .slide: id="adding-position" -->

## The Fix: Add a Position Signal

Give each position its own signature and **add it to the token embedding** before attention runs:

$$X_{\text{pos}} = X + P$$

<div style="text-align: center; margin: 8px 0;">
<svg viewBox="0 0 720 130" width="100%" style="max-height: 120px;">
  <g font-size="12" text-anchor="middle" font-weight="600">
    <rect x="40" y="40" width="120" height="40" rx="5" fill="#0d1225" stroke="#4a9eff" stroke-width="1.5"/><text x="100" y="65" fill="#e8eaf0">token embedding</text>
    <text x="100" y="100" fill="#8892a4" font-size="11" font-weight="400">what the word is</text>
    <text x="195" y="65" fill="#e8eaf0" font-size="22">+</text>
    <rect x="230" y="40" width="120" height="40" rx="5" fill="#0d1225" stroke="#f5a623" stroke-width="1.5"/><text x="290" y="65" fill="#e8eaf0">position signal</text>
    <text x="290" y="100" fill="#8892a4" font-size="11" font-weight="400">where it sits</text>
    <text x="385" y="65" fill="#e8eaf0" font-size="22">=</text>
    <rect x="420" y="40" width="150" height="40" rx="5" fill="#0d1225" stroke="#3fb950" stroke-width="1.5"/><text x="495" y="65" fill="#e8eaf0">position-aware input</text>
  </g>
</svg>
</div>

Identical words at different positions now arrive as **different vectors**. Remaining question: what should $P$ look like?

---

<!-- .slide: id="sinusoidal" -->

## Sinusoidal Positional Encodings

A fixed pattern: each dimension of $P$ is a sine or cosine wave with its own frequency.

$$PE_{(pos, 2i)} = \sin\left(\frac{pos}{10000^{2i/d}}\right) \qquad PE_{(pos, 2i+1)} = \cos\left(\frac{pos}{10000^{2i/d}}\right)$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**Low dimensions:** high frequencies. Flip quickly from token to token. Encode fine position.

</div>

<div>

**High dimensions:** low frequencies. Change slowly. Encode coarse position over long spans.

</div>

</div>

No learned parameters. The pattern extends to lengths never seen in training.

---

<section id="pe-explorer">

  <div class="interactive-host" data-widget="positionalEncoding"></div>
</section>

<!-- .slide: id="learned-and-other" -->

## Learned and Relative Schemes

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**Learned positional embeddings**

A trainable table, one vector per position:

$$X_{\text{pos}} = X + P, \quad P \in \mathbb{R}^{L \times d}$$

- simple and effective
- limited to the maximum training length
- used in BERT and GPT-2

</div>

<div>

**Relative and bias-based schemes**

Often the **distance** between tokens matters, not the absolute index.

- **Relative position** encodings inject a term that depends on $m - n$
- **ALiBi** adds a distance penalty to the attention scores
- Both extrapolate to longer contexts more gracefully

</div>

</div>

---

<!-- .slide: id="rope" -->

## RoPE: Position as Rotation

**RoPE** (Rotary Position Embedding, Su et al. 2021):

- **rotate** each query and key by an angle proportional to its position
- the dot product between positions $m$ and $n$ then depends only on the **offset** $m - n$

<div style="text-align: center; margin: 6px 0;">
<svg viewBox="0 0 720 230" width="100%" style="max-height: 220px;">

# Memory and Compute

The cost of every token seeing every other token


---

<!-- .slide: id="n-squared-cost" -->

## The $O(n^2)$ Cost

Every token attends to every other token, so the attention map holds one weight per pair: $n \times n$ for a sequence of $n$ tokens. That matrix is the bottleneck.
<div style="text-align: center; margin: 4px 0;">
<svg viewBox="0 0 720 250" width="100%" style="max-height: 240px;">

  <text x="36" y="135" fill="#8892a4" font-size="12" text-anchor="middle" transform="rotate(-90 36 135)">n tokens attending</text>
  <g>
    <rect x="60" y="36" width="200" height="200" fill="rgba(74,158,255,0.18)" stroke="#4a9eff" stroke-width="1.5"/>
    <!-- grid lines -->

    </g>
    <text x="160" y="140" fill="#e8eaf0" font-size="16" text-anchor="middle" font-weight="600">n&#178; entries</text>
  </g>
  <!-- text panel -->
  <text x="320" y="70" fill="#e8eaf0" font-size="14">Compute: O(n&#178; &middot; d_k)</text>
  <text x="320" y="100" fill="#e8eaf0" font-size="14">Memory: O(n&#178;), whatever d_k is</text>
  <text x="320" y="140" fill="#f5a623" font-size="14">Double the context, and the</text>
  <text x="320" y="162" fill="#f5a623" font-size="14">attention cost quadruples.</text>

<div class="figure-card">

![Tri Dao](module_03_attention/images/dao.jpg)

<div class="figure-info">

## Tri Dao <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Made Exact Attention Fast

- Tri Dao and collaborators (2022): FlashAttention
- Observed that materializing the full $n \times n$ matrix in slow GPU memory (HBM) is the real bottleneck
- FlashAttention computes **exact** attention without ever writing the full matrix to HBM
- IO-aware: it tiles the computation to keep intermediate results in fast on-chip SRAM
- Identical result to standard attention, but 2-4x faster and 5-20x less memory
- FlashAttention-2 and -3 pushed further on newer GPUs

</div>

</div>

</div>

---

<!-- .slide: id="flash-attention-explained" -->

## FlashAttention: Same Math, Less Memory Traffic

Standard attention writes the full $n \times n$ matrix to GPU memory, then reads it back to multiply by $V$. FlashAttention skips that round trip.

<!-- .slide: id="mitigations" -->

## Modern Mitigations

Ways to cut the $O(n^2)$ cost:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**FlashAttention**

Exact attention, no materialized matrix. Same result, less memory traffic.

</div>

<div>

**Sliding-window attention**

Each token attends to a local window (plus a few global tokens). Reduces the effective $n$.

</div>

<div>

**Multi-query attention (MQA)**

All heads share one K and V projection. Only Q is per-head. Shrinks the KV cache.

</div>

<div>

**Grouped-query attention (GQA)**

Groups of heads share K and V. Used in LLaMA 2/3.

</div>

</div>

<!-- .slide: id="divider-kv-cache" class="section-divider" data-state="is-section-divider" -->

# KV Cache

Reusing work during generation


---

<!-- .slide: id="kv-cache-idea" -->

## The KV Cache

During autoregressive inference:

- each new token attends to **every** token before it
- the naive approach re-projects all previous keys and values at every step
- but past keys and values never change

So compute them once and **store** them.

---

<!-- .slide: id="kv-cache-demo" -->

<section id="kv-cache-viz">
  <h2>Recompute Every Step, or Cache and Reuse</h2>
  <div class="interactive-host" data-widget="kvCache"></div>
</section>

---

<!-- .slide: id="kv-cache-tradeoffs" -->

## KV Cache Tradeoffs

A classic memory-vs-compute tradeoff:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**Speed win**

- $O(1)$ projection work per step instead of $O(n)$
- total generation cost drops from $O(n^2)$ to $O(n)$

</div>

<div>

**Memory cost**

- stores $2 \times n_{\text{layers}} \times n_{\text{heads}} \times n_{\text{tokens}} \times d_k$ floats
- a 70B model at 128K context: tens of gigabytes

</div>

</div>

<div class="note">

**KV cache memory limits** long context and large-batch serving. MQA and GQA exist to shrink it.

</div>

---

<!-- .slide: id="attention-sinks" -->

## Attention Sinks

In a trained language model, a large share of every head's attention lands on the **very first token**, even a contentless start marker.

<div style="text-align: center; margin: 6px 0;">
<svg viewBox="0 0 660 130" width="100%" style="max-height: 120px;">
  <text x="30" y="20" fill="#8892a4" font-size="12">attention from a token late in the sequence:</text>
  <g text-anchor="middle" font-size="11">
    <rect x="40" y="30" width="60" height="70" rx="3" fill="rgba(245,166,35,0.55)"/><text x="70" y="115" fill="#e8eaf0">tok 1</text><text x="70" y="70" fill="#e8eaf0" font-weight="600">0.62</text>
    <rect x="110" y="86" width="60" height="14" rx="3" fill="rgba(74,158,255,0.45)"/><text x="140" y="115" fill="#8892a4">tok 2</text>
    <rect x="180" y="90" width="60" height="10" rx="3" fill="rgba(74,158,255,0.45)"/><text x="210" y="115" fill="#8892a4">tok 3</text>
    <rect x="250" y="84" width="60" height="16" rx="3" fill="rgba(74,158,255,0.45)"/><text x="280" y="115" fill="#8892a4">tok 4</text>
    <rect x="320" y="92" width="60" height="8" rx="3" fill="rgba(74,158,255,0.45)"/><text x="350" y="115" fill="#8892a4">tok 5</text>
    <rect x="390" y="78" width="60" height="22" rx="3" fill="rgba(74,158,255,0.45)"/><text x="420" y="115" fill="#8892a4">tok 6</text>
    <rect x="460" y="88" width="60" height="12" rx="3" fill="rgba(74,158,255,0.45)"/><text x="490" y="115" fill="#8892a4">tok 7</text>
  </g>
</svg>
</div>

**Why would the model dump attention on a token that carries no relevant meaning?**

<div class="fragment note">

- Softmax weights must sum to 1, so a head must put its weight **somewhere**
- A head with nothing useful to attend to needs a no-op target
- Under causal masking, only the first token is visible to **every** later token: the natural sink
- Keeping these first tokens in the cache stabilizes very long generation (Xiao et al. 2023, StreamingLLM)

</div>

---

<!-- .slide: id="attention-maps" -->

## Attention Maps Are Not Always Explanations

Attention weights show where the model looks. High attention does not prove causal importance.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**Weights suggest hypotheses**

- a pronoun attending to its antecedent is a real, interpretable pattern
- useful for debugging and intuition

</div>

<div>

**High attention is not proof**

- attention is one of many operations in the network
- information can route through other pathways
- causal claims need ablation tests

</div>

</div>

Visualization suggests hypotheses; ablation confirms them.

<!-- .slide: id="quiz-q1" -->

## Q1: Learned Lookup

<div class="quiz-prompt">

In the attention mechanism, the query, key, and value projections are learned during training. If you froze these projections at random initialization (never trained them), what would the attention weights look like, and why?

</div>

<div class="fragment note quiz-answer">

**Answer:** Approximately uniform. Random projections give roughly orthogonal query and key vectors, so all dot products are about equal and softmax spreads weight evenly. Learning is what makes attention **selective**.

</div>

---

<!-- .slide: id="quiz-q2" -->

## Q2: Causal Masking and Training

<div class="quiz-prompt">

A student proposes training a language model without a causal mask, arguing that "seeing future tokens during training will help the model learn faster." Explain why this approach fails at inference time.

</div>

<div class="fragment note quiz-answer">

**Answer:** At inference, future tokens do not exist. A model trained with bidirectional attention learned to rely on future context it will never have, so its predictions degrade. Causal masking makes the training and inference constraints match.

</div>

---

<!-- .slide: id="quiz-q3" -->

## Q3: Positional Information

<div class="quiz-prompt">

You feed the sentence "the cat sat on the mat" into a self-attention layer with positional embeddings removed. You then reverse the sentence to "mat the on sat cat the" and feed it in again. How do the attention patterns compare, and what does this tell you?

</div>

<div class="fragment note quiz-answer">

**Answer:** Identical up to the permutation. Self-attention is permutation equivariant: permute the input and the output permutes the same way. The model cannot tell which token came first. Positional embeddings break this symmetry.

</div>

---

<!-- .slide: id="quiz-q4" -->

## Q4: O(n^2) Scaling

<div class="quiz-prompt">

A model supports a 128K-token context. If you doubled the context to 256K tokens, by what factor does the attention computation cost increase? Why is this a bigger problem for per-token feed-forward layers?

</div>

<div class="fragment note quiz-answer">

**Answer:** Attention cost quadruples: $O((2n)^2) = O(4n^2)$. Feed-forward layers process tokens independently, so their cost only doubles. This quadratic growth is why long context is disproportionately expensive and why FlashAttention, sliding-window, and sparse attention exist.

</div>

---

<!-- .slide: id="quiz-q5" -->

## Q5: KV Cache Trade-offs

<div class="quiz-prompt">

A model has 32 layers, 32 attention heads per layer, and $d_k = 128$ per head. How many floats are stored in the KV cache for a 4096-token sequence? If you switch from multi-head attention to grouped-query attention with 4 groups, what is the reduction factor?

</div>

<div class="fragment note quiz-answer">

**Answer:** Multi-head: $2 \times 32 \times 32 \times 4096 \times 128 = 1,073,741,824$ floats (about 4 GB in float32); the "2" covers K and V. GQA with 4 groups shares K and V across each group of 8 heads: $2 \times 32 \times 4 \times 4096 \times 128 \approx 134$ million floats (about 512 MB). Reduction factor: 8, the number of heads per group.

</div>

  <!-- Per-module config: sets window.MODULE_CONFIG before the shared logic runs -->
  <script>
window.ASSET_BASE = "module_03_attention/";
(function () {
  // ===================================================================

  var COL = {
    text: '#e8eaf0', muted: '#8892a4', line: '#2a3450',
    primary: '#4a9eff', secondary: '#f5a623', green: '#3fb950',
    red: '#e74c3c', purple: '#c792ea', bg: '#0d1225'
  };
  var SLOTC = ['#4a9eff', '#f5a623', '#50c878', '#c792ea'];

  function fit(canvas) {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return null;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    var ctx = canvas.getContext('2d');

      host.addEventListener(ev, function (e) { e.stopPropagation(); });

  function rounded(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function normalizeRows(M) {
    return M.map(function (row) {
      var s = row.reduce(function (a, b) { return a + b; }, 0);
      return row.map(function (v) { return v / s; });
    });
  }

  // ===================================================================
  // WIDGET: mlpRigid  — weights are bound to fixed slots
  // ===================================================================
  function mlpRigid(host) {
    var words = ['the', 'cat', 'sat', 'on', 'the', 'mat'];
    var trackIdx = 2; // "sat"
    var state = { start: 0 };

    host.innerHTML =
      '<div class="m3-widget">' +
        '<div class="m3-canvas-wrap"><canvas class="m3-canvas"></canvas></div>' +
        '<div class="m3-controls">' +
          '<button class="m3-btn m3-primary" data-act="slide">Slide window &rarr;</button>' +
          '<button class="m3-btn m3-reset" data-act="reset">Reset</button>' +
        '</div>' +
        '<p class="m3-readout"></p>' +
      '</div>';
    var canvas = host.querySelector('.m3-canvas');
    var readout = host.querySelector('.m3-readout');
    stop(host);

    host.querySelector('[data-act="slide"]').addEventListener('click', function () {
      state.start = (state.start + 1) % 3; draw();
    });
    host.querySelector('[data-act="reset"]').addEventListener('click', function () {
      state.start = 0; draw();
    });

    function draw() {
      var f = fit(canvas); if (!f) return;
      var ctx = f.ctx, W = f.w, H = f.h;
      ctx.clearRect(0, 0, W, H);
      ctx.textAlign = 'center';

      var n = words.length;
      var step = Math.min(120, (W - 80) / n);
      var x0 = (W - step * n) / 2 + step / 2;
      var bw = step - 14;

      // strip of full sentence
      var stripY = 64;
      ctx.font = '600 14px Inter, sans-serif';
      ctx.fillStyle = COL.muted;
      ctx.fillText('the model reads a fixed window of 4 tokens', W / 2, 20);
      // window rectangle
      var winX = x0 + state.start * step - step / 2 + 6;
      ctx.strokeStyle = COL.secondary; ctx.lineWidth = 2;
      ctx.setLineDash([5, 3]);
      rounded(ctx, winX, stripY - 22, step * 4 - 12, 44, 6); ctx.stroke();
      ctx.setLineDash([]);

      var slotCx = [];
      for (var i = 0; i < n; i++) {
        var cx = x0 + i * step;
        var inWin = (i >= state.start && i < state.start + 4);
        var slot = i - state.start;
        if (inWin) slotCx[slot] = cx;
        ctx.fillStyle = COL.bg;
        var tracked = (i === trackIdx);
        ctx.strokeStyle = tracked ? COL.secondary : (inWin ? COL.text : COL.line);
        ctx.lineWidth = tracked ? 2.5 : 1.4;
        rounded(ctx, cx - bw / 2, stripY - 16, bw, 32, 5); ctx.fill(); ctx.stroke();
        ctx.fillStyle = inWin ? COL.text : COL.muted;
        ctx.font = '600 14px Inter, sans-serif';
        ctx.fillText(words[i], cx, stripY + 5);
      }

      // weight blocks row
      var wbY = H - 86;
      ctx.font = '600 12px Inter, sans-serif';
      for (var s = 0; s < 4; s++) {
        if (slotCx[s] === undefined) continue;
        var c = slotCx[s];
        // arrow from windowed word down to weight block
        ctx.strokeStyle = SLOTC[s]; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(c, stripY + 18); ctx.lineTo(c, wbY - 2); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.strokeStyle = SLOTC[s];
        rounded(ctx, c - 36, wbY, 72, 44, 6); ctx.fill(); ctx.stroke();
        ctx.fillStyle = SLOTC[s];
        ctx.fillText('slot ' + (s + 1), c, wbY + 18);
        ctx.fillText('W' + (s + 1), c, wbY + 36);
      }

      // tracked word annotation
      var trackSlot = trackIdx - state.start;
      ctx.font = '600 13px Inter, sans-serif';
      if (trackSlot >= 0 && trackSlot < 4) {
        var tc = slotCx[trackSlot];
        ctx.fillStyle = COL.secondary;
        ctx.fillText('"sat" here', tc, wbY - 16);
        readout.innerHTML = '"sat" now sits in <strong>slot ' + (trackSlot + 1) +
          '</strong>, processed by weight block <strong>W' + (trackSlot + 1) +
          '</strong>. Slide it and it meets entirely different parameters &mdash; nothing it learned transfers.';
      }
    }
    draw();
    return { resize: draw };
  }

  // ===================================================================
  // WIDGET: attentionHeatmap — NxN attention weights for a sentence
  // ===================================================================
  function attentionHeatmap(host) {
    var examples = {
      a: {
        tokens: ['the', 'cat', 'sat', 'on', 'the', 'mat'],
        sel: 2,
        M: [
          [0.00, 0.34, 0.18, 0.12, 0.28, 0.08],
          [0.14, 0.00, 0.42, 0.16, 0.08, 0.20],
          [0.06, 0.46, 0.00, 0.30, 0.08, 0.10],
          [0.08, 0.12, 0.50, 0.00, 0.20, 0.10],
          [0.30, 0.08, 0.12, 0.22, 0.00, 0.28],
          [0.26, 0.24, 0.30, 0.12, 0.08, 0.00]
        ]
      },
      b: {
        tokens: ['alice', 'gave', 'bob', 'her', 'book'],
        sel: 3,
        M: [
          [0.00, 0.20, 0.25, 0.30, 0.25],
          [0.25, 0.00, 0.35, 0.20, 0.20],
          [0.20, 0.40, 0.00, 0.15, 0.25],
          [0.60, 0.15, 0.10, 0.00, 0.15],
          [0.35, 0.20, 0.10, 0.35, 0.00]
        ]
      }
    };
    var state = { key: 'a', sel: examples.a.sel };

    host.innerHTML =
      '<div class="m3-widget">' +
        '<div class="m3-canvas-wrap"><canvas class="m3-canvas"></canvas></div>' +
        '<div class="m3-controls">' +
          '<button class="m3-btn active" data-ex="a">"the cat sat on the mat"</button>' +
          '<button class="m3-btn" data-ex="b">"alice gave bob her book"</button>' +
        '</div>' +
        '<p class="m3-readout"></p>' +
      '</div>';
    var canvas = host.querySelector('.m3-canvas');
    var readout = host.querySelector('.m3-readout');
    stop(host);

    host.querySelectorAll('[data-ex]').forEach(function (b) {
      b.addEventListener('click', function () {
        state.key = b.getAttribute('data-ex');
        state.sel = examples[state.key].sel;
        host.querySelectorAll('[data-ex]').forEach(function (x) { x.classList.toggle('active', x === b); });
        draw();
      });
    });

    var layout = null;
    canvas.addEventListener('click', function (e) {
      if (!layout) return;
      var rect = canvas.getBoundingClientRect();
      // rescale the click into canvas layout pixels (reveal scales the deck).
      var sy = canvas.clientHeight / rect.height || 1;
      var my = (e.clientY - rect.top) * sy;
      var row = Math.floor((my - layout.oy) / layout.cell);
      if (row >= 0 && row < layout.n) { state.sel = row; draw(); }
    });

    function draw() {
      var f = fit(canvas); if (!f) return;
      var ctx = f.ctx, W = f.w, H = f.h;
      ctx.clearRect(0, 0, W, H);
      var ex = examples[state.key];
      var toks = ex.tokens, M = ex.M, n = toks.length;
      var pad = 64;
      var avail = Math.min(W - pad - 40, H - pad - 30);
      var cell = avail / n;
      var ox = pad + (W - pad - 40 - n * cell) / 2;
      var oy = pad;
      layout = { ox: ox, oy: oy, cell: cell, n: n };

      ctx.font = '12px Inter, sans-serif';
      // column (key) labels
      ctx.fillStyle = COL.secondary; ctx.textAlign = 'center';
      ctx.fillText('keys (attended to)', ox + n * cell / 2, 22);
      for (var j = 0; j < n; j++) {
        ctx.fillStyle = COL.secondary;
        ctx.fillText(toks[j], ox + j * cell + cell / 2, oy - 8);
      }
      // row (query) labels
      ctx.textAlign = 'right';
      for (var i = 0; i < n; i++) {
        ctx.fillStyle = (i === state.sel) ? COL.secondary : COL.primary;
        ctx.fillText(toks[i], ox - 8, oy + i * cell + cell / 2 + 4);
      }
      ctx.save();
      ctx.translate(ox - 58, oy + n * cell / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = 'center'; ctx.fillStyle = COL.primary;
      ctx.fillText('queries', 0, 0);
      ctx.restore();

      // cells
      for (var r = 0; r < n; r++) {
        for (var c = 0; c < n; c++) {
          var w = M[r][c];
          ctx.fillStyle = (r === c)
            ? 'rgba(13,18,37,0.95)'
            : 'rgba(74,158,255,' + (0.08 + 0.9 * w).toFixed(3) + ')';
          ctx.fillRect(ox + c * cell + 1, oy + r * cell + 1, cell - 2, cell - 2);
          ctx.fillStyle = (r === c) ? COL.muted : COL.text; ctx.textAlign = 'center';
          ctx.font = '11px Inter, sans-serif';
          ctx.fillText(w.toFixed(2), ox + c * cell + cell / 2, oy + r * cell + cell / 2 + 4);
        }
      }
      // highlight selected query row
      ctx.strokeStyle = COL.secondary; ctx.lineWidth = 2.5;
      ctx.strokeRect(ox, oy + state.sel * cell, n * cell, cell);

      // readout: top attended key for selected query
      var row = M[state.sel];
      var best = 0; for (var k = 1; k < n; k++) if (row[k] > row[best]) best = k;
      readout.innerHTML = 'Click a row to pick a query. <strong>"' + toks[state.sel] +
        '"</strong> attends most to <strong>"' + toks[best] + '"</strong> (' +
        (row[best] * 100).toFixed(0) + '%). The diagonal is set to 0 here, and each row sums to 1.';
    }
    draw();
    return { resize: draw };
  }

  // ===================================================================
  // WIDGET: attentionArrows — click a word; arcs fan out to the words it
  // attends to. Thicker, brighter arc = more attention.
  // ===================================================================
  function attentionArrows(host) {
    var tokens = ['the', 'cat', 'sat', 'on', 'the', 'mat'];
    // rows = query (the word doing the attending), cols = key (attended to).
    // The diagonal is 0: a word does not attend to itself here, so every arc
    // points at a different word. normalizeRows then spreads each row's weight
    // across the other tokens.
    var M = normalizeRows([
      [0.00, 0.18, 0.10, 0.10, 0.22, 0.10],  // the
      [0.12, 0.00, 0.26, 0.06, 0.10, 0.16],  // cat
      [0.05, 0.46, 0.00, 0.09, 0.05, 0.15],  // sat
      [0.05, 0.10, 0.34, 0.00, 0.06, 0.25],  // on
      [0.10, 0.06, 0.10, 0.14, 0.00, 0.30],  // the
      [0.05, 0.16, 0.26, 0.18, 0.10, 0.00]   // mat
    ]);
    var state = { sel: 2 };

    host.innerHTML =
      '<div class="m3-widget">' +
        '<div class="m3-canvas-wrap"><canvas class="m3-canvas"></canvas></div>' +
        '<p class="m3-readout"></p>' +
      '</div>';
    var canvas = host.querySelector('.m3-canvas');
    var readout = host.querySelector('.m3-readout');
    stop(host);

    var boxes = [];
    canvas.addEventListener('click', function (e) {
      var rect = canvas.getBoundingClientRect();
      // reveal scales the whole deck, so the on-screen rect differs from the
      // canvas layout size; rescale the click into layout (drawing) pixels.
      var sx = canvas.clientWidth / rect.width || 1;
      var sy = canvas.clientHeight / rect.height || 1;
      var mx = (e.clientX - rect.left) * sx, my = (e.clientY - rect.top) * sy;
      for (var i = 0; i < boxes.length; i++) {
        var b = boxes[i];
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
          state.sel = i; draw(); return;
        }
      }
    });

    function head(ctx, fromx, fromy, tox, toy, color) {
      var ang = Math.atan2(toy - fromy, tox - fromx);
      var s = 8;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(tox, toy);
      ctx.lineTo(tox - s * Math.cos(ang - 0.45), toy - s * Math.sin(ang - 0.45));
      ctx.lineTo(tox - s * Math.cos(ang + 0.45), toy - s * Math.sin(ang + 0.45));
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      var f = fit(canvas); if (!f) return;
      var ctx = f.ctx, W = f.w, H = f.h;
      ctx.clearRect(0, 0, W, H);
      var n = tokens.length;
      ctx.textAlign = 'center';

      // Word row sits low; arcs bow up into the open space above it.
      ctx.font = '600 17px Inter, sans-serif';
      var bh = 40, rowY = H - 74, gap = 16;
      var widths = tokens.map(function (t) { return Math.max(66, ctx.measureText(t).width + 36); });
      var totalW = widths.reduce(function (a, b) { return a + b; }, 0) + gap * (n - 1);
      var x = (W - totalW) / 2;
      boxes = [];
      var cx = [];
      for (var i = 0; i < n; i++) {
        boxes.push({ x: x, y: rowY, w: widths[i], h: bh });
        cx.push(x + widths[i] / 2);
        x += widths[i] + gap;
      }

      var row = M[state.sel];
      var maxw = Math.max.apply(null, row);
      var topY = rowY - 4;
      var capBow = H - 116;

      // Arcs from the query to every other token.
      for (var k = 0; k < n; k++) {
        if (k === state.sel) continue;
        var w = row[k];
        var sx = cx[state.sel], ex = cx[k];
        var dist = Math.abs(ex - sx);
        var bow = Math.min(capBow, 46 + dist * 0.42);
        var midx = (sx + ex) / 2, cy = topY - bow;
        var col = 'rgba(74,158,255,' + (0.16 + 0.74 * (w / maxw)).toFixed(3) + ')';
        ctx.strokeStyle = col;
        ctx.lineWidth = 1 + 13 * w;
        ctx.beginPath();
        ctx.moveTo(sx, topY);
        ctx.quadraticCurveTo(midx, cy, ex, topY);
        ctx.stroke();
        head(ctx, midx, cy, ex, topY, col);
        if (w > 0.12) {
          ctx.fillStyle = COL.text; ctx.font = '11px Inter, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText((w * 100).toFixed(0) + '%', ex, topY - 9);
        }
      }
      // Word boxes (query highlighted).
      for (var b2 = 0; b2 < n; b2++) {
        var on = (b2 === state.sel);
        ctx.fillStyle = on ? 'rgba(245,166,35,0.16)' : '#0d1225';
        ctx.strokeStyle = on ? COL.secondary : COL.line;
        ctx.lineWidth = on ? 2.5 : 1.4;
        rounded(ctx, boxes[b2].x, boxes[b2].y, boxes[b2].w, bh, 7);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = on ? COL.secondary : COL.text;
        ctx.font = '600 17px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(tokens[b2], cx[b2], rowY + bh / 2 + 6);
      }
      ctx.fillStyle = COL.muted; ctx.font = '13px Inter, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('query: "' + tokens[state.sel] + '"   (click any word)', W / 2, H - 14);

      var best = 0; for (var t = 0; t < n; t++) if (row[t] > row[best]) best = t;
      readout.innerHTML = '<strong>"' + tokens[state.sel] + '"</strong> attends most to <strong>"' +
        tokens[best] + '"</strong> (' + (row[best] * 100).toFixed(0) +
        '%). Thicker arrows carry more attention; the output for this word is a weighted blend of all the value vectors.';
    }
    draw();
    return { resize: draw };
  }

  // ===================================================================
  // WIDGET: permutationShuffle — order does not change attention
  // ===================================================================
  function permutationShuffle(host) {
    var ids = ['dog', 'bites', 'man'];
    // affinity by token identity (row-normalized), independent of position
    var AFF = normalizeRows([
      [0.20, 0.30, 0.50],  // dog -> dog, bites, man
      [0.45, 0.10, 0.45],  // bites
      [0.50, 0.30, 0.20]   // man
    ]);
    var perms = [[0, 1, 2], [2, 1, 0], [1, 2, 0], [2, 0, 1]];
    var state = { p: 0 };

    host.innerHTML =
      '<div class="m3-widget">' +
        '<div class="m3-canvas-wrap"><canvas class="m3-canvas"></canvas></div>' +
        '<div class="m3-controls">' +
          '<button class="m3-btn m3-primary" data-act="shuffle">Reorder tokens</button>' +
          '<button class="m3-btn m3-reset" data-act="reset">Reset</button>' +
        '</div>' +
        '<p class="m3-readout"></p>' +
      '</div>';
    var canvas = host.querySelector('.m3-canvas');
    var readout = host.querySelector('.m3-readout');
    stop(host);
    host.querySelector('[data-act="shuffle"]').addEventListener('click', function () {
      state.p = (state.p + 1) % perms.length; draw();
    });
    host.querySelector('[data-act="reset"]').addEventListener('click', function () {
      state.p = 0; draw();
    });

    function draw() {
      var f = fit(canvas); if (!f) return;
      var ctx = f.ctx, W = f.w, H = f.h;
      ctx.clearRect(0, 0, W, H);
      var perm = perms[state.p];
      var n = 3;
      var order = perm.map(function (k) { return ids[k]; });

      // token row
      ctx.textAlign = 'center';
      ctx.fillStyle = COL.muted; ctx.font = '13px Inter, sans-serif';
      ctx.fillText('current order', W / 2, 24);
      var tw = 96, gap = 18, totalW = n * tw + (n - 1) * gap;
      var tx = (W - totalW) / 2;
      for (var i = 0; i < n; i++) {
        ctx.fillStyle = COL.bg; ctx.strokeStyle = COL.primary; ctx.lineWidth = 1.5;
        rounded(ctx, tx + i * (tw + gap), 36, tw, 34, 6); ctx.fill(); ctx.stroke();
        ctx.fillStyle = COL.text; ctx.font = '600 15px Inter, sans-serif';
        ctx.fillText(order[i], tx + i * (tw + gap) + tw / 2, 58);
      }

      // attention matrix in current order
      var cell = Math.min(96, (H - 130) / n);
      var mW = n * cell;
      var ox = (W - mW) / 2, oy = 96 + ((H - 96) - (n * cell + 24)) / 2;
      ctx.font = '12px Inter, sans-serif';
      for (var j = 0; j < n; j++) {
        ctx.fillStyle = COL.secondary; ctx.textAlign = 'center';
        ctx.fillText(order[j], ox + j * cell + cell / 2, oy - 8);
        ctx.fillStyle = COL.primary; ctx.textAlign = 'right';
        ctx.fillText(order[j], ox - 8, oy + j * cell + cell / 2 + 4);
      }
      for (var r = 0; r < n; r++) {
        for (var c = 0; c < n; c++) {
          var w = AFF[perm[r]][perm[c]];
          ctx.fillStyle = 'rgba(74,158,255,' + (0.10 + 0.85 * w).toFixed(3) + ')';
          ctx.fillRect(ox + c * cell + 1, oy + r * cell + 1, cell - 2, cell - 2);
          ctx.fillStyle = COL.text; ctx.textAlign = 'center'; ctx.font = '11px Inter, sans-serif';
          ctx.fillText(w.toFixed(2), ox + c * cell + cell / 2, oy + r * cell + cell / 2 + 4);
        }
      }
      // highlight the dog->man pair wherever it now sits
      var dr = perm.indexOf(0), dc = perm.indexOf(2);
      ctx.strokeStyle = COL.secondary; ctx.lineWidth = 2.5;
      ctx.strokeRect(ox + dc * cell, oy + dr * cell, cell, cell);

      readout.innerHTML = 'attention("dog" &rarr; "man") = <strong>' +
        AFF[0][2].toFixed(2) + '</strong> in every ordering. Reorder the tokens and the value is unchanged &mdash; <strong>order carries no information</strong>.';
    }
    draw();
    return { resize: draw };
  }

  // ===================================================================
  // WIDGET: positionalEncoding — sinusoidal heatmap + distance signal
  // ===================================================================
  function positionalEncoding(host) {
    var state = { d: 32, exp: 4, L: 40 };

    host.innerHTML =
      '<div class="m3-widget">' +
        '<div class="m3-dual">' +
          '<div class="m3-canvas-wrap"><canvas class="m3-canvas pe-heat"></canvas></div>' +
          '<div class="m3-canvas-wrap"><canvas class="m3-canvas pe-sim"></canvas></div>' +
        '</div>' +
        '<div class="m3-sliders">' +
          '<div class="m3-slider"><label>d_model</label><input type="range" min="8" max="64" step="8" value="32" data-k="d"><p class="m3-val">32</p></div>' +
          '<div class="m3-slider"><label>base 10^</label><input type="range" min="2" max="5" step="1" value="4" data-k="exp"><p class="m3-val">4</p></div>' +
        '</div>' +
        '<p class="m3-readout"></p>' +
      '</div>';
    var heat = host.querySelector('.pe-heat');
    var sim = host.querySelector('.pe-sim');
    var readout = host.querySelector('.m3-readout');
    stop(host);
    host.querySelectorAll('input[type="range"]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        state[inp.getAttribute('data-k')] = parseInt(inp.value, 10);
        inp.parentElement.querySelector('.m3-val').textContent = inp.value;
        draw();
      });
    });

    function pe(pos, i, d, base) {
      var denom = Math.pow(base, (2 * Math.floor(i / 2)) / d);
      var angle = pos / denom;
      return (i % 2 === 0) ? Math.sin(angle) : Math.cos(angle);
    }

    function draw() {
      var base = Math.pow(10, state.exp);
      var d = state.d, L = state.L;
      // ---- heatmap ----
      var f = fit(heat); if (!f) return;
      var ctx = f.ctx, W = f.w, H = f.h;
      ctx.clearRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.fillStyle = COL.muted; ctx.font = '12px Inter, sans-serif';
      ctx.fillText('encoding value (x = sequence position, y = dimension)', W / 2, 16);
      var ox = 46, oy = 50, gw = W - ox - 14, gh = H - oy - 30;
      // legend for the diverging colour scale (sits between the title and the grid)
      var lgy = 30;
      ctx.textAlign = 'left'; ctx.font = '11px Inter, sans-serif';
      ctx.fillStyle = 'rgba(74,158,255,0.85)'; ctx.fillRect(ox, lgy, 16, 11);
      ctx.fillStyle = COL.muted; ctx.fillText('positive', ox + 22, lgy + 9);
      ctx.fillStyle = 'rgba(245,166,35,0.85)'; ctx.fillRect(ox + 92, lgy, 16, 11);
      ctx.fillStyle = COL.muted; ctx.fillText('negative', ox + 114, lgy + 9);
      var cw = gw / L, ch = gh / d;
      for (var p = 0; p < L; p++) {
        for (var i = 0; i < d; i++) {
          var v = pe(p, i, d, base);
          ctx.fillStyle = v >= 0
            ? 'rgba(74,158,255,' + (0.12 + 0.85 * v).toFixed(3) + ')'
            : 'rgba(245,166,35,' + (0.12 + 0.85 * (-v)).toFixed(3) + ')';
          ctx.fillRect(ox + p * cw, oy + i * ch, cw + 0.5, ch + 0.5);
        }
      }
      ctx.fillStyle = COL.muted; ctx.textAlign = 'right';
      ctx.fillText('dim 0', ox - 4, oy + 8);
      ctx.fillText('dim ' + (d - 1), ox - 4, oy + gh);
      ctx.textAlign = 'center';
      ctx.fillText('pos 0', ox + cw / 2 + 4, H - 8);
      ctx.fillText('pos ' + (L - 1), ox + gw - cw, H - 8);

      // ---- similarity vs distance ----
      var g = fit(sim); if (!g) return;
      var c2 = g.ctx, W2 = g.w, H2 = g.h;
      c2.clearRect(0, 0, W2, H2);
      c2.textAlign = 'center'; c2.fillStyle = COL.muted; c2.font = '12px Inter, sans-serif';
      c2.fillText('similarity to position 0 as distance grows', W2 / 2, 16);
      var px = 40, py = 28, pw = W2 - px - 16, ph = H2 - py - 28;
      // axes
      c2.strokeStyle = COL.line; c2.lineWidth = 1;
      c2.beginPath(); c2.moveTo(px, py); c2.lineTo(px, py + ph); c2.lineTo(px + pw, py + ph); c2.stroke();
      // compute dot products PE(0).PE(k)
      var vals = [];
      for (var k = 0; k < L; k++) {
        var dot = 0;
        for (var ii = 0; ii < d; ii++) dot += pe(0, ii, d, base) * pe(k, ii, d, base);
        vals.push(dot);
      }
      var maxv = vals[0] || 1;
      c2.strokeStyle = COL.primary; c2.lineWidth = 2;
      c2.beginPath();
      for (var kk = 0; kk < L; kk++) {
        var xx = px + (kk / (L - 1)) * pw;
        var yy = py + ph - (vals[kk] / maxv) * ph;
        if (kk === 0) c2.moveTo(xx, yy); else c2.lineTo(xx, yy);
      }
      c2.stroke();
      c2.fillStyle = COL.muted; c2.textAlign = 'left';
      c2.fillText('0', px, py + ph + 16);
      c2.textAlign = 'right'; c2.fillText('distance ' + (L - 1), px + pw, py + ph + 16);
      c2.save();
      c2.translate(12, py + ph / 2);
      c2.rotate(-Math.PI / 2);
      c2.textAlign = 'center';
      c2.fillText('similarity', 0, 0);
      c2.restore();

      readout.innerHTML = 'd_model = <strong>' + d + '</strong>, base = <strong>' + base.toLocaleString() +
        '</strong>. The heatmap shows positions across the x-axis and dimensions down the y-axis. The right plot compares each position to position 0; nearby positions tend to be more similar, giving attention a distance signal.';
    }
    draw();
    return { resize: draw };
  }

  // ===================================================================
  // WIDGET: softmaxExplorer — logits to a distribution, with temperature
  // ===================================================================
  function softmaxExplorer(host) {
    var toks = ['mat', 'rug', 'sofa', 'roof', 'sky'];
    var state = { logits: [3.2, 2.6, 1.4, 0.9, -0.3], T: 1.0 };

    var logitHTML = '';
    toks.forEach(function (t, i) {
      logitHTML += '<div class="m3-slider"><label>"' + t + '"</label>' +
        '<input type="range" min="-2" max="6" step="0.1" value="' + state.logits[i] + '" data-i="' + i + '">' +
        '<p class="m3-val">' + state.logits[i].toFixed(1) + '</p></div>';
    });
    var tempHTML = '<div class="m3-slider"><label>temperature</label>' +
      '<input type="range" min="0.2" max="10" step="0.1" value="1" data-t="1"><p class="m3-val">1.0</p></div>';

    host.innerHTML =
      '<div class="m3-widget">' +
        '<div class="m3-canvas-wrap"><canvas class="m3-canvas"></canvas></div>' +
        '<div class="m3-sliders m3-logits">' + logitHTML + '</div>' +
        '<div class="m3-sliders m3-temp">' + tempHTML + '</div>' +
        '<p class="m3-readout"></p>' +
      '</div>';
    var canvas = host.querySelector('.m3-canvas');
    var readout = host.querySelector('.m3-readout');
    stop(host);
    host.querySelectorAll('input[data-i]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        state.logits[parseInt(inp.getAttribute('data-i'), 10)] = parseFloat(inp.value);
        inp.parentElement.querySelector('.m3-val').textContent = parseFloat(inp.value).toFixed(1);
        draw();
      });
    });
    host.querySelector('input[data-t]').addEventListener('input', function () {
      state.T = parseFloat(this.value);
      this.parentElement.querySelector('.m3-val').textContent = state.T.toFixed(1);
      draw();
    });

    function softmax(z, T) {
      var m = Math.max.apply(null, z);
      var ex = z.map(function (v) { return Math.exp((v - m) / T); });
      var s = ex.reduce(function (a, b) { return a + b; }, 0);
      return ex.map(function (v) { return v / s; });

    function draw() {
      var f = fit(canvas); if (!f) return;
      var ctx = f.ctx, W = f.w, H = f.h;
      ctx.clearRect(0, 0, W, H);
      var n = toks.length;
      var p = softmax(state.logits, state.T);
      var colW = (W - 80) / n;
      var midY = H / 2;
      ctx.textAlign = 'center';

      // top: logits ; bottom: probabilities
      ctx.font = '12px Inter, sans-serif'; ctx.fillStyle = COL.muted;
      ctx.fillText('logits (raw scores)', 70, 18);
      ctx.fillText('probabilities (after softmax)', 110, midY + 16);

      var maxL = 6, minL = -2;
      var topH = midY - 40;
      for (var i = 0; i < n; i++) {
        var cx = 60 + i * colW + colW / 2;
        // logit bar (above midline)
        var lh = ((state.logits[i] - minL) / (maxL - minL)) * topH;
        ctx.fillStyle = 'rgba(245,166,35,0.55)';
        ctx.fillRect(cx - colW * 0.3, midY - 24 - lh, colW * 0.6, lh);
        ctx.fillStyle = COL.text; ctx.font = '11px Inter, sans-serif';
        ctx.fillText(state.logits[i].toFixed(1), cx, midY - 28 - lh);
        // token label at midline
        ctx.fillStyle = COL.primary; ctx.font = '600 13px Inter, sans-serif';
        ctx.fillText(toks[i], cx, midY - 6);
        // prob bar (below midline)
        var botH = H - midY - 50;
        var ph = p[i] * botH;
        ctx.fillStyle = 'rgba(74,158,255,' + (0.35 + 0.6 * p[i]).toFixed(3) + ')';
        ctx.fillRect(cx - colW * 0.3, midY + 24, colW * 0.6, ph);
        ctx.fillStyle = COL.text; ctx.font = '11px Inter, sans-serif';
        ctx.fillText((p[i] * 100).toFixed(0) + '%', cx, midY + 24 + ph + 14);
      }
      ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(30, midY); ctx.lineTo(W - 20, midY); ctx.stroke();

      var top = 0; for (var k = 1; k < n; k++) if (p[k] > p[top]) top = k;
      var spread = state.T >= 4
        ? ' At high temperature the probabilities flatten toward uniform (' + (100 / n).toFixed(0) + '% each).'
        : ' Lower temperature sharpens the peak; higher temperature flattens it.';
      readout.innerHTML = 'Temperature <strong>' + state.T.toFixed(1) + '</strong>: top token is <strong>"' +
        toks[top] + '"</strong> at <strong>' + (p[top] * 100).toFixed(0) + '%</strong>.' + spread;
    }
    draw();
    return { resize: draw };
  }

  // ===================================================================
  // WIDGET: kvCache — recompute every step vs cache and reuse
  // ===================================================================
  function kvCache(host) {
    var toks = ['the', 'cat', 'sat', 'on', 'the', 'mat'];
    var N = toks.length;
    var state = { t: 1 };

    host.innerHTML =
      '<div class="m3-widget">' +
        '<div class="m3-canvas-wrap"><canvas class="m3-canvas"></canvas></div>' +
        '<div class="m3-controls">' +
          '<button class="m3-btn m3-primary" data-act="next">Generate next token</button>' +
          '<button class="m3-btn m3-reset" data-act="reset">Reset</button>' +
        '</div>' +
        '<p class="m3-readout"></p>' +
      '</div>';
    var canvas = host.querySelector('.m3-canvas');
    var readout = host.querySelector('.m3-readout');
    stop(host);
    host.querySelector('[data-act="next"]').addEventListener('click', function () {
      if (state.t < N) state.t++; draw();
    });
    host.querySelector('[data-act="reset"]').addEventListener('click', function () {
      state.t = 1; draw();
    });

    function panel(ctx, x0, y0, pw, ph, title, cached) {
      ctx.textAlign = 'center';
      ctx.fillStyle = cached ? COL.green : COL.secondary;
      ctx.font = '600 14px Inter, sans-serif';
      ctx.fillText(title, x0 + pw / 2, y0);
      var cell = Math.min((pw - 30) / N, (ph - 50) / N);
      var gx = x0 + (pw - cell * N) / 2, gy = y0 + 28;
      // column labels (positions)
      ctx.font = '10px Inter, sans-serif'; ctx.fillStyle = COL.muted;
      for (var c = 0; c < N; c++) ctx.fillText(toks[c], gx + c * cell + cell / 2, gy - 5);
      var computed = 0;
      for (var s = 0; s < state.t; s++) {
        for (var c2 = 0; c2 <= s; c2++) {
          var bright, fill;
          if (!cached) { bright = (s === state.t - 1); fill = 'rgba(245,166,35,' + (bright ? 0.7 : 0.28) + ')'; computed++; }
          else {
            if (c2 === s) { fill = 'rgba(63,185,80,0.7)'; computed++; }
            else fill = 'rgba(136,146,164,0.18)';
          }
          ctx.fillStyle = fill;
          ctx.fillRect(gx + c2 * cell + 1, gy + s * cell + 1, cell - 2, cell - 2);
        }
      }
      // grid frame
      ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
      ctx.strokeRect(gx, gy, cell * N, cell * state.t);
      ctx.fillStyle = COL.muted; ctx.font = '9px Inter, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('step', gx - 2, gy + cell * state.t + 12);
      return computed;
    }

    function draw() {
      var f = fit(canvas); if (!f) return;
      var ctx = f.ctx, W = f.w, H = f.h;
      ctx.clearRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.fillStyle = COL.muted; ctx.font = '12px Inter, sans-serif';
      ctx.fillText('rows = generation step, columns = token position (orange/green = K,V computed this step)', W / 2, 18);
      var pw = (W - 60) / 2, ph = H - 70, y0 = 44;
      var noCache = panel(ctx, 20, y0, pw, ph, 'Without cache: recompute all', false);
      var withCache = panel(ctx, 40 + pw, y0, pw, ph, 'With cache: compute only the new one', true);
      readout.innerHTML = 'After <strong>' + state.t + '</strong> tokens, K,V projections computed: ' +
        '<strong>' + noCache + '</strong> without cache vs <strong>' + withCache +
        '</strong> with cache. Without caching, every past token is re-projected at every step.';
    }
    draw();
    return { resize: draw };
  }

  window.MODULE_CONFIG = {
    title: 'LLMs 0 to 100 - Module 3',
    manimSections: {},
    widgets: {
      mlpRigid: mlpRigid,
      attentionArrows: attentionArrows,
      attentionHeatmap: attentionHeatmap,
      permutationShuffle: permutationShuffle,
      positionalEncoding: positionalEncoding,
      softmaxExplorer: softmaxExplorer,
      kvCache: kvCache
    }
  };
}());
