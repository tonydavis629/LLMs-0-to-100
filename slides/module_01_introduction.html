<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMs 0 to 100</title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <!-- KaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>

  <!-- Module-specific <head> includes (e.g. Chart.js); empty for most modules -->
  <!-- Chart.js for the AI Summers and Winters data visualization -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>


  <!-- Shared styles + per-module overrides, inlined by the build -->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

/* ===========================================
   CSS VARIABLES
   =========================================== */
:root {
  --background-color: #0a0e1a;
  --section-divider-bg: #0d1225;

  --heading-font: "Space Grotesk", Helvetica, sans-serif;
  --body-font: "Inter", Helvetica, sans-serif;
  --base-font-size: 32px;
  --text-size: 16pt;
  --h1-size: 48pt;
  --h2-size: 36pt;
  --h3-size: 24pt;
  --footnote-size: 11pt;

  --primary-color: #4a9eff;
  --secondary-color: #f5a623;
  --text-color: #e8eaf0;
  --muted-color: #8892a4;
  --line-color: #2a3450;

  --slide-padding: 60px;
  --slide-padding-top: 24px;
  --content-gap: 18px;

  --box-radius: 8px;
}

/* ===========================================
   BASE STYLES
   =========================================== */

.reveal {
  font-family: var(--body-font);
  font-size: var(--base-font-size);
}

.reveal strong,
.reveal b {
  font-weight: bold;
}

.reveal a {
  color: var(--primary-color);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.reveal a:hover {
  color: var(--text-color);
}

.reveal-viewport {
  background-color: var(--background-color);
}

.reveal-viewport.is-section-divider .slide-background.present {
  background-color: var(--section-divider-bg) !important;
}

.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4,
.reveal h5,
.reveal h6 {
  font-family: var(--heading-font);
  text-transform: none;
  color: var(--text-color);
  font-weight: 600;
  line-height: 1.2;
}

.reveal h1 { font-size: var(--h1-size); }
.reveal h2 { font-size: var(--h2-size); margin-bottom: 0; }
.reveal h3 { font-size: var(--h3-size); }

.reveal p,
.reveal li,
.reveal td,
.reveal th,
.reveal blockquote {
  font-size: var(--text-size);
  color: var(--text-color);
  line-height: 1.5;
}

/* Vertical separation between newline-separated sentences on text slides.
   Scoped to a slide's top-level paragraphs (the prose flow); paragraphs
   nested inside components (terminal captions, figure cards, grid columns)
   keep their own tighter spacing so dense component slides do not overflow.
   Adjacent margins collapse, so the gap between two paragraphs is 0.9em. */
.reveal .slides section > p {
  margin: 0.4em 0 0.9em 0;
}

/* ===========================================
   LISTS
   =========================================== */

.reveal ul {
  list-style: none;
  padding-left: 0;
  margin: 15px 0;
}

.reveal ul li {
  position: relative;
  padding-left: 25px;
  margin-bottom: 10px;
}

.reveal ul li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.6em;
  width: 8px;
  height: 8px;
  background: var(--primary-color);
  border-radius: 50%;
}

.reveal ul ul li::before {
  background: var(--muted-color);
  width: 6px;
  height: 6px;
}

.reveal blockquote p {
  font-size: inherit;
}

/* ===========================================
   SLIDE LAYOUT
   =========================================== */

.reveal .slides section {
  height: 100%;
  display: flex !important;
  flex-direction: column !important;
  padding: var(--slide-padding-top) var(--slide-padding) var(--slide-padding) var(--slide-padding) !important;
  box-sizing: border-box;
  text-align: left;
  /* Any slide whose content runs past the bottom scrolls instead of clipping.
     The scrollbar only appears when needed. */
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: #30363d transparent;
}

.reveal .slides section::-webkit-scrollbar {
  width: 8px;
}

.reveal .slides section::-webkit-scrollbar-thumb {
  background: #30363d;
  border-radius: 4px;
}

.reveal .slides section.stack {
  padding: 0 !important;
}

.reveal .slides section > .content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: var(--content-gap);
  text-align: left;
}

.reveal .slides section > .footnote {
  position: absolute;
  bottom: 15px;
  left: var(--slide-padding);
  right: var(--slide-padding);
  font-size: var(--footnote-size);
  color: var(--muted-color);
}

/* ===========================================
   SECTION DIVIDERS
   =========================================== */

.reveal .slides section.section-divider {
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}

.reveal .slides section.section-divider h1 {
  font-size: 56pt;
  text-align: center;
  color: var(--primary-color);
}

.reveal .slides section.section-divider p {
  font-size: 20pt;
  color: var(--muted-color);
}

/* ===========================================
   TEXT SIZE UTILITIES
   =========================================== */

.text-lg { font-size: 18pt !important; }
.text-xl { font-size: 20pt !important; }
.text-2xl { font-size: 24pt !important; }
.text-3xl { font-size: 28pt !important; }
.text-4xl { font-size: 32pt !important; }

.text-muted { color: var(--muted-color) !important; }
.text-center { text-align: center !important; }
.text-uppercase { text-transform: uppercase; letter-spacing: 0.1em; }
.font-light { font-weight: 300; }
.font-bold { font-weight: 600; }

/* ===========================================
   BLOCKQUOTES
   =========================================== */

.reveal blockquote {
  border-left: 4px solid var(--primary-color);
  padding-left: 20px;
  margin: 20px 0;
  font-style: italic;
  background: none;
  box-shadow: none;
  width: 100%;
  max-width: none;
}

.reveal blockquote cite {
  display: block;
  margin-top: 10px;
  font-style: normal;
  color: var(--muted-color);
}

/* ===========================================
   ACCENT UNDERLINE ON TITLES
   =========================================== */

.reveal .slides section > h2 {
  flex-shrink: 0;
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line-color);
}

/* ===========================================
   FIGURE CARD - for notable figures slides
   =========================================== */

.figure-card {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  align-items: start;
}

.figure-card img {
  border-radius: var(--box-radius);
  width: 100%;
  box-shadow: 0 4px 20px rgba(74, 158, 255, 0.15);
}

.figure-card .figure-info h3 {
  margin: 0 0 5px 0;
  color: var(--secondary-color);
  font-size: 14pt;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ===========================================
   ERA BADGE - for timeline labels
   =========================================== */

.era-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12pt;
  font-weight: 500;
}

.era-badge.summer {
  background: rgba(245, 166, 35, 0.2);
  color: var(--secondary-color);
}

.era-badge.winter {
  background: rgba(74, 158, 255, 0.15);
  color: #6cb4ff;
}

.era-badge.spring {
  background: rgba(80, 200, 120, 0.2);
  color: #50c878;
}

/* ===========================================
   HIGHLIGHT BOX
   =========================================== */

.highlight-box {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
}

/* Exercise hint: a single fragment that reveals the whole hint at once.
   The wrapping .fragment div is what animates; this just sizes the text
   (matching the old text-lg intent) and removes the global paragraph
   margin so the one-line hint is not double-spaced. */
.reveal .hint-box p {
  font-size: 18pt;
  margin: 0;
}

/* ===========================================
   COURSE STRUCTURE
   =========================================== */

.course-summary {
  max-width: 1120px;
  margin: 0 0 16px 0;
  color: #f0f4fb;
  font-size: 18pt !important;
  line-height: 1.4 !important;
}

.course-track-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

.module-track-card {
  background: rgba(74, 158, 255, 0.07);
  border: 1px solid rgba(74, 158, 255, 0.22);
  border-radius: var(--box-radius);
  padding: 20px 22px;
}

.module-track-kicker {
  font-size: 12pt;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--secondary-color);
  margin-bottom: 8px;
}

.module-track-card h3 {
  margin: 0 0 8px 0;
}

.module-track-intro {
  font-size: 14pt !important;
  color: #d7ddea !important;
  margin: 0 0 10px 0;
  line-height: 1.4 !important;
}

.compact-list {
  margin: 0;
}

.reveal ul.compact-list li {
  font-size: 16pt;
  line-height: 1.35;
  margin-bottom: 7px;
  padding-left: 20px;
}

.course-note {
  margin-top: 14px;
  color: #d7ddea;
  font-size: 15pt !important;
  line-height: 1.35 !important;
}

.course-glossary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  margin-top: 14px;
}

.glossary-item {
  background: rgba(245, 166, 35, 0.08);
  border: 1px solid rgba(245, 166, 35, 0.18);
  border-radius: var(--box-radius);
  padding: 12px 14px;
}

.glossary-item strong {
  color: var(--secondary-color);
}

.glossary-item p {
  font-size: 13pt !important;
  color: #d7ddea !important;
  margin: 6px 0 0 0;
  line-height: 1.4;
}

/* ===========================================
   TERMINAL OUTPUT
   =========================================== */

.terminal-output {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 0;
  max-width: 800px;
  margin: 0 auto;
  text-align: left;
}

.terminal-output .terminal-bar {
  background: #161b22;
  border-radius: 8px 8px 0 0;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.terminal-output .terminal-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.terminal-output .terminal-dot.red { background: #ff5f57; }
.terminal-output .terminal-dot.yellow { background: #febc2e; }
.terminal-output .terminal-dot.green { background: #28c840; }

.terminal-output .terminal-title {
  color: #8b949e;
  font-family: monospace;
  font-size: 10pt;
  margin-left: 8px;
}

.terminal-output .terminal-body {
  padding: 15px 20px;
}

.terminal-output .terminal-body pre {
  margin: 0;
  background: none !important;
  box-shadow: none !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output.dense .terminal-body {
  padding: 10px 20px;
}

.reveal .terminal-output.dense .terminal-body pre.terminal-pre {
  font-size: 9pt;
  line-height: 1.28;
}

.reveal .terminal-output .terminal-body pre.terminal-pre span {
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre p {
  display: inline;
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
  margin: 0 !important;
  color: inherit;
}

.reveal .terminal-output .terminal-body pre code {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output .terminal-body .prompt {
  color: #8b949e;
}

.terminal-output .terminal-body .success {
  color: #3fb950;
}

.terminal-output .terminal-body .header {
  font-weight: bold;
}

.terminal-output .terminal-body .skipped {
  color: #8b949e;
  font-style: italic;
}

/* ===========================================
   TURNING POINT SLIDE
   =========================================== */

.turning-point h2 {
  border-bottom-color: var(--secondary-color) !important;
}

/* ===========================================
   CODE BLOCKS
   =========================================== */

.reveal pre {
  margin-bottom: 0;
  width: 100%;
  box-sizing: border-box;
  box-shadow: none !important;
  background: none !important;
}

.reveal pre code {
  font-size: 14pt;
  line-height: 1.4;
  padding: 10px 20px;
  border-radius: var(--box-radius);
  background: rgba(20, 25, 45, 0.8);
  color: var(--text-color);
  max-height: 400px;
}

.reveal pre code .hljs-keyword,
.reveal pre code .hljs-built_in {
  color: #c792ea;
}

.reveal pre code .hljs-string {
  color: #c3e88d;
}

.reveal pre code .hljs-comment {
  color: #546e7a;
}

.reveal pre code .hljs-number {
  color: #f78c6c;
}

.reveal code {
  color: var(--text-color);
}

/* ===========================================
   MATH (KaTeX)
   =========================================== */

.katex {
  color: var(--text-color);
  font-size: 1.1em;
}

.katex-display {
  margin: 15px 0;
}

.katex-display > .katex {
  font-size: 1.3em;
}

/* ===========================================
   VIDEO CONTAINERS
   =========================================== */

.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-container video,
.video-container img {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--box-radius);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
}

/* ===========================================
   SIDE QUEST BADGE
   =========================================== */

.side-quest-badge {
  display: inline-block;
  background: rgba(245, 166, 35, 0.15);
  color: var(--secondary-color);
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12pt;
  font-weight: 500;
  margin-bottom: 10px;
}

/* ===========================================
   TERMINAL OUTPUT - ANSI COLOR PALETTE
   Replaces inline `style="color:#..."` on spans
   inside .terminal-pre. A rule on the span itself
   overrides the color inherited from .terminal-pre.
   =========================================== */

.terminal-output .terminal-body .t-red    { color: #e06c75; }
.terminal-output .terminal-body .t-orange { color: #d19a66; }
.terminal-output .terminal-body .t-yellow { color: #e5c07b; }
.terminal-output .terminal-body .t-green  { color: #98c379; }
.terminal-output .terminal-body .t-cyan   { color: #56b6c2; }
.terminal-output .terminal-body .t-blue   { color: #61afef; }
.terminal-output .terminal-body .t-gray   { color: #8b949e; }
.terminal-output .terminal-body .t-fg     { color: #e8eaf0; }
.terminal-output .terminal-body .t-fail   { color: #e74c3c; }

.terminal-caption {
  margin-top: 15px;
  text-align: center;
}

/* ===========================================
   TIMELINE (module 1) - per-node structure
   Positional left/width and per-era colors stay
   inline; this captures the repeated boilerplate.
   =========================================== */

.tl-node  { position: absolute; transform: translateX(-50%); text-align: center; }
/* .reveal prefix needed: `.reveal p` (0,1,1) sets color/font-size and would
   otherwise beat a bare .tl-* class. The original used inline styles. */
.reveal .tl-label { font-size: 10pt; color: var(--muted-color); white-space: nowrap; margin: 0; }
.reveal .tl-year  { font-size: 11pt; font-weight: 600; margin: 2px 0 0 0; }
.tl-stem  { width: 1px; opacity: 0.5; margin: 2px auto 0; }
.tl-dot   { width: 10px; height: 10px; border-radius: 50%; margin: 0 auto; }

.tl-node.below .tl-stem  { margin: 0 auto; }
.tl-node.below .tl-year  { margin: 0; }
.tl-node.below .tl-label { margin: 2px 0 0 0; }

/* ===========================================
   CANONICAL SLIDE TYPES
   Backs the :::divider / :::columns / :::note /
   :::quiz / :::step / :::interactive fences so
   slides.md carries no inline layout styles.
   (.section-divider, .figure-card, .terminal-output,
    .hint-box are defined above and reused.)
   =========================================== */

/* :::columns - grid; template/gap/valign supplied by the build */
.reveal .slide-columns {
  display: grid;
  align-items: start;
  margin: 10px 0;
}

/* :::note - callout box (canonical replacement for .highlight-box) */
.reveal .note {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
  margin: 20px 0;
}

.reveal .note p {
  font-size: 18pt;
  margin: 0;
}

.reveal .note p + p {
  margin-top: 0.6em;
}

/* :::note variant="hint" - lighter, boxless (also used inside :::step) */
.reveal .note.hint-box {
  background: none;
  border: none;
  padding: 0;
}

/* :::quiz - prompt scales up; its last line is the question */
.reveal .quiz-prompt p {
  font-size: 18pt;
  margin: 0 0 0.6em 0;
}

.reveal .quiz-prompt p:last-child {
  font-size: 24pt;
  color: var(--text-color);
  margin: 0.5em 0 0 0;
}

.reveal .quiz-answer {
  margin-top: 30px;
}

/* :::step - spacing between code, hint, and answer */
.reveal .hint-box {
  margin-top: 22px;
}

.reveal .hint-box + .note {
  margin-top: 8px;
  padding: 12px 18px;
}

/* :::interactive - widget fills the slide body like a video */
.reveal .interactive-host {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

/* ===========================================
   SHARED INTERACTIVE WIDGET CHROME (.iw-*)
   Used by the :::interactive widgets defined in each module's config.js.
   Module 3 predates this and keeps its own .m3-* chrome.
   =========================================== */

.iw {
  display: flex;
  flex-direction: column;
  justify-content: center;   /* only bites when the content does not fill the slide */
  gap: 12px;
  width: 100%;
  height: 100%;
}

.iw-canvas-wrap {
  flex: 1;
  min-height: 0;
  width: 100%;
}

.iw-canvas {
  width: 100%;
  height: 100%;
  min-height: 0;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.iw-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.iw-btn {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: rgba(74, 158, 255, 0.10);
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 6px;
  padding: 7px 16px;
  cursor: pointer;
}

.iw-btn:hover {
  background: rgba(74, 158, 255, 0.22);
}

.iw-btn.iw-primary,
.iw-btn.active {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: #0a0e1a;
  font-weight: 600;
}

.iw-btn.iw-reset {
  background: rgba(245, 166, 35, 0.12);
  border-color: rgba(245, 166, 35, 0.40);
  color: var(--secondary-color);
}

.iw-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.iw-label {
  font-size: 12pt;
  color: var(--muted-color);
  margin: 0 2px 0 10px;
}

.reveal .iw-readout {
  font-size: 13pt;
  color: var(--muted-color);
  text-align: center;
  margin: 0;
  min-height: 1.4em;
}

.reveal .iw-readout strong {
  color: var(--secondary-color);
}

.iw-sliders {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 4px 18px;
  width: 100%;
  max-width: 100%;
  margin: 0 auto;
}

.iw-slider {
  display: grid;
  grid-template-columns: minmax(72px, auto) 1fr 58px;
  align-items: center;
  gap: 9px;
}

.reveal .iw-slider label {
  font-size: 11.5pt;
  color: var(--primary-color);
  font-weight: 600;
  margin: 0;
}

.iw-slider input[type="range"] {
  width: 100%;
  accent-color: var(--primary-color);
}

.reveal .iw-slider .iw-val {
  font-size: 11.5pt;
  color: var(--text-color);
  font-family: monospace;
  text-align: right;
  margin: 0;
}

.iw-text-input {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: 6px;

## Claude Shannon <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### The Father of Information Theory

- Created the mathematical theory of communication (1948)
- Defined the **"bit"** as a unit of information
- Showed that language has measurable statistical structure
- Proved reliable communication is possible over noisy channels

</div>

</div>

</div>

<div class="figure-card">

![John von Neumann](module_01_introduction/images/vonneumann.gif)

<div class="figure-info">

## John von Neumann <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### The Architecture of Computation

- Designed the stored-program architecture (von Neumann architecture)
- Programs and data stored in the same memory &mdash; the basis of all modern computers
- Contributed to game theory, quantum mechanics, and nuclear physics
- Worked on ENIAC and EDVAC at Los Alamos

</div>

</div>

</div>

<!-- .slide: id="info-theory" -->

## Information Theory (1940s-50s)

- **Shannon:** communication can be quantified in *bits*
- Any signal can be transmitted reliably through a noisy channel
- **Language is information** with measurable structure
- **Von Neumann:** stored-program architecture enables general computation

> "The fundamental problem of communication is that of reproducing at one point either exactly or approximately a message selected at another point."
>
> &mdash; Claude Shannon, 1948

## GOFAI (1950s-80s)

**"Good Old-Fashioned AI"** <!-- .element: class="text-xl" style="color: var(--secondary-color); margin-bottom: 10px;" -->

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

### The Approach

- Hand-written rules and symbolic logic
- Expert systems, search trees, knowledge bases
- If-then rules authored by domain experts

</div>

<div>

### The Problem

- Worked for narrow, well-defined tasks
- Couldn't handle ambiguity
- Couldn't scale to real language
- Brittle: one unexpected input breaks everything

</div>

</div>

# Language as Prediction

The core insight behind every LLM

<!-- .slide: id="shannon-insight" -->

## Shannon's Key Insight (1948)

- **Language is not random.** Given context, the next symbol is partially predictable.
- Shannon asked humans to guess the next character &mdash; they beat chance **by a wide margin**
- Modern LLMs use the same idea at much larger scale

<!-- .slide: id="chain-rule" -->

## The Chain Rule of Probability

How do we compute the probability of an entire sequence $P(w_1, w_2, \ldots, w_n)$? <!-- .element: class="text-lg" -->

$$P(w_1 w_2 \ldots w_n) = \prod_{k=1}^{n} P(w_k \mid w_1 \ldots w_{k-1})$$

- Splits one joint probability into a product of conditional probabilities
- Problem: we cannot count every possible history to estimate $P(w_k \mid w_1 \ldots w_{k-1})$

---

<!-- .slide: id="markov-assumption" -->

## The Markov Assumption

Condition on the last few symbols, not the entire history: <!-- .element: class="text-lg" -->

$$P(w_k \mid w_1 \ldots w_{k-1}) \approx P(w_k \mid w_{k-n+1} \ldots w_{k-1})$$

For example, instead of computing: <!-- .element: class="text-lg" -->

$P(\texttt{blue} \mid \texttt{The water of Walden Pond is so beautifully})$

A bigram approximates this as: <!-- .element: class="text-lg" -->

$P(\texttt{blue} \mid \texttt{beautifully})$ <!-- .element: style="color: var(--secondary-color);" -->

The n-gram trade-off: more context helps, but data gets sparser. <!-- .element: class="text-muted" style="font-size: 13pt;" -->

---

<!-- .slide: id="ngram-models" -->

## N-gram Model Estimation

Estimate each conditional probability by counting: <!-- .element: class="text-lg" -->

$$P(c_t \mid c_{t-n+1}, \ldots, c_{t-1}) = \frac{\text{count}(c_{t-n+1} \ldots c_t)}{\text{count}(c_{t-n+1} \ldots c_{t-1})}$$

- **Uniform random:** $P(c) = \frac{1}{27}$
- **Unigram:** $P(c) = \frac{\text{count}(c)}{\text{total characters}}$
- **Bigram:** $P(c_t \mid c_{t-1})$
- **Trigram:** $P(c_t \mid c_{t-2}, c_{t-1})$

Shannon described this procedure in 1948. The exercise builds it. <!-- .element: class="text-muted" style="font-size: 13pt;" -->

<!-- .slide: id="entropy" -->

## Shannon Entropy

How many bits do we need, on average, to encode a symbol? <!-- .element: class="text-lg" -->

$$H(X) = -\sum_{i} p(x_i) \log_2 p(x_i)$$

For a **uniform** distribution over 27 characters, every $p(x_i) = \frac{1}{27}$: <!-- .element: class="text-lg" -->

$$H = -\sum_{i=1}^{27} \tfrac{1}{27} \log_2 \tfrac{1}{27} = -27 \cdot \tfrac{1}{27} \cdot \log_2 \tfrac{1}{27} = \log_2(27) = 4.75 \text{ bits/char}$$

- 4.75 bits is the **maximum entropy** for 27 symbols. Structure lowers it.
- English text: $H \approx 1.0$ to $1.5$ bits/char (Shannon, 1951)
- The gap (4.75 vs ~1.2) is **redundancy**: most of each character is predictable from context

---

<!-- .slide: id="cross-entropy" -->

## Cross-Entropy

How well does a **model** $q$ predict text drawn from the true distribution $p$? <!-- .element: class="text-lg" -->

$$H(p, q) = -\sum_{c} \textcolor{#61afef}{p(c)} \log_2 q(c)$$

- Entropy uses one distribution twice. Cross-entropy uses two: $\textcolor{#61afef}{p}$ says how often a character actually occurs, $q$ says how many bits the model spends on it.
- We never know $\textcolor{#61afef}{p}$, but real text is a sample from it, so averaging over $N$ observed characters applies the same weighting:

$$H(p, q) \approx -\frac{1}{N} \sum_{i=1}^{N} \log_2 q(c_i \mid \text{context}_i)$$

**Perplexity** converts bits to an intuitive scale: $\text{Perplexity} = 2^{H(p, q)}$ <!-- .element: class="text-lg" -->

Perplexity 10 = as uncertain as choosing uniformly from 10 options. Lower is better. <!-- .element: class="text-muted" style="font-size: 13pt;" -->

## The Sampling Loop (Provided)

`generate_from_char_model()` is written for you in `src/sampling.py`. It is the loop every language model runs: <!-- .element: class="text-lg" -->

```python
while len(result) < length:
    # The current context is the last n-1 characters we have generated
    context = "".join(result[-(n - 1):])

    counter = model[context]                  # what followed this context?
    chars = list(counter.keys())
    weights = list(counter.values())
    next_char = random.choices(chars, weights=weights, k=1)[0]
    result.append(next_char)
```

Build the count table and text comes out. Modern LLMs run this same loop with a learned distribution in place of the counts. <!-- .element: class="text-lg" style="margin-top: 15px;" -->

        model[context][next_char] += 1

    return model
```

## Extra Credit: Scoring the Models

Optional. Generated text is judged by eye; **cross-entropy** judges it with a number. <!-- .element: class="text-lg" -->

- **`cross_entropy()`** &mdash; how surprised the model is by held-out text: $H(p, q) = -\frac{1}{N} \sum \log_2 q(c_i \mid \text{context})$
- **`perplexity()`** (provided) &mdash; $\text{PPL} = 2^{H(p,q)}$, the standard metric for language models

The runner trains orders 1 through 5 on the first 90% of the book and scores each on the last 10%. Perplexity should drop as order rises, then climb again once contexts become too rare to have been seen in training. The same metric evaluates modern LLMs. <!-- .element: class="text-lg" style="margin-top: 15px;" -->

## Extra Credit: Answer

```python
text = text.lower()
# Every key in the model has the same length: the context size (n-1)
context_len = len(next(iter(model)))

total_bits = 0.0
count = 0
for i in range(len(text) - context_len):
    context = text[i : i + context_len]
    next_char = text[i + context_len]
    counter = model.get(context)
    if counter and counter[next_char] > 0:
        prob = counter[next_char] / sum(counter.values())
    else:
        prob = 1e-6  # never seen: tiny probability instead of log(0)
    total_bits += -math.log2(prob)
    count += 1

return total_bits / count if count else 0.0
```

<!-- .slide: id="quiz-q1" -->

## Q1: Why Not Just Use Rules?

<div class="quiz-prompt">

GOFAI systems used hand-written rules to process language. Why did this approach ultimately fail for general language understanding? <!-- .element: class="text-lg" -->

</div>

<div class="fragment note quiz-answer">

**Answer:** <!-- .element: class="text-lg" -->

- Language is ambiguous and context-dependent
- No rule set can cover every meaning of every word ("bank" alone has dozens)
- Learned models discover these patterns from data instead

</div>

---

<!-- .slide: id="quiz-q2" -->

## Q2: Shannon's Entropy

<div class="quiz-prompt">

Shannon estimated English has $H \approx 1.0\text{--}1.5$ bits/char. A uniform 27-character alphabet has $H = \log_2(27) = 4.75$ bits/char. <!-- .element: class="text-lg" -->

What does this gap tell us about English as a communication system? <!-- .element: class="text-2xl" style="margin-top: 20px;" -->

</div>

<div class="fragment note quiz-answer">

**Answer:** <!-- .element: class="text-lg" -->

- English is highly redundant: about 70-80% of each character is predictable from context
- Redundancy makes autocomplete, spell-check, and language models possible
- Shannon made this redundancy measurable

</div>

---

<!-- .slide: id="quiz-q3" -->

## Q3: The Memorization Problem

<div class="quiz-prompt">

A word-level 5-gram model trained on *Alice in Wonderland* produces output that is mostly exact quotes from the book. <!-- .element: class="text-lg" -->

Why does this happen, and how do modern LLMs avoid it? <!-- .element: class="text-2xl" style="margin-top: 20px;" -->

</div>

<div class="fragment note quiz-answer">

**Answer:** <!-- .element: class="text-lg" -->

- Most 5-word contexts appear only once in a small corpus, so the model can only reproduce the original
- Modern LLMs train on far more data
- They use learned embeddings that generalize across similar contexts, not exact count tables

</div>

---

<!-- .slide: id="quiz-q4" -->

## Q4: Conditional Probability

<div class="quiz-prompt">

A trigram model trained on English text has these counts for the context "th": <!-- .element: class="text-lg" -->

```python
model["th"] = Counter({"e": 50, "a": 20, "i": 15, "o": 10, "u": 5})
```

What is $P(\texttt{e} \mid \texttt{th})$, and what does it mean for the model's behavior? <!-- .element: class="text-2xl" style="margin-top: 20px;" -->

</div>

<div class="fragment note quiz-answer">

**Answer:** $P(\texttt{e} \mid \texttt{th}) = \frac{50}{50+20+15+10+5} = \frac{50}{100} = 0.5$ <!-- .element: class="text-lg" -->

- After "th", the model generates "e" half the time
- The rest: "a" (20%), "i" (15%), "o" (10%), "u" (5%)
- This is why trigram output contains "the" so often, plus "tha", "thi", and others

</div>

---

<!-- .slide: id="quiz-q5" -->

## Q5: Compression and Prediction

<div class="quiz-prompt">

Shannon proved that a perfect language model would also be a perfect compressor, and vice versa. <!-- .element: class="text-lg" -->

Why are prediction and compression fundamentally the same problem? <!-- .element: class="text-2xl" style="margin-top: 20px;" -->

</div>

<div class="fragment note quiz-answer">

**Answer:** <!-- .element: class="text-lg" -->

- A symbol with probability $p$ needs $-\log_2(p)$ bits, so confident prediction means short codes
- Perfect prediction ($p = 1$) needs 0 bits
- Every compression scheme implicitly defines a probability model
- Source coding theorem: minimum average code length $=$ entropy $H(X)$

</div>

  <!-- Shared deck logic for every module -->
  <script>
// =====================================================================
// Core deck infrastructure: Manim steppers, Reveal.js init, syntax
// highlighting, interactive widget plumbing, and per-module hooks.
// Loaded before any widget definitions.
// =====================================================================

// =====================================================================
// Shared deck logic for every module. Per-module data and hooks arrive
// via window.MODULE_CONFIG, set by each module's config.js (which the
// build inlines BEFORE this file):
//
//   window.MODULE_CONFIG = {
//     title:          'LLMs 0 to 100 - Module N',  // sets document.title
//     manimSections:  { scene: ['Clip_0000.mp4', ...], ... },
//     widgets:        { name: function(host){...}, ... },  // optional
//     onReady:        function(reveal){...},               // optional
//     onSlideChanged: function(event){...}                 // optional
//   };
// =====================================================================
var MODULE_CONFIG = window.MODULE_CONFIG || {};

// ---- Manim section step-through player ----
// Section video lists are inline to avoid fetch() issues with file:// protocol.
var MANIM_SECTIONS = MODULE_CONFIG.manimSections || {};

var manimSteppers = {};

function initManimStepper(video) {
  var scene = video.getAttribute('data-manim-scene');
  var sections = MANIM_SECTIONS[scene] || [];
  var state = { sections: sections, current: -1, playing: false, video: video, scene: scene };
  manimSteppers[scene] = state;

  // Set poster frame from first section
  if (sections.length > 0) {
    video.src = (window.ASSET_BASE || '') + 'media/sections/' + sections[0];
    video.load();
  }

  video.addEventListener('ended', function() {
    state.playing = false;
  });
}

function advanceManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state || state.playing) return false;
  if (state.current >= state.sections.length - 1) return false;

  state.current++;
  state.playing = true;
  var file = state.sections[state.current];
  state.video.src = (window.ASSET_BASE || '') + 'media/sections/' + file;
  state.video.load();
  state.video.play().then(function() {}).catch(function() { state.playing = false; });
  return true;
}

function resetManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state) return;
  state.current = -1;
  state.playing = false;
  state.video.pause();
  if (state.sections.length > 0) {
    state.video.src = (window.ASSET_BASE || '') + 'media/sections/' + state.sections[0];
    state.video.load();
  }
}

// Instantly finish the section that is currently playing by jumping to its
// final frame. This lets an impatient "next" complete the animation in
// place rather than leaking through to reveal and skipping the slide.
// Returns true if it consumed the action (a video was actually playing).
function skipManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state || !state.playing) return false;
  var v = state.video;
  v.pause();
  // Seek just shy of the end so the step's end state stays on screen.
  if (v.duration && isFinite(v.duration)) {
    try { v.currentTime = Math.max(0, v.duration - 0.04); } catch (e) {}
  }
  state.playing = false;
  return true;
}

// One forward action on a manim slide. If a section is mid-play, the press
// completes it (skip to the end frame); otherwise it advances to the next
// section. Returns false only when there is nothing left to animate, which
// is the signal that reveal.js may now move on to the next slide.
function manimForward(scene) {
  var state = manimSteppers[scene];
  if (!state) return false;
  if (state.playing) return skipManimStepper(scene);
  return advanceManimStepper(scene);
}

// ---- Initialize Reveal.js ----
Reveal.initialize({
  width: 1280,
  height: 720,
  margin: 0,
  controls: true,
  progress: true,
  slideNumber: false,
  hash: true,
  transition: 'none',
  center: false,
  autoAnimateDuration: 0.8,
  plugins: [ RevealHighlight, RevealMarkdown ]
});

// ---- Syntax highlighting ----
// reveal-markdown converts the inline <textarea> into <pre><code> blocks
// in a deferred microtask, AFTER the highlight plugin's init() has already
// run, so code ships un-highlighted. Re-trigger the plugin once the blocks
// exist (on ready) and for any added later (on slidechanged).
function highlightAllCodeBlocks() {
  if (!Reveal.getPlugin) return;
  var hl = Reveal.getPlugin('highlight');
  if (!hl || typeof hl.highlightBlock !== 'function') return;
  document.querySelectorAll('pre code').forEach(function(block) {
    if (block.dataset.highlighted === 'yes') return;
    hl.highlightBlock(block);
  });
}
// reveal-markdown may materialize blocks in waves, so re-run the
// (idempotent) pass across the startup window rather than once.
Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    highlightAllCodeBlocks();
    if (tries > 25) clearInterval(iv);
  }, 100);
});
Reveal.on('slidechanged', highlightAllCodeBlocks);

// ---- Overflow scrolling ----
// Sections scroll when their content is taller than the slide (styles.css).
// Start every slide at the top, and scroll a newly revealed fragment into
// view if it landed below the fold.
Reveal.on('slidechanged', function(event) {
  if (event.currentSlide) event.currentSlide.scrollTop = 0;
});
Reveal.on('fragmentshown', function(event) {
  var frag = event.fragment;
  if (!frag || !frag.scrollIntoView) return;
  var section = frag.closest('section');
  if (!section || section.scrollHeight <= section.clientHeight) return;
  frag.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
});
Reveal.on('fragmentshown', highlightAllCodeBlocks);

function initStepperClickHandlers() {
  document.querySelectorAll('.manim-stepper').forEach(function(video) {
    if (video.dataset.clickInit) return;
    video.dataset.clickInit = '1';
    video.style.cursor = 'pointer';
    video.addEventListener('click', function(e) {
      var scene = video.getAttribute('data-manim-scene');
      manimForward(scene);
      e.stopPropagation();
      e.preventDefault();
    });
  });
}

function initAllSteppers() {
  document.querySelectorAll('.manim-stepper').forEach(function(v) {
    if (!manimSteppers[v.getAttribute('data-manim-scene')]) {
      initManimStepper(v);
    }
  });
  initStepperClickHandlers();
}

function renderMath() {
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false}
      ]
    });
  }
}

// reveal-markdown loads slides asynchronously, so the 'ready' event may
// fire before the markdown content is in the DOM. Poll briefly.
Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    if (document.querySelectorAll('section').length > 5 || tries > 20) {
      clearInterval(iv);
      initAllSteppers();
      renderMath();
    }
  }, 100);
});

// Reset steppers when leaving a slide
Reveal.on('slidechanged', function(event) {
  initAllSteppers();
  Object.keys(manimSteppers).forEach(function(scene) {
    if (!event.currentSlide.querySelector('[data-manim-scene="' + scene + '"]')) {
      resetManimStepper(scene);
    }
  });
});

// Intercept right arrow / space / enter on manim slides to step through
// sections. manimForward consumes the press while there is still animation
// to play (completing the current section or starting the next), so reveal
// only advances the slide once every section has been shown.
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
    var currentSlide = Reveal.getCurrentSlide();
    var stepper = currentSlide ? currentSlide.querySelector('.manim-stepper') : null;
    if (stepper) {
      var scene = stepper.getAttribute('data-manim-scene');
      if (manimForward(scene)) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }
  }
}, true);

// The on-screen controls (controls: true) navigate directly and bypass the
// keydown handler above, so guard the forward arrows the same way: a forward
// control press on a manim slide steps the animation before leaving.
document.addEventListener('click', function(e) {
  var btn = e.target.closest ? e.target.closest('.navigate-right, .navigate-down') : null;
  if (!btn) return;
  var currentSlide = Reveal.getCurrentSlide();
  var stepper = currentSlide ? currentSlide.querySelector('.manim-stepper') : null;
  if (stepper && manimForward(stepper.getAttribute('data-manim-scene'))) {
    e.stopImmediatePropagation();
    e.preventDefault();
  }
}, true);

// =====================================================================
// Interactive widgets (:::interactive). Each widget is a factory keyed
// by its `data-widget` value; it owns its host element and (re)draws
// whenever its slide becomes visible or the window resizes.
// =====================================================================
var INTERACTIVE_WIDGETS = {};

function hydrateInteractiveWidgets() {
  document.querySelectorAll('.interactive-host[data-widget]').forEach(function(host) {
    if (host.dataset.hydrated) return;
    var factory = INTERACTIVE_WIDGETS[host.getAttribute('data-widget')];
    if (!factory) return;
    host.dataset.hydrated = '1';
    host._widget = factory(host) || null;
  });
}

function refreshInteractiveWidgets() {
  document.querySelectorAll('.interactive-host[data-widget]').forEach(function(host) {
    if (host._widget && typeof host._widget.resize === 'function') host._widget.resize();
  });
}

Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    if (document.querySelector('.interactive-host[data-widget]') || tries > 25) {
      clearInterval(iv);
      hydrateInteractiveWidgets();
      requestAnimationFrame(refreshInteractiveWidgets);
    }
  }, 100);
});
Reveal.on('slidechanged', function() {
  hydrateInteractiveWidgets();
  requestAnimationFrame(refreshInteractiveWidgets);
});
window.addEventListener('resize', refreshInteractiveWidgets);

// ---- Per-module hooks (from MODULE_CONFIG) ----
if (MODULE_CONFIG.title) document.title = MODULE_CONFIG.title;
if (MODULE_CONFIG.widgets) Object.assign(INTERACTIVE_WIDGETS, MODULE_CONFIG.widgets);
if (typeof MODULE_CONFIG.onReady === 'function') {
  Reveal.on('ready', function() { MODULE_CONFIG.onReady(Reveal); });
}
if (typeof MODULE_CONFIG.onSlideChanged === 'function') {
  Reveal.on('slidechanged', function(event) { MODULE_CONFIG.onSlideChanged(event); });
}

// =====================================================================
// Slide annotation / drawing overlay.
//
// A full-viewport <canvas> the presenter can draw on top of any slide.
// Strokes are stored per slide (keyed by Reveal indices, in normalized
// coordinates) so they survive navigation and window resizes. A small
// floating toolbar exposes pen colors, an eraser, undo, and clear.
//
// Keyboard:
//   d       toggle draw mode on/off
//   e       eraser (while in draw mode)
//   c       clear the current slide's drawing
//   u       undo the last stroke
//   Escape  exit draw mode
//
// While draw mode is active, Reveal's own keyboard/touch navigation is
// suspended so drawing gestures never flip the slide.
// =====================================================================
(function () {
  'use strict';

  var PALETTE = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#ffffff'];
  var PEN_WIDTH = 3;
  var ERASER_WIDTH = 28;

  // strokesBySlide[key] = [ {color, width, erase, points:[{x,y}, ...]}, ... ]
  // Points are normalized to [0,1] against the canvas so they rescale on resize.
  var strokesBySlide = {};

  var canvas, ctx, toolbar;
  var drawMode = false;
  var erasing = false;
  var color = PALETTE[0];
  var drawing = false;
  var currentStroke = null;

  // ---- slide identity + canvas geometry ----
  function slideKey() {
    var idx = (typeof Reveal !== 'undefined' && Reveal.getIndices) ? Reveal.getIndices() : { h: 0, v: 0 };
    return idx.h + '-' + (idx.v || 0);
  }

  function strokes() {
    var k = slideKey();
    if (!strokesBySlide[k]) strokesBySlide[k] = [];
    return strokesBySlide[k];
  }

  // Size the backing store to device pixels for crisp lines, keep the CSS
  // box at viewport size, then repaint the current slide's strokes.
  function resizeCanvas() {
    if (!canvas) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }

  function drawStroke(s) {
    if (!s.points.length) return;
    var w = window.innerWidth, h = window.innerHeight;
    ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.points[0].x * w, s.points[0].y * h);
    for (var i = 1; i < s.points.length; i++) {
      ctx.lineTo(s.points[i].x * w, s.points[i].y * h);
    }
    // A single tap should still leave a visible dot.
    if (s.points.length === 1) ctx.lineTo(s.points[0].x * w + 0.01, s.points[0].y * h);
    ctx.stroke();
  }

  function redraw() {
    if (!ctx) return;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    strokes().forEach(drawStroke);
  }

  // ---- mode toggling ----
  // While drawing, the canvas captures pointer events. Arrow/space keys still
  // navigate slides (they never conflict with pointer drawing), so keyboard
  // nav stays on; only touch/swipe is suspended so finger-drawing on a
  // touchscreen can't flip the slide out from under the pen.
  function setDrawMode(on) {
    drawMode = on;
    if (!on) erasing = false;
    document.body.classList.toggle('draw-mode', on);
    if (canvas) canvas.style.pointerEvents = on ? 'auto' : 'none';
    if (typeof Reveal !== 'undefined' && Reveal.configure) {
      Reveal.configure({ touch: !on });
    }
    updateToolbar();
  }

  function setColor(c) {
    color = c;
    erasing = false;
    if (!drawMode) setDrawMode(true);
    updateToolbar();
  }

  function setEraser() {
    erasing = true;
    if (!drawMode) setDrawMode(true);
    updateToolbar();
  }

  function clearSlide() {
    strokesBySlide[slideKey()] = [];
    redraw();
  }

  function undo() {
    strokes().pop();
    redraw();
  }

  function injectStyles() {
    var css = [
      '#draw-canvas{position:fixed;inset:0;z-index:40;pointer-events:none;touch-action:none;}',
      'body.draw-mode #draw-canvas{cursor:crosshair;}',
      // Hidden by default; slides up into view only while the pointer is in
      // the bottom hover band (see the mousemove handler that toggles .visible).
      '#draw-toolbar{position:fixed;bottom:14px;left:50%;',
      '  transform:translateX(-50%) translateY(24px);',
      '  z-index:60;display:flex;align-items:center;gap:8px;padding:7px 10px;',
      '  background:rgba(20,20,24,0.92);border:1px solid rgba(255,255,255,0.18);',
      '  border-radius:10px;opacity:0;pointer-events:none;',
      '  transition:opacity 0.15s,transform 0.15s;font-family:sans-serif;}',
      '#draw-toolbar.visible{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}',
      '.draw-btn{width:26px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,0.25);',
      '  background:transparent;cursor:pointer;padding:0;display:flex;align-items:center;',
      '  justify-content:center;color:#fff;font-size:14px;line-height:1;}',
      '.draw-btn:hover{background:rgba(255,255,255,0.15);}',
      '.draw-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}',
      '.draw-swatch.active{border-color:#fff;}',
      '.draw-btn.active{background:rgba(255,255,255,0.28);}',
      '.draw-sep{width:1px;height:22px;background:rgba(255,255,255,0.2);}'
    ].join('\n');
    var style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);
  }

  function buildToolbar() {
    toolbar = document.createElement('div');
    toolbar.id = 'draw-toolbar';

    // Pen toggle
    var penBtn = document.createElement('button');
    penBtn.className = 'draw-btn';
    penBtn.dataset.role = 'pen';
    penBtn.title = 'Draw (d)';
    penBtn.textContent = '✎'; // pencil
    penBtn.addEventListener('click', function () { setDrawMode(!drawMode); });
    toolbar.appendChild(penBtn);

    toolbar.appendChild(sep());

    // Color swatches
    PALETTE.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'draw-swatch';
      b.dataset.color = c;
      b.style.background = c;
      b.title = 'Pen color';
      b.addEventListener('click', function () { setColor(c); });
      toolbar.appendChild(b);
    });

    toolbar.appendChild(sep());

    // Eraser / undo / clear
    toolbar.appendChild(iconBtn('⊘', 'Eraser (e)', 'eraser', setEraser));
    toolbar.appendChild(iconBtn('↶', 'Undo (u)', 'undo', undo));
    toolbar.appendChild(iconBtn('✕', 'Clear slide (c)', 'clear', clearSlide));

    document.body.appendChild(toolbar);
    updateToolbar();
  }

  function sep() {
    var s = document.createElement('span');
    s.className = 'draw-sep';
    return s;
  }

  function iconBtn(glyph, title, role, handler) {
    var b = document.createElement('button');
    b.className = 'draw-btn';
    b.dataset.role = role;
    b.title = title;
    b.textContent = glyph;
    b.addEventListener('click', handler);
    return b;
  }

  function updateToolbar() {
    if (!toolbar) return;
    toolbar.querySelectorAll('.draw-swatch').forEach(function (b) {
      b.classList.toggle('active', drawMode && !erasing && b.dataset.color === color);
    });
    var pen = toolbar.querySelector('[data-role="pen"]');
    if (pen) pen.classList.toggle('active', drawMode);
    var er = toolbar.querySelector('[data-role="eraser"]');
    if (er) er.classList.toggle('active', drawMode && erasing);
  }

  // ---- pointer drawing ----
  function point(e) {
    return { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight };
  }

  function startStroke(e) {
    if (!drawMode) return;
    drawing = true;
    currentStroke = {
      color: color,
      width: erasing ? ERASER_WIDTH : PEN_WIDTH,
      erase: erasing,
      points: [point(e)]
    };
    strokes().push(currentStroke);
    if (canvas.setPointerCapture && e.pointerId != null) {
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
    e.preventDefault();
  }

  function extendStroke(e) {
    if (!drawing || !currentStroke) return;
    currentStroke.points.push(point(e));
    redraw();
    e.preventDefault();
  }

  function endStroke() {
    drawing = false;
    currentStroke = null;
  }

  function bindCanvasEvents() {
    canvas.addEventListener('pointerdown', startStroke);
    canvas.addEventListener('pointermove', extendStroke);
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);
    canvas.addEventListener('pointerleave', endStroke);
  }

  function bindKeys() {
    // Capture phase so we act before Reveal, but only for our bare shortcuts
    // (ignore when a modifier is held or focus is in a text field).
    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;

      if (e.key === 'd' || e.key === 'D') {
        setDrawMode(!drawMode);
        e.preventDefault(); e.stopImmediatePropagation();
      } else if (!drawMode) {
        return; // remaining shortcuts only apply while drawing
      } else if (e.key === 'e' || e.key === 'E') {
        setEraser(); e.preventDefault(); e.stopImmediatePropagation();
      } else if (e.key === 'c' || e.key === 'C') {
        clearSlide(); e.preventDefault(); e.stopImmediatePropagation();
      } else if (e.key === 'u' || e.key === 'U') {
        undo(); e.preventDefault(); e.stopImmediatePropagation();
      } else if (e.key === 'Escape') {
        setDrawMode(false); e.preventDefault(); e.stopImmediatePropagation();
      }
    }, true);
  }

  // Reveal the toolbar only while the pointer is within a band along the
  // bottom of the viewport (or hovering the toolbar itself).
  function bindToolbarReveal() {
    var BAND = 90; // px from the bottom edge
    window.addEventListener('mousemove', function (e) {
      var near = e.clientY >= window.innerHeight - BAND;
      toolbar.classList.toggle('visible', near);
    });
    // Keep it up while the cursor is actually on the toolbar (drawing gestures
    // never fire mousemove there, but plain hover to click a tool should hold).
    toolbar.addEventListener('mouseenter', function () { toolbar.classList.add('visible'); });
  }

  function init() {
    injectStyles();

    canvas = document.createElement('canvas');
    canvas.id = 'draw-canvas';
    document.body.appendChild(canvas);
    ctx = canvas.getContext('2d');

    buildToolbar();
    bindCanvasEvents();
    bindKeys();
    bindToolbarReveal();
    resizeCanvas();

    window.addEventListener('resize', resizeCanvas);
    if (typeof Reveal !== 'undefined' && Reveal.on) {
      // Repaint the destination slide's stored strokes after navigation.
      Reveal.on('slidechanged', redraw);
      Reveal.on('ready', resizeCanvas);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

// =====================================================================
// MLP Core — Shared neural-net library consumed by multiple widgets.
// Deterministic data generation, preset lookup-model geometry, and the
// Adam trainer (used by the debug harness; the deck uses lookupModel).
// =====================================================================

// =====================================================================
// Shared MLP core for the boundaryExplorer and mlpBoundary widgets.
// The slide widgets use deterministic lookup presets keyed by
// dataset/width/depth so a button click always loads the intended working
// or under-capacity example. The older Adam trainer is kept as a fallback
// helper for the debug harness, but the deck paths pass a dataset name and
// therefore use lookupModel() rather than browser-time training.
// =====================================================================
var MLP = (function () {
  var EPOCHS = 220, LR = 0.05, BATCH = 16;
  var MAX_RESTARTS = 24, TIME_BUDGET_MS = 450, EARLY_STOP = 0.999;
  var CENTER = 0.5; // input centering offset

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;

      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };

  // Deterministic datasets (fixed seed) normalized into [0.04, 0.96].
  function generateData(name) {
    var rnd = mulberry32(7);
    var pts = [];
    if (name === 'linear') {

      { x1: 0.04, y1: 0.86, x2: 0.86, y2: 0.04 },
      { x1: 0.14, y1: 0.96, x2: 0.96, y2: 0.14 }
    ].slice(0, count);
  }

  function geometryForModel(dataset, data, count, depth, band, solved, centerline, redCenterline) {
    count = Math.max(1, count);
    if (dataset === 'xor' && count >= 2) {
      return { polygon: null, lines: [
        { x1: 0.04, y1: 0.66, x2: 0.66, y2: 0.04 },
        { x1: 0.34, y1: 0.96, x2: 0.96, y2: 0.34 }
      ].slice(0, count) };
    }
    if (dataset === 'linear' || count === 1) {
      return { polygon: null, lineMode: 'halfPlane', lines: [{ x1: 0.04, y1: 0.96, x2: 0.96, y2: 0.04 }] };
    }
    if (dataset === 'moons' || dataset === 'spiral') {
      if (count < 3) {
        return { polygon: null, lineMode: count > 1 ? 'stripe' : 'halfPlane', lines: simpleUnderfitLines(count) };
      }
      if (!solved || (dataset === 'spiral' && depth < 2)) {
        var polygon = hullPolygon(data, count, dataset === 'spiral' ? 0.02 : 0.035);
        return { polygon: polygon, lines: polygonEdges(polygon) };
      }
      var tube = tubePolygon(dataset, data, count, band);
      if (tube) return { polygon: tube, lines: polygonEdges(tube) };
      return { polygon: null, lines: classifierBoundaryLines(data, count, dataset, centerline, redCenterline) };
    }
    return { polygon: null, lineMode: 'halfPlane', lines: [{ x1: 0.04, y1: 0.96, x2: 0.96, y2: 0.04 }] };
  }

  function lookupModel(dataset, data, width, depth) {
    var pieces = effectivePieces(dataset, width, depth);
    var solved = pieces >= requiredPieces(dataset);
    var display = displayPieces(width, depth);
    var band = dataset === 'spiral' ? 0.088 : 0.16;
    var centerCount = Math.max(3, Math.ceil(pieces / 2) + 1);
    if (solved) {
      centerCount = dataset === 'spiral'
        ? Math.max(12, display + 1)
        : Math.max(8, display * 2);
    }
    var centerline = (dataset === 'moons' || dataset === 'spiral') ? sampleClassPath(data, 1, centerCount) : null;
    var redCenterline = (dataset === 'moons' || dataset === 'spiral') ? sampleClassPath(data, 0, centerCount) : null;
    var lookupPoints = (dataset === 'moons' || dataset === 'spiral') && solved ? data : pickPrototypes(data, pieces);
    var geom = geometryForModel(dataset, data, display, depth, band, solved, centerline, redCenterline);
    return {
      kind: 'lookup',
      dataset: dataset,
      width: width,
      depth: depth,
      solved: solved,
      pieces: pieces,
      displayPieces: display,
      lookupPoints: lookupPoints,
      centerline: centerline,
      redCenterline: redCenterline,
      band: band,
      polygon: geom.polygon,
      lineMode: geom.lineMode,
      lines: geom.lines
    };
  }

  // One Adam run: EPOCHS epochs of shuffled mini-batches over CENTER-shifted
  // inputs. Standard backprop for a ReLU stack with a sigmoid + BCE output.
  function runAdam(data, layers, rng) {
    var pts = data.map(function (p) { return { x: [p.x - CENTER, p.y - CENTER], y: p.cls }; });
    var N = pts.length, b1 = 0.9, b2 = 0.999, eps = 1e-8;
    var mW = layers.map(function (L) { return L.W.map(function (r) { return r.map(function () { return 0; }); }); });
    var vW = layers.map(function (L) { return L.W.map(function (r) { return r.map(function () { return 0; }); }); });
    var mb = layers.map(function (L) { return L.b.map(function () { return 0; }); });
    var vb = layers.map(function (L) { return L.b.map(function () { return 0; }); });
    var t = 0;
    for (var ep = 0; ep < EPOCHS; ep++) {
      for (var i = N - 1; i > 0; i--) { var jr = Math.floor(rng() * (i + 1)); var tmp = pts[i]; pts[i] = pts[jr]; pts[jr] = tmp; }
      for (var start = 0; start < N; start += BATCH) {
        var end = Math.min(start + BATCH, N), bn = end - start;
        var dW = layers.map(function (L) { return L.W.map(function (r) { return r.map(function () { return 0; }); }); });
        var db = layers.map(function (L) { return L.b.map(function () { return 0; }); });
        for (var s = start; s < end; s++) {
          var as = [pts[s].x], zs = [];
          for (var l = 0; l < layers.length; l++) {
            var z = vecAdd(matVec(layers[l].W, as[l]), layers[l].b);
            zs.push(z);
            if (l < layers.length - 1) as.push(z.map(function (v) { return Math.max(0, v); }));
            else as.push(z);
          }
          var pred = 1 / (1 + Math.exp(-as[as.length - 1][0]));
          var delta = [pred - pts[s].y];
          for (var l = layers.length - 1; l >= 0; l--) {
            var aPrev = as[l];
            for (var j = 0; j < layers[l].W.length; j++) {
              for (var k = 0; k < layers[l].W[j].length; k++) dW[l][j][k] += delta[j] * aPrev[k];
              db[l][j] += delta[j];
            }
            if (l > 0) {
              var W = layers[l].W, nd = [];
              for (var k = 0; k < layers[l - 1].b.length; k++) {
                var sum = 0;
                for (var j = 0; j < W.length; j++) sum += W[j][k] * delta[j];
                nd.push(sum * (zs[l - 1][k] > 0 ? 1 : 0));
              }
              delta = nd;
            }
          }
        }
        t++;
        var bc1 = 1 - Math.pow(b1, t), bc2 = 1 - Math.pow(b2, t);
        for (var l = 0; l < layers.length; l++) {
          for (var j = 0; j < layers[l].W.length; j++) {
            for (var k = 0; k < layers[l].W[j].length; k++) {
              var g = dW[l][j][k] / bn;
              mW[l][j][k] = b1 * mW[l][j][k] + (1 - b1) * g;
              vW[l][j][k] = b2 * vW[l][j][k] + (1 - b2) * g * g;
              layers[l].W[j][k] -= LR * (mW[l][j][k] / bc1) / (Math.sqrt(vW[l][j][k] / bc2) + eps);
            }
            var gb = db[l][j] / bn;
            mb[l][j] = b1 * mb[l][j] + (1 - b1) * gb;
            vb[l][j] = b2 * vb[l][j] + (1 - b2) * gb * gb;
            layers[l].b[j] -= LR * (mb[l][j] / bc1) / (Math.sqrt(vb[l][j] / bc2) + eps);
          }
        }
      }
    }
    return layers;
  }

  // Fold the input centering into layer-0 bias so the net evaluates on raw
  // coordinates: W.(x - 0.5) + b == W.x + (b - 0.5 * sum(W_row)).
  function absorbCenter(layers) {
    var L0 = layers[0];
    for (var j = 0; j < L0.W.length; j++) {
      var s = 0; for (var k = 0; k < L0.W[j].length; k++) s += L0.W[j][k];
      L0.b[j] -= CENTER * s;
    }
    return layers;
  }

  // Best-of-N restarts under a wall-clock budget: stop on a (near-)perfect
  // fit, else keep retrying until the budget is spent. Returns the most
  // accurate net, already converted for raw-coordinate evaluation.
  function train(data, width, depth, dataset) {
    if (dataset) return lookupModel(dataset, data, width, depth);
    var best = null, bestAcc = -1, t0 = Date.now();
    for (var r = 0; r < MAX_RESTARTS; r++) {
      var rng = mulberry32(1009 + data.length * 17 + width * 101 + depth * 10007 + r * 7919);
      var net = absorbCenter(runAdam(data, createNet(width, depth, rng), rng));
      var acc = computeAccuracy(data, net);
      if (acc > bestAcc) { bestAcc = acc; best = net; }
      if (bestAcc >= EARLY_STOP) break;
      if (Date.now() - t0 > TIME_BUDGET_MS) break;
    }
    return best;
  }

  return {
    generateData: generateData, train: train,
    predictOne: predictOne, computeAccuracy: computeAccuracy,
  };
})();

// Shared helpers for the :::interactive widgets defined in each module's
// config.js. Loaded after config.js, so factories must reference WIDGET_UTIL
// from inside their bodies (which run at DOM-ready), never at definition time.
var WIDGET_UTIL = (function () {
  var COL = {
    text: '#e8eaf0', muted: '#8892a4', line: '#2a3450',
    primary: '#4a9eff', secondary: '#f5a623', green: '#3fb950',
    red: '#e74c3c', purple: '#c792ea', bg: '#0d1225'
  };

  // Size the backing store to the device pixel ratio so canvas text stays sharp.
  function fit(canvas) {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return null;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: h };
  }

  // Keep slider and button interaction from reaching reveal's navigation keys.
  function stop(host) {
    ['pointerdown', 'keydown', 'click'].forEach(function (ev) {
      host.addEventListener(ev, function (e) { e.stopPropagation(); });
    });
  }

  function rounded(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Markup for one labelled range slider inside an .iw-sliders grid.
  function sliderHTML(key, label, min, max, step, value) {
    return '<div class="iw-slider">' +
      '<label for="s-' + key + '">' + label + '</label>' +
      '<input id="s-' + key + '" type="range" data-key="' + key + '" min="' + min +
      '" max="' + max + '" step="' + step + '" value="' + value + '">' +
      '<span class="iw-val" data-val="' + key + '"></span>' +
      '</div>';
  }

  // Wire every slider in `host` to one callback; returns a read of all values.
  function bindSliders(host, onChange) {
    var inputs = Array.prototype.slice.call(host.querySelectorAll('input[type="range"]'));
    inputs.forEach(function (el) {
      el.addEventListener('input', function () { onChange(el.getAttribute('data-key'), parseFloat(el.value)); });
    });
    return function () {
      var out = {};
      inputs.forEach(function (el) { out[el.getAttribute('data-key')] = parseFloat(el.value); });
      return out;
    };
  }

  function setVal(host, key, text) {
    var el = host.querySelector('[data-val="' + key + '"]');
    if (el) el.textContent = text;
  }

  // Exclusive button group: marks the clicked button active, calls back with its value.
  function bindToggle(host, selector, onPick) {
    var btns = Array.prototype.slice.call(host.querySelectorAll(selector));
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        btns.forEach(function (o) { o.classList.remove('active'); });
        b.classList.add('active');
        onPick(b.getAttribute('data-val'), b);
      });
    });
  }

  function softmax(logits, temperature) {
    var T = temperature || 1;
    var scaled = logits.map(function (z) { return z / T; });
    var m = Math.max.apply(null, scaled);
    var ex = scaled.map(function (z) { return Math.exp(z - m); });
    var s = ex.reduce(function (a, b) { return a + b; }, 0);
    return ex.map(function (v) { return v / s; });
  }

  // Deterministic PRNG so a widget redraws identically on resize.
  function rng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  // Decimal units throughout (1 GB = 1000 MB), matching how model and cache
  // sizes are quoted in the deck.
  function fmtBytes(gb) {
    if (gb >= 1000) return (gb / 1000).toFixed(2) + ' TB';
    if (gb >= 1) return gb.toFixed(gb >= 10 ? 1 : 2) + ' GB';
    var mb = gb * 1000;
    if (mb >= 0.1) return mb.toFixed(mb >= 100 ? 0 : mb >= 10 ? 1 : 2) + ' MB';
    return (mb * 1000).toFixed(0) + ' KB';
  }

  // Compact SI-ish formatting for parameter and token counts.
  function fmtCount(n) {
    if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
    if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(Math.round(n));
  }

  return {
    COL: COL, fit: fit, stop: stop, rounded: rounded,
    sliderHTML: sliderHTML, bindSliders: bindSliders, setVal: setVal,
    bindToggle: bindToggle, softmax: softmax, rng: rng,
    fmtBytes: fmtBytes, fmtCount: fmtCount
  };
}());

  </script>
</body>
</html>
