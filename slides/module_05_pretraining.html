<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMs 0 to 100</title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <!-- KaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>

  <!-- Module-specific <head> includes (e.g. Chart.js); empty for most modules -->
  

  <!-- Shared styles + per-module overrides, inlined by the build -->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

/* ===========================================
   CSS VARIABLES
   =========================================== */
:root {
  --background-color: #0a0e1a;
  --section-divider-bg: #0d1225;

  --heading-font: "Space Grotesk", Helvetica, sans-serif;
  --body-font: "Inter", Helvetica, sans-serif;
  --base-font-size: 32px;
  --text-size: 16pt;
  --h1-size: 48pt;
  --h2-size: 36pt;
  --h3-size: 24pt;
  --footnote-size: 11pt;

  --primary-color: #4a9eff;
  --secondary-color: #f5a623;
  --text-color: #e8eaf0;
  --muted-color: #8892a4;
  --line-color: #2a3450;

  --slide-padding: 60px;
  --slide-padding-top: 24px;
  --content-gap: 18px;

  --box-radius: 8px;
}

/* ===========================================
   BASE STYLES
   =========================================== */

.reveal {
  font-family: var(--body-font);
  font-size: var(--base-font-size);
}

.reveal strong,
.reveal b {
  font-weight: bold;
}

.reveal a {
  color: var(--primary-color);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.reveal a:hover {
  color: var(--text-color);
}

.reveal-viewport {
  background-color: var(--background-color);
}

.reveal-viewport.is-section-divider .slide-background.present {
  background-color: var(--section-divider-bg) !important;
}

.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4,
.reveal h5,
.reveal h6 {
  font-family: var(--heading-font);
  text-transform: none;
  color: var(--text-color);
  font-weight: 600;
  line-height: 1.2;
}

.reveal h1 { font-size: var(--h1-size); }
.reveal h2 { font-size: var(--h2-size); margin-bottom: 0; }
.reveal h3 { font-size: var(--h3-size); }

.reveal p,
.reveal li,
.reveal td,
.reveal th,
.reveal blockquote {
  font-size: var(--text-size);
  color: var(--text-color);
  line-height: 1.5;
}

/* Vertical separation between newline-separated sentences on text slides.
   Scoped to a slide's top-level paragraphs (the prose flow); paragraphs
   nested inside components (terminal captions, figure cards, grid columns)
   keep their own tighter spacing so dense component slides do not overflow.
   Adjacent margins collapse, so the gap between two paragraphs is 0.9em. */
.reveal .slides section > p {
  margin: 0.4em 0 0.9em 0;
}

/* ===========================================
   LISTS
   =========================================== */

.reveal ul {
  list-style: none;
  padding-left: 0;
  margin: 15px 0;
}

.reveal ul li {
  position: relative;
  padding-left: 25px;
  margin-bottom: 10px;
}

.reveal ul li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.6em;
  width: 8px;
  height: 8px;
  background: var(--primary-color);
  border-radius: 50%;
}

.reveal ul ul li::before {
  background: var(--muted-color);
  width: 6px;
  height: 6px;
}

.reveal blockquote p {
  font-size: inherit;
}

/* ===========================================
   SLIDE LAYOUT
   =========================================== */

.reveal .slides section {
  height: 100%;
  display: flex !important;
  flex-direction: column !important;
  padding: var(--slide-padding-top) var(--slide-padding) var(--slide-padding) var(--slide-padding) !important;
  box-sizing: border-box;
  text-align: left;
  /* Any slide whose content runs past the bottom scrolls instead of clipping.
     The scrollbar only appears when needed. */
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: #30363d transparent;
}

.reveal .slides section::-webkit-scrollbar {
  width: 8px;
}

.reveal .slides section::-webkit-scrollbar-thumb {
  background: #30363d;
  border-radius: 4px;
}

.reveal .slides section.stack {
  padding: 0 !important;
}

.reveal .slides section > .content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: var(--content-gap);
  text-align: left;
}

.reveal .slides section > .footnote {
  position: absolute;
  bottom: 15px;
  left: var(--slide-padding);
  right: var(--slide-padding);
  font-size: var(--footnote-size);
  color: var(--muted-color);
}

/* ===========================================
   SECTION DIVIDERS
   =========================================== */

.reveal .slides section.section-divider {
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}

.reveal .slides section.section-divider h1 {
  font-size: 56pt;
  text-align: center;
  color: var(--primary-color);
}

.reveal .slides section.section-divider p {
  font-size: 20pt;
  color: var(--muted-color);
}

/* ===========================================
   TEXT SIZE UTILITIES
   =========================================== */

.text-lg { font-size: 18pt !important; }
.text-xl { font-size: 20pt !important; }
.text-2xl { font-size: 24pt !important; }
.text-3xl { font-size: 28pt !important; }
.text-4xl { font-size: 32pt !important; }

.text-muted { color: var(--muted-color) !important; }
.text-center { text-align: center !important; }
.text-uppercase { text-transform: uppercase; letter-spacing: 0.1em; }
.font-light { font-weight: 300; }
.font-bold { font-weight: 600; }

/* ===========================================
   BLOCKQUOTES
   =========================================== */

.reveal blockquote {
  border-left: 4px solid var(--primary-color);
  padding-left: 20px;
  margin: 20px 0;
  font-style: italic;
  background: none;
  box-shadow: none;
  width: 100%;
  max-width: none;
}

.reveal blockquote cite {
  display: block;
  margin-top: 10px;
  font-style: normal;
  color: var(--muted-color);
}

/* ===========================================
   ACCENT UNDERLINE ON TITLES
   =========================================== */

.reveal .slides section > h2 {
  flex-shrink: 0;
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line-color);
}

/* ===========================================
   FIGURE CARD - for notable figures slides
   =========================================== */

.figure-card {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  align-items: start;
}

.figure-card img {
  border-radius: var(--box-radius);
  width: 100%;
  box-shadow: 0 4px 20px rgba(74, 158, 255, 0.15);
}

.figure-card .figure-info h3 {
  margin: 0 0 5px 0;
  color: var(--secondary-color);
  font-size: 14pt;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ===========================================
   ERA BADGE - for timeline labels
   =========================================== */

.era-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12pt;
  font-weight: 500;
}

.era-badge.summer {
  background: rgba(245, 166, 35, 0.2);
  color: var(--secondary-color);
}

.era-badge.winter {
  background: rgba(74, 158, 255, 0.15);
  color: #6cb4ff;
}

.era-badge.spring {
  background: rgba(80, 200, 120, 0.2);
  color: #50c878;
}

/* ===========================================
   HIGHLIGHT BOX
   =========================================== */

.highlight-box {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
}

/* Exercise hint: a single fragment that reveals the whole hint at once.
   The wrapping .fragment div is what animates; this just sizes the text
   (matching the old text-lg intent) and removes the global paragraph
   margin so the one-line hint is not double-spaced. */
.reveal .hint-box p {
  font-size: 18pt;
  margin: 0;
}

/* ===========================================
   COURSE STRUCTURE
   =========================================== */

.course-summary {
  max-width: 1120px;
  margin: 0 0 16px 0;
  color: #f0f4fb;
  font-size: 18pt !important;
  line-height: 1.4 !important;
}

.course-track-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

.module-track-card {
  background: rgba(74, 158, 255, 0.07);
  border: 1px solid rgba(74, 158, 255, 0.22);
  border-radius: var(--box-radius);
  padding: 20px 22px;
}

.module-track-kicker {
  font-size: 12pt;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--secondary-color);
  margin-bottom: 8px;
}

.module-track-card h3 {
  margin: 0 0 8px 0;
}

.module-track-intro {
  font-size: 14pt !important;
  color: #d7ddea !important;
  margin: 0 0 10px 0;
  line-height: 1.4 !important;
}

.compact-list {
  margin: 0;
}

.reveal ul.compact-list li {
  font-size: 16pt;
  line-height: 1.35;
  margin-bottom: 7px;
  padding-left: 20px;
}

.course-note {
  margin-top: 14px;
  color: #d7ddea;
  font-size: 15pt !important;
  line-height: 1.35 !important;
}

.course-glossary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  margin-top: 14px;
}

.glossary-item {
  background: rgba(245, 166, 35, 0.08);
  border: 1px solid rgba(245, 166, 35, 0.18);
  border-radius: var(--box-radius);
  padding: 12px 14px;
}

.glossary-item strong {
  color: var(--secondary-color);
}

.glossary-item p {
  font-size: 13pt !important;
  color: #d7ddea !important;
  margin: 6px 0 0 0;
  line-height: 1.4;
}

/* ===========================================
   TERMINAL OUTPUT
   =========================================== */

.terminal-output {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 0;
  max-width: 800px;
  margin: 0 auto;
  text-align: left;
}

.terminal-output .terminal-bar {
  background: #161b22;
  border-radius: 8px 8px 0 0;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.terminal-output .terminal-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.terminal-output .terminal-dot.red { background: #ff5f57; }
.terminal-output .terminal-dot.yellow { background: #febc2e; }
.terminal-output .terminal-dot.green { background: #28c840; }

.terminal-output .terminal-title {
  color: #8b949e;
  font-family: monospace;
  font-size: 10pt;
  margin-left: 8px;
}

.terminal-output .terminal-body {
  padding: 15px 20px;
}

.terminal-output .terminal-body pre {
  margin: 0;
  background: none !important;
  box-shadow: none !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output.dense .terminal-body {
  padding: 10px 20px;
}

.reveal .terminal-output.dense .terminal-body pre.terminal-pre {
  font-size: 9pt;
  line-height: 1.28;
}

.reveal .terminal-output .terminal-body pre.terminal-pre span {
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre p {
  display: inline;
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
  margin: 0 !important;
  color: inherit;
}

.reveal .terminal-output .terminal-body pre code {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output .terminal-body .prompt {
  color: #8b949e;
}

.terminal-output .terminal-body .success {
  color: #3fb950;
}

.terminal-output .terminal-body .header {
  font-weight: bold;
}

.terminal-output .terminal-body .skipped {
  color: #8b949e;
  font-style: italic;
}

/* ===========================================
   TURNING POINT SLIDE
   =========================================== */

.turning-point h2 {
  border-bottom-color: var(--secondary-color) !important;
}

/* ===========================================
   CODE BLOCKS
   =========================================== */

.reveal pre {
  margin-bottom: 0;
  width: 100%;
  box-sizing: border-box;
  box-shadow: none !important;
  background: none !important;
}

.reveal pre code {
  font-size: 14pt;
  line-height: 1.4;
  padding: 10px 20px;
  border-radius: var(--box-radius);
  background: rgba(20, 25, 45, 0.8);
  color: var(--text-color);
  max-height: 400px;
}

.reveal pre code .hljs-keyword,
.reveal pre code .hljs-built_in {
  color: #c792ea;
}

.reveal pre code .hljs-string {
  color: #c3e88d;
}

.reveal pre code .hljs-comment {
  color: #546e7a;
}

.reveal pre code .hljs-number {
  color: #f78c6c;
}

.reveal code {
  color: var(--text-color);
}

/* ===========================================
   MATH (KaTeX)
   =========================================== */

.katex {
  color: var(--text-color);
  font-size: 1.1em;
}

.katex-display {
  margin: 15px 0;
}

.katex-display > .katex {
  font-size: 1.3em;
}

/* ===========================================
   VIDEO CONTAINERS
   =========================================== */

.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-container video,
.video-container img {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--box-radius);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
}

/* ===========================================
   SIDE QUEST BADGE
   =========================================== */

.side-quest-badge {
  display: inline-block;
  background: rgba(245, 166, 35, 0.15);
  color: var(--secondary-color);
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12pt;
  font-weight: 500;
  margin-bottom: 10px;
}

/* ===========================================
   TERMINAL OUTPUT - ANSI COLOR PALETTE
   Replaces inline `style="color:#..."` on spans
   inside .terminal-pre. A rule on the span itself
   overrides the color inherited from .terminal-pre.
   =========================================== */

.terminal-output .terminal-body .t-red    { color: #e06c75; }
.terminal-output .terminal-body .t-orange { color: #d19a66; }
.terminal-output .terminal-body .t-yellow { color: #e5c07b; }
.terminal-output .terminal-body .t-green  { color: #98c379; }
.terminal-output .terminal-body .t-cyan   { color: #56b6c2; }
.terminal-output .terminal-body .t-blue   { color: #61afef; }
.terminal-output .terminal-body .t-gray   { color: #8b949e; }
.terminal-output .terminal-body .t-fg     { color: #e8eaf0; }
.terminal-output .terminal-body .t-fail   { color: #e74c3c; }

.terminal-caption {
  margin-top: 15px;
  text-align: center;
}

/* ===========================================
   TIMELINE (module 1) - per-node structure
   Positional left/width and per-era colors stay
   inline; this captures the repeated boilerplate.
   =========================================== */

.tl-node  { position: absolute; transform: translateX(-50%); text-align: center; }
/* .reveal prefix needed: `.reveal p` (0,1,1) sets color/font-size and would
   otherwise beat a bare .tl-* class. The original used inline styles. */
.reveal .tl-label { font-size: 10pt; color: var(--muted-color); white-space: nowrap; margin: 0; }
.reveal .tl-year  { font-size: 11pt; font-weight: 600; margin: 2px 0 0 0; }
.tl-stem  { width: 1px; opacity: 0.5; margin: 2px auto 0; }
.tl-dot   { width: 10px; height: 10px; border-radius: 50%; margin: 0 auto; }

.tl-node.below .tl-stem  { margin: 0 auto; }
.tl-node.below .tl-year  { margin: 0; }
.tl-node.below .tl-label { margin: 2px 0 0 0; }

/* ===========================================
   CANONICAL SLIDE TYPES
   Backs the :::divider / :::columns / :::note /
   :::quiz / :::step / :::interactive fences so
   slides.md carries no inline layout styles.
   (.section-divider, .figure-card, .terminal-output,
    .hint-box are defined above and reused.)
   =========================================== */

/* :::columns - grid; template/gap/valign supplied by the build */
.reveal .slide-columns {
  display: grid;
  align-items: start;
  margin: 10px 0;
}

/* :::note - callout box (canonical replacement for .highlight-box) */
.reveal .note {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
  margin: 20px 0;
}

.reveal .note p {
  font-size: 18pt;
  margin: 0;
}

.reveal .note p + p {
  margin-top: 0.6em;
}

/* :::note variant="hint" - lighter, boxless (also used inside :::step) */
.reveal .note.hint-box {
  background: none;
  border: none;
  padding: 0;
}

/* :::quiz - prompt scales up; its last line is the question */
.reveal .quiz-prompt p {
  font-size: 18pt;
  margin: 0 0 0.6em 0;
}

.reveal .quiz-prompt p:last-child {
  font-size: 24pt;
  color: var(--text-color);
  margin: 0.5em 0 0 0;
}

.reveal .quiz-answer {
  margin-top: 30px;
}

/* :::step - spacing between code, hint, and answer */
.reveal .hint-box {
  margin-top: 22px;
}

.reveal .hint-box + .note {
  margin-top: 8px;
  padding: 12px 18px;
}

/* :::interactive - widget fills the slide body like a video */
.reveal .interactive-host {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

/* ===========================================
   SHARED INTERACTIVE WIDGET CHROME (.iw-*)
   Used by the :::interactive widgets defined in each module's config.js.
   Module 3 predates this and keeps its own .m3-* chrome.
   =========================================== */

.iw {
  display: flex;
  flex-direction: column;
  justify-content: center;   /* only bites when the content does not fill the slide */
  gap: 12px;
  width: 100%;
  height: 100%;
}

.iw-canvas-wrap {
  flex: 1;
  min-height: 0;
  width: 100%;
}

.iw-canvas {
  width: 100%;
  height: 100%;
  min-height: 0;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.iw-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.iw-btn {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: rgba(74, 158, 255, 0.10);
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 6px;
  padding: 7px 16px;
  cursor: pointer;
}

.iw-btn:hover {
  background: rgba(74, 158, 255, 0.22);
}

.iw-btn.iw-primary,
.iw-btn.active {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: #0a0e1a;
  font-weight: 600;
}

.iw-btn.iw-reset {
  background: rgba(245, 166, 35, 0.12);
  border-color: rgba(245, 166, 35, 0.40);
  color: var(--secondary-color);
}

.iw-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.iw-label {
  font-size: 12pt;
  color: var(--muted-color);
  margin: 0 2px 0 10px;
}

.reveal .iw-readout {
  font-size: 13pt;
  color: var(--muted-color);
  text-align: center;
  margin: 0;
  min-height: 1.4em;
}

.reveal .iw-readout strong {
  color: var(--secondary-color);
}

.iw-sliders {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 4px 18px;
  width: 100%;
  max-width: 100%;
  margin: 0 auto;
}

.iw-slider {
  display: grid;
  grid-template-columns: minmax(72px, auto) 1fr 58px;
  align-items: center;
  gap: 9px;
}

.reveal .iw-slider label {
  font-size: 11.5pt;
  color: var(--primary-color);
  font-weight: 600;
  margin: 0;
}

.iw-slider input[type="range"] {
  width: 100%;
  accent-color: var(--primary-color);
}

.reveal .iw-slider .iw-val {
  font-size: 11.5pt;
  color: var(--text-color);
  font-family: monospace;
  text-align: right;
  margin: 0;
}

.iw-text-input {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: 6px;
  padding: 7px 12px;
  width: 100%;
  max-width: 620px;
}

/* DOM-based widget pieces: token chips, panels, and two-column bodies. */

.iw-body {
  flex: 1;

<!-- .slide: id="title" class="section-divider" data-state="is-section-divider" -->

# LLMs 0 to 100

Module 5: Pretraining


---

<!-- .slide: id="review-1" -->

## Review: From Module 4

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The machinery we built**

- Text is tokenized, embedded, and run through a stack of decoder blocks
- The model outputs **logits**: one score per vocabulary token, at every position
- A decoding strategy (greedy, temperature, top-k, top-p) turns logits into the next token
- Architecture is the **shape** of the computation, not the **weights**

</div>

<div>

**The question this module answers**

- A fresh transformer has random weights, so its output is noise
- **Pretraining** turns random weights into useful ones
- The only input: raw text

</div>

</div>

---

<!-- .slide: id="review-2" -->

## Review: Two Ideas We Reuse

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Causal masking (Module 3 and 4)**

- Each position attends only to itself and earlier positions
- So every position predicts the **next** token without seeing the answer
- One sequence = many prediction problems at once

</div>

<div>

**Cross-entropy (Module 2)**

The same loss that trained the classifier:

$$\mathcal{L} = -\log p_\theta(\text{true next token})$$

Goal: assign **high probability to the token that actually comes next**.

</div>

</div>

<div class="note">

Causal masking + cross-entropy is the whole idea. The rest of the module &mdash; data pipelines, schedules, scaling laws, distributed training &mdash; is the engineering that makes it work at scale.

</div>

---

<!-- .slide: id="divider-what" class="section-divider" data-state="is-section-divider" -->

# What Pretraining Is

Learning the structure of language from raw text


---

<!-- .slide: id="self-supervised" -->

## Self-Supervised Learning

Pretraining: learn from broad raw text **before** specializing for any task.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Supervised learning**

- Humans label the data: image "cat", review "positive"
- Labels are expensive and scarce

</div>

<div>

**Self-supervised learning**

- The label is already in the text: the **next token**
- No human annotation
- A sequence of length $T$ yields $T$ training examples

</div>

</div>

Free supervision is why pretraining can consume trillions of tokens.

---

<!-- .slide: id="base-model" -->

## The Result Is a Base Model

- A base model knows grammar, facts, style, and code patterns
- It is **not** yet a helpful assistant &mdash; that is finetuning (Module 6)

---

<!-- .slide: id="why-enough" -->

## "Just" Predicting the Next Token

To push the loss lower, the model must learn everything that makes text predictable:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

- **Grammar and syntax** &mdash; to keep sentences well-formed
- **Facts about the world** &mdash; "the capital of France is ___"
- **Style and register** &mdash; legal text, poetry, code comments

</div>

<div>

- **Code structure** &mdash; balanced brackets, valid identifiers
- **Task formats** &mdash; question/answer, translation, summaries
- **Implicit reasoning** &mdash; arithmetic, deduction, multi-step chains

</div>

</div>

One simple objective + enormous diverse data = broad capability.

---

<!-- .slide: id="few-shot" -->

## A Striking Side Effect: In-Context Learning

A large enough base model infers a task from **examples in the prompt**:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

```text
sea -> mer
sky -> ciel
cat -> chat
dog ->
```

</div>

<div>

- The model was only trained to continue text
- It continues the **pattern** and answers `chien`
- This is **few-shot / in-context learning**
- Emergent from scale, not explicitly trained

</div>

</div>

<div class="note">

Nobody designed a "few-shot mode" into the objective; it appears for free at scale. More on prompting in Module 10.

</div>

---

<!-- .slide: id="divider-objective" class="section-divider" data-state="is-section-divider" -->

# The Training Objective

Causal language modeling, and the alternatives


---

<!-- .slide: id="causal-lm" -->

## Causal Language Modeling

The GPT-style objective: predict token $x_t$ from the tokens before it.

The training pair is the **same sequence, shifted by one**:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**input** $x$

$$x_0,\ x_1,\ \ldots,\ x_{T-1}$$

</div>

<div>

**target** $y$

$$x_1,\ x_2,\ \ldots,\ x_{T}$$

</div>

</div>

- One logit vector at **every** position: $T$ predictions, $T$ loss terms per sequence
- Labels are free: just shift

---

<section id="next-token-anim">
  <div class="video-container">
    <video class="manim-stepper" data-manim-scene="next-token" preload="auto"></video>
  </div>
</section>

---

<!-- .slide: id="objective-equation" -->

## The Cross-Entropy Objective

Minimize the average negative log-probability of the true next token:

$$\mathcal{L} = -\frac{1}{T}\sum_{t=1}^{T}\log p_\theta\left(x_t \mid x_{<t}\right)$$

This is **cross-entropy** against the true next token, averaged over every position.

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 20px;">

<div>

**loss** (nats)

the raw objective above

</div>

<div>

**perplexity**

$$\exp(\mathcal{L})$$
the effective number of choices

</div>

<div>

**bits per token**

$$\mathcal{L} / \ln 2$$
Shannon's units (Module 1)

</div>

</div>

Three units, one quantity. Detail in a few slides.

---

<div class="figure-card">

![Alec Radford](module_05_pretraining/images/radford.jpg)

<div class="figure-info">

## Alec Radford <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Improving Language Understanding by Generative Pre-Training (2018)

- Led the GPT line of generative pretraining at OpenAI
- Showed that a single decoder trained only to predict the next token transfers to many tasks
- GPT-2 (2019) made large-scale causal language modeling the dominant recipe

</div>

</div>

</div>

---

<!-- .slide: id="other-objectives" -->

## Other Pretraining Objectives

Two alternatives change **which tokens are predicted from which context**:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**Masked language modeling (BERT)**

- Hide ~15% of tokens; predict them from **both sides**
- Builds rich bidirectional representations
- Not a natural generator; only masked positions give signal

</div>

<div>

**Denoising / span corruption (T5)**

- Corrupt a passage (drop or shuffle spans)
- Train an encoder-decoder to **reconstruct** it
- Flexible "text-to-text", but heavier machinery

</div>

</div>

---

<div class="figure-card">

![Devlin, Chang, Lee, and Toutanova](module_05_pretraining/images/devlin.jpg)

<div class="figure-info">

## Devlin, Chang, Lee, and Toutanova <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### BERT: Pre-training of Deep Bidirectional Transformers (2018)

- Introduced masked language modeling as the reference point for bidirectional pretraining
- Each masked position is predicted from left and right context at once
- Excellent for understanding tasks; not designed for open-ended generation

</div>

</div>

</div>

---

<!-- .slide: id="why-causal-won" -->

## Why Decoder-Only Causal LM Won

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

- **Dense signal.** Every position is a prediction: $T$ examples per sequence. MLM learns only from the ~15% it masks.
- **Trivial data construction.** Input and target are the same stream, shifted by one.

</div>

<div>

- **Natural generation.** The objective *is* generation: sample, append, repeat.
- **Prompt compatibility.** Classification, translation, and Q&A all become text completion.

</div>

</div>

---

<!-- .slide: id="side-quest-compression" -->

## Side Quest: Compression Is Prediction

A model that predicts text well is a good **compressor**: encoding the next token takes about $-\log_2 p(\text{token})$ bits.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

- Shannon's through-line from Module 1: **cross-entropy, perplexity, and bits per token** measure compression
- Lower loss = fewer bits per token = tighter description of the data

</div>

<div>

- Minimizing loss and maximizing compression are the **same objective**
- Ilya Sutskever frames next-token prediction as compression; the **Hutter Prize** rewards compressing Wikipedia; DeepMind's **"Language Modeling Is Compression"** (2023) makes the equivalence precise

</div>

</div>

---

From a pile of text to a stream of training batches

Most of the work happens **before** the optimizer runs. Data decisions shape the model as much as architecture does.

---

<!-- .slide: id="collect-filter" -->

## Collect, Then Filter

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Collect**

- Web pages, books, code, papers, forums, documentation
- The mixture depends on the model's goals and on legal and ethical constraints

</div>

<div>

**Filter**

Raw text is mostly junk. Remove:

- Boilerplate and low-quality pages
- Near-duplicate documents (deduplication)
- Unsafe content categories and private information
- Obvious benchmark leakage, where it can be found

</div>

</div>

Quality and deduplication beat raw volume (more in the data-quality section).

---

<!-- .slide: id="tokenize-pack" -->

## Tokenize and Pack

The Module 4 tokenizer turns strings into IDs. Packing turns IDs into fixed-length blocks:

- Documents vary in length; the GPU wants uniform `(batch, block)` tensors
- Concatenate documents into one long stream, chop into equal blocks
- Mark document boundaries with **special tokens**

<div class="note">

**Special tokens** are reserved vocabulary IDs that never come from ordinary text: **BOS** marks document start, **EOS** the end (GPT-2 uses one token, `<|endoftext|>`, for both). They teach the model that context resets at a boundary. Sampling EOS at generation time means "I am done."

</div>

---

<!-- .slide: id="split-train-eval" -->

## Split, Train, Evaluate

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Hold out a validation set**

- Split into train and validation **before** reporting metrics
- Validation loss then measures generalization, not memorized batches

</div>

<div>

**Train in batches**

Each step is the same four moves:

1. Forward pass on a batch
2. Shifted-target cross-entropy loss
3. Backpropagation
4. Optimizer update

</div>

</div>

Measure validation loss periodically to check the model generalizes beyond the batches it just saw.

<!-- .slide: id="divider-recipe" class="section-divider" data-state="is-section-divider" -->

# The Training Recipe

The engineering that keeps a long run stable


---

<!-- .slide: id="recipe-intro" -->

## One Loop, Repeated

- Module 2 gave the core: SGD, Adam, mini-batches, learning rates
- Pretraining adds a few standard choices that keep **long, large** runs stable
- The loop never changes: forward, loss, backward, update &mdash; millions of times

---

  <div class="video-container">
    <video class="manim-stepper" data-manim-scene="training-loop" preload="auto"></video>
  </div>
</section>

---

<!-- .slide: id="adamw" -->

## AdamW: The Standard Optimizer

**AdamW** = Adam's adaptive step sizes + **decoupled weight decay**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Adam part**

- Running averages of the gradient and its square
- Each parameter gets its own effective learning rate
- Robust to the very different gradient scales in a deep model

</div>

<div>

**Weight-decay part**

- Pulls weights toward zero each step (regularization, Module 2)
- "Decoupled": applied directly to the weights, separate from the adaptive gradient term
- Works better in practice

</div>

</div>

---

<!-- .slide: id="lr-schedule" -->

## Learning-Rate Schedule: Warmup, Then Cosine Decay

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Warmup**

- Start near zero, ramp up over the first few hundred steps
- Early weights are random and gradients large; small steps avoid a blow-up

</div>

<div>

**Cosine decay**

- After the peak, decay smoothly to a small floor
- Big steps early to explore, small steps late to settle

</div>

</div>

---

  </div>

<!-- .slide: id="stability-tricks" -->

## Stability and Scale

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 20px;">

<div>

**Gradient clipping**

- Cap the global gradient norm
- One bad batch cannot wreck the weights
- Prevents loss spikes

</div>

<div>

**Gradient accumulation**

- Sum gradients over several small batches before stepping
- Simulates a larger **effective** batch than one GPU holds

</div>

<div>

**Mixed precision**

- Most math in `bf16`, not `fp32`
- Fewer bits = faster compute, larger models in memory
- More in Module 9

</div>

</div>

---

<!-- .slide: id="overfit-check" -->

## Sanity Check: Overfit One Batch

Before a long run, train repeatedly on a **single batch**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Why it works**

- Any model with enough capacity can memorize one tiny batch
- Its loss should crater toward zero

</div>

<div>

**What it catches**

- Loss does not crater = broken loop
- Detached gradient, wrong target shift, frozen parameter, bad learning rate
- Cheap to run, fails loudly

</div>

</div>

The exercise runs exactly this check.

<!-- .slide: id="divider-loss" class="section-divider" data-state="is-section-divider" -->

# Reading the Loss

Loss, perplexity, and what progress looks like


---

<!-- .slide: id="loss-intro" -->

## Cross-Entropy Measures Surprise

Loss = the model's average **surprise** at the true next token. Lower loss = more probability on what actually came next.

The same number wears three hats:

- **loss** in nats, the raw objective
- **perplexity** $= \exp(\text{loss})$, the effective number of next-token choices
- **bits per token** $= \text{loss} / \ln 2$, the compression view from Module 1

<div class="note">

A **nat** is the natural-log sibling of the bit: $\ln$ instead of $\log_2$. PyTorch's `log` is natural, so raw loss comes out in nats. One nat $= 1/\ln 2 \approx 1.44$ bits.

</div>

<!-- .slide: id="divider-data" class="section-divider" data-state="is-section-divider" -->

# Data Quality, Contamination, Memorization

Pretraining data is a design decision, not neutral infrastructure


---

<!-- .slide: id="more-not-better" -->

## More Data Is Not Automatically Better

Beyond a point, **what** you train on matters more than how much:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- **Quality** &mdash; a smaller corpus of clean text can beat a larger pile of boilerplate and spam
- **Diversity** &mdash; many domains and styles generalize better than one repeated genre

</div>

<div>

- **Deduplication** &mdash; removing near-duplicates improves generalization, even though it removes tokens
- **Domain balance** &mdash; the ratio of code, prose, and academic text shapes what the model is good at

</div>

</div>

---

<!-- .slide: id="side-quest-memorization" -->

## Side Quest: Memorization vs Generalization

Repeat one passage many times in a tiny dataset, and the model **memorizes that exact string**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Memorization**

- "The model learned this exact character sequence"
- Verbatim recall: a privacy and copyright liability
- Not a transferable skill

</div>

<div>

**Generalization**

- "The model learned a pattern it can reuse"
- The goal of pretraining
- Why we **deduplicate** and watch **validation loss**

</div>

</div>

Duplicated text quietly turns generalization back into memorization.

---

<!-- .slide: id="contamination" -->

## Benchmark Contamination

Evaluation examples leak into pretraining data; the model scores by **recall**, not ability.

- The model may have literally seen the test questions and answers
- Benchmark numbers then overstate real capability
- Decontamination tries to remove known benchmark text; a suspiciously high score deserves scrutiny
- Easy to introduce by accident (benchmarks live on the scraped web), hard to fully rule out

---

<!-- .slide: id="data-mixture" -->

## Data Mixture Shapes Behavior

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 20px;">

<div>

**Code-heavy**

- Improves coding ability
- Less obviously: some structured reasoning

</div>

<div>

**Academic text**

- Shifts style
- Broadens factual knowledge

</div>

<div>

**Conversational text**

- Changes how the model handles turns and informal language

</div>

</div>

<div class="note">

Gao, Biderman, and collaborators at EleutherAI built **The Pile**: 800GB, 22 curated sources, the standard reference corpus for open pretraining.

</div>

---

<!-- .slide: id="side-quest-data-wall" -->

## Side Quest: The Data Wall

What if high-quality **human** text, not model size, is the scarce resource?

- The best public text is finite; the largest models already train on much of it
- Responses: aggressive **curation and deduplication**, careful **domain balance**, **synthetic data** from other models
- The new question is not "can we afford a bigger model?" but "is there enough good data to feed it?"

A recurring theme in later modules; "just scale up" is incomplete.

---

<!-- .slide: id="divider-scaling" class="section-divider" data-state="is-section-divider" -->

# Scaling Laws

Predicting performance before spending the compute


---

<!-- .slide: id="scaling-predictable" -->

## Loss Improves Predictably

Kaplan, McCandlish, and collaborators (2020): loss falls as a smooth **power law** in three quantities, across many orders of magnitude:

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 20px;">

<div>

**Parameters** $N$

a bigger model

</div>

<div>

**Data** $D$

more training tokens

</div>

<div>

**Compute** $C$

more total FLOPs

</div>

</div>

- On log-log axes, loss vs compute is nearly a straight line
- So small-scale runs predict a large model's loss **before** committing the budget

---

<section id="scaling-anim">
  <div class="video-container">
    <video class="manim-stepper" data-manim-scene="scaling-laws" preload="auto"></video>
  </div>
</section>

---

<!-- .slide: id="compute-6nd" -->

## A Computable Handle: C &approx; 6ND

For a dense transformer, total pretraining compute is well approximated by

$$C \approx 6 N D$$

where $N$ is the parameter count and $D$ is the number of training tokens (Kaplan et al., 2020).

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Where the 6 comes from**

- Forward pass: ~2 FLOPs per parameter per token
- Backward pass: about twice that

</div>

<div>

**Why it is useful**

- "How big, how long?" becomes arithmetic
- Fix $C$, and $N$ and $D$ trade off directly

</div>

</div>

---

<!-- .slide: id="chinchilla" -->

## Chinchilla: Compute-Optimal Balance

Hoffmann and the Chinchilla team (2022): for a **fixed compute budget**, many earlier models were too large for their token counts.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The lesson**

- Parameters and tokens should grow **together**
- A smaller model on more tokens beats a larger model starved of data

</div>

<div>

**The rule of thumb**

- ~**20 training tokens per parameter** is compute-optimal
- A 1B-parameter model wants ~20B tokens

</div>

</div>

---

<section id="scaling-planner">
  <h2>Spend One Compute Budget</h2>
  <div class="interactive-host" data-widget="scalingPlanner"></div>
</section>

---

<!-- .slide: id="serving-optimal" -->

## Compute-Optimal Is Not Serving-Optimal

Chinchilla optimizes **training**. A model is trained once, then served billions of times.

- Constant serving means inference cost dominates, so **smaller** wins
- Llama-style models train **smaller models on far more tokens** than Chinchilla suggests
- Extra training compute buys much larger inference savings

<div class="note">

Model size, data size, batch size, sequence length, hardware, and wall-clock time all interact; pretraining is engineering as much as modeling. Brown and the GPT-3 team (2020) had already shown the payoff of scale: strong **few-shot** behavior through prompting.

</div>

---

<!-- .slide: id="side-quest-emergence" -->

## Side Quest: Emergent Abilities, Real or Mirage?

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Sharp emergence (Wei et al., 2022)**

- Some capabilities appear to switch on **suddenly** past a scale threshold
- Near-zero performance, then a jump

</div>

<div>

**A measurement artifact? (Schaeffer et al., 2023)**

- The jump can come from a **thresholded or nonlinear metric**
- Under a smoother metric, the same capability often improves gradually

</div>

</div>

A discontinuous-looking curve may describe the metric, not the model.

---

<!-- .slide: id="divider-distributed" class="section-divider" data-state="is-section-divider" -->

# Training at Scale

When the model, batch, or run no longer fits on one device


---

<!-- .slide: id="distributed-intro" -->

## Pretraining Becomes a Systems Problem

- A frontier run does not fit on one GPU: not the batch, often not even the model
- Pretraining becomes a **distributed-systems** problem; throughput matters as much as the loss curve
- The most common tool, **data parallelism**: replicate the model, split the batch, synchronize gradients

---

<section id="data-parallel-anim">
  <div class="video-container">
    <video class="manim-stepper" data-manim-scene="data-parallel" preload="auto"></video>
  </div>
</section>

---

<!-- .slide: id="parallelism-kinds" -->

## Two Ways to Split the Work

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Data parallelism**

- Every GPU holds a **full copy** of the model
- Each processes a different slice of the batch
- An **all-reduce** averages gradients so replicas stay identical
- Scales the batch

</div>

<div>

**Model / tensor / pipeline parallelism**

Split the **model itself** when it does not fit on one GPU:

- **Tensor**: split individual weight matrices across GPUs
- **Pipeline**: put different layers on different GPUs

</div>

</div>

**FSDP** is the hybrid: data-parallel structure, but parameters, gradients, and optimizer state are sharded too. Frontier runs combine all of these.

---

<!-- .slide: id="scale-realities" -->

## The Realities of Scale

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Thousands of GPUs, for months**

- **Networking, storage, and scheduling** become first-order concerns
- Moving gradients can cost as much time as computing them

</div>

<div>

**Failures are expected**

- Over months on thousands of machines, hardware **will** fail
- **Checkpoint and resume** is mandatory: save training state so a crash costs hours, not weeks

</div>

</div>

<div class="note">

Implementation details of distributed training are the subject of Module 9.

</div>

<!-- .slide: id="divider-assistant" class="section-divider" data-state="is-section-divider" -->

# From Base Model to Assistant

Why impressive pretraining is not yet a product


---

<!-- .slide: id="base-continues" -->

## A Base Model Continues Text

A base model **continues text**; it does not reliably **follow intent**. It will happily:

- Complete a chat transcript by inventing **both** sides
- Continue a document, write code, imitate a style
- Carry on harmful text, because that too is a pattern in the data

It is not refusing to help, and not trying to help. It is predicting the next token.

---

<!-- .slide: id="side-quest-base-vs-assistant" -->

## Side Quest: Same Prompt, Two Models

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**Base model** sees a document to continue

```text
What is the capital of France?
What is the capital of Italy?
What is the largest ocean?
```
It continues the **pattern** &mdash; more quiz questions &mdash; instead of answering.

</div>

<div>

**Assistant model** infers your intent

```text
What is the capital of France?

The capital of France is Paris.
```
It treats the text as a **request** and satisfies it.

</div>

</div>

Same knowledge; different behavior. The difference is what comes after pretraining.

Try it (free Hugging Face account): paste the quiz prompt into the [Qwen3-4B-Base](https://huggingface.co/Qwen/Qwen3-4B-Base) inference widget, then into an instruction-tuned model on [HuggingChat](https://huggingface.co/chat), and compare.

---

<!-- .slide: id="aligning-behavior" -->

## Shaping Behavior

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Instruction finetuning**

- Continue training on **prompts paired with desired responses**
- Teaches: a prompt is something to satisfy, not continue

</div>

<div>

**Preference optimization and RL**

- Shape behavior toward **helpfulness, honesty, appropriate refusal, tool use**
- Signal: human or model preferences

</div>

</div>

Same machinery (gradients, batches, a loss). New **data**, new **behavioral target**.

---

<!-- .slide: id="handoff" -->

## Next Class: Finetuning

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**What pretraining gave us**

- A base model with grammar, facts, style, code, latent skills
- Powerful but unaligned

</div>

<div>

**What comes next**

- **Finetuning and alignment** turn it into an assistant
- Same optimizer, same backprop; new data, new target

</div>

</div>

Pretraining built the engine. The next class teaches it to drive.

# Quiz


---

<!-- .slide: id="quiz-one-loss-per-token" -->

## One Loss Per Token

<div class="quiz-prompt">

Causal language modeling produces one loss term per **token**, not one per sequence. Why?

</div>

<div class="fragment note quiz-answer">

- Causal masking lets every position predict its next token from earlier tokens only
- A sequence of length $T$ = $T$ prediction problems, each with its own cross-entropy term
- This dense signal makes causal LM sample-efficient; masked LM learns only from the ~15% it masks

</div>

---

<!-- .slide: id="quiz-base-instruction" -->

## Base Models and Instructions

<div class="quiz-prompt">

Why can a base model **continue** an instruction without reliably **obeying** it?

</div>

<div class="fragment note quiz-answer">

- A base model predicts the most likely continuation, nothing more
- "List three colors" is statistically as likely to be followed by more instructions (a worksheet) as by an answer
- No objective says "satisfy the request"; that is instruction finetuning (Module 6)

</div>

---

<!-- .slide: id="quiz-val-loss" -->

## Why Validation Loss

<div class="quiz-prompt">

What does **validation** loss catch that training loss can hide?

</div>

<div class="fragment note quiz-answer">

- Training loss can fall from **memorizing** exact batches
- Validation loss uses held-out text, so it only improves when patterns **generalize**
- Training loss falling while validation flattens or rises = the classic overfitting signature

</div>

---

<!-- .slide: id="quiz-dedup" -->

## Deduplication Removes Tokens, Yet Helps

<div class="quiz-prompt">

Deduplication throws away training tokens. Why can it still **improve** generalization?

</div>

<div class="fragment note quiz-answer">

- Duplicates push the model to memorize exact strings instead of reusable patterns
- Removing them rebalances toward diversity: the same gradient steps teach more general structure
- The lost tokens were redundant; the gained patterns transfer
- Bonus: less verbatim memorization of sensitive or copyrighted text

</div>

---

<!-- .slide: id="quiz-chinchilla" -->

## Smaller Can Beat Bigger

<div class="quiz-prompt">

Under a **fixed compute budget**, why might a smaller model trained on more tokens beat a larger model trained on fewer?

</div>

<div class="fragment note quiz-answer">

- $C \approx 6ND$: for fixed $C$, parameters $N$ and tokens $D$ trade off directly
- A too-large model exhausts the budget after too few tokens
- A smaller model affords many more tokens in the same budget
- Chinchilla: ~20 tokens per parameter is compute-optimal; the smaller, better-fed model wins

</div>

---

<!-- .slide: id="quiz-units" -->

## Loss, Perplexity, Bits

<div class="quiz-prompt">

How do you convert a loss in **nats** into **perplexity** and into **bits per token**?

</div>

<div class="fragment note quiz-answer">

- Perplexity $= \exp(\text{loss})$: the effective number of equally likely next-token choices
- Bits per token $= \text{loss} / \ln 2$: nats converted to bits
- All three are the same quantity in different units

</div>

---

<!-- .slide: id="quiz-warmup" -->

## Why Warmup Helps

<div class="quiz-prompt">

Why does learning-rate **warmup** reduce the chance of early training instability?

</div>

<div class="fragment note quiz-answer">

- At initialization, gradients are large and poorly conditioned
- Adam's running averages have not yet stabilized
- Full-size steps can throw the weights into a bad region and spike the loss
- Ramping up slowly keeps early updates small while the model is most fragile

</div>

---

<!-- .slide: id="quiz-parallelism" -->

## Two Kinds of Parallelism

<div class="quiz-prompt">

What is the difference between **data parallelism** and **model / tensor / pipeline** parallelism?

</div>

<div class="fragment note quiz-answer">

- Data parallelism: replicate the **whole model** per GPU, split the **batch**, all-reduce gradients. Requires the model to fit on one device
- Model / tensor / pipeline parallelism: split the **model itself** (weight matrices or whole layers) when it does not fit
- Large runs combine both

</div>

---

<!-- .slide: id="quiz-emergence" -->

## Emergence or Mirage?

<div class="quiz-prompt">

Why might an apparent **emergent ability** be a measurement artifact rather than a sudden new capability?

</div>

<div class="fragment note quiz-answer">

- Harsh metrics (e.g. exact match) score 0 until every step is correct
- A model improving smoothly in its probabilities stays near zero, then appears to "switch on" at a threshold
- Under a smoother metric the same capability rises gradually
- The discontinuity can live in the metric, not the model

</div>

  // parameters and tokens, and read the predicted loss off the curve.
  // Loss uses the Chinchilla parametric fit L(N, D) = E + A/N^alpha + B/D^beta,
  // with the corrected coefficients from Besiroglu et al. (2024). Those are
  // the ones whose optimum reproduces the paper's own ~20 tokens per parameter;
  // the coefficients printed in Hoffmann et al. (2022) put it near 60.
  // ===================================================================
  function scalingPlanner(host) {
    var U = WIDGET_UTIL, COL = WIDGET_UTIL.COL;
    var E = 1.8172, A = 482.01, ALPHA = 0.3478, B = 2085.43, BETA = 0.3658;
    // Reference points: tokens per parameter actually used by real runs.
    var MARKS = [
      { label: 'GPT-3', ratio: 1.7 },
      { label: 'Chinchilla', ratio: 20 },
      { label: 'Llama 3 8B', ratio: 1875 }
    ];

    host.innerHTML =
      '<div class="iw">' +
        '<div class="iw-canvas-wrap"><canvas class="iw-canvas"></canvas></div>' +
        '<div class="iw-stats">' +
          '<div class="iw-stat"><span class="iw-stat-num" data-el="N">0</span><span class="iw-stat-lab">parameters</span></div>' +
          '<div class="iw-stat"><span class="iw-stat-num" data-el="D">0</span><span class="iw-stat-lab">training tokens</span></div>' +
          '<div class="iw-stat"><span class="iw-stat-num" data-el="L">0</span><span class="iw-stat-lab">predicted loss</span></div>' +
          '<div class="iw-stat" data-el="gapbox"><span class="iw-stat-num" data-el="gap">0</span><span class="iw-stat-lab">loss above optimal</span></div>' +
        '</div>' +
        '<div class="iw-sliders">' +
          U.sliderHTML('logC', 'compute FLOPs', 19, 26, 0.1, 22) +
          U.sliderHTML('logR', 'tokens / param', 0, 3.4, 0.02, 1.3) +
        '</div>' +
        '<div class="iw-controls">' +
          '<button class="iw-btn iw-primary" data-act="opt">Jump to compute-optimal</button>' +
          '<button class="iw-btn" data-act="gpt3">GPT-3 split</button>' +

      ctx.font = '11px Inter, sans-serif';

        ctx.fillStyle = COL.muted;

      });

      var ox = X(Math.log10(opt.ratio)), oy = Y(opt.loss);
      ctx.fillStyle = COL.green;
      ctx.beginPath(); ctx.arc(ox, oy, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillText('optimal', ox, oy + 20);

      var cx = X(v.logR), cy = Y(curL);
      ctx.fillStyle = COL.secondary;
      ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = COL.secondary; ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, padT + ph); ctx.stroke();
      ctx.setLineDash([]);

      el.N.textContent = U.fmtCount(cur.N);
      el.D.textContent = U.fmtCount(cur.D);
      el.L.textContent = curL.toFixed(3);
      var gap = curL - opt.loss;
      el.gap.textContent = '+' + gap.toFixed(3);
      el.gapbox.className = 'iw-stat ' + (gap < 0.01 ? 'good' : gap > 0.08 ? 'warn' : '');

      U.setVal(host, 'logC', '1e' + v.logC.toFixed(1));
      U.setVal(host, 'logR', ratio < 10 ? ratio.toFixed(1) : String(Math.round(ratio)));

      var atOpt = Math.abs(Math.log10(ratio) - Math.log10(opt.ratio)) < 0.05;
      readout.innerHTML = atOpt
        ? 'This is the compute-optimal split for <strong>1e' + v.logC.toFixed(1) +
          '</strong> FLOPs: about <strong>' + Math.round(opt.ratio) + ' tokens per parameter</strong>.'
        : 'Same budget, worse loss by <strong>' + gap.toFixed(3) + '</strong>. The optimum here is <strong>' +

          (ratio < opt.ratio ? 'this model is too big for its data.' : 'this model is smaller than training alone would want, which is what buys cheap serving.');
    }

    var read = U.bindSliders(host, draw);

    function setTo(logC, ratio) {

      host.querySelector('[data-key="logR"]').value = Math.log10(ratio);
      draw();

    host.querySelector('[data-act="opt"]').addEventListener('click', function () {

    });
    host.querySelector('[data-act="gpt3"]').addEventListener('click', function () { setTo(read().logC, 1.7); });
    host.querySelector('[data-act="llama"]').addEventListener('click', function () { setTo(read().logC, 1875); });

  }

  <script>
// =====================================================================
// CLUSTER_MLP — a small real ReLU MLP trained in the browser (seeded, so
// the result is repeatable), plus a marching-squares contour helper.
// Used by the "Clusters" tab of the mlpBoundary widget: four green
// clusters on a red background. Each hidden neuron's zero-line in input
// space is a straight line for layer 1 and a piecewise-linear curve for
// deeper layers; the final boundary is the output neuron's zero-line.
// =====================================================================
var CLUSTER_MLP = (function() {
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function gauss(rnd) {
    var u = 1 - rnd(), v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v);
  }
  var CENTERS = [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]];

  function generateData() {
    var rnd = mulberry32(7);
    var pts = [];
    CENTERS.forEach(function(c) {
      for (var i = 0; i < 22; i++) {
        pts.push({ x: c[0] + gauss(rnd) * 0.045, y: c[1] + gauss(rnd) * 0.045, cls: 1 });
      }
    });
    var reds = 0;
    while (reds < 150) {
      var x = 0.03 + rnd() * 0.94, y = 0.03 + rnd() * 0.94;
      var near = CENTERS.some(function(c) { return Math.hypot(x - c[0], y - c[1]) < 0.17; });
      if (near) continue;
      pts.push({ x: x, y: y, cls: 0 });
      reds++;
    }
    return pts;
  }

  // ---- network: [2 -> W]*D (ReLU) -> 1 (sigmoid), full-batch Adam ----
  function makeNet(width, depth, seed) {
    var rnd = mulberry32(seed);
    var layers = [];
    var fanIn = 2;
    for (var d = 0; d < depth; d++) {
      layers.push(initLayer(fanIn, width, rnd));
      fanIn = width;
    }
    layers.push(initLayer(fanIn, 1, rnd));
    return { width: width, depth: depth, layers: layers };
  }
  function initLayer(nIn, nOut, rnd) {
    var W = [], b = [];
    var scale = Math.sqrt(2 / nIn);
    for (var o = 0; o < nOut; o++) {
      var row = [];
      for (var i = 0; i < nIn; i++) row.push(gauss(rnd) * scale);
      W.push(row);
      b.push(gauss(rnd) * 0.1);
    }
    return { W: W, b: b, mW: zeros(nOut, nIn), vW: zeros(nOut, nIn), mb: new Array(nOut).fill(0), vb: new Array(nOut).fill(0) };
  }
  function zeros(r, c) {
    var a = [];
    for (var i = 0; i < r; i++) a.push(new Array(c).fill(0));
    return a;
  }

  // Forward pass returning every layer's pre-activations and activations.
  // Inputs are centered so the first layer's lines can pass near the middle.
  function forward(net, x, y) {
    var act = [x - 0.5, y - 0.5];
    var pres = [], acts = [act];
    for (var l = 0; l < net.layers.length; l++) {
      var L = net.layers[l];
      var pre = [], out = [];
      var last = l === net.layers.length - 1;
      for (var o = 0; o < L.W.length; o++) {
        var s = L.b[o];
        for (var i = 0; i < act.length; i++) s += L.W[o][i] * act[i];
        pre.push(s);
        out.push(last ? s : (s > 0 ? s : 0));
      }
      pres.push(pre); acts.push(out); act = out;
    }
    return { pres: pres, acts: acts, logit: act[0] };

  function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }

    net.t = net.t || 0;
    for (var s = 0; s < steps; s++) {
      net.t++;
      var grads = net.layers.map(function(L) {
        return { W: zeros(L.W.length, L.W[0].length), b: new Array(L.W.length).fill(0) };
      });
      for (var n = 0; n < data.length; n++) {
        var p = data[n];
        var f = forward(net, p.x, p.y);
        var delta = [sigmoid(f.logit) - p.cls];
        for (var l = net.layers.length - 1; l >= 0; l--) {
          var L = net.layers[l], inp = f.acts[l], g = grads[l];
          var prev = new Array(inp.length).fill(0);
          for (var o = 0; o < L.W.length; o++) {
            g.b[o] += delta[o];
            for (var i = 0; i < inp.length; i++) {
              g.W[o][i] += delta[o] * inp[i];
              prev[i] += delta[o] * L.W[o][i];
            }
          }
          if (l > 0) {
            for (var k = 0; k < prev.length; k++) if (f.pres[l - 1][k] <= 0) prev[k] = 0;
          }
          delta = prev;
        }
      }
      var N = data.length;
      var c1 = 1 - Math.pow(b1, net.t), c2 = 1 - Math.pow(b2, net.t);
      net.layers.forEach(function(L, l) {
        var g = grads[l];
        for (var o = 0; o < L.W.length; o++) {
          for (var i = 0; i < L.W[o].length; i++) {
            var gw = g.W[o][i] / N;
            L.mW[o][i] = b1 * L.mW[o][i] + (1 - b1) * gw;
            L.vW[o][i] = b2 * L.vW[o][i] + (1 - b2) * gw * gw;
            L.W[o][i] -= lr * (L.mW[o][i] / c1) / (Math.sqrt(L.vW[o][i] / c2) + eps);
          }
          var gb = g.b[o] / N;
          L.mb[o] = b1 * L.mb[o] + (1 - b1) * gb;
          L.vb[o] = b2 * L.vb[o] + (1 - b2) * gb * gb;
          L.b[o] -= lr * (L.mb[o] / c1) / (Math.sqrt(L.vb[o] / c2) + eps);
        }
      });
    }
  }

  function accuracy(net, data) {
    var ok = 0;
    data.forEach(function(p) { if ((forward(net, p.x, p.y).logit > 0 ? 1 : 0) === p.cls) ok++; });
    return ok / data.length;
  }

  // Train with a few seeds and keep the best, so each (width, depth)
  // shows what that architecture can do rather than one unlucky init.
  function train(data, width, depth, opts) {
    opts = opts || {};
    var seeds = opts.seeds || 4, steps = opts.steps || 400, lr = opts.lr || 0.03;
    var best = null;
    for (var s = 0; s < seeds; s++) {
      var net = makeNet(width, depth, 1000 + s * 17 + width * 3 + depth * 101);
      trainSteps(net, data, steps, lr);
      var acc = accuracy(net, data);
      if (!best || acc > best.acc) best = { net: net, acc: acc };
    }
    return best;
  }

  // ---- marching squares: zero-contour of a scalar field on a grid ----
  function contour(field, n) {
    // field[i][j] sampled at x=i/n, y=j/n for i,j in 0..n
    var segs = [];
    function lerp(a, b, va, vb) { return a + (0 - va) / (vb - va) * (b - a); }

        var v00 = field[i][j], v10 = field[i + 1][j], v01 = field[i][j + 1], v11 = field[i + 1][j + 1];
        var x0 = i / n, x1 = (i + 1) / n, y0 = j / n, y1 = (j + 1) / n;
        var pts = [];
        if ((v00 > 0) !== (v10 > 0)) pts.push([lerp(x0, x1, v00, v10), y0]);
        if ((v10 > 0) !== (v11 > 0)) pts.push([x1, lerp(y0, y1, v10, v11)]);
        if ((v01 > 0) !== (v11 > 0)) pts.push([lerp(x0, x1, v01, v11), y1]);
        if ((v00 > 0) !== (v01 > 0)) pts.push([x0, lerp(y0, y1, v00, v01)]);
        if (pts.length === 2) segs.push([pts[0], pts[1]]);
        else if (pts.length === 4) { segs.push([pts[0], pts[1]]); segs.push([pts[2], pts[3]]); }
      }
    }
    return segs;
  }

  return { generateData: generateData, train: train, forward: forward, accuracy: accuracy, contour: contour, sigmoid: sigmoid };

// =====================================================================
// Core deck infrastructure: Manim steppers, Reveal.js init, syntax
// highlighting, interactive widget plumbing, and per-module hooks.
// Loaded before any widget definitions.
// =====================================================================

// =====================================================================
// Shared deck logic for every module. Per-module data and hooks arrive
// via window.MODULE_CONFIG, set by each module's config.js (which the
// build inlines BEFORE this file):
//
//   window.MODULE_CONFIG = {
//     title:          'LLMs 0 to 100 - Module N',  // sets document.title
//     manimSections:  { scene: ['Clip_0000.mp4', ...], ... },
//     widgets:        { name: function(host){...}, ... },  // optional
//     onReady:        function(reveal){...},               // optional
//     onSlideChanged: function(event){...}                 // optional
//   };
// =====================================================================
var MODULE_CONFIG = window.MODULE_CONFIG || {};

// ---- Manim section step-through player ----
// Section video lists are inline to avoid fetch() issues with file:// protocol.
var MANIM_SECTIONS = MODULE_CONFIG.manimSections || {};

var manimSteppers = {};

function initManimStepper(video) {
  var scene = video.getAttribute('data-manim-scene');
  var sections = MANIM_SECTIONS[scene] || [];
  var state = { sections: sections, current: -1, playing: false, video: video, scene: scene };
  manimSteppers[scene] = state;

  // Set poster frame from first section
  if (sections.length > 0) {
    video.src = (window.ASSET_BASE || '') + 'media/sections/' + sections[0];
    video.load();
  }

  video.addEventListener('ended', function() {
    state.playing = false;
  });
}

function advanceManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state || state.playing) return false;
  if (state.current >= state.sections.length - 1) return false;

  state.current++;
  state.playing = true;
  var file = state.sections[state.current];
  state.video.src = (window.ASSET_BASE || '') + 'media/sections/' + file;
  state.video.load();
  state.video.play().then(function() {}).catch(function() { state.playing = false; });
  return true;
}

function resetManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state) return;
  state.current = -1;
  state.playing = false;
  state.video.pause();
  if (state.sections.length > 0) {
    state.video.src = (window.ASSET_BASE || '') + 'media/sections/' + state.sections[0];
    state.video.load();
  }
}

// Instantly finish the section that is currently playing by jumping to its
// final frame. This lets an impatient "next" complete the animation in
// place rather than leaking through to reveal and skipping the slide.
// Returns true if it consumed the action (a video was actually playing).
function skipManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state || !state.playing) return false;
  var v = state.video;
  v.pause();
  // Seek just shy of the end so the step's end state stays on screen.
  if (v.duration && isFinite(v.duration)) {
    try { v.currentTime = Math.max(0, v.duration - 0.04); } catch (e) {}
  }
  state.playing = false;

// is the signal that reveal.js may now move on to the next slide.
function manimForward(scene) {
  var state = manimSteppers[scene];
  if (!state) return false;
  if (state.playing) return skipManimStepper(scene);
  return advanceManimStepper(scene);
}

// ---- Initialize Reveal.js ----
Reveal.initialize({
  width: 1280,
  height: 720,
  margin: 0,
  controls: true,
  progress: true,
  slideNumber: false,
  hash: true,
  transition: 'none',
  center: false,
  autoAnimateDuration: 0.8,
  plugins: [ RevealHighlight, RevealMarkdown ]
});

// ---- Syntax highlighting ----
// reveal-markdown converts the inline <textarea> into <pre><code> blocks
// in a deferred microtask, AFTER the highlight plugin's init() has already
// run, so code ships un-highlighted. Re-trigger the plugin once the blocks
// exist (on ready) and for any added later (on slidechanged).
function highlightAllCodeBlocks() {
  if (!Reveal.getPlugin) return;
  var hl = Reveal.getPlugin('highlight');
  if (!hl || typeof hl.highlightBlock !== 'function') return;
  document.querySelectorAll('pre code').forEach(function(block) {
    if (block.dataset.highlighted === 'yes') return;
    hl.highlightBlock(block);
  });
}
// reveal-markdown may materialize blocks in waves, so re-run the
// (idempotent) pass across the startup window rather than once.
Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    highlightAllCodeBlocks();
    if (tries > 25) clearInterval(iv);
  }, 100);
});
Reveal.on('slidechanged', highlightAllCodeBlocks);

// ---- Overflow scrolling ----
// Sections scroll when their content is taller than the slide (styles.css).
// Start every slide at the top, and scroll a newly revealed fragment into
// view if it landed below the fold.
Reveal.on('slidechanged', function(event) {
  if (event.currentSlide) event.currentSlide.scrollTop = 0;
});
Reveal.on('fragmentshown', function(event) {
  var frag = event.fragment;
  if (!frag || !frag.scrollIntoView) return;
  var section = frag.closest('section');
  if (!section || section.scrollHeight <= section.clientHeight) return;
  frag.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
});
Reveal.on('fragmentshown', highlightAllCodeBlocks);

function initStepperClickHandlers() {
  document.querySelectorAll('.manim-stepper').forEach(function(video) {
    if (video.dataset.clickInit) return;
    video.dataset.clickInit = '1';
    video.style.cursor = 'pointer';
    video.addEventListener('click', function(e) {
      var scene = video.getAttribute('data-manim-scene');
      manimForward(scene);
      e.stopPropagation();
      e.preventDefault();
    });
  });
}

function initAllSteppers() {
  document.querySelectorAll('.manim-stepper').forEach(function(v) {
    if (!manimSteppers[v.getAttribute('data-manim-scene')]) {
      initManimStepper(v);
    }
  });
  initStepperClickHandlers();
}

function renderMath() {
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false}
      ]
    });
  }
}

// reveal-markdown loads slides asynchronously, so the 'ready' event may
// fire before the markdown content is in the DOM. Poll briefly.
Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    if (document.querySelectorAll('section').length > 5 || tries > 20) {
      clearInterval(iv);
      initAllSteppers();
      renderMath();
    }
  }, 100);
});

// Reset steppers when leaving a slide
Reveal.on('slidechanged', function(event) {
  initAllSteppers();
  Object.keys(manimSteppers).forEach(function(scene) {
    if (!event.currentSlide.querySelector('[data-manim-scene="' + scene + '"]')) {
      resetManimStepper(scene);
    }
  });
});

// Intercept right arrow / space / enter on manim slides to step through
// sections. manimForward consumes the press while there is still animation
// to play (completing the current section or starting the next), so reveal
// only advances the slide once every section has been shown.
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
    var currentSlide = Reveal.getCurrentSlide();
    var stepper = currentSlide ? currentSlide.querySelector('.manim-stepper') : null;
    if (stepper) {
      var scene = stepper.getAttribute('data-manim-scene');
      if (manimForward(scene)) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }
  }
}, true);

// The on-screen controls (controls: true) navigate directly and bypass the
// keydown handler above, so guard the forward arrows the same way: a forward
// control press on a manim slide steps the animation before leaving.
document.addEventListener('click', function(e) {
  var btn = e.target.closest ? e.target.closest('.navigate-right, .navigate-down') : null;
  if (!btn) return;
  var currentSlide = Reveal.getCurrentSlide();
  var stepper = currentSlide ? currentSlide.querySelector('.manim-stepper') : null;
  if (stepper && manimForward(stepper.getAttribute('data-manim-scene'))) {
    e.stopImmediatePropagation();
    e.preventDefault();
  }
}, true);

// =====================================================================
// Interactive widgets (:::interactive). Each widget is a factory keyed
// by its `data-widget` value; it owns its host element and (re)draws
// whenever its slide becomes visible or the window resizes.
// =====================================================================
var INTERACTIVE_WIDGETS = {};

function hydrateInteractiveWidgets() {
  document.querySelectorAll('.interactive-host[data-widget]').forEach(function(host) {
    if (host.dataset.hydrated) return;
    var factory = INTERACTIVE_WIDGETS[host.getAttribute('data-widget')];
    if (!factory) return;
    host.dataset.hydrated = '1';
    host._widget = factory(host) || null;
  });
}

function refreshInteractiveWidgets() {
  document.querySelectorAll('.interactive-host[data-widget]').forEach(function(host) {
    if (host._widget && typeof host._widget.resize === 'function') host._widget.resize();
  });
}

Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    if (document.querySelector('.interactive-host[data-widget]') || tries > 25) {
      clearInterval(iv);
      hydrateInteractiveWidgets();
      requestAnimationFrame(refreshInteractiveWidgets);
    }
  }, 100);
});
Reveal.on('slidechanged', function() {
  hydrateInteractiveWidgets();
  requestAnimationFrame(refreshInteractiveWidgets);
});
window.addEventListener('resize', refreshInteractiveWidgets);

// ---- Per-module hooks (from MODULE_CONFIG) ----
if (MODULE_CONFIG.title) document.title = MODULE_CONFIG.title;
if (MODULE_CONFIG.widgets) Object.assign(INTERACTIVE_WIDGETS, MODULE_CONFIG.widgets);
if (typeof MODULE_CONFIG.onReady === 'function') {
  Reveal.on('ready', function() { MODULE_CONFIG.onReady(Reveal); });
}
if (typeof MODULE_CONFIG.onSlideChanged === 'function') {
  Reveal.on('slidechanged', function(event) { MODULE_CONFIG.onSlideChanged(event); });
}

// =====================================================================
// Slide annotation / drawing overlay.
//
// A full-viewport <canvas> the presenter can draw on top of any slide.
// Strokes are stored per slide (keyed by Reveal indices, in normalized
// coordinates) so they survive navigation and window resizes. A small
// floating toolbar exposes pen colors, an eraser, undo, and clear.
//
// Keyboard:
//   d       toggle draw mode on/off
//   e       eraser (while in draw mode)
//   c       clear the current slide's drawing
//   u       undo the last stroke
//   Escape  exit draw mode
//
// While draw mode is active, Reveal's own keyboard/touch navigation is
// suspended so drawing gestures never flip the slide.
// =====================================================================
(function () {
  'use strict';

  var PALETTE = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#ffffff'];
  var PEN_WIDTH = 3;
  var ERASER_WIDTH = 28;

  // strokesBySlide[key] = [ {color, width, erase, points:[{x,y}, ...]}, ... ]
  // Points are normalized to [0,1] against the canvas so they rescale on resize.
  var strokesBySlide = {};

  var canvas, ctx, toolbar;
  var drawMode = false;
  var erasing = false;
  var color = PALETTE[0];
  var drawing = false;
  var currentStroke = null;

  // ---- slide identity + canvas geometry ----
  function slideKey() {
    var idx = (typeof Reveal !== 'undefined' && Reveal.getIndices) ? Reveal.getIndices() : { h: 0, v: 0 };
    return idx.h + '-' + (idx.v || 0);
  }

  function strokes() {
    var k = slideKey();
    if (!strokesBySlide[k]) strokesBySlide[k] = [];
    return strokesBySlide[k];
  }

  // Size the backing store to device pixels for crisp lines, keep the CSS
  // box at viewport size, then repaint the current slide's strokes.
  function resizeCanvas() {
    if (!canvas) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }

  function drawStroke(s) {
    if (!s.points.length) return;
    var w = window.innerWidth, h = window.innerHeight;
    ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.points[0].x * w, s.points[0].y * h);
    for (var i = 1; i < s.points.length; i++) {
      ctx.lineTo(s.points[i].x * w, s.points[i].y * h);
    }
    // A single tap should still leave a visible dot.
    if (s.points.length === 1) ctx.lineTo(s.points[0].x * w + 0.01, s.points[0].y * h);
    ctx.stroke();
  }

  function redraw() {
    if (!ctx) return;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    strokes().forEach(drawStroke);
  }

  // ---- mode toggling ----
  // While drawing, the canvas captures pointer events. Arrow/space keys still
  // navigate slides (they never conflict with pointer drawing), so keyboard
  // nav stays on; only touch/swipe is suspended so finger-drawing on a
  // touchscreen can't flip the slide out from under the pen.
  function setDrawMode(on) {
    drawMode = on;
    if (!on) erasing = false;
    document.body.classList.toggle('draw-mode', on);
    if (canvas) canvas.style.pointerEvents = on ? 'auto' : 'none';
    if (typeof Reveal !== 'undefined' && Reveal.configure) {
      Reveal.configure({ touch: !on });
    }
    updateToolbar();
  }

  function setColor(c) {
    color = c;
    erasing = false;
    if (!drawMode) setDrawMode(true);
    updateToolbar();
  }

  function setEraser() {
    erasing = true;
    if (!drawMode) setDrawMode(true);
    updateToolbar();
  }

  function clearSlide() {
    strokesBySlide[slideKey()] = [];
    redraw();
  }

  function undo() {
    strokes().pop();
    redraw();
  }

  function injectStyles() {
    var css = [
      '#draw-canvas{position:fixed;inset:0;z-index:40;pointer-events:none;touch-action:none;}',
      'body.draw-mode #draw-canvas{cursor:crosshair;}',
      // Hidden by default; slides up into view only while the pointer is in
      // the bottom hover band (see the mousemove handler that toggles .visible).
      '#draw-toolbar{position:fixed;bottom:14px;left:50%;',
      '  transform:translateX(-50%) translateY(24px);',
      '  z-index:60;display:flex;align-items:center;gap:8px;padding:7px 10px;',
      '  background:rgba(20,20,24,0.92);border:1px solid rgba(255,255,255,0.18);',
      '  border-radius:10px;opacity:0;pointer-events:none;',
      '  transition:opacity 0.15s,transform 0.15s;font-family:sans-serif;}',
      '#draw-toolbar.visible{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}',
      '.draw-btn{width:26px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,0.25);',
      '  background:transparent;cursor:pointer;padding:0;display:flex;align-items:center;',
      '  justify-content:center;color:#fff;font-size:14px;line-height:1;}',
      '.draw-btn:hover{background:rgba(255,255,255,0.15);}',
      '.draw-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}',
      '.draw-swatch.active{border-color:#fff;}',
      '.draw-btn.active{background:rgba(255,255,255,0.28);}',
      '.draw-sep{width:1px;height:22px;background:rgba(255,255,255,0.2);}'
