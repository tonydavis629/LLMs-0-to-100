<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMs 0 to 100</title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <!-- KaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>

  <!-- Module-specific <head> includes (e.g. Chart.js); empty for most modules -->
  

  <!-- Shared styles + per-module overrides, inlined by the build -->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

/* ===========================================
   CSS VARIABLES
   =========================================== */
:root {
  --background-color: #0a0e1a;
  --section-divider-bg: #0d1225;

  --heading-font: "Space Grotesk", Helvetica, sans-serif;
  --body-font: "Inter", Helvetica, sans-serif;
  --base-font-size: 32px;
  --text-size: 16pt;
  --h1-size: 48pt;
  --h2-size: 36pt;
  --h3-size: 24pt;
  --footnote-size: 11pt;

  --primary-color: #4a9eff;
  --secondary-color: #f5a623;
  --text-color: #e8eaf0;
  --muted-color: #8892a4;
  --line-color: #2a3450;

  --slide-padding: 60px;
  --slide-padding-top: 24px;
  --content-gap: 18px;

  --box-radius: 8px;
}

/* ===========================================
   BASE STYLES
   =========================================== */

.reveal {
  font-family: var(--body-font);
  font-size: var(--base-font-size);
}

.reveal strong,
.reveal b {
  font-weight: bold;
}

.reveal a {
  color: var(--primary-color);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.reveal a:hover {
  color: var(--text-color);
}

.reveal-viewport {
  background-color: var(--background-color);
}

.reveal-viewport.is-section-divider .slide-background.present {
  background-color: var(--section-divider-bg) !important;
}

.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4,
.reveal h5,
.reveal h6 {
  font-family: var(--heading-font);
  text-transform: none;
  color: var(--text-color);
  font-weight: 600;
  line-height: 1.2;
}

.reveal h1 { font-size: var(--h1-size); }
.reveal h2 { font-size: var(--h2-size); margin-bottom: 0; }
.reveal h3 { font-size: var(--h3-size); }

.reveal p,
.reveal li,
.reveal td,
.reveal th,
.reveal blockquote {
  font-size: var(--text-size);
  color: var(--text-color);
  line-height: 1.5;
}

/* Vertical separation between newline-separated sentences on text slides.
   Scoped to a slide's top-level paragraphs (the prose flow); paragraphs
   nested inside components (terminal captions, figure cards, grid columns)
   keep their own tighter spacing so dense component slides do not overflow.
   Adjacent margins collapse, so the gap between two paragraphs is 0.9em. */
.reveal .slides section > p {
  margin: 0.4em 0 0.9em 0;
}

/* ===========================================
   LISTS
   =========================================== */

.reveal ul {
  list-style: none;
  padding-left: 0;
  margin: 15px 0;
}

.reveal ul li {
  position: relative;
  padding-left: 25px;
  margin-bottom: 10px;
}

.reveal ul li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.6em;
  width: 8px;
  height: 8px;
  background: var(--primary-color);
  border-radius: 50%;
}

.reveal ul ul li::before {
  background: var(--muted-color);
  width: 6px;
  height: 6px;
}

.reveal blockquote p {
  font-size: inherit;
}

/* ===========================================
   SLIDE LAYOUT
   =========================================== */

.reveal .slides section {
  height: 100%;
  display: flex !important;
  flex-direction: column !important;
  padding: var(--slide-padding-top) var(--slide-padding) var(--slide-padding) var(--slide-padding) !important;
  box-sizing: border-box;
  text-align: left;
  /* Any slide whose content runs past the bottom scrolls instead of clipping.
     The scrollbar only appears when needed. */
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: #30363d transparent;
}

.reveal .slides section::-webkit-scrollbar {
  width: 8px;
}

.reveal .slides section::-webkit-scrollbar-thumb {
  background: #30363d;
  border-radius: 4px;
}

.reveal .slides section.stack {
  padding: 0 !important;
}

.reveal .slides section > .content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: var(--content-gap);
  text-align: left;
}

.reveal .slides section > .footnote {
  position: absolute;
  bottom: 15px;
  left: var(--slide-padding);
  right: var(--slide-padding);
  font-size: var(--footnote-size);
  color: var(--muted-color);
}

/* ===========================================
   SECTION DIVIDERS
   =========================================== */

.reveal .slides section.section-divider {
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}

.reveal .slides section.section-divider h1 {
  font-size: 56pt;
  text-align: center;
  color: var(--primary-color);
}

.reveal .slides section.section-divider p {
  font-size: 20pt;
  color: var(--muted-color);
}

/* ===========================================
   TEXT SIZE UTILITIES
   =========================================== */

.text-lg { font-size: 18pt !important; }
.text-xl { font-size: 20pt !important; }
.text-2xl { font-size: 24pt !important; }
.text-3xl { font-size: 28pt !important; }
.text-4xl { font-size: 32pt !important; }

.text-muted { color: var(--muted-color) !important; }
.text-center { text-align: center !important; }
.text-uppercase { text-transform: uppercase; letter-spacing: 0.1em; }
.font-light { font-weight: 300; }
.font-bold { font-weight: 600; }

/* ===========================================
   BLOCKQUOTES
   =========================================== */

.reveal blockquote {
  border-left: 4px solid var(--primary-color);
  padding-left: 20px;
  margin: 20px 0;
  font-style: italic;
  background: none;
  box-shadow: none;
  width: 100%;
  max-width: none;
}

.reveal blockquote cite {
  display: block;
  margin-top: 10px;
  font-style: normal;
  color: var(--muted-color);
}

/* ===========================================
   ACCENT UNDERLINE ON TITLES
   =========================================== */

.reveal .slides section > h2 {
  flex-shrink: 0;
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line-color);
}

/* ===========================================
   FIGURE CARD - for notable figures slides
   =========================================== */

.figure-card {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  align-items: start;
}

.figure-card img {
  border-radius: var(--box-radius);
  width: 100%;
  box-shadow: 0 4px 20px rgba(74, 158, 255, 0.15);
}

.figure-card .figure-info h3 {
  margin: 0 0 5px 0;
  color: var(--secondary-color);
  font-size: 14pt;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ===========================================
   ERA BADGE - for timeline labels
   =========================================== */

.era-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12pt;
  font-weight: 500;
}

.era-badge.summer {
  background: rgba(245, 166, 35, 0.2);
  color: var(--secondary-color);
}

.era-badge.winter {
  background: rgba(74, 158, 255, 0.15);
  color: #6cb4ff;
}

.era-badge.spring {
  background: rgba(80, 200, 120, 0.2);
  color: #50c878;
}

/* ===========================================
   HIGHLIGHT BOX
   =========================================== */

.highlight-box {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
}

/* Exercise hint: a single fragment that reveals the whole hint at once.
   The wrapping .fragment div is what animates; this just sizes the text
   (matching the old text-lg intent) and removes the global paragraph
   margin so the one-line hint is not double-spaced. */
.reveal .hint-box p {
  font-size: 18pt;
  margin: 0;
}

/* ===========================================
   COURSE STRUCTURE
   =========================================== */

.course-summary {
  max-width: 1120px;
  margin: 0 0 16px 0;
  color: #f0f4fb;
  font-size: 18pt !important;
  line-height: 1.4 !important;
}

.course-track-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

.module-track-card {
  background: rgba(74, 158, 255, 0.07);
  border: 1px solid rgba(74, 158, 255, 0.22);
  border-radius: var(--box-radius);
  padding: 20px 22px;
}

.module-track-kicker {
  font-size: 12pt;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--secondary-color);
  margin-bottom: 8px;
}

.module-track-card h3 {
  margin: 0 0 8px 0;
}

.module-track-intro {
  font-size: 14pt !important;
  color: #d7ddea !important;
  margin: 0 0 10px 0;
  line-height: 1.4 !important;
}

.compact-list {
  margin: 0;
}

.reveal ul.compact-list li {
  font-size: 16pt;
  line-height: 1.35;
  margin-bottom: 7px;
  padding-left: 20px;
}

.course-note {
  margin-top: 14px;
  color: #d7ddea;
  font-size: 15pt !important;
  line-height: 1.35 !important;
}

.course-glossary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  margin-top: 14px;
}

.glossary-item {
  background: rgba(245, 166, 35, 0.08);
  border: 1px solid rgba(245, 166, 35, 0.18);
  border-radius: var(--box-radius);
  padding: 12px 14px;
}

.glossary-item strong {
  color: var(--secondary-color);
}

.glossary-item p {
  font-size: 13pt !important;
  color: #d7ddea !important;
  margin: 6px 0 0 0;
  line-height: 1.4;
}

/* ===========================================
   TERMINAL OUTPUT
   =========================================== */

.terminal-output {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 0;
  max-width: 800px;
  margin: 0 auto;
  text-align: left;
}

.terminal-output .terminal-bar {
  background: #161b22;
  border-radius: 8px 8px 0 0;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.terminal-output .terminal-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.terminal-output .terminal-dot.red { background: #ff5f57; }
.terminal-output .terminal-dot.yellow { background: #febc2e; }
.terminal-output .terminal-dot.green { background: #28c840; }

.terminal-output .terminal-title {
  color: #8b949e;
  font-family: monospace;
  font-size: 10pt;
  margin-left: 8px;
}

.terminal-output .terminal-body {
  padding: 15px 20px;
}

.terminal-output .terminal-body pre {
  margin: 0;
  background: none !important;
  box-shadow: none !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output.dense .terminal-body {
  padding: 10px 20px;
}

.reveal .terminal-output.dense .terminal-body pre.terminal-pre {
  font-size: 9pt;
  line-height: 1.28;
}

.reveal .terminal-output .terminal-body pre.terminal-pre span {
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre p {
  display: inline;
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
  margin: 0 !important;
  color: inherit;
}

.reveal .terminal-output .terminal-body pre code {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output .terminal-body .prompt {
  color: #8b949e;
}

.terminal-output .terminal-body .success {
  color: #3fb950;
}

.terminal-output .terminal-body .header {
  font-weight: bold;
}

.terminal-output .terminal-body .skipped {
  color: #8b949e;
  font-style: italic;
}

/* ===========================================
   TURNING POINT SLIDE
   =========================================== */

.turning-point h2 {
  border-bottom-color: var(--secondary-color) !important;
}

/* ===========================================
   CODE BLOCKS
   =========================================== */

.reveal pre {
  margin-bottom: 0;
  width: 100%;
  box-sizing: border-box;
  box-shadow: none !important;
  background: none !important;
}

.reveal pre code {
  font-size: 14pt;
  line-height: 1.4;
  padding: 10px 20px;
  border-radius: var(--box-radius);
  background: rgba(20, 25, 45, 0.8);
  color: var(--text-color);
  max-height: 400px;
}

.reveal pre code .hljs-keyword,
.reveal pre code .hljs-built_in {
  color: #c792ea;
}

.reveal pre code .hljs-string {
  color: #c3e88d;
}

.reveal pre code .hljs-comment {
  color: #546e7a;
}

.reveal pre code .hljs-number {
  color: #f78c6c;
}

.reveal code {
  color: var(--text-color);
}

/* ===========================================
   MATH (KaTeX)
   =========================================== */

.katex {
  color: var(--text-color);
  font-size: 1.1em;
}

.katex-display {
  margin: 15px 0;
}

.katex-display > .katex {
  font-size: 1.3em;
}

/* ===========================================
   VIDEO CONTAINERS
   =========================================== */

.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-container video,
.video-container img {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--box-radius);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
}

/* ===========================================
   SIDE QUEST BADGE
   =========================================== */

.side-quest-badge {
  display: inline-block;
  background: rgba(245, 166, 35, 0.15);
  color: var(--secondary-color);
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12pt;
  font-weight: 500;
  margin-bottom: 10px;
}

/* ===========================================
   TERMINAL OUTPUT - ANSI COLOR PALETTE
   Replaces inline `style="color:#..."` on spans
   inside .terminal-pre. A rule on the span itself
   overrides the color inherited from .terminal-pre.
   =========================================== */

.terminal-output .terminal-body .t-red    { color: #e06c75; }
.terminal-output .terminal-body .t-orange { color: #d19a66; }
.terminal-output .terminal-body .t-yellow { color: #e5c07b; }
.terminal-output .terminal-body .t-green  { color: #98c379; }
.terminal-output .terminal-body .t-cyan   { color: #56b6c2; }
.terminal-output .terminal-body .t-blue   { color: #61afef; }
.terminal-output .terminal-body .t-gray   { color: #8b949e; }
.terminal-output .terminal-body .t-fg     { color: #e8eaf0; }
.terminal-output .terminal-body .t-fail   { color: #e74c3c; }

.terminal-caption {
  margin-top: 15px;
  text-align: center;
}

/* ===========================================
   TIMELINE (module 1) - per-node structure
   Positional left/width and per-era colors stay
   inline; this captures the repeated boilerplate.
   =========================================== */

.tl-node  { position: absolute; transform: translateX(-50%); text-align: center; }
/* .reveal prefix needed: `.reveal p` (0,1,1) sets color/font-size and would
   otherwise beat a bare .tl-* class. The original used inline styles. */
.reveal .tl-label { font-size: 10pt; color: var(--muted-color); white-space: nowrap; margin: 0; }
.reveal .tl-year  { font-size: 11pt; font-weight: 600; margin: 2px 0 0 0; }
.tl-stem  { width: 1px; opacity: 0.5; margin: 2px auto 0; }
.tl-dot   { width: 10px; height: 10px; border-radius: 50%; margin: 0 auto; }

.tl-node.below .tl-stem  { margin: 0 auto; }
.tl-node.below .tl-year  { margin: 0; }
.tl-node.below .tl-label { margin: 2px 0 0 0; }

/* ===========================================
   CANONICAL SLIDE TYPES
   Backs the :::divider / :::columns / :::note /
   :::quiz / :::step / :::interactive fences so
   slides.md carries no inline layout styles.
   (.section-divider, .figure-card, .terminal-output,
    .hint-box are defined above and reused.)
   =========================================== */

/* :::columns - grid; template/gap/valign supplied by the build */
.reveal .slide-columns {
  display: grid;
  align-items: start;
  margin: 10px 0;
}

/* :::note - callout box (canonical replacement for .highlight-box) */
.reveal .note {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
  margin: 20px 0;
}

.reveal .note p {
  font-size: 18pt;
  margin: 0;
}

.reveal .note p + p {
  margin-top: 0.6em;
}

/* :::note variant="hint" - lighter, boxless (also used inside :::step) */
.reveal .note.hint-box {
  background: none;
  border: none;
  padding: 0;
}

/* :::quiz - prompt scales up; its last line is the question */
.reveal .quiz-prompt p {
  font-size: 18pt;
  margin: 0 0 0.6em 0;
}

.reveal .quiz-prompt p:last-child {
  font-size: 24pt;
  color: var(--text-color);
  margin: 0.5em 0 0 0;
}

.reveal .quiz-answer {
  margin-top: 30px;
}

/* :::step - spacing between code, hint, and answer */
.reveal .hint-box {
  margin-top: 22px;
}

.reveal .hint-box + .note {
  margin-top: 8px;
  padding: 12px 18px;
}

/* :::interactive - widget fills the slide body like a video */
.reveal .interactive-host {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

/* ===========================================
   SHARED INTERACTIVE WIDGET CHROME (.iw-*)
   Used by the :::interactive widgets defined in each module's config.js.
   Module 3 predates this and keeps its own .m3-* chrome.
   =========================================== */

.iw {
  display: flex;
  flex-direction: column;
  justify-content: center;   /* only bites when the content does not fill the slide */
  gap: 12px;
  width: 100%;
  height: 100%;
}

.iw-canvas-wrap {
  flex: 1;
  min-height: 0;
  width: 100%;
}

.iw-canvas {
  width: 100%;
  height: 100%;
  min-height: 0;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.iw-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.iw-btn {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: rgba(74, 158, 255, 0.10);
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 6px;
  padding: 7px 16px;
  cursor: pointer;
}

.iw-btn:hover {
  background: rgba(74, 158, 255, 0.22);
}

.iw-btn.iw-primary,
.iw-btn.active {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: #0a0e1a;
  font-weight: 600;
}

.iw-btn.iw-reset {
  background: rgba(245, 166, 35, 0.12);
  border-color: rgba(245, 166, 35, 0.40);
  color: var(--secondary-color);
}

.iw-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.iw-label {
  font-size: 12pt;
  color: var(--muted-color);
  margin: 0 2px 0 10px;
}

.reveal .iw-readout {
  font-size: 13pt;
  color: var(--muted-color);
  text-align: center;
  margin: 0;
  min-height: 1.4em;
}

.reveal .iw-readout strong {
  color: var(--secondary-color);
}

.iw-sliders {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 4px 18px;
  width: 100%;
  max-width: 100%;
  margin: 0 auto;
}

.iw-slider {
  display: grid;
  grid-template-columns: minmax(72px, auto) 1fr 58px;
  align-items: center;
  gap: 9px;
}

.reveal .iw-slider label {
  font-size: 11.5pt;
  color: var(--primary-color);
  font-weight: 600;
  margin: 0;
}

.iw-slider input[type="range"] {
  width: 100%;
  accent-color: var(--primary-color);
}

.reveal .iw-slider .iw-val {
  font-size: 11.5pt;
  color: var(--text-color);
  font-family: monospace;
  text-align: right;
  margin: 0;
}

.iw-text-input {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: 6px;
  padding: 7px 12px;
  width: 100%;
  max-width: 620px;
}

/* DOM-based widget pieces: token chips, panels, and two-column bodies. */

.iw-body {
  flex: 1;
  min-height: 0;
  display: grid;
  gap: 14px;
  align-items: start;
}

.iw-body.iw-cols {
  grid-template-columns: 1.3fr 0.7fr;
}

/* Widgets whose content is short: keep the panel tight to the content. */
.iw-body.iw-hug {
  flex: 0 0 auto;
}

.iw-body.iw-hug .iw-panel {
  height: auto;
}

.iw-panel {
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
  padding: 12px 14px;
  height: 100%;
  overflow: hidden;
}

.reveal .iw-panel h4 {
  font-size: 12pt;
  color: var(--muted-color);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 0 0 8px;
  font-weight: 600;
}

.iw-tokens {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}

.iw-chip {
  display: inline-block;
  font-family: monospace;
  font-size: 12.5pt;
  color: var(--text-color);
  background: rgba(74, 158, 255, 0.10);
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 5px;
  padding: 3px 8px;
  white-space: pre;
}

.iw-chip.hot {
  background: rgba(245, 166, 35, 0.20);
  border-color: var(--secondary-color);
  color: var(--secondary-color);
}

.iw-chip.dim {
  background: rgba(136, 146, 164, 0.08);
  border-color: rgba(136, 146, 164, 0.28);
  color: var(--muted-color);
}

.iw-chip.good {
  background: rgba(63, 185, 80, 0.16);
  border-color: rgba(63, 185, 80, 0.5);
  color: #7ee08a;
}

.iw-rows {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.iw-row {
  display: grid;
  grid-template-columns: 96px 1fr;
  align-items: center;
  gap: 10px;
  font-size: 12.5pt;
  color: var(--text-color);
}

.reveal .iw-row .iw-key {
  color: var(--muted-color);
  font-size: 11.5pt;
  margin: 0;
}

.iw-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}

.iw-stat {
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
  padding: 8px 10px;
  text-align: center;
}

.reveal .iw-stat .iw-stat-num {
  display: block;
  font-family: var(--heading-font);
  font-size: 21pt;
  color: var(--secondary-color);
  line-height: 1.15;
}

.reveal .iw-stat .iw-stat-lab {
  display: block;
  font-size: 10.5pt;
  color: var(--muted-color);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.iw-stat.warn .iw-stat-num { color: #e74c3c; }
.iw-stat.good .iw-stat-num { color: #3fb950; }


/* Module 4 overrides: diagrams for architecture slides.
   Notable-figure slides use the shared :::figure fence (see slides/source),
   matching the other modules: the portrait is fixed on the left and the name
   and details reveal as fragments, with no center-then-slide animation. */

.rnn-flow,
.gate-diagram,
.embedding-visual,
.position-visual,
.attention-visual,
.ffn-visual,
.stack-visual,
.softmax-visual,
.norm-visual,
.icl-diagram,
.handoff-diagram,
.encoder-decoder-layout,
.moe-diagram,
.beam-diagram {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin: 28px 0;
}

.rnn-token,
.rnn-cell,
.gate-input,
.gate-memory,
.gate,
.word-card,
.matrix-card,
.vector-pill,
.ffn-layer,
.stack-block,
.router-box,
.expert,
.beam-node,
.family-grid div,
.vocab-tradeoff div,
.token-case,
.norm-lane {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.28);
  border-radius: var(--box-radius);
  padding: 12px 16px;
  color: var(--text-color);
  text-align: center;
}

.rnn-cell,
.gate-memory,
.matrix-card,
.stack-block.accent,
.expert.active,
.beam-node.kept,
.norm-lane .accent,
.vector-pill.accent,
.ffn-layer.accent,
.matrix-card.accent {
  border-color: rgba(245, 166, 35, 0.6);
  background: rgba(245, 166, 35, 0.12);
}

.rnn-cell span,
.gate span,
.gate-memory span,
.head-card span,
.stack-block span,
.router-box span,
.expert span,
.beam-node span,
.family-grid span,
.vocab-tradeoff span {
  display: block;
  color: var(--muted-color);
  font-size: 12pt;
  margin-top: 4px;
}

.rnn-arrow,
.gate-arrow,
.pipe-arrow,
.byte-arrow {
  color: var(--secondary-color);
  font-size: 26pt;
  font-family: var(--heading-font);
  text-align: center;
}

.formula-card {
  max-width: 820px;
  margin: 18px auto;
  padding: 16px 22px;
  text-align: center;
  border-radius: var(--box-radius);
  border: 1px solid rgba(245, 166, 35, 0.45);
  background: rgba(245, 166, 35, 0.09);
  color: var(--text-color);
  font-size: 20pt;
}

.gate-stack {
  display: grid;
  gap: 10px;
}

.gate.forget { border-color: rgba(231, 76, 60, 0.55); }
.gate.input { border-color: rgba(63, 185, 80, 0.55); }
.gate.output { border-color: rgba(74, 158, 255, 0.55); }

.token-strip,
.id-strip {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.token-strip span,
.id-strip span {
  display: inline-flex;
  align-items: center;
  min-height: 38px;
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid rgba(74, 158, 255, 0.35);
  background: rgba(74, 158, 255, 0.10);
  color: var(--text-color);
  font-size: 15pt;
}

.token-strip-accent span,
.id-strip span {
  border-color: rgba(245, 166, 35, 0.48);
  background: rgba(245, 166, 35, 0.12);
}

.byte-bpe-diagram {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin: 18px auto;
  max-width: 900px;
}

.byte-lane {
  text-align: center;
}

.byte-lane h3,
.token-case h3,
.norm-lane h3 {
  font-size: 18pt;
  margin: 0 0 8px 0;
  color: var(--secondary-color);
}

.byte-grid {
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  gap: 6px;
}

.byte-grid span {
  padding: 7px 0;
  border: 1px solid rgba(136, 146, 164, 0.35);
  border-radius: 5px;
  font-size: 12pt;
  color: var(--text-color);
}

.vocab-tradeoff,
.token-practice-grid,
.family-grid {
  display: grid;
  gap: 14px;
}

.vocab-tradeoff {
  grid-template-columns: repeat(3, 1fr);
  margin-top: 14px;
}

.token-practice-grid {
  grid-template-columns: repeat(3, 1fr);
  margin: 28px 0;
}

.token-case p {
  font-size: 14pt !important;
  color: var(--muted-color) !important;
  margin: 12px 0 0 0 !important;
  line-height: 1.35 !important;
}

.glitch-token-map {
  display: grid;
  grid-template-columns: 1fr 44px 1fr 44px 1fr;
  gap: 18px;
  align-items: stretch;
  margin: 28px 0;
}

.glitch-card {
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 14px;
  min-height: 250px;
  padding: 16px 18px;
  border-radius: var(--box-radius);
  border: 1px solid rgba(74, 158, 255, 0.28);
  background: rgba(74, 158, 255, 0.08);
  text-align: center;
}

.glitch-card.accent {
  border-color: rgba(245, 166, 35, 0.6);
  background: rgba(245, 166, 35, 0.12);
}

.glitch-card h3 {
  font-size: 17pt;
  margin: 0;
  color: var(--secondary-color);
}

.glitch-card p {
  font-size: 13pt !important;
  line-height: 1.32 !important;
  margin: 0 !important;
  color: var(--muted-color) !important;
}

.glitch-card .token-strip,
.glitch-card .matrix-card,
.glitch-bars {
  align-self: center;
}

.glitch-token span {
  border-color: rgba(245, 166, 35, 0.55);
  background: rgba(245, 166, 35, 0.14);
  font-size: 14pt;
}

.glitch-bars {
  display: grid;
  gap: 12px;
  width: 100%;
}

.glitch-bar {
  display: flex;
  align-items: center;
  min-height: 40px;
  padding: 0 12px;
  border-radius: 6px;
  color: var(--text-color);
  font-size: 12pt;
  text-align: left;
}

.glitch-bar.common {
  width: 100%;
  background: rgba(74, 158, 255, 0.34);
}

.glitch-bar.rare {
  width: 38%;
  min-width: 118px;
  background: rgba(245, 166, 35, 0.38);
}

.handoff-diagram {
  margin-top: 18px;
}

.decoder-flow {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin: 18px 0 26px 0;
}

.flow-node {
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8px 10px;
  border-radius: var(--box-radius);
  border: 1px solid rgba(136, 146, 164, 0.30);
  color: var(--muted-color);
  font-size: 13pt;
  line-height: 1.2;
}

.active-embedding .embedding,
.active-position .position,
.active-attention .attention,
.active-ffn .ffn,
.active-repeat .repeat,
.active-sampling .sampling {
  border-color: rgba(245, 166, 35, 0.75);
  background: rgba(245, 166, 35, 0.14);
  color: var(--text-color);
}

.embedding-visual {
  display: grid;
  grid-template-columns: 1fr 44px 1.4fr 44px 1fr 44px 1.2fr;
}

.embedding-table {
  display: flex;
  flex-direction: column;
  gap: 7px;
  color: var(--muted-color);
  font-size: 11pt;
}

.et-title {
  text-align: center;
  color: var(--secondary-color);
  font-size: 12pt;
  margin-bottom: 4px;
}

.et-title span {
  display: block;
  color: var(--muted-color);
  font-size: 10pt;
  margin-top: 2px;
}

.et-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.et-id {
  min-width: 56px;
  text-align: right;
  font-size: 10pt;
  white-space: nowrap;
}

.et-vec {
  font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  font-size: 10.5pt;
  color: var(--primary-color);
  white-space: nowrap;
}

.et-row.accent .et-id { color: var(--secondary-color); }
.et-row.accent .et-vec { color: var(--secondary-color); }

.position-visual {
  align-items: stretch;
}

.pos-column {
  display: grid;
  gap: 8px;
}

.pos-column h3 {
  text-align: center;
  font-size: 16pt;
  margin: 0 0 4px 0;
  color: var(--secondary-color);
}

.plus-column {
  display: flex;
  align-items: center;
  color: var(--secondary-color);
  font-size: 36pt;
}

.vector-pill.muted {
  border-color: rgba(136, 146, 164, 0.35);
  color: var(--muted-color);
}

.attention-visual {
  gap: 42px;
}

.causal-matrix {
  display: grid;
  grid-template-columns: 82px repeat(4, 82px);
  gap: 6px;
  align-items: center;
  text-align: center;
  font-size: 11pt;
  color: var(--muted-color);
}

.causal-matrix span {
  width: 76px;
  height: 42px;
  border-radius: 5px;
  border: 1px solid rgba(136, 146, 164, 0.25);
  background: rgba(136, 146, 164, 0.08);
}

.causal-matrix span.on {
  border-color: rgba(74, 158, 255, 0.55);
  background: rgba(74, 158, 255, 0.22);
}

.head-stack {
  display: grid;
  gap: 12px;
}

.head-card {
  min-width: 180px;
  border: 1px solid rgba(245, 166, 35, 0.45);
  background: rgba(245, 166, 35, 0.10);
  border-radius: var(--box-radius);
  padding: 14px 18px;
  text-align: center;
  color: var(--text-color);
}

.attention-detail {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 40px;
  align-items: center;
  margin: 18px 0 14px 0;
}

.attention-steps ul {
  margin: 0;
}

.attention-steps li {
  font-size: 15pt !important;
  line-height: 1.35 !important;
  margin-bottom: 8px;
}

.ffn-visual {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: stretch;
}

.vector-column,
.ffn-layers {
  display: grid;
  gap: 10px;
}

.ffn-layer {
  display: flex;
  align-items: center;
  justify-content: center;
}

.stack-visual {
  flex-wrap: wrap;
}

.stack-ellipsis {
  color: var(--muted-color);
  font-size: 36pt;
}

.logit-bars {
  display: flex;
  align-items: end;
  gap: 16px;
  height: 180px;
  padding: 14px 20px;
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  background: rgba(74, 158, 255, 0.06);
}

.logit-bars div {
  display: grid;
  align-items: end;
  gap: 8px;
  justify-items: center;
}

.logit-bars b {
  display: block;
  width: 44px;
  border-radius: 5px 5px 0 0;
  background: var(--secondary-color);
}

.logit-bars span {
  color: var(--text-color);
  font-size: 12pt;
}

.norm-visual {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: stretch;
}

.norm-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 18px 0;
}

.norm-row span {
  padding: 10px 12px;
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 6px;
}

.norm-lane p {
  font-size: 14pt !important;
  color: var(--muted-color) !important;
  margin: 0 !important;
}

.residual-visual {
  position: relative;
  min-height: 240px;
  flex: 1;
}

.residual-line {
  position: absolute;
  left: 80px;
  right: 80px;
  top: 50%;
  height: 4px;
  background: var(--primary-color);
}

.residual-token,
.residual-write {
  position: absolute;
  border-radius: var(--box-radius);
  border: 1px solid rgba(245, 166, 35, 0.50);
  background: rgba(245, 166, 35, 0.12);
  padding: 10px 14px;
  color: var(--text-color);
  font-size: 14pt;
}

.residual-token.start { left: 20px; top: calc(50% - 24px); }
.residual-token.end { right: 20px; top: calc(50% - 24px); }
.residual-write.top { left: 270px; top: 26px; }
.residual-write.bottom { left: 470px; bottom: 26px; }
.residual-write.second { left: 680px; }

.icl-diagram {
  display: grid;
  grid-template-columns: 1.2fr 44px 1fr 44px 0.7fr;
}

.icl-prompt {
  display: grid;
  gap: 10px;
}

.icl-prompt div {
  padding: 12px 14px;
  border: 1px solid rgba(74, 158, 255, 0.30);
  border-radius: var(--box-radius);
  background: rgba(74, 158, 255, 0.08);
  color: var(--text-color);
  font-size: 15pt;
}

.icl-prompt .accent {
  border-color: rgba(245, 166, 35, 0.60);
  background: rgba(245, 166, 35, 0.12);
}

.icl-pattern {
  display: grid;
  gap: 14px;
  align-items: center;
}

.icl-pattern div {
  padding: 12px 14px;
  border: 1px solid rgba(74, 158, 255, 0.30);
  border-radius: var(--box-radius);
  background: rgba(74, 158, 255, 0.08);
  color: var(--text-color);
  font-size: 14pt;
  text-align: center;
}

.icl-pattern .stream-line {
  height: 4px;
  padding: 0;
  border: none;
  background: var(--primary-color);
  border-radius: 0;
}

.icl-pattern .accent {
  border-color: rgba(245, 166, 35, 0.60);
  background: rgba(245, 166, 35, 0.12);
}

.transformer-figure {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 36px;
  align-items: center;
  margin: 12px 0;
}

.transformer-figure img {
  max-height: 420px;
  width: 100%;
  object-fit: contain;
  border-radius: var(--box-radius);
  background: #ffffff;
  padding: 10px;
}

.transformer-callouts {
  display: grid;
  gap: 12px;
}

.transformer-callouts div {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.28);
  border-radius: var(--box-radius);
  padding: 10px 16px;
  text-align: left;
  color: var(--text-color);
}

.transformer-callouts div strong {
  color: var(--text-color);
  font-size: 17pt;
}

.transformer-callouts span {
  display: block;
  color: var(--muted-color);
  font-size: 13pt;
  margin-top: 4px;
}

.encoder-decoder-layout {
  display: grid;
  grid-template-columns: 410px 1fr;
  gap: 34px;
}

.encoder-decoder-layout img {
  max-height: 520px;
  width: 100%;
  object-fit: contain;
  border-radius: var(--box-radius);
  background: #ffffff;
  padding: 8px;
}

.family-grid {
  grid-template-columns: 1fr;
}

.family-grid div {
  text-align: left;
}

.moe-diagram {
  display: grid;
  grid-template-columns: 260px 1fr;
}

.expert-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.beam-diagram {
  flex-direction: column;
  gap: 16px;
}

.beam-level {
  display: flex;
  gap: 18px;
}

.beam-node.root {
  min-width: 120px;
}

.beam-node.dropped {
  opacity: 0.48;
}

.resources-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 28px;
  margin-top: 16px;
}

.resources-grid h3 {
  font-size: 18pt;
  margin: 0 0 8px 0;
  color: var(--secondary-color);
}

.reveal ul.resource-list {
  margin: 0;
}

.reveal ul.resource-list li {
  font-size: 11.5pt;
  line-height: 1.28;
  margin-bottom: 6px;
  padding-left: 18px;
}

.reveal ul.resource-list li::before {
  width: 6px;
  height: 6px;
}

#bpe-algorithm .video-container video {
  max-height: 540px;
}

/* Decoder-only architecture stack (architecture-only slide). Kept compact so
   the whole stack fits one slide without overflowing. */
.decoder-arch {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  max-width: 440px;
  margin: 6px auto 0;
}

.da-node {
  width: 100%;
  box-sizing: border-box;
  padding: 6px 14px;
  border-radius: var(--box-radius);
  border: 1px solid rgba(74, 158, 255, 0.40);
  background: rgba(74, 158, 255, 0.10);
  color: var(--text-color);
  text-align: center;
  font-size: 13.5pt;
  line-height: 1.15;
}

.da-node.io {
  border-color: rgba(245, 166, 35, 0.55);
  background: rgba(245, 166, 35, 0.12);
}

.da-node.sub {
  border-color: rgba(136, 146, 164, 0.45);
  background: rgba(136, 146, 164, 0.10);
  font-size: 12.5pt;
}

.da-arrow {
  color: var(--secondary-color);
  font-size: 13pt;
  line-height: 1;
  margin: 0;
}

.da-block {
  position: relative;
  width: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 12px 10px;
  border: 1px dashed rgba(74, 158, 255, 0.55);
  border-radius: var(--box-radius);
  background: rgba(74, 158, 255, 0.04);
}

.da-block-label {
  position: absolute;
  top: 50%;
  right: -52px;
  transform: translateY(-50%);
  color: var(--secondary-color);
  font-size: 16pt;
  font-weight: 600;
}

/* Glitch-token example exchange */
.glitch-example {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 720px;
  margin: 22px auto;
}

.glitch-turn {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 12px 16px;
  border-radius: var(--box-radius);
  border: 1px solid rgba(136, 146, 164, 0.30);
  background: rgba(136, 146, 164, 0.08);
  color: var(--text-color);
  font-size: 16pt;
  text-align: left;
}

.glitch-turn span {
  flex: 0 0 86px;
  color: var(--muted-color);
  font-size: 11pt;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

.glitch-turn.model {
  border-color: rgba(245, 166, 35, 0.55);
  background: rgba(245, 166, 35, 0.10);
}

.glitch-turn.model span { color: var(--secondary-color); }

/* Beam-search sideways tree */
.beam-tree {
  display: flex;
  justify-content: center;
  margin: 18px 0 8px;
}

.beam-tree svg {
  width: 100%;
  max-width: 820px;
  max-height: 250px;
  height: auto;
}

/* Single rolled RNN cell and the LSTM memory-belt diagram */
.rnn-rolled,
.lstm-belt {
  display: flex;
  justify-content: center;
  margin: 18px 0 8px;
}

# LLMs 0 to 100

Module 4: LLM Architectures


---

<!-- .slide: id="review-1" -->

## Review: Module 3

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**Self-Attention as a Learned Lookup**

Compare every token (query) against every other token (key), normalize with softmax, and retrieve a weighted sum of values:

$$\text{Attention}(Q, K, V) = \text{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right) V$$

Each output token is a weighted average of value vectors, with weights from query-key compatibility.

</div>

<div>

**The Missing Pieces**

- A single attention layer is not a model; it needs embeddings, depth (stacked blocks), and an output head
- Positional embeddings inject order into a bag of attention scores
- Causal masking ensures autoregressive generation: each token only attends to itself and previous tokens

</div>

</div>

---

<!-- .slide: id="review-2" -->

## Review: From Attention to Models

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**What Module 3 gave us**

- Queries choose what each token is looking for
- Keys describe what each token offers
- Values carry the information to copy forward
- A causal mask blocks attention to future tokens

</div>

<div>

**What is still missing**

- Token IDs must become vectors
- Attention must be wrapped in residuals, normalization, and feed-forward networks
- Many blocks must stack before logits become text
- Architecture choices determine what the model can do

</div>

</div>

- Each step takes the previous hidden state and the current token

<!-- .slide: id="rnn-problems" -->

## The Problems with Recurrence

- **Vanishing and exploding gradients:** backprop through time multiplies many weight matrices; the product shrinks to zero or blows up (Module 2's multiplication rule, repeated per step)
- **Sequential dependency:** token $t$ waits for tokens $1 \dots t-1$; $n$ tokens take $n$ serial steps, so training cannot parallelize across the sequence
- **Fixed-size bottleneck:** all context squeezes through one fixed-dimension vector

- **Forget gate:** erases part of the old memory
- **Input gate:** writes new information
- **Output gate:** chooses what to reveal as the hidden state
- **GRUs:** simplify to two gates (update, reset)
- Gating fixes vanishing gradients but stays **sequential** with a **fixed-size bottleneck**

### Long Short-Term Memory (1997)

- With Sepp Hochreiter, introduced gated recurrent cells for long-range dependencies

<!-- .slide: id="seq2seq" -->

## Sequence-to-Sequence Learning

Encoder-decoder RNNs (Sutskever et al., 2014) use two recurrent networks:

- **Encoder:** compresses the input into one fixed-size context vector
- **Decoder:** generates the output from that vector
- Dominant architecture for machine translation
- Bottleneck: long and short sentences compress into the same-size vector
- Bahdanau attention (Module 3) fixed this by letting the decoder attend to all encoder states

## Ilya Sutskever <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Sequence to Sequence Learning (2014)

- With Oriol Vinyals and Quoc Le, showed encoder-decoder RNNs could translate sequences
- The encoder compressed the source sentence into one vector
- That bottleneck motivated attention over encoder states

<!-- .slide: id="attention-is-all-you-need" -->

## Attention Is All You Need (2017)

Vaswani et al. removed recurrence entirely. In its place: stacked multi-head self-attention plus feed-forward networks.

- **Full parallelism:** training processes every token at once; the causal mask enforces order
- **Constant path length:** token 1 and token $n$ interact directly through one attention layer, $O(1)$ instead of $O(n)$ recurrent steps
- **No bottleneck:** each layer sees the full sequence; nothing compresses into one vector

Each fix answers one RNN limitation from the previous slide.

# Tokenization

What is the atomic unit of a language model?

<!-- .slide: id="unit-problem" -->

## The Unit Problem

What should a language model read?

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 25px;">

<div>

**Characters**

- Tiny vocabulary (~256 bytes)
- Very long sequences
- Each token carries almost no meaning

</div>

<div>

**Words**

- Meaningful units
- Vocabulary explodes to hundreds of thousands
- Typos and new words become out-of-vocabulary

</div>

<div>

**Subwords**

- Frequent words stay whole; rare words split into pieces
- "tokenization" &rarr; "token" + "ization"
- Typos and new coinages stay representable

</div>

</div>

<!-- .slide: id="tokenization-practice" -->

## Why Tokenization Matters in Practice

<div class="token-practice-grid">
  <div class="token-case">
    <h3>English prose</h3>
    <div class="token-strip"><span>the</span><span>&nbsp;cat</span><span>&nbsp;sat</span></div>
    <p>Frequent pieces stay compact.</p>
  </div>
  <div class="token-case">
    <h3>Less represented scripts</h3>
    <div class="token-strip"><span>日</span><span>本</span><span>語</span><span>の</span><span>文</span><span>章</span></div>
    <p>More pieces can mean higher cost for the same idea.</p>
  </div>
  <div class="token-case">
    <h3>Strings and numbers</h3>
    <div class="token-strip"><span>12345</span><span>&nbsp;reverse</span><span>&nbsp;me</span></div>
    <p>The model sees token IDs, not guaranteed character access.</p>
  </div>
</div>

- Tokenized text is a list of integer IDs; each ID selects one embedding row
- The transformer sees only vectors, never the original characters
- This is why LLMs struggle to reverse strings or count letters

---

<!-- .slide: id="side-quest-glitch-tokens" -->

## Side Quest: Glitch Tokens

The tokenizer and the model are trained **separately**, and that seam can crack:

- A rare string earns a vocabulary entry in the tokenizer's data but rarely appears in the model's training data
- Its embedding row gets almost no gradient and stays near random initialization
- Classic case: <code>&nbsp;SolidGoldMagikarp</code>, a Reddit username; early GPT models refused it, swapped it, or produced garbage

<div class="glitch-example">
  <div class="glitch-turn user"><span>Prompt</span>Please repeat the string "SolidGoldMagikarp" back to me.</div>
  <div class="glitch-turn model"><span>Early GPT</span>"distribute"</div>
</div>

A real exchange: the model swaps the glitch token for an unrelated word.

These **under-trained tokens** (Land and Bartolo, 2024) prove the boundary: the model never sees `S-o-l-i-d-...`, only one token ID and its embedding vector.

# Generating Text

From logits to tokens: decoding strategies

<!-- .slide: id="logits-to-text" -->

## From Logits to Text

A forward pass produces a raw score (a **logit** $z$) for every token in the vocabulary. **Softmax** turns those scores into probabilities that sum to one:

$$p_{\textcolor{#f5a623}{i}} = \frac{e^{z_{\textcolor{#f5a623}{i}}}}{\sum_{\textcolor{#4a9eff}{j}} e^{z_{\textcolor{#4a9eff}{j}}}}$$

<div class="prompt-line"><span class="pl-text">The capital of France is</span><span class="pl-next">next token?</span></div>

<div class="logit-index-visual">
  <div class="lv-num"><b>i</b> &mdash; the one token whose probability we are computing (numerator)</div>
  <div class="vocab-stack">
    <div class="vocab-row">
      <span class="vtok i">Paris<small>z = 8.2</small></span>
      <span class="vtok">London<small>5.1</small></span>
      <span class="vtok">Lyon<small>4.7</small></span>
      <span class="vtok">city<small>4.0</small></span>
      <span class="vtok">the<small>3.2</small></span>
      <span class="vtok">of<small>2.5</small></span>
      <span class="vtok more">&hellip;</span>
    </div>
    <div class="vocab-bracket"></div>
  </div>
  <div class="lv-den"><b>j</b> &mdash; runs over <strong>every</strong> token in the vocabulary; the sum normalizes (denominator)</div>
</div>

---

<!-- .slide: id="greedy-decoding" -->

## Greedy Decoding

Always pick the token with the highest probability:

$$\text{token}_t = \arg\max_i p_i$$

- Simple, deterministic, fast
- Produces repetitive, flat text; never explores lower-probability continuations
- Once in a loop ("the the the"), it stays there

---

<!-- .slide: id="temperature" -->

## Temperature

Scale the logits by $\textcolor{#f5a623}{T}$ before softmax to control randomness:

$$p_i = \frac{e^{z_i / \textcolor{#f5a623}{T}}}{\sum_j e^{z_j / \textcolor{#f5a623}{T}}}$$

<div class="temp-regimes">
  <div class="temp-card"><b>T &lt; 1</b><span>sharper</span><p>conservative; sticks to the highest-probability tokens</p></div>
  <div class="temp-card"><b>T = 1</b><span>original</span><p>the model's raw distribution, unchanged</p></div>
  <div class="temp-card"><b>T &gt; 1</b><span>flatter</span><p>more random and creative; unlikely tokens gain probability</p></div>
</div>

The simplest inference-time control over randomness.

---

<!-- .slide: id="topk-topp" -->

## Top-k and Top-p (Nucleus) Sampling

Temperature alone can still sample implausible tokens. Two truncation fixes:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**Top-k**

- Keep the $k$ most likely tokens, renormalize, sample
- $k = 50$ is common
- Fixed cutoff: too strict for peaked distributions, too loose for flat ones

</div>

<div>

**Top-p (nucleus)**

- Keep the smallest set with cumulative probability &gt; $p$
- Peaked distribution: ~5 tokens. Flat: ~200
- Adapts to distribution shape

</div>

</div>

In practice: scale by temperature, then truncate, then sample.

<!-- .slide: id="attention-sublayer" -->

## Step 3: Multi-Head Attention

<div class="decoder-flow active-attention">
  <div class="flow-node embedding">word &rarr; vector</div>
  <div class="flow-node position">add position</div>
  <div class="flow-node attention">multi-head attention</div>
  <div class="flow-node ffn">feed-forward network</div>
  <div class="flow-node repeat">repeat blocks</div>
  <div class="flow-node sampling">sampling</div>
</div>

$$\text{Attention}(Q,K,V) = \text{softmax}\left(\frac{QK^{\top}}{\sqrt{d_k}}\right)V$$

<div class="attention-detail">
  <div class="causal-matrix">
    <div></div><div>The</div><div>capital</div><div>of</div><div>France</div>
    <div>The</div><span class="on"></span><span></span><span></span><span></span>
    <div>capital</div><span class="on"></span><span class="on"></span><span></span><span></span>
    <div>of</div><span class="on"></span><span class="on"></span><span class="on"></span><span></span>
    <div>France</div><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span>
  </div>
  <div class="attention-steps">
    <ul>
      <li>Each token is projected into a <strong>query</strong>, a <strong>key</strong>, and a <strong>value</strong></li>
      <li>Score every query against every key, then scale by the square root of the head dimension</li>
      <li>The <strong>causal mask</strong> keeps only the lower triangle, so a token never reads from the future</li>
      <li>Softmax the scores into weights, then output the <strong>weighted sum of values</strong></li>
      <li>Several <strong>heads</strong> run in parallel, each learning a different kind of lookup</li>
    </ul>
  </div>
</div>

Attention is the only sub-layer where information moves between positions.

<!-- .slide: id="ffn-sublayer" -->

## Step 4: Feed-Forward Network

<div class="decoder-flow active-ffn">
  <div class="flow-node embedding">word &rarr; vector</div>
  <div class="flow-node position">add position</div>
  <div class="flow-node attention">multi-head attention</div>
  <div class="flow-node ffn">feed-forward network</div>
  <div class="flow-node repeat">repeat blocks</div>
  <div class="flow-node sampling">sampling</div>
</div>

$$\text{FFN}(x) = W_2 \operatorname{ReLU}(W_1 x), \qquad d \rightarrow 4d \rightarrow d$$

- Applied to **each token independently**; never mixes positions
- Project up to $4d$, apply **ReLU**, project back down (GPT-2 uses GELU, a smooth variant)
- Holds much of the model's stored knowledge

## Normalization: Keep the Scale Stable

Normalization rescales each token vector to a stable range. This keeps a deep stack trainable.

<div class="norm-visual">
  <div class="norm-lane">
    <h3>LayerNorm</h3>
    <p>Subtract the mean, divide by the standard deviation, apply a learned gain and bias.</p>
  </div>
  <div class="norm-lane">
    <h3>RMSNorm</h3>
    <p>Divide by the root-mean-square only. Cheaper, works as well.</p>
  </div>
</div>

Placement: the original transformer normalized **after** each sub-layer (post-norm). Modern decoders normalize **before** (pre-norm), which trains more stably at depth.

<!-- .slide: id="residual-stream" -->

## The Residual Stream View

Every sub-layer reads the current vector, computes an update, and **adds** it back:

<div class="formula-card">output = input + sub-layer(norm(input))</div>

- Blocks only add; the original embedding is never overwritten
- Prompt information stays available many layers later
- Gradients flow back through the addition without decaying
- This "residual stream" is the central object in mechanistic interpretability

## Side Quest: Induction Heads

**Induction heads** (Olsson et al., 2022) implement copy-and-continue:

- See `[A] [B] ... [A]`, predict `[B]`
- The head finds an earlier occurrence of the current token and predicts what followed it, with no weight updates
- A core mechanism behind few-shot (in-context) learning at scale

# Beyond the Vanilla Transformer

Modern blocks, MoE, and sub-quadratic alternatives


---

<!-- .slide: id="modern-block" -->

## The Modern Block: 2017 vs Llama-Style

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**Original Transformer (2017)**

- LayerNorm
- ReLU activation in FFN
- Sinusoidal positional embeddings
- Post-norm (normalize after sub-layer)
- Bias terms in all linear layers

</div>

<div>

**Modern Llama-Style**

- RMSNorm (simpler, faster)
- SwiGLU activation (smoother, better gradients)
- RoPE (rotary positional embeddings, callback to Module 3)
- Pre-norm (normalize before sub-layer)
- **Dropped bias terms** in linear layers (saves parameters)

</div>

</div>

Mostly independent changes; together they make training more stable and efficient.

---

<!-- .slide: id="moe" -->

## Mixture of Experts

<div class="moe-diagram">
  <div class="router-box">router<br><span>top-k experts per token</span></div>
  <div class="expert-grid">
    <div class="expert active">expert 3<br><span>GPU active</span></div>
    <div class="expert">expert 8<br><span>CPU or cold GPU</span></div>
    <div class="expert active">expert 17<br><span>GPU active</span></div>
    <div class="expert">expert 42<br><span>CPU or cold GPU</span></div>
  </div>
</div>

$$\text{MoE}(\mathbf{x}) = \sum_{i=1}^{E} g(\mathbf{x})_i \cdot \text{FFN}_i(\mathbf{x})$$

- $g(\mathbf{x})$ is the router: a sparse gate, nonzero only for the top-$k$ experts
- Sparse activation buys far more parameters at roughly the same compute per token
- Serving trade-off: active experts need fast GPU access; inactive ones can sit in CPU memory or on other devices

---

<!-- .slide: id="sub-quadratic" -->

## Sub-Quadratic Alternatives

Attention is $O(n^2)$ in sequence length; the bottleneck for long contexts. Alternatives under active research:

- **State-space models** (Mamba): recurrent update with input-dependent gates; linear in length, fixed-size state
- **Linear attention:** kernelize the softmax; no $n \times n$ matrix
- **RWKV:** recurrent update with linear attention-like weights
- **Hybrids** (Jamba): attention layers for short-range precision, Mamba layers for long-range compression

The transformer still dominates; the $O(n^2)$ cost keeps the search alive.

<!-- .slide: id="divider-families" class="section-divider" data-state="is-section-divider" -->

# Three Architectural Families

Encoder-decoder, encoder-only, and decoder-only


---

<!-- .slide: id="encoder-decoder" -->

## Family 1: Encoder-Decoder

<div class="encoder-decoder-layout">
  <img src="module_04_architectures/images/transformer.webp" alt="Original transformer encoder-decoder architecture">
  <div>
    <p>The original transformer has two stacks: an encoder for the input and a decoder for the output.</p>
    <div class="family-grid">
      <div><strong>Encoder</strong><span>bidirectional self-attention over the source</span></div>
      <div><strong>Decoder</strong><span>causal self-attention plus cross-attention to encoder states</span></div>
      <div><strong>Best fit</strong><span>translation, summarization, and other input-output sequence tasks</span></div>
      <div><strong>Examples</strong><span>T5 and BART keep separate input understanding and output generation</span></div>
    </div>
  </div>
</div>

---

<!-- .slide: id="encoder-only" -->

## Family 2: Encoder-Only

- Bidirectional attention, no causal mask, no decoder
- Trained with **masked language modeling** (Module 5): hide tokens, predict them from both sides

$$\text{output}_i = f(\mathbf{x}_1, \dots, \mathbf{x}_n) \quad \text{for all } i$$

- Produces representations, not generations: classification, embeddings, retrieval, named-entity recognition
- BERT (Devlin et al., 2018) made this dominant for "understanding" tasks; RoBERTa improved the recipe, same architecture

---

<!-- .slide: id="decoder-only" -->

## Family 3: Decoder-Only

- Causal masking, autoregressive next-token prediction
- GPT (Radford et al., 2018), GPT-2, GPT-3, and the Llama lineage share this design

$$\text{output}_t = f(\mathbf{x}_1, \dots, \mathbf{x}_t)$$

Why it won for LLMs:

- One stack, simple, scales cleanly
- Next-token objective: dense training signal at every position
- Any task phrases as text completion; no task-specific heads
- In-context and few-shot learning emerge at scale

---

<div class="figure-card">

![Alec Radford](module_04_architectures/images/radford.jpg)

<div class="figure-info">

## Alec Radford <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### GPT and GPT-2 (2018-2019)

- Showed that autoregressive pretraining could produce general-purpose text models
- GPT-2 demonstrated coherent long-form generation from scale and data
- The decoder-only stack became the dominant LLM design

</div>

</div>

</div>

---

<!-- .slide: id="honest-tradeoffs" -->

## The Honest Trade-offs

Decoder-only won on generality and scaling, not every axis:

- **Encoder-only:** faster for embeddings, retrieval, classification
- **Encoder-decoder:** strong when input and output are distinct (translation); bidirectional input, autoregressive output
- **Decoder-only:** best for open-ended tasks and one-model-for-everything prompting; the price is phrasing every task as completion

Pick by problem, not by fashion.

# Quiz


---

<!-- .slide: id="quiz-ffn" -->

## Why Does the Feed-Forward Network Matter?

<div class="quiz-prompt">

The attention sub-layer mixes information between positions, but the feed-forward network (FFN) processes each position independently. Why is the FFN still essential?

</div>

<div class="fragment note quiz-answer">

The FFN holds most of the parameters and stored "knowledge."

- Each neuron acts like a key-value pair: input activates it, it retrieves a learned output vector
- Without it, the model only mixes existing embeddings and cannot store or recall facts

</div>

---

<!-- .slide: id="quiz-pre-post-norm" -->

## Pre-Norm vs Post-Norm

<div class="quiz-prompt">

The original transformer placed LayerNorm after each sub-layer (post-norm). Modern models place it before (pre-norm). Why is pre-norm preferred?

</div>

<div class="fragment note quiz-answer">

Pre-norm trains more stably at depth.

- Post-norm: gradients pass through LayerNorm before the residual add; deep stacks compound this into vanishing or exploding gradients
- Pre-norm: normalization sits outside the residual path, so the gradient highway stays clean

</div>

---

<!-- .slide: id="quiz-decoder-only" -->

## Why Did Decoder-Only Win for LLMs?

<div class="quiz-prompt">

Decoder-only models are not universally better. What specific advantages made them the dominant LLM architecture?

</div>

<div class="fragment note quiz-answer">

- One stack: simpler, scales cleanly
- Next-token objective gives a dense training signal at every position
- Generation subsumes "understanding": classification becomes text completion
- In-context learning emerges at scale without task-specific heads

</div>

---

<!-- .slide: id="quiz-token-tax" -->

## The Tokenization Trade-Off

<div class="quiz-prompt">

A larger vocabulary means shorter sequences but a larger embedding matrix. Why does non-English text often cost more tokens per sentence?

</div>

<div class="fragment note quiz-answer">

- English dominates training corpora, so more English words fit whole in the vocabulary
- Other scripts and low-resource languages split into more pieces
- The "token tax": same content, more tokens, higher cost and context usage

</div>

---

<!-- .slide: id="quiz-moe" -->

## How Does MoE Add Parameters Without Adding Compute?

<div class="quiz-prompt">

Mixture of Experts replaces one large FFN with many smaller FFNs plus a router. Why does total compute per token stay roughly constant?

</div>

<div class="fragment note quiz-answer">

- The router picks a small subset per token (e.g., top-2 of 64 experts)
- Most expert parameters stay inactive each forward pass
- Parameters scale with expert count; compute scales only with the activated subset

</div>

---

<!-- .slide: id="quiz-temperature" -->

## The Effect of Temperature on Sampling

<div class="quiz-prompt">

Temperature $T$ scales logits before softmax. How does a very high temperature change the sample distribution, and why might that be undesirable?

</div>

<div class="fragment note quiz-answer">

- High $T$ flattens the distribution: unlikely tokens become nearly as probable as likely ones
- Output turns random and ungrammatical
- Very low $T$ sharpens the peak: repetitive, deterministic text
- Typical range: $T \approx 0.7$ to $1.0$

</div>

  // ===================================================================
  function samplingExplorer(host) {
    var U = WIDGET_UTIL, COL = WIDGET_UTIL.COL;
    var TOKENS = ['Paris', 'the', 'a', 'located', 'now', 'home', 'known', 'one', 'situated', 'France', 'Lyon', 'called'];
    var LOGITS = [6.6, 5.4, 5.1, 4.6, 4.0, 3.7, 3.4, 3.0, 2.6, 2.2, 1.9, 1.5];
    var state = { T: 1.0, k: 12, p: 1.0, draws: null };

    host.innerHTML =
      '<div class="iw">' +
        '<div class="iw-canvas-wrap"><canvas class="iw-canvas"></canvas></div>' +
        '<div class="iw-sliders">' +
          U.sliderHTML('T', 'temperature', 0.1, 2.0, 0.05, 1.0) +
          U.sliderHTML('k', 'top-k', 1, 12, 1, 12) +
          U.sliderHTML('p', 'top-p', 0.05, 1.0, 0.01, 1.0) +
        '</div>' +
        '<div class="iw-controls">' +
          '<button class="iw-btn iw-primary" data-act="sample">Draw 200 samples</button>' +
          '<button class="iw-btn iw-reset" data-act="reset">Reset</button>' +
        '</div>' +
        '<p class="iw-readout"></p>' +
      '</div>';
    U.stop(host);
    var canvas = host.querySelector('.iw-canvas');
    var readout = host.querySelector('.iw-readout');

    // The serving-time order: temperature first, then truncate, then renormalize.
    function distribution() {
      var probs = U.softmax(LOGITS, state.T);
      var order = probs.map(function (v, i) { return i; })
        .sort(function (a, b) { return probs[b] - probs[a]; });
      var kept = {}, cum = 0;
      for (var r = 0; r < order.length; r++) {
        if (r >= state.k) break;
        kept[order[r]] = true;
        cum += probs[order[r]];
        if (cum >= state.p) break;   // top-p stops once the nucleus is covered
      }
      var mass = 0;
      probs.forEach(function (v, i) { if (kept[i]) mass += v; });
      var final = probs.map(function (v, i) { return kept[i] ? v / mass : 0; });
      return { raw: probs, kept: kept, final: final, size: Object.keys(kept).length };
    }

    function draw() {
      var f = U.fit(canvas); if (!f) return;
      var ctx = f.ctx, W = f.w, H = f.h;
      ctx.clearRect(0, 0, W, H);
      var d = distribution();

      var padL = 46, padR = 20, padB = 62, padT = 30;
      var plotW = W - padL - padR, plotH = H - padT - padB;
      var n = TOKENS.length;
      var step = plotW / n, bw = Math.min(52, step - 12);
      var maxP = Math.max.apply(null, d.final.concat(d.raw));
      var scale = plotH / (maxP * 1.12);

      ctx.textAlign = 'center';
      ctx.font = '12px Inter, sans-serif';
      ctx.fillStyle = COL.muted;
      ctx.fillText('probability after temperature (outline) and after truncation + renormalize (filled)' +
        (state.draws ? '; orange = how often 200 draws actually landed there' : ''), W / 2, 16);

      for (var i = 0; i < n; i++) {
        var cx = padL + step * i + step / 2;
        var yBase = padT + plotH;

        // Outline: what temperature alone produced, before any cutoff.
        var hRaw = d.raw[i] * scale;
        ctx.strokeStyle = 'rgba(136,146,164,0.55)';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(cx - bw / 2, yBase - hRaw, bw, hRaw);

        var hFin = d.final[i] * scale;
        if (hFin > 0.5) {
          ctx.fillStyle = d.kept[i] ? 'rgba(74,158,255,0.75)' : 'rgba(136,146,164,0.15)';
          U.rounded(ctx, cx - bw / 2, yBase - hFin, bw, hFin, 3);
          ctx.fill();
        }

        // Sample counts land as an orange overlay so drift from the bars is visible.
        if (state.draws) {
          var hs = (state.draws[i] / state.draws.total) * scale;
          if (hs > 0.5) {
            ctx.fillStyle = 'rgba(245,166,35,0.85)';
            ctx.fillRect(cx - bw / 2 + bw * 0.28, yBase - hs, bw * 0.44, hs);
          }
        }

        ctx.save();
        ctx.translate(cx, yBase + 10);
        ctx.rotate(-Math.PI / 5);
        ctx.textAlign = 'right';
        ctx.fillStyle = d.kept[i] ? COL.text : COL.muted;
        ctx.font = (d.kept[i] ? '600 ' : '') + '12px Inter, sans-serif';
        ctx.fillText(TOKENS[i], 0, 0);
        ctx.restore();
      }

      ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, padT + plotH); ctx.lineTo(W - padR, padT + plotH); ctx.stroke();

      var ent = 0;
      d.final.forEach(function (v) { if (v > 0) ent -= v * Math.log2(v); });
      readout.innerHTML = 'Kept <strong>' + d.size + ' of ' + n + '</strong> tokens. Top token now at <strong>' +
        (Math.max.apply(null, d.final) * 100).toFixed(1) + '%</strong>, entropy <strong>' + ent.toFixed(2) +
        ' bits</strong>. Truncation is what stops the long tail from ever being drawn.';
    }

    var read = U.bindSliders(host, function (key, value) {
      state[key] = value;
      state.draws = null;
      sync();
      draw();
    });

    function sync() {
      var v = read();
      U.setVal(host, 'T', v.T.toFixed(2));
      U.setVal(host, 'k', String(v.k));
      U.setVal(host, 'p', v.p.toFixed(2));
    }

    host.querySelector('[data-act="sample"]').addEventListener('click', function () {
      var d = distribution();
      var rand = U.rng(20240917);
      var counts = new Array(TOKENS.length).fill(0);
      for (var s = 0; s < 200; s++) {
        var r = rand(), acc = 0, pick = 0;
        for (var i = 0; i < d.final.length; i++) { acc += d.final[i]; if (r <= acc) { pick = i; break; } }
        counts[pick]++;
      }
      counts.total = 200;
      state.draws = counts;
      draw();
    });
    host.querySelector('[data-act="reset"]').addEventListener('click', function () {
      state = { T: 1.0, k: 12, p: 1.0, draws: null };
      host.querySelector('[data-key="T"]').value = 1.0;
      host.querySelector('[data-key="k"]').value = 12;
      host.querySelector('[data-key="p"]').value = 1.0;
      sync(); draw();
    });

    sync();
    draw();
    return { resize: draw };
  }

  window.MODULE_CONFIG = {
    title: 'LLMs 0 to 100 - Module 4',
    manimSections: {

  <script>
// =====================================================================
// CLUSTER_MLP — a small real ReLU MLP trained in the browser (seeded, so
// the result is repeatable), plus a marching-squares contour helper.
// Used by the "Clusters" tab of the mlpBoundary widget: four green
// clusters on a red background. Each hidden neuron's zero-line in input
// space is a straight line for layer 1 and a piecewise-linear curve for
// deeper layers; the final boundary is the output neuron's zero-line.
// =====================================================================
var CLUSTER_MLP = (function() {
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function gauss(rnd) {
    var u = 1 - rnd(), v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v);
  }
  var CENTERS = [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]];

  function generateData() {
    var rnd = mulberry32(7);
    var pts = [];
    CENTERS.forEach(function(c) {
      for (var i = 0; i < 22; i++) {
        pts.push({ x: c[0] + gauss(rnd) * 0.045, y: c[1] + gauss(rnd) * 0.045, cls: 1 });
      }
    });
    var reds = 0;
    while (reds < 150) {
      var x = 0.03 + rnd() * 0.94, y = 0.03 + rnd() * 0.94;
      var near = CENTERS.some(function(c) { return Math.hypot(x - c[0], y - c[1]) < 0.17; });
      if (near) continue;
      pts.push({ x: x, y: y, cls: 0 });
      reds++;
    }
    return pts;
  }

  // ---- network: [2 -> W]*D (ReLU) -> 1 (sigmoid), full-batch Adam ----
  function makeNet(width, depth, seed) {
    var rnd = mulberry32(seed);
    var layers = [];
    var fanIn = 2;
    for (var d = 0; d < depth; d++) {
      layers.push(initLayer(fanIn, width, rnd));
      fanIn = width;
    }
    layers.push(initLayer(fanIn, 1, rnd));
    return { width: width, depth: depth, layers: layers };
  }
  function initLayer(nIn, nOut, rnd) {
    var W = [], b = [];
    var scale = Math.sqrt(2 / nIn);
    for (var o = 0; o < nOut; o++) {
      var row = [];
      for (var i = 0; i < nIn; i++) row.push(gauss(rnd) * scale);
      W.push(row);
      b.push(gauss(rnd) * 0.1);
    }
    return { W: W, b: b, mW: zeros(nOut, nIn), vW: zeros(nOut, nIn), mb: new Array(nOut).fill(0), vb: new Array(nOut).fill(0) };
  }
  function zeros(r, c) {
    var a = [];
    for (var i = 0; i < r; i++) a.push(new Array(c).fill(0));
    return a;
  }

  // Forward pass returning every layer's pre-activations and activations.
  // Inputs are centered so the first layer's lines can pass near the middle.
  function forward(net, x, y) {
    var act = [x - 0.5, y - 0.5];
    var pres = [], acts = [act];
    for (var l = 0; l < net.layers.length; l++) {
      var L = net.layers[l];
      var pre = [], out = [];
      var last = l === net.layers.length - 1;
      for (var o = 0; o < L.W.length; o++) {
        var s = L.b[o];
        for (var i = 0; i < act.length; i++) s += L.W[o][i] * act[i];
        pre.push(s);
        out.push(last ? s : (s > 0 ? s : 0));
      }
      pres.push(pre); acts.push(out); act = out;
    }
    return { pres: pres, acts: acts, logit: act[0] };
  }
  function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }

  function trainSteps(net, data, steps, lr) {
    var b1 = 0.9, b2 = 0.999, eps = 1e-8;
    net.t = net.t || 0;
    for (var s = 0; s < steps; s++) {
      net.t++;
      var grads = net.layers.map(function(L) {
        return { W: zeros(L.W.length, L.W[0].length), b: new Array(L.W.length).fill(0) };
      });
      for (var n = 0; n < data.length; n++) {
        var p = data[n];
        var f = forward(net, p.x, p.y);
        var delta = [sigmoid(f.logit) - p.cls];
        for (var l = net.layers.length - 1; l >= 0; l--) {
          var L = net.layers[l], inp = f.acts[l], g = grads[l];
          var prev = new Array(inp.length).fill(0);
          for (var o = 0; o < L.W.length; o++) {
            g.b[o] += delta[o];
            for (var i = 0; i < inp.length; i++) {
              g.W[o][i] += delta[o] * inp[i];
              prev[i] += delta[o] * L.W[o][i];
            }
          }
          if (l > 0) {
            for (var k = 0; k < prev.length; k++) if (f.pres[l - 1][k] <= 0) prev[k] = 0;
          }
          delta = prev;
        }
      }
      var N = data.length;
      var c1 = 1 - Math.pow(b1, net.t), c2 = 1 - Math.pow(b2, net.t);
      net.layers.forEach(function(L, l) {
        var g = grads[l];
        for (var o = 0; o < L.W.length; o++) {
          for (var i = 0; i < L.W[o].length; i++) {
            var gw = g.W[o][i] / N;
            L.mW[o][i] = b1 * L.mW[o][i] + (1 - b1) * gw;
            L.vW[o][i] = b2 * L.vW[o][i] + (1 - b2) * gw * gw;
            L.W[o][i] -= lr * (L.mW[o][i] / c1) / (Math.sqrt(L.vW[o][i] / c2) + eps);
          }
          var gb = g.b[o] / N;
          L.mb[o] = b1 * L.mb[o] + (1 - b1) * gb;
          L.vb[o] = b2 * L.vb[o] + (1 - b2) * gb * gb;
          L.b[o] -= lr * (L.mb[o] / c1) / (Math.sqrt(L.vb[o] / c2) + eps);
        }
      });
    }
  }

  function accuracy(net, data) {
    var ok = 0;
    data.forEach(function(p) { if ((forward(net, p.x, p.y).logit > 0 ? 1 : 0) === p.cls) ok++; });
    return ok / data.length;
  }

  // Train with a few seeds and keep the best, so each (width, depth)
  // shows what that architecture can do rather than one unlucky init.
  function train(data, width, depth, opts) {
    opts = opts || {};
    var seeds = opts.seeds || 4, steps = opts.steps || 400, lr = opts.lr || 0.03;
    var best = null;
    for (var s = 0; s < seeds; s++) {
      var net = makeNet(width, depth, 1000 + s * 17 + width * 3 + depth * 101);
      trainSteps(net, data, steps, lr);
      var acc = accuracy(net, data);
      if (!best || acc > best.acc) best = { net: net, acc: acc };
    }
    return best;
  }

  // ---- marching squares: zero-contour of a scalar field on a grid ----
  function contour(field, n) {
    // field[i][j] sampled at x=i/n, y=j/n for i,j in 0..n
    var segs = [];
    function lerp(a, b, va, vb) { return a + (0 - va) / (vb - va) * (b - a); }
    for (var i = 0; i < n; i++) {
      for (var j = 0; j < n; j++) {
        var v00 = field[i][j], v10 = field[i + 1][j], v01 = field[i][j + 1], v11 = field[i + 1][j + 1];
        var x0 = i / n, x1 = (i + 1) / n, y0 = j / n, y1 = (j + 1) / n;
        var pts = [];
        if ((v00 > 0) !== (v10 > 0)) pts.push([lerp(x0, x1, v00, v10), y0]);
        if ((v10 > 0) !== (v11 > 0)) pts.push([x1, lerp(y0, y1, v10, v11)]);
        if ((v01 > 0) !== (v11 > 0)) pts.push([lerp(x0, x1, v01, v11), y1]);
        if ((v00 > 0) !== (v01 > 0)) pts.push([x0, lerp(y0, y1, v00, v01)]);
