  host.querySelector('.land-step').addEventListener('click', function() {
    var g = batchGrad(state.w1, state.w2, state.batch, state.t + 1);
    var oldW1 = state.w1, oldW2 = state.w2;
    state.w1 += -state.eta * g.g1;
    state.w2 += -state.eta * g.g2;
    state.t++;
    state.lastStep = { oldW1: oldW1, oldW2: oldW2, g1: g.g1, g2: g.g2,
                       trueG1: g.trueG1, trueG2: g.trueG2, eta: state.eta,
                       batch: state.batch, newW1: state.w1, newW2: state.w2 };
    syncWeightReadouts();
    draw();
  });
  resetBtn.addEventListener('click', function() {
    state.w1 = INIT_W1; state.w2 = INIT_W2; state.eta = INIT_ETA; state.batch = INIT_BATCH; state.t = 0;
    state.lastStep = null;
    state.az = INIT_AZ; state.el = INIT_EL; state.zoom = INIT_ZOOM;
    state.panX = 0; state.panY = 0;
    host.querySelector('[data-k="eta"]').value = state.eta;
    host.querySelector('[data-k="batch"]').value = state.batch;
    syncWeightReadouts();
    host.querySelector('[data-r="eta"]').textContent = state.eta.toFixed(1);
    host.querySelector('[data-r="batch"]').textContent = String(state.batch);
    draw();
  });

  function fitCanvas(c) {
    var dpr = window.devicePixelRatio || 1;
    var w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return null;
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    var ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: h };
  }

  function heightColor(z, zmin, zmax) {
    var t = Math.max(0, Math.min(1, (z - zmin) / (zmax - zmin || 1)));
    var r, g, b;
    if (t < 0.25) { r = 0; g = t * 4; b = 1; }
    else if (t < 0.5) { r = 0; g = 1; b = 1 - (t - 0.25) * 4; }
    else if (t < 0.75) { r = (t - 0.5) * 4; g = 1; b = 0; }
    else { r = 1; g = 1 - (t - 0.75) * 4; b = 0; }
    return 'rgba(' + Math.round(r * 255) + ',' + Math.round(g * 255) + ',' + Math.round(b * 255) + ',0.82)';
  }
  function lineColor(z, zmin, zmax) {
    var c = heightColor(z, zmin, zmax);
    return c.replace('0.82)', '0.30)');
  }

  function project3D(x, y, z, W, H) {
    var cx = (WMIN + WMAX) / 2, cy = (WMIN + WMAX) / 2;
    var dx = x - cx, dy = y - cy;
    var ca = Math.cos(state.az), sa = Math.sin(state.az);
    var ce = Math.cos(state.el), se = Math.sin(state.el);
    var xr = dx * ca - dy * sa;
    var yr = dx * sa + dy * ca;
    var zr = -z * 0.22;
    var yr2 = yr * ce - zr * se;
    var zr2 = yr * se + zr * ce;
    var scale = Math.min(W, H) * 0.16 * state.zoom;
    var px = W * 0.5 + state.panX + xr * scale;
    var py = H * 0.55 + state.panY - yr2 * scale * 0.72;
    return { x: px, y: py, depth: zr2 };
  }

  function drawAxis(ctx, from, to, label, color, W, H) {
    var a = project3D(from[0], from[1], from[2], W, H);
    var b = project3D(to[0], to[1], to[2], W, H);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = '12px Inter, sans-serif';
    ctx.textAlign = 'center';
    var lx = Math.max(22, Math.min(W - 22, b.x));
    var ly = Math.max(18, Math.min(H - 14, b.y - 6));
    ctx.fillText(label, lx, ly);
  }

  function drawAxes(ctx, W, H, zmax) {
    var base = [WMIN, WMIN, 0];
    drawAxis(ctx, base, [WMAX, WMIN, 0], 'w₁', PRIMARY, W, H);
    drawAxis(ctx, base, [WMIN, WMAX, 0], 'w₂', SECONDARY, W, H);
    drawAxis(ctx, base, [WMIN, WMIN, zmax * 0.55], 'loss', TEXT, W, H);
  }

  function draw() {
    var f = fitCanvas(canvas);
    if (!f) return;
    var ctx = f.ctx, W = f.w, H = f.h;
    ctx.clearRect(0, 0, W, H);

    var grid = 32;
    var zmin = 0, zmax = loss(WMIN, WMAX);
    var pts = [];
    for (var i = 0; i <= grid; i++) {
      pts[i] = [];
      for (var j = 0; j <= grid; j++) {
        var w1 = WMIN + (WMAX - WMIN) * i / grid;
        var w2 = WMIN + (WMAX - WMIN) * j / grid;
        var z = loss(w1, w2);
        pts[i][j] = project3D(w1, w2, z, W, H);
        pts[i][j].z = z;
      }
    }

    var tris = [];
    for (var i = 0; i < grid; i++) {
      for (var j = 0; j < grid; j++) {
        var a = pts[i][j], b = pts[i + 1][j], c = pts[i][j + 1], d = pts[i + 1][j + 1];
        var zt1 = (a.z + b.z + c.z) / 3;
        var zt2 = (b.z + c.z + d.z) / 3;
        var dt1 = (a.depth + b.depth + c.depth) / 3;
        var dt2 = (b.depth + c.depth + d.depth) / 3;
        tris.push({ p: [a, b, c], z: zt1, d: dt1 });
        tris.push({ p: [b, d, c], z: zt2, d: dt2 });
      }
    }
    tris.sort(function(a, b) { return b.d - a.d; });

    tris.forEach(function(t) {
      ctx.beginPath();
      ctx.moveTo(t.p[0].x, t.p[0].y);
      ctx.lineTo(t.p[1].x, t.p[1].y);
      ctx.lineTo(t.p[2].x, t.p[2].y);
      ctx.closePath();
      ctx.fillStyle = heightColor(t.z, zmin, zmax);
      ctx.fill();
    });

    ctx.lineWidth = 0.6;
    for (var i = 0; i <= grid; i++) {
      for (var j = 0; j < grid; j++) {
        var a = pts[i][j], b = pts[i][j + 1];
        ctx.strokeStyle = lineColor((a.z + b.z) / 2, zmin, zmax);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    for (var j2 = 0; j2 <= grid; j2++) {
      for (var i2 = 0; i2 < grid; i2++) {
        var a2 = pts[i2][j2], b2 = pts[i2 + 1][j2];
        ctx.strokeStyle = lineColor((a2.z + b2.z) / 2, zmin, zmax);
        ctx.beginPath(); ctx.moveTo(a2.x, a2.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
      }
    }

    drawAxes(ctx, W, H, zmax);

    var curL = loss(state.w1, state.w2);
    var curP = project3D(state.w1, state.w2, curL, W, H);
    ctx.shadowColor = RED; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(curP.x, curP.y, 8, 0, 6.2832);
    ctx.fillStyle = RED; ctx.fill();
    ctx.shadowBlur = 0;

    if (state.lastStep) {
      var oldP = project3D(state.lastStep.oldW1, state.lastStep.oldW2,
                           loss(state.lastStep.oldW1, state.lastStep.oldW2), W, H);
      ctx.strokeStyle = SECONDARY; ctx.lineWidth = 2.5;
      ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(oldP.x, oldP.y); ctx.lineTo(curP.x, curP.y); ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.fillStyle = MUTED; ctx.font = '12px Inter, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('Drag: rotate | Shift+drag: pan | Scroll: zoom', 10, H - 10);

    var g = batchGrad(state.w1, state.w2, state.batch, state.t + 1);
    if (state.lastStep) {
      readout.innerHTML =
        'Step: [' + state.lastStep.newW1.toFixed(2) + ', ' + state.lastStep.newW2.toFixed(2) +
        '] = [' + state.lastStep.oldW1.toFixed(2) + ', ' + state.lastStep.oldW2.toFixed(2) +
        '] + (-' + state.lastStep.eta.toFixed(1) + ' · batch-gradient B=' + state.lastStep.batch + ' [' +
        state.lastStep.g1.toFixed(3) + ', ' + state.lastStep.g2.toFixed(3) +
        ']). Current loss: <strong>' + curL.toFixed(3) + '</strong>.';
    } else {
      readout.innerHTML =
        'Batch gradient B=' + state.batch + ': [' + g.g1.toFixed(3) + ', ' + g.g2.toFixed(3) +
        '] (true: [' + g.trueG1.toFixed(3) + ', ' + g.trueG2.toFixed(3) + '])' +
        '. Next: w_new = [' + state.w1.toFixed(2) + ', ' + state.w2.toFixed(2) +
        '] + (-' + state.eta.toFixed(1) + ' · [' + g.g1.toFixed(3) + ', ' + g.g2.toFixed(3) + ']).';
    }
  }
  syncWeightReadouts();
  return { resize: draw };
};

// =====================================================================
// MLP boundary widget — INTERACTIVE_WIDGETS.mlpBoundary
// Deterministic lookup of MLP boundary presets.
// "Many lines make a curve": each hidden neuron contributes one linear
// piece to the decision boundary. Width × depth = total pieces.
// =====================================================================
INTERACTIVE_WIDGETS.mlpBoundary = function(host) {
  var GREEN = '#3fb950', RED = '#e74c3c', MUTED = '#8892a4',
      LINEC = '#2a3450', TEXT = '#e8eaf0', PRIMARY = '#4a9eff', SECONDARY = '#f5a623';
  var state = { dataset: 'spiral', width: 8, depth: 2, net: null, acc: 0, view: -1, hover: null, pinned: null, nodePos: [] };
  var NEURON_COLORS = ['#4a9eff', '#f5a623', '#bd93f9', '#ff79c6', '#8be9fd', '#50fa7b', '#ffb86c', '#f1fa8c'];
  var clusterData = null, clusterCache = {};
  var GRID = 64;
  // Network + training live in the shared MLP module (defined above).
  var generateData = MLP.generateData, train = MLP.train,
      predictOne = MLP.predictOne, computeAccuracy = MLP.computeAccuracy;

  host.innerHTML =
    '<div class="mlp-widget">' +
      '<div class="mlp-canvas-wrap"><canvas class="mlp-canvas"></canvas></div>' +
      '<div class="mlp-controls">' +
        '<div class="expl-datasets"></div>' +
        '<div class="expl-datasets expl-views"></div>' +
        '<div class="mlp-slider"><label>Width</label><input type="range" min="1" max="8" step="1" value="8"><p data-readout="width">8</p></div>' +
        '<div class="mlp-slider"><label>Depth</label><input type="range" min="1" max="4" step="1" value="2"><p data-readout="depth">2</p></div>' +
        '<p class="mlp-readout"></p>' +
      '</div>' +
    '</div>';

  var canvas = host.querySelector('.mlp-canvas');
  var widthInput = host.querySelector('input[data-readout="width"]') || host.querySelector('.mlp-controls input');
  var depthInput = host.querySelectorAll('.mlp-controls input')[1];
  var widthText = host.querySelector('[data-readout="width"]');
  var depthText = host.querySelector('[data-readout="depth"]');
  var readout = host.querySelector('.mlp-readout');
  var dsEl = host.querySelector('.expl-datasets');
  var viewsEl = host.querySelector('.expl-views');

  ['pointerdown', 'keydown'].forEach(function(ev) {
    host.addEventListener(ev, function(e) { e.stopPropagation(); });
  });

  function nodeAt(e) {
    if (state.dataset !== 'clusters') return null;
    var r = canvas.getBoundingClientRect();
    var mx = (e.clientX - r.left) * (canvas.clientWidth / r.width);
    var my = (e.clientY - r.top) * (canvas.clientHeight / r.height);
    var best = null, bestD = 16;
    state.nodePos.forEach(function(n) {
      var d = Math.hypot(n.x - mx, n.y - my);
      if (d < bestD) { bestD = d; best = n; }
    });
    return best;
  }
  function sameNode(a, b) { return (!a && !b) || (a && b && a.layer === b.layer && a.idx === b.idx); }
  canvas.addEventListener('pointermove', function(e) {
    var n = nodeAt(e);
    canvas.style.cursor = n ? 'pointer' : 'default';
    if (sameNode(n, state.hover)) return;
    state.hover = n;
    var active = state.pinned || state.hover;
    if (active && active.layer !== state.view) { state.view = active.layer; }
    updateUI(); draw();
  });
  canvas.addEventListener('pointerleave', function() {
    if (!state.hover) return;
    state.hover = null; updateUI(); draw();
  });
  canvas.addEventListener('click', function(e) {
    var n = nodeAt(e);
    if (!n) { if (state.pinned) { state.pinned = null; updateUI(); draw(); } return; }
    state.pinned = sameNode(n, state.pinned) ? null : n;
    if (state.pinned) state.view = state.pinned.layer;
    updateUI(); draw();
  });

  var datasets = ['moons', 'spiral', 'clusters'];
  function applyDatasetPreset(name) {
    state.dataset = name;
    if (name === 'moons') { state.width = 6; state.depth = 1; }
    if (name === 'spiral') { state.width = 8; state.depth = 2; }
    if (name === 'clusters') { state.width = 6; state.depth = 2; }
    state.view = -1; state.hover = null; state.pinned = null;
    widthInput.value = state.width; depthInput.value = state.depth;
    widthText.textContent = String(state.width); depthText.textContent = String(state.depth);
    state.net = null;
  }
  datasets.forEach(function(name) {
    var btn = document.createElement('button');
    btn.className = 'expl-ds-btn';
    btn.textContent = name === 'xor' ? 'XOR' : name.charAt(0).toUpperCase() + name.slice(1);
    btn.dataset.ds = name;
    btn.addEventListener('click', function() {
      applyDatasetPreset(name);
      updateUI(); draw();
    });
    dsEl.appendChild(btn);
  });

  // Find the actual slider inputs by their labels
  var allInputs = host.querySelectorAll('.mlp-slider input');
  widthInput = allInputs[0];
  depthInput = allInputs[1];

  widthInput.addEventListener('input', function() {
    state.width = +widthInput.value; widthText.textContent = widthInput.value; state.net = null;
    if (state.view >= state.depth) state.view = -1;
    updateUI(); draw();
  });
  depthInput.addEventListener('input', function() {
    state.depth = +depthInput.value; depthText.textContent = depthInput.value; state.net = null;
    if (state.view >= state.depth) state.view = -1;
    updateUI(); draw();
  });

  function updateUI() {
    host.querySelectorAll('.expl-datasets:not(.expl-views) .expl-ds-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.ds === state.dataset);
    });
    // View buttons only make sense on the clusters tab, where a real net is trained.
    viewsEl.innerHTML = '';
    viewsEl.style.minHeight = '34px';
    viewsEl.style.visibility = state.dataset === 'clusters' ? 'visible' : 'hidden';
    if (state.dataset === 'clusters') {
      for (var v = 0; v <= state.depth; v++) {
        (function(v) {
          var isOut = v === state.depth;
          var btn = document.createElement('button');
          btn.className = 'expl-ds-btn' + ((isOut ? -1 : v) === state.view ? ' active' : '');
          btn.textContent = isOut ? 'Boundary' : 'Layer ' + (v + 1) + ' neurons';
          btn.addEventListener('click', function() { state.view = isOut ? -1 : v; state.pinned = null; updateUI(); draw(); });
          viewsEl.appendChild(btn);
        })(v);
      }
    }
    var totalUnits = state.width * state.depth;
    readout.innerHTML = state.depth + ' hidden layer' + (state.depth === 1 ? '' : 's') +
      ' &times; ' + state.width + ' neuron' + (state.width === 1 ? '' : 's') +
      ' = <strong>' + totalUnits + '</strong> hidden unit' + (totalUnits === 1 ? '' : 's') +
      ' | Accuracy: <strong>' + (state.acc * 100).toFixed(0) + '%</strong>';
    if (state.dataset === 'clusters' && state.view === 0) {
      readout.innerHTML += '<br>Layer 1: ' + state.width + ' straight lines. Fencing one cluster takes at least 3.';
    } else if (state.dataset === 'clusters' && state.view > 0) {
      readout.innerHTML += '<br>Layer ' + (state.view + 1) + ': ' + state.width + ' new piecewise-linear curves, bent only where layer ' + state.view + ' curves cross.';
    } else if (state.dataset === 'clusters') {
      readout.innerHTML += '<br>Boundary: one curve assembled from the last layer. It must enclose each cluster.';
    }
    var active = state.pinned || state.hover;
    if (state.dataset === 'clusters' && active) {
      readout.innerHTML += '<br><span style="color:' + NEURON_COLORS[active.idx % NEURON_COLORS.length] + '">Layer ' + (active.layer + 1) + ', neuron ' + (active.idx + 1) + '</span>: ' +
        (active.layer === 0 ? 'one straight line.' : 'straight pieces joined at the dashed layer ' + active.layer + ' curves, where a ReLU switches on or off.') +
        (state.pinned ? ' Click again to release.' : ' Click to pin.');
    } else if (state.dataset === 'clusters' && state.view >= 0) {
      readout.innerHTML += '<br>Hover a neuron in the diagram to highlight its line.';
    }
  }

  function fitCanvas(c) {
    var dpr = window.devicePixelRatio || 1;
    var w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return null;
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    var ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: h };
  }

  function drawModelBoundaryLines(ctx, model, ox, oy, side) {
    if (!model || !model.lines || !model.lines.length) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(ox, oy, side, side); ctx.clip();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    function strokeSegments(width, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      model.lines.forEach(function(line) {
        ctx.moveTo(ox + line.x1 * side, oy + (1 - line.y1) * side);
        ctx.lineTo(ox + line.x2 * side, oy + (1 - line.y2) * side);
      });
      ctx.stroke();
    }
    strokeSegments(6.0, 'rgba(8,12,24,0.94)');
    strokeSegments(3.2, SECONDARY);
    ctx.restore();
  }

  function draw() {
    var f = fitCanvas(canvas);
    if (!f) return;
    var ctx = f.ctx, W = f.w, H = f.h;
    ctx.clearRect(0, 0, W, H);

    if (state.dataset === 'clusters') { drawClusters(ctx, W, H); return; }
    var data = generateData(state.dataset);
    if (!state.net) {
      state.net = train(data, state.width, state.depth, state.dataset);
      state.acc = computeAccuracy(data, state.net);
      updateUI();
    }

    var pad = 18;
    var rightPanel = 140;
    var side = Math.min(W - 2 * pad - rightPanel, H - 2 * pad);
    if (side < 120) { rightPanel = 0; side = Math.min(W - 2 * pad, H - 2 * pad); }
    var ox = pad + (W - 2 * pad - rightPanel - side) / 2;
    var oy = pad + (H - 2 * pad - side) / 2;

    // Decision grid background
    var cell = side / GRID;
    for (var i = 0; i < GRID; i++) {
      for (var j = 0; j < GRID; j++) {
        var gx = (i + 0.5) / GRID, gy = (j + 0.5) / GRID;
        var p = predictOne([gx, gy], state.net);
        ctx.fillStyle = p >= 0.5 ? 'rgba(63,185,80,0.16)' : 'rgba(231,76,60,0.10)';
        ctx.fillRect(ox + i * cell, oy + (GRID - 1 - j) * cell, cell + 0.5, cell + 0.5);
      }
    }

    drawModelBoundaryLines(ctx, state.net, ox, oy, side);

    // Data scatter
    data.forEach(function(p) {
      var px = ox + p.x * side, py = oy + (1 - p.y) * side;
      ctx.beginPath(); ctx.arc(px, py, 4.2, 0, 6.2832);
      ctx.fillStyle = p.cls ? GREEN : RED; ctx.fill();
    });

    // Frame
    ctx.strokeStyle = LINEC; ctx.lineWidth = 1;
    ctx.strokeRect(ox, oy, side, side);

    drawNetwork(ctx, W, H, ox, oy, side, pad, rightPanel, -2);
  }

  // highlight: hidden layer index to fill, -1 for the output, -2 for none
  function drawNetwork(ctx, W, H, ox, oy, side, pad, rightPanel, highlight) {
    if (rightPanel > 80) {
      var nx0 = ox + side + 20, nx1 = W - pad;
      var cols = state.depth + 2;
      var clusters = state.dataset === 'clusters';
      var perLayer = clusters ? state.width : Math.min(state.width, 6);
      var top = oy + 6, bot = oy + side - 6;
      state.nodePos = [];
      var active = state.pinned || state.hover;
      function colX(i) { return nx0 + (nx1 - nx0) * i / (cols - 1); }
      function ys(n) {
        if (n === 1) return [(top + bot) / 2];
        var a = []; for (var i = 0; i < n; i++) a.push(top + (bot - top) * i / (n - 1)); return a;
      }
      var layersDiag = [{ x: colX(0), ys: ys(2), label: ['x₁', 'x₂'], color: SECONDARY }];
      for (var d = 0; d < state.depth; d++) layersDiag.push({ x: colX(d + 1), ys: ys(perLayer), color: PRIMARY, hl: highlight === d });
      layersDiag.push({ x: colX(cols - 1), ys: ys(1), label: ['ŷ'], color: SECONDARY, hl: highlight === -1 });

      ctx.strokeStyle = 'rgba(74,158,255,0.28)'; ctx.lineWidth = 1;
      for (var L = 0; L < layersDiag.length - 1; L++) {
        var A = layersDiag[L], B = layersDiag[L + 1];
        A.ys.forEach(function(ay) {
          B.ys.forEach(function(by) {
            ctx.beginPath(); ctx.moveTo(A.x + 10, ay); ctx.lineTo(B.x - 10, by); ctx.stroke();
          });
        });
      }
      layersDiag.forEach(function(Lr, li) {
        var hiddenIdx = li - 1;
        Lr.ys.forEach(function(yy, idx) {
          var isHidden = clusters && hiddenIdx >= 0 && hiddenIdx < state.depth;
          var color = isHidden ? NEURON_COLORS[idx % NEURON_COLORS.length] : Lr.color;
          var isActive = isHidden && active && active.layer === hiddenIdx && active.idx === idx;
          if (isHidden) state.nodePos.push({ x: Lr.x, y: yy, layer: hiddenIdx, idx: idx });
          if (isActive) {
            ctx.beginPath(); ctx.arc(Lr.x, yy, 15, 0, 6.2832);
            ctx.strokeStyle = TEXT; ctx.lineWidth = 2; ctx.stroke();
          }
          ctx.beginPath(); ctx.arc(Lr.x, yy, 10, 0, 6.2832);
          ctx.fillStyle = (Lr.hl || isActive) ? color : '#0d1225'; ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.fill(); ctx.stroke();
          if (Lr.label) { ctx.fillStyle = TEXT; ctx.font = '10px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(Lr.label[idx], Lr.x, yy + 3); }
        });
      });
    }
  }

  function sampleFields(net) {
    var n = GRID, pres = [], logit = [];
    for (var l = 0; l < net.layers.length; l++) {
      var per = [];
      for (var o = 0; o < net.layers[l].W.length; o++) per.push([]);
      pres.push(per);
    }
    for (var i = 0; i <= n; i++) {
      logit.push([]);
      pres.forEach(function(per) { per.forEach(function(fld) { fld.push([]); }); });
      for (var j = 0; j <= n; j++) {
        var f = CLUSTER_MLP.forward(net, i / n, j / n);
        logit[i].push(f.logit);
        pres.forEach(function(per, l) { per.forEach(function(fld, o) { fld[i].push(f.pres[l][o]); }); });
      }
    }
    return { pres: pres, logit: logit };
  }

  function strokeSegs(ctx, segs, ox, oy, side, color, width) {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
    ctx.beginPath();
    segs.forEach(function(sg) {
      ctx.moveTo(ox + sg[0][0] * side, oy + (1 - sg[0][1]) * side);
      ctx.lineTo(ox + sg[1][0] * side, oy + (1 - sg[1][1]) * side);
    });
    ctx.stroke();
  }

  // Clusters tab: a real ReLU MLP, so every neuron's zero-line can be drawn.
  function drawClusters(ctx, W, H) {
    if (!clusterData) clusterData = CLUSTER_MLP.generateData();
    var key = state.width + 'x' + state.depth;
    if (!clusterCache[key]) {
      readout.textContent = 'Training…';
      clusterCache[key] = CLUSTER_MLP.train(clusterData, state.width, state.depth, { steps: 700, seeds: 5 });
    }
    var model = clusterCache[key];
    if (!state.net) { state.net = model.net; state.acc = model.acc; updateUI(); }
    var fields = sampleFields(model.net);

    var pad = 18, rightPanel = 140;
    var side = Math.min(W - 2 * pad - rightPanel, H - 2 * pad);
    if (side < 120) { rightPanel = 0; side = Math.min(W - 2 * pad, H - 2 * pad); }
    var ox = pad + (W - 2 * pad - rightPanel - side) / 2;
    var oy = pad + (H - 2 * pad - side) / 2;

    var cell = side / GRID;
    for (var i = 0; i < GRID; i++) {
      for (var j = 0; j < GRID; j++) {
        ctx.fillStyle = fields.logit[i][j] > 0 ? 'rgba(63,185,80,0.16)' : 'rgba(231,76,60,0.10)';
        ctx.fillRect(ox + i * cell, oy + (GRID - 1 - j) * cell, cell + 0.5, cell + 0.5);
      }
    }
    ctx.save();
    ctx.beginPath(); ctx.rect(ox, oy, side, side); ctx.clip();
    if (state.view < 0) {
      var segs = CLUSTER_MLP.contour(fields.logit, GRID);
      strokeSegs(ctx, segs, ox, oy, side, 'rgba(8,12,24,0.94)', 6);
      strokeSegs(ctx, segs, ox, oy, side, SECONDARY, 3.2);
    } else {
      var active = state.pinned || state.hover;
      if (state.view > 0) {
        ctx.setLineDash([4, 4]);
        fields.pres[state.view - 1].forEach(function(fld) {
          strokeSegs(ctx, CLUSTER_MLP.contour(fld, GRID), ox, oy, side, 'rgba(232,234,240,0.35)', 1.2);
        });
        ctx.setLineDash([]);
      }
      var focus = active && active.layer === state.view ? active.idx : -1;
      fields.pres[state.view].forEach(function(fld, k) {
        if (k === focus) return;
        ctx.globalAlpha = focus >= 0 ? 0.22 : 1;
        strokeSegs(ctx, CLUSTER_MLP.contour(fld, GRID), ox, oy, side, NEURON_COLORS[k % NEURON_COLORS.length], 2.2);
        ctx.globalAlpha = 1;
      });
      if (focus >= 0) {
        var segs2 = CLUSTER_MLP.contour(fields.pres[state.view][focus], GRID);
        strokeSegs(ctx, segs2, ox, oy, side, 'rgba(8,12,24,0.9)', 7);
        strokeSegs(ctx, segs2, ox, oy, side, NEURON_COLORS[focus % NEURON_COLORS.length], 3.6);
      }
    }
    ctx.restore();

    clusterData.forEach(function(p) {
      ctx.beginPath(); ctx.arc(ox + p.x * side, oy + (1 - p.y) * side, 4.2, 0, 6.2832);
      ctx.fillStyle = p.cls ? GREEN : RED; ctx.fill();
    });
    ctx.strokeStyle = LINEC; ctx.lineWidth = 1; ctx.strokeRect(ox, oy, side, side);
    drawNetwork(ctx, W, H, ox, oy, side, pad, rightPanel, state.view);
  }

  updateUI();
  return { resize: draw, nodes: function() { return state.nodePos; } };
};

// =====================================================================
// Perceptron Line widget — INTERACTIVE_WIDGETS.perceptronLine
// Plots the line w1*x1 + w2*x2 + b = 0 in the (x1, x2) plane and shades
// the side where sigma fires. Sliders for w1, w2, b. No data, no training.
// =====================================================================
INTERACTIVE_WIDGETS.perceptronLine = function(host) {
  var TEXT = '#e8eaf0', MUTED = '#8892a4', AXIS = '#2a3450',
      SECONDARY = '#f5a623', GREEN = '#3fb950';
  var R = 3; // plot range: x1, x2 in [-R, R]
  var state = { w1: 1.0, w2: 1.0, b: 0.0 };

  host.innerHTML =
    '<div class="pline-widget">' +
      '<canvas class="perc-canvas pline-canvas"></canvas>' +
      '<div class="perc-controls">' +
        '<div class="perc-sliders"></div>' +
        '<p class="perc-readout pline-readout"></p>' +
      '</div>' +
    '</div>';
  var canvas = host.querySelector('.pline-canvas');
  var readout = host.querySelector('.pline-readout');
  var slidersEl = host.querySelector('.perc-sliders');

  ['pointerdown', 'keydown'].forEach(function(ev) {
    host.addEventListener(ev, function(e) { e.stopPropagation(); });
  });

  [['w1', 'w₁'], ['w2', 'w₂'], ['b', 'b']].forEach(function(spec) {
    var key = spec[0];
    var row = document.createElement('div');
    row.className = 'perc-slider';
    var lab = document.createElement('label');
    lab.textContent = spec[1];
    var inp = document.createElement('input');
    inp.type = 'range'; inp.min = -3; inp.max = 3; inp.step = 0.1;
    inp.value = state[key].toFixed(1);
    var val = document.createElement('p');
    val.className = 'perc-val';
    val.textContent = state[key].toFixed(1);
    inp.addEventListener('input', function() {
      state[key] = parseFloat(inp.value);
      val.textContent = state[key].toFixed(1);
      draw();
    });
    row.appendChild(lab); row.appendChild(inp); row.appendChild(val);
    slidersEl.appendChild(row);
  });

  function signed(v) {
    return (v < 0 ? ' − ' : ' + ') + Math.abs(v).toFixed(1);
  }

  function draw() {
    var dpr = window.devicePixelRatio || 1;
    var W = canvas.clientWidth, H = canvas.clientHeight;
    if (!W || !H) return;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var pad = 10;
    var side = Math.min(W, H) - 2 * pad;
    var ox = (W - side) / 2, oy = (H - side) / 2;
    function px(x) { return ox + (x + R) / (2 * R) * side; }
    function py(y) { return oy + (R - y) / (2 * R) * side; }

    var a = state.w1, b = state.w2, c = state.b;

    // Shade: red everywhere, then green on the half-plane w·x + b >= 0.
    ctx.fillStyle = 'rgba(231,76,60,0.10)';
    ctx.fillRect(ox, oy, side, side);
    var n = Math.hypot(a, b);
    if (n > 1e-9) {
      var fx = -c * a / (n * n), fy = -c * b / (n * n); // closest point on line to origin
      ctx.save();
      ctx.beginPath(); ctx.rect(ox, oy, side, side); ctx.clip();
      ctx.translate(px(fx), py(fy));
      ctx.rotate(Math.atan2(-b, a)); // canvas y is flipped
      ctx.fillStyle = 'rgba(63,185,80,0.16)';
      ctx.fillRect(0, -4 * side, 4 * side, 8 * side);
      ctx.restore();
    } else if (c >= 0) {
      ctx.fillStyle = 'rgba(63,185,80,0.16)';
      ctx.fillRect(ox, oy, side, side);
    }

    // Axes
    ctx.strokeStyle = AXIS; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px(-R), py(0)); ctx.lineTo(px(R), py(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px(0), py(-R)); ctx.lineTo(px(0), py(R)); ctx.stroke();
    ctx.fillStyle = MUTED; ctx.font = '13px Inter, sans-serif';
    ctx.textAlign = 'right'; ctx.fillText('x₁', px(R) - 4, py(0) + 15);
    ctx.textAlign = 'right'; ctx.fillText('x₂', px(0) - 6, py(R) + 14); ctx.textAlign = 'left';

    // Decision line a*x + b*y + c = 0, clipped to the frame.
    var p0 = null, p1 = null;
    if (Math.abs(b) > 1e-9) {
      p0 = [px(-R), py(-(a * -R + c) / b)];
      p1 = [px(R), py(-(a * R + c) / b)];
    } else if (Math.abs(a) > 1e-9) {
      p0 = [px(-c / a), py(-R)];
      p1 = [px(-c / a), py(R)];
    }
    if (p0) {
      ctx.save();
      ctx.beginPath(); ctx.rect(ox, oy, side, side); ctx.clip();
      ctx.strokeStyle = SECONDARY; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
      // Weight vector from the line's nearest point to the origin, pointing to the firing side.
      var L = 0.9;
      var tx = fx + a / n * L, ty = fy + b / n * L;
      ctx.strokeStyle = TEXT; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px(fx), py(fy)); ctx.lineTo(px(tx), py(ty)); ctx.stroke();
      var ang = Math.atan2(py(ty) - py(fy), px(tx) - px(fx));
      ctx.fillStyle = TEXT;
      ctx.beginPath();
      ctx.moveTo(px(tx), py(ty));
      ctx.lineTo(px(tx) - 9 * Math.cos(ang - 0.4), py(ty) - 9 * Math.sin(ang - 0.4));
      ctx.lineTo(px(tx) - 9 * Math.cos(ang + 0.4), py(ty) - 9 * Math.sin(ang + 0.4));
      ctx.closePath(); ctx.fill();
      ctx.font = '13px Inter, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('w', px(tx) + 6, py(ty) + 4);
    }

    // Frame
    ctx.strokeStyle = AXIS; ctx.lineWidth = 1;
    ctx.strokeRect(ox, oy, side, side);

    readout.innerHTML =
      a.toFixed(1) + '·x₁' + signed(b) + '·x₂' + signed(c) + ' = 0' +
      ' &nbsp; <span style="color:' + GREEN + '">green</span>: w·x + b ≥ 0';
  }

  return { resize: draw };
};

// =====================================================================
// Saddle widget — INTERACTIVE_WIDGETS.saddle3d
// A loss surface with a hill in front of the bowl. Along one weight the
// ball is stuck behind the hill (a local minimum of the 1D slice). With a
// second weight the same descent walks around the hill. Drag to rotate.
// =====================================================================
INTERACTIVE_WIDGETS.saddle3d = function(host) {
  var TEXT = '#e8eaf0', MUTED = '#8892a4', PRIMARY = '#4a9eff', GREEN = '#3fb950', ORANGE = '#f5a623';
  var R = 1.9, GRID = 40;
  function loss(a, b) {
    return 0.3 * ((a - 1.4) * (a - 1.4) + b * b) + 2.4 * Math.exp(-((a - 0.1) * (a - 0.1) / 0.45 + b * b / 0.9));
  }
  function grad(a, b) {
    var h = 1e-4;
    return [(loss(a + h, b) - loss(a - h, b)) / (2 * h), (loss(a, b + h) - loss(a, b - h)) / (2 * h)];
  }
  function descend(a, b, free, steps, lr) {
    var path = [[a, b]];
    for (var i = 0; i < steps; i++) {
      var g = grad(a, b);
      a -= lr * g[0];
      if (free) b -= lr * g[1];
      path.push([a, b]);
    }
    return path;
  }
  var START = [-1.4, 0.2], STEPS = 600, LR = 0.08;
  var path1 = descend(START[0], START[1], false, STEPS, LR);
  var path2 = descend(START[0], START[1], true, STEPS, LR);
  var VIEW0 = { az: -2.4, el: -0.7 };
  var state = { az: VIEW0.az, el: VIEW0.el, t: 0, playing: false, timer: null, dragging: false, lastX: 0, lastY: 0 };

  host.innerHTML =
    '<div class="mlp-widget saddle-widget">' +
      '<div class="mlp-canvas-wrap"><canvas class="mlp-canvas"></canvas></div>' +
      '<div class="mlp-controls">' +
        '<div class="expl-datasets"><button class="expl-ds-btn saddle-play">Run descent</button><button class="expl-ds-btn saddle-reset">Reset</button><button class="expl-ds-btn saddle-view">Reset view</button></div>' +
      '</div>' +
    '</div>';
  var canvas = host.querySelector('.mlp-canvas');
  ['pointerdown', 'keydown'].forEach(function(ev) {
    host.addEventListener(ev, function(e) { e.stopPropagation(); });
  });
  canvas.addEventListener('pointerdown', function(e) {
    state.dragging = true; state.lastX = e.clientX; state.lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function(e) {
    if (!state.dragging) return;
    state.az -= (e.clientX - state.lastX) * 0.008;
    state.el = Math.max(-1.4, Math.min(1.4, state.el + (e.clientY - state.lastY) * 0.008));
    state.lastX = e.clientX; state.lastY = e.clientY;
    draw();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function(ev) {
    canvas.addEventListener(ev, function() { state.dragging = false; });
  });
  function stop() { if (state.timer) { clearInterval(state.timer); state.timer = null; } state.playing = false; }
  host.querySelector('.saddle-play').addEventListener('click', function() {
    if (state.playing) { stop(); return; }
    if (state.t >= STEPS) state.t = 0;
    state.playing = true;
    state.timer = setInterval(function() {
      if (!host.isConnected) { stop(); return; }
      state.t = Math.min(STEPS, state.t + 6);
      draw();
      if (state.t >= STEPS) stop();
    }, 40);
  });
  host.querySelector('.saddle-reset').addEventListener('click', function() { stop(); state.t = 0; draw(); });
  host.querySelector('.saddle-view').addEventListener('click', function() { state.az = VIEW0.az; state.el = VIEW0.el; draw(); });

  function fitCanvas(c) {
    var dpr = window.devicePixelRatio || 1;
    var wd = c.clientWidth, h = c.clientHeight;
    if (!wd || !h) return null;
    c.width = Math.round(wd * dpr); c.height = Math.round(h * dpr);
    var ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: wd, h: h };
  }
  var ZSCALE = 0.3;
  function project(a, b, z, Wd, H) {
    var x = a / R, y = b / R, zz = z * ZSCALE - 0.45;
    var ca = Math.cos(state.az), sa = Math.sin(state.az);
    var ce = Math.cos(state.el), se = Math.sin(state.el);
    var xr = x * ca - y * sa;
    var yr = x * sa + y * ca;
    var y2 = yr * ce - zz * se;
    var depth = yr * se + zz * ce;
    var scale = Math.min(Wd, H) * 0.36;
    return { x: Wd * 0.5 + xr * scale, y: H * 0.54 - y2 * scale, depth: depth };
  }
  function heightColor(z, zmin, zmax, alpha) {
    var t = Math.max(0, Math.min(1, (z - zmin) / (zmax - zmin || 1)));
    var bands = [[38, 92, 255], [0, 214, 255], [38, 217, 87], [248, 227, 64], [255, 159, 28], [255, 59, 48]];
    var c = bands[Math.min(bands.length - 1, Math.floor(t * bands.length))];
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + alpha + ')';
  }

  function draw() {
    var f = fitCanvas(canvas);
    if (!f) return;
    var ctx = f.ctx, Wd = f.w, H = f.h;
    ctx.clearRect(0, 0, Wd, H);

    var pts = [], zmin = Infinity, zmax = -Infinity;
    for (var i = 0; i <= GRID; i++) {
      pts[i] = [];
      for (var j = 0; j <= GRID; j++) {
        var a = -R + 2 * R * i / GRID, b = -R + 2 * R * j / GRID, z = loss(a, b);
        zmin = Math.min(zmin, z); zmax = Math.max(zmax, z);
        var q = project(a, b, z, Wd, H); q.z = z; pts[i].push(q);
      }
    }
    var tris = [];
    for (var ti = 0; ti < GRID; ti++) {
      for (var tj = 0; tj < GRID; tj++) {
        var p00 = pts[ti][tj], p10 = pts[ti + 1][tj], p01 = pts[ti][tj + 1], p11 = pts[ti + 1][tj + 1];
        tris.push({ p: [p00, p10, p01], z: (p00.z + p10.z + p01.z) / 3, d: (p00.depth + p10.depth + p01.depth) / 3 });
        tris.push({ p: [p10, p11, p01], z: (p10.z + p11.z + p01.z) / 3, d: (p10.depth + p11.depth + p01.depth) / 3 });
      }
    }
    tris.sort(function(x, y) { return x.d - y.d; });
    tris.forEach(function(t) {
      ctx.beginPath(); ctx.moveTo(t.p[0].x, t.p[0].y); ctx.lineTo(t.p[1].x, t.p[1].y); ctx.lineTo(t.p[2].x, t.p[2].y); ctx.closePath();
      ctx.fillStyle = heightColor(t.z, zmin, zmax, 0.9); ctx.fill();
      ctx.strokeStyle = 'rgba(8,12,24,0.35)'; ctx.lineWidth = 0.5; ctx.stroke();
    });

    // Axis lines along the two base edges that meet at the nearest corner,
    // with w1 / w2 labels at the midpoints of those edges
    var zb = zmin - 0.15, near = null;
    [[-R, -R], [R, -R], [R, R], [-R, R]].forEach(function(c) {
      var q = project(c[0], c[1], zb, Wd, H);
      if (!near || q.depth > near.depth) near = { a: c[0], b: c[1], depth: q.depth };
    });
    var c0 = project(near.a, near.b, zb, Wd, H);
    var ea = project(-near.a, near.b, zb, Wd, H), eb = project(near.a, -near.b, zb, Wd, H);
    ctx.strokeStyle = MUTED; ctx.lineWidth = 1.5; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(c0.x, c0.y); ctx.lineTo(ea.x, ea.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(c0.x, c0.y); ctx.lineTo(eb.x, eb.y); ctx.stroke();
    ctx.fillStyle = TEXT; ctx.font = '15px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var sb = near.b > 0 ? 1 : -1, sa = near.a > 0 ? 1 : -1;
    var lx = project(0, near.b + sb * 0.4, zb, Wd, H), ly = project(near.a + sa * 0.4, 0, zb, Wd, H);
    ctx.fillText('w₁', lx.x, lx.y); ctx.fillText('w₂', ly.x, ly.y);
    ctx.textBaseline = 'alphabetic';

    // The 1D slice (w2 = 0.15) that the one-weight descent lives on
    ctx.strokeStyle = 'rgba(245,166,35,0.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    ctx.beginPath();
    for (var k = 0; k <= 60; k++) {
      var sa = -R + 2 * R * k / 60, sq = project(sa, START[1], loss(sa, START[1]) + 0.02, Wd, H);
      if (k === 0) ctx.moveTo(sq.x, sq.y); else ctx.lineTo(sq.x, sq.y);
    }
    ctx.stroke(); ctx.setLineDash([]);

    function drawPath(path, color, upto) {
      ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      for (var m = 0; m <= upto; m++) {
        var q = project(path[m][0], path[m][1], loss(path[m][0], path[m][1]) + 0.03, Wd, H);
        if (m === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
      }
      ctx.stroke();
      var e = path[upto], qe = project(e[0], e[1], loss(e[0], e[1]) + 0.03, Wd, H);
      ctx.beginPath(); ctx.arc(qe.x, qe.y, 7, 0, 6.2832);
      ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = TEXT; ctx.lineWidth = 1.5; ctx.stroke();
    }
    drawPath(path1, ORANGE, state.t);
    drawPath(path2, GREEN, state.t);

    ctx.fillStyle = TEXT; ctx.font = '13px Inter, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('step ' + state.t + ' of ' + STEPS, 12, 20);
    ctx.fillStyle = ORANGE; ctx.fillText('one weight: L = ' + loss(path1[state.t][0], path1[state.t][1]).toFixed(2), 12, 40);
    ctx.fillStyle = GREEN; ctx.fillText('two weights: L = ' + loss(path2[state.t][0], path2[state.t][1]).toFixed(2), 12, 58);
  }
  return { resize: draw, setView: function(az, el) { state.az = az; state.el = el; draw(); }, setT: function(t) { state.t = t; draw(); } };
};

// =====================================================================
// Single Perceptron widget — INTERACTIVE_WIDGETS.singlePerceptron
// Adjustable line on data, no training.
// =====================================================================
INTERACTIVE_WIDGETS.singlePerceptron = function(host) {
  var GREEN = '#3fb950', RED = '#e74c3c', MUTED = '#8892a4',
      LINEC = '#2a3450', TEXT = '#e8eaf0', PRIMARY = '#4a9eff', SECONDARY = '#f5a623';
  var state = { dataset: 'linear', w1: 0.5, w2: 0.5, b: -0.5 };

  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // 2D datasets under the unit square.
  function generateData(name) {
    var rnd = mulberry32(7);
    var pts = [];
    if (name === 'linear') {
      for (var i = 0; i < 40; i++) {
        var x = rnd() * 2 - 1, y = rnd() * 2 - 1;
        pts.push({ x: x + 1.5, y: y + 1.5, cls: 1 });
        pts.push({ x: x - 1.5, y: y - 1.5, cls: 0 });
      }
    } else if (name === 'xor') {
      var clusters = [[1.5, 1.5, 1], [1.5, -1.5, 0], [-1.5, 1.5, 0], [-1.5, -1.5, 1]];
      clusters.forEach(function(c) {
        for (var i = 0; i < 14; i++) {
          pts.push({ x: c[0] + (rnd() - 0.5) * 0.6, y: c[1] + (rnd() - 0.5) * 0.6, cls: c[2] });
        }
      });
    }
    // Normalize to [0.04, 0.96]
    var xs = pts.map(function(p) { return p.x; });
    var ys = pts.map(function(p) { return p.y; });
    var xmn = Math.min.apply(null, xs), xmx = Math.max.apply(null, xs);
    var ymn = Math.min.apply(null, ys), ymx = Math.max.apply(null, ys);
    var xr = xmx - xmn || 1, yr = ymx - ymn || 1;
    pts.forEach(function(p) {
      p.x = 0.04 + 0.92 * (p.x - xmn) / xr;
      p.y = 0.04 + 0.92 * (p.y - ymn) / yr;
    });
    return pts;
  }

  host.innerHTML =
    '<div class="perc-widget">' +
      '<div class="perc-canvas-wrap"><canvas class="perc-canvas"></canvas></div>' +
      '<div class="perc-controls">' +
        '<div class="perc-datasets"></div>' +
        '<div class="perc-sliders"></div>' +
        '<p class="perc-readout"></p>' +
      '</div>' +
    '</div>';
  var canvas = host.querySelector('.perc-canvas');
  var readout = host.querySelector('.perc-readout');
  var dsEl = host.querySelector('.perc-datasets');
  var slidersEl = host.querySelector('.perc-sliders');

  ['pointerdown', 'keydown'].forEach(function(ev) {
    host.addEventListener(ev, function(e) { e.stopPropagation(); });
  });

  var datasets = ['linear', 'xor'];
  datasets.forEach(function(name) {
    var btn = document.createElement('button');
    btn.className = 'perc-ds-btn';
    btn.textContent = name === 'xor' ? 'XOR' : name.charAt(0).toUpperCase() + name.slice(1);
    btn.dataset.ds = name;
    btn.addEventListener('click', function() {
      state.dataset = name;
      updateUI(); draw();
    });
    dsEl.appendChild(btn);
  });

  function buildSliders() {
    slidersEl.innerHTML = '';
    [['w1', 'w₁', -3, 3, 0.1], ['w2', 'w₂', -3, 3, 0.1], ['b', 'b', -3, 3, 0.1]].forEach(function(spec) {
      var key = spec[0], label = spec[1], mn = spec[2], mx = spec[3], st = spec[4];
      var row = document.createElement('div');
      row.className = 'perc-slider';
      var lab = document.createElement('label');
      lab.textContent = label;
      var inp = document.createElement('input');
      inp.type = 'range'; inp.min = mn; inp.max = mx; inp.step = st;
      inp.value = state[key].toFixed(1);
      var val = document.createElement('p');
      val.className = 'perc-val';
      val.textContent = state[key].toFixed(1);
      inp.addEventListener('input', function() {
        state[key] = parseFloat(inp.value);
        val.textContent = state[key].toFixed(1);
        draw();
      });
      row.appendChild(lab); row.appendChild(inp); row.appendChild(val);
      slidersEl.appendChild(row);
    });
  }

  function updateUI() {
    host.querySelectorAll('.perc-ds-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.ds === state.dataset);
    });
  }

  function fitCanvas(c) {
    var dpr = window.devicePixelRatio || 1;
    var w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return null;
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    var ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: h };
  }

  function predict(x, y) {
    return probability(x, y) >= 0.5 ? 1 : 0;
  }

  function score(x, y) {
    return state.w1 * x + state.w2 * y + state.b;
  }

  function probability(x, y) {
    return 1 / (1 + Math.exp(-score(x, y)));
  }

  function signed(v) {
    return (v < 0 ? ' - ' : ' + ') + Math.abs(v).toFixed(1);
  }

  function drawNetwork(ctx, x0, y0, w, h) {
    function node(x, y, label, color) {
      ctx.beginPath();
      ctx.arc(x, y, 16, 0, 6.2832);
      ctx.fillStyle = '#0d1225';
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = TEXT;
      ctx.font = '14px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, y + 5);
    }
    function edge(x1, y1, x2, y2, label) {
      ctx.strokeStyle = 'rgba(74,158,255,0.55)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      ctx.fillStyle = '#0d1225';
      ctx.fillRect(mx - 25, my - 9, 50, 16);
      ctx.fillStyle = PRIMARY;
      ctx.font = '12px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, mx, my + 4);
    }
    var xi = x0 + 34, xo = x0 + w - 42;
    var y1 = y0 + h * 0.32, y2 = y0 + h * 0.68, yo = y0 + h * 0.50;
    edge(xi + 16, y1, xo - 16, yo, 'w₁=' + state.w1.toFixed(1));
    edge(xi + 16, y2, xo - 16, yo, 'w₂=' + state.w2.toFixed(1));
    node(xi, y1, 'x₁', SECONDARY);
    node(xi, y2, 'x₂', SECONDARY);
    node(xo, yo, 'ŷ', PRIMARY);
    ctx.fillStyle = MUTED;
    ctx.font = '13px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('h = w·x + b', xo, yo + 38);
    ctx.fillText('y = sigmoid(h)', xo, yo + 56);
  }

  function draw() {
    var f = fitCanvas(canvas);
    if (!f) return;
    var ctx = f.ctx, W = f.w, H = f.h;
    ctx.clearRect(0, 0, W, H);

    var pad = 18;
    var rightPanel = 320;
    var side = Math.min(W - 2 * pad - rightPanel, H - 2 * pad);
    if (side < 120) { rightPanel = 0; side = Math.min(W - 2 * pad, H - 2 * pad); }
    var ox = pad + (W - 2 * pad - rightPanel - side) / 2;
    var oy = pad + (H - 2 * pad - side) / 2;

    // Background shading: which side of the line each point falls on
    var GRID = 36;
    for (var i = 0; i < GRID; i++) {
      for (var j = 0; j < GRID; j++) {
        var gx = i / (GRID - 1), gy = j / (GRID - 1);
        var pred = predict(gx, gy);
        ctx.fillStyle = pred ? 'rgba(63,185,80,0.14)' : 'rgba(231,76,60,0.08)';
        ctx.fillRect(ox + gx * side, oy + (1 - gy) * side, side / GRID + 1, side / GRID + 1);
      }
    }

    // Decision line w1*x + w2*y + b = 0, clipped to frame
    var a = state.w1, b = state.w2, c = state.b;
    var xr = [0, 1], yr = [0, 1];
    var p0, p1;
    if (Math.abs(b) > 1e-9) {
      p0 = [ox + xr[0] * side, oy + (1 - (-(a * xr[0] + c) / b)) * side];
      p1 = [ox + xr[1] * side, oy + (1 - (-(a * xr[1] + c) / b)) * side];
    } else if (Math.abs(a) > 1e-9) {
      var xv = -c / a;
      p0 = [ox + xv * side, oy + yr[0] * side];
      p1 = [ox + xv * side, oy + yr[1] * side];
    } else {
      p0 = null; p1 = null;
    }

    if (p0 && p1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(ox, oy, side, side);
      ctx.clip();
      ctx.strokeStyle = SECONDARY; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
      ctx.restore();
    }

    // Data points
    var data = generateData(state.dataset);
    data.forEach(function(p) {
      var px = ox + p.x * side, py = oy + (1 - p.y) * side;
      ctx.beginPath(); ctx.arc(px, py, 4.5, 0, 6.2832);
      ctx.fillStyle = p.cls ? GREEN : RED; ctx.fill();
      // Misclassification ring
      if (predict(p.x, p.y) !== p.cls) {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(px, py, 6.6, 0, 6.2832); ctx.stroke();
      }
    });

    // Frame
    ctx.strokeStyle = LINEC; ctx.lineWidth = 1;
    ctx.strokeRect(ox, oy, side, side);

    if (rightPanel > 80) {
      drawNetwork(ctx, ox + side + 24, oy + 8, rightPanel - 38, side - 16);
    }

    var correct = 0;
    data.forEach(function(p) { if (predict(p.x, p.y) === p.cls) correct++; });
    var acc = data.length ? correct / data.length : 0;
    readout.innerHTML =
      'h = ' + state.w1.toFixed(1) + '·x₁' + signed(state.w2) + '·x₂' + signed(state.b) +
      ' &nbsp; <span style="color:' + GREEN + '">green</span>: sigmoid(h) ≥ 0.5' +
      ' | Accuracy: <strong>' + (acc * 100).toFixed(0) + '%</strong>';
  }

  buildSliders();
  updateUI();
  return { resize: draw };
};

  </script>
</body>
</html>
