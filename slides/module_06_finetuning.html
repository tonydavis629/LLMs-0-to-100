<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMs 0 to 100</title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <!-- KaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>

  <!-- Module-specific <head> includes (e.g. Chart.js); empty for most modules -->
  

  <!-- Shared styles + per-module overrides, inlined by the build -->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

/* ===========================================
   CSS VARIABLES
   =========================================== */
:root {
  --background-color: #0a0e1a;
  --section-divider-bg: #0d1225;

  --heading-font: "Space Grotesk", Helvetica, sans-serif;
  --body-font: "Inter", Helvetica, sans-serif;
  --base-font-size: 32px;
  --text-size: 16pt;
  --h1-size: 48pt;
  --h2-size: 36pt;
  --h3-size: 24pt;
  --footnote-size: 11pt;

  --primary-color: #4a9eff;
  --secondary-color: #f5a623;
  --text-color: #e8eaf0;
  --muted-color: #8892a4;
  --line-color: #2a3450;

  --slide-padding: 60px;
  --slide-padding-top: 24px;
  --content-gap: 18px;

  --box-radius: 8px;
}

/* ===========================================
   BASE STYLES
   =========================================== */

.reveal {
  font-family: var(--body-font);
  font-size: var(--base-font-size);
}

.reveal strong,
.reveal b {
  font-weight: bold;
}

.reveal a {
  color: var(--primary-color);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.reveal a:hover {
  color: var(--text-color);
}

.reveal-viewport {
  background-color: var(--background-color);
}

.reveal-viewport.is-section-divider .slide-background.present {
  background-color: var(--section-divider-bg) !important;
}

.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4,
.reveal h5,
.reveal h6 {
  font-family: var(--heading-font);
  text-transform: none;
  color: var(--text-color);
  font-weight: 600;
  line-height: 1.2;
}

.reveal h1 { font-size: var(--h1-size); }
.reveal h2 { font-size: var(--h2-size); margin-bottom: 0; }
.reveal h3 { font-size: var(--h3-size); }

.reveal p,
.reveal li,
.reveal td,
.reveal th,
.reveal blockquote {
  font-size: var(--text-size);
  color: var(--text-color);
  line-height: 1.5;
}

/* Vertical separation between newline-separated sentences on text slides.
   Scoped to a slide's top-level paragraphs (the prose flow); paragraphs
   nested inside components (terminal captions, figure cards, grid columns)
   keep their own tighter spacing so dense component slides do not overflow.
   Adjacent margins collapse, so the gap between two paragraphs is 0.9em. */
.reveal .slides section > p {
  margin: 0.4em 0 0.9em 0;
}

/* ===========================================
   LISTS
   =========================================== */

.reveal ul {
  list-style: none;
  padding-left: 0;
  margin: 15px 0;
}

.reveal ul li {
  position: relative;
  padding-left: 25px;
  margin-bottom: 10px;
}

.reveal ul li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.6em;
  width: 8px;
  height: 8px;
  background: var(--primary-color);
  border-radius: 50%;
}

.reveal ul ul li::before {
  background: var(--muted-color);
  width: 6px;
  height: 6px;
}

.reveal blockquote p {
  font-size: inherit;
}

/* ===========================================
   SLIDE LAYOUT
   =========================================== */

.reveal .slides section {
  height: 100%;
  display: flex !important;
  flex-direction: column !important;
  padding: var(--slide-padding-top) var(--slide-padding) var(--slide-padding) var(--slide-padding) !important;
  box-sizing: border-box;
  text-align: left;
  /* Any slide whose content runs past the bottom scrolls instead of clipping.
     The scrollbar only appears when needed. */
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: #30363d transparent;
}

.reveal .slides section::-webkit-scrollbar {
  width: 8px;
}

.reveal .slides section::-webkit-scrollbar-thumb {
  background: #30363d;
  border-radius: 4px;
}

.reveal .slides section.stack {
  padding: 0 !important;
}

.reveal .slides section > .content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: var(--content-gap);
  text-align: left;
}

.reveal .slides section > .footnote {
  position: absolute;
  bottom: 15px;
  left: var(--slide-padding);
  right: var(--slide-padding);
  font-size: var(--footnote-size);
  color: var(--muted-color);
}

/* ===========================================
   SECTION DIVIDERS
   =========================================== */

.reveal .slides section.section-divider {
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}

.reveal .slides section.section-divider h1 {
  font-size: 56pt;
  text-align: center;
  color: var(--primary-color);
}

.reveal .slides section.section-divider p {
  font-size: 20pt;
  color: var(--muted-color);
}

/* ===========================================
   TEXT SIZE UTILITIES
   =========================================== */

.text-lg { font-size: 18pt !important; }
.text-xl { font-size: 20pt !important; }
.text-2xl { font-size: 24pt !important; }
.text-3xl { font-size: 28pt !important; }
.text-4xl { font-size: 32pt !important; }

.text-muted { color: var(--muted-color) !important; }
.text-center { text-align: center !important; }
.text-uppercase { text-transform: uppercase; letter-spacing: 0.1em; }
.font-light { font-weight: 300; }
.font-bold { font-weight: 600; }

/* ===========================================
   BLOCKQUOTES
   =========================================== */

.reveal blockquote {
  border-left: 4px solid var(--primary-color);
  padding-left: 20px;
  margin: 20px 0;
  font-style: italic;
  background: none;
  box-shadow: none;
  width: 100%;
  max-width: none;
}

.reveal blockquote cite {
  display: block;
  margin-top: 10px;
  font-style: normal;
  color: var(--muted-color);
}

/* ===========================================
   ACCENT UNDERLINE ON TITLES
   =========================================== */

.reveal .slides section > h2 {
  flex-shrink: 0;
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line-color);
}

/* ===========================================
   FIGURE CARD - for notable figures slides
   =========================================== */

.figure-card {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  align-items: start;
}

.figure-card img {
  border-radius: var(--box-radius);
  width: 100%;
  box-shadow: 0 4px 20px rgba(74, 158, 255, 0.15);
}

.figure-card .figure-info h3 {
  margin: 0 0 5px 0;
  color: var(--secondary-color);
  font-size: 14pt;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ===========================================
   ERA BADGE - for timeline labels
   =========================================== */

.era-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12pt;
  font-weight: 500;
}

.era-badge.summer {
  background: rgba(245, 166, 35, 0.2);
  color: var(--secondary-color);
}

.era-badge.winter {
  background: rgba(74, 158, 255, 0.15);
  color: #6cb4ff;
}

.era-badge.spring {
  background: rgba(80, 200, 120, 0.2);
  color: #50c878;
}

/* ===========================================
   HIGHLIGHT BOX
   =========================================== */

.highlight-box {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
}

/* Exercise hint: a single fragment that reveals the whole hint at once.
   The wrapping .fragment div is what animates; this just sizes the text
   (matching the old text-lg intent) and removes the global paragraph
   margin so the one-line hint is not double-spaced. */
.reveal .hint-box p {
  font-size: 18pt;
  margin: 0;
}

/* ===========================================
   COURSE STRUCTURE
   =========================================== */

.course-summary {
  max-width: 1120px;
  margin: 0 0 16px 0;
  color: #f0f4fb;
  font-size: 18pt !important;
  line-height: 1.4 !important;
}

.course-track-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

.module-track-card {
  background: rgba(74, 158, 255, 0.07);
  border: 1px solid rgba(74, 158, 255, 0.22);
  border-radius: var(--box-radius);
  padding: 20px 22px;
}

.module-track-kicker {
  font-size: 12pt;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--secondary-color);
  margin-bottom: 8px;
}

.module-track-card h3 {
  margin: 0 0 8px 0;
}

.module-track-intro {
  font-size: 14pt !important;
  color: #d7ddea !important;
  margin: 0 0 10px 0;
  line-height: 1.4 !important;
}

.compact-list {
  margin: 0;
}

.reveal ul.compact-list li {
  font-size: 16pt;
  line-height: 1.35;
  margin-bottom: 7px;
  padding-left: 20px;
}

.course-note {
  margin-top: 14px;
  color: #d7ddea;
  font-size: 15pt !important;
  line-height: 1.35 !important;
}

.course-glossary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  margin-top: 14px;
}

.glossary-item {
  background: rgba(245, 166, 35, 0.08);
  border: 1px solid rgba(245, 166, 35, 0.18);
  border-radius: var(--box-radius);
  padding: 12px 14px;
}

.glossary-item strong {
  color: var(--secondary-color);
}

.glossary-item p {
  font-size: 13pt !important;
  color: #d7ddea !important;
  margin: 6px 0 0 0;
  line-height: 1.4;
}

/* ===========================================
   TERMINAL OUTPUT
   =========================================== */

.terminal-output {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 0;
  max-width: 800px;
  margin: 0 auto;
  text-align: left;
}

.terminal-output .terminal-bar {
  background: #161b22;
  border-radius: 8px 8px 0 0;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.terminal-output .terminal-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.terminal-output .terminal-dot.red { background: #ff5f57; }
.terminal-output .terminal-dot.yellow { background: #febc2e; }
.terminal-output .terminal-dot.green { background: #28c840; }

.terminal-output .terminal-title {
  color: #8b949e;
  font-family: monospace;
  font-size: 10pt;
  margin-left: 8px;
}

.terminal-output .terminal-body {
  padding: 15px 20px;
}

.terminal-output .terminal-body pre {
  margin: 0;
  background: none !important;
  box-shadow: none !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output.dense .terminal-body {
  padding: 10px 20px;
}

.reveal .terminal-output.dense .terminal-body pre.terminal-pre {
  font-size: 9pt;
  line-height: 1.28;
}

.reveal .terminal-output .terminal-body pre.terminal-pre span {
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre p {
  display: inline;
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
  margin: 0 !important;
  color: inherit;
}

.reveal .terminal-output .terminal-body pre code {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output .terminal-body .prompt {
  color: #8b949e;
}

.terminal-output .terminal-body .success {
  color: #3fb950;
}

.terminal-output .terminal-body .header {
  font-weight: bold;
}

.terminal-output .terminal-body .skipped {
  color: #8b949e;
  font-style: italic;
}

/* ===========================================
   TURNING POINT SLIDE
   =========================================== */

.turning-point h2 {
  border-bottom-color: var(--secondary-color) !important;
}

/* ===========================================
   CODE BLOCKS
   =========================================== */

.reveal pre {
  margin-bottom: 0;
  width: 100%;
  box-sizing: border-box;
  box-shadow: none !important;
  background: none !important;
}

.reveal pre code {
  font-size: 14pt;
  line-height: 1.4;
  padding: 10px 20px;
  border-radius: var(--box-radius);
  background: rgba(20, 25, 45, 0.8);
  color: var(--text-color);
  max-height: 400px;
}

.reveal pre code .hljs-keyword,
.reveal pre code .hljs-built_in {
  color: #c792ea;
}

.reveal pre code .hljs-string {
  color: #c3e88d;
}

.reveal pre code .hljs-comment {
  color: #546e7a;
}

.reveal pre code .hljs-number {
  color: #f78c6c;
}

.reveal code {
  color: var(--text-color);
}

/* ===========================================
   MATH (KaTeX)
   =========================================== */

.katex {
  color: var(--text-color);
  font-size: 1.1em;
}

.katex-display {
  margin: 15px 0;
}

.katex-display > .katex {
  font-size: 1.3em;
}

/* ===========================================
   VIDEO CONTAINERS
   =========================================== */

.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-container video,
.video-container img {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--box-radius);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
}

/* ===========================================
   SIDE QUEST BADGE
   =========================================== */

.side-quest-badge {
  display: inline-block;
  background: rgba(245, 166, 35, 0.15);
  color: var(--secondary-color);
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12pt;
  font-weight: 500;
  margin-bottom: 10px;
}

/* ===========================================
   TERMINAL OUTPUT - ANSI COLOR PALETTE
   Replaces inline `style="color:#..."` on spans
   inside .terminal-pre. A rule on the span itself
   overrides the color inherited from .terminal-pre.
   =========================================== */

.terminal-output .terminal-body .t-red    { color: #e06c75; }
.terminal-output .terminal-body .t-orange { color: #d19a66; }
.terminal-output .terminal-body .t-yellow { color: #e5c07b; }
.terminal-output .terminal-body .t-green  { color: #98c379; }
.terminal-output .terminal-body .t-cyan   { color: #56b6c2; }
.terminal-output .terminal-body .t-blue   { color: #61afef; }
.terminal-output .terminal-body .t-gray   { color: #8b949e; }
.terminal-output .terminal-body .t-fg     { color: #e8eaf0; }
.terminal-output .terminal-body .t-fail   { color: #e74c3c; }

.terminal-caption {
  margin-top: 15px;
  text-align: center;
}

/* ===========================================
   TIMELINE (module 1) - per-node structure
   Positional left/width and per-era colors stay
   inline; this captures the repeated boilerplate.
   =========================================== */

.tl-node  { position: absolute; transform: translateX(-50%); text-align: center; }
/* .reveal prefix needed: `.reveal p` (0,1,1) sets color/font-size and would
   otherwise beat a bare .tl-* class. The original used inline styles. */
.reveal .tl-label { font-size: 10pt; color: var(--muted-color); white-space: nowrap; margin: 0; }
.reveal .tl-year  { font-size: 11pt; font-weight: 600; margin: 2px 0 0 0; }
.tl-stem  { width: 1px; opacity: 0.5; margin: 2px auto 0; }
.tl-dot   { width: 10px; height: 10px; border-radius: 50%; margin: 0 auto; }

.tl-node.below .tl-stem  { margin: 0 auto; }
.tl-node.below .tl-year  { margin: 0; }
.tl-node.below .tl-label { margin: 2px 0 0 0; }

/* ===========================================
   CANONICAL SLIDE TYPES
   Backs the :::divider / :::columns / :::note /
   :::quiz / :::step / :::interactive fences so
   slides.md carries no inline layout styles.
   (.section-divider, .figure-card, .terminal-output,
    .hint-box are defined above and reused.)
   =========================================== */

/* :::columns - grid; template/gap/valign supplied by the build */
.reveal .slide-columns {
  display: grid;
  align-items: start;
  margin: 10px 0;
}

/* :::note - callout box (canonical replacement for .highlight-box) */
.reveal .note {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
  margin: 20px 0;
}

.reveal .note p {
  font-size: 18pt;
  margin: 0;
}

.reveal .note p + p {
  margin-top: 0.6em;
}

/* :::note variant="hint" - lighter, boxless (also used inside :::step) */
.reveal .note.hint-box {
  background: none;
  border: none;
  padding: 0;
}

/* :::quiz - prompt scales up; its last line is the question */
.reveal .quiz-prompt p {
  font-size: 18pt;
  margin: 0 0 0.6em 0;
}

.reveal .quiz-prompt p:last-child {
  font-size: 24pt;
  color: var(--text-color);
  margin: 0.5em 0 0 0;
}

.reveal .quiz-answer {
  margin-top: 30px;
}

/* :::step - spacing between code, hint, and answer */
.reveal .hint-box {
  margin-top: 22px;
}

.reveal .hint-box + .note {
  margin-top: 8px;
  padding: 12px 18px;
}

/* :::interactive - widget fills the slide body like a video */
.reveal .interactive-host {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

/* ===========================================
   SHARED INTERACTIVE WIDGET CHROME (.iw-*)
   Used by the :::interactive widgets defined in each module's config.js.
   Module 3 predates this and keeps its own .m3-* chrome.
   =========================================== */

.iw {
  display: flex;
  flex-direction: column;
  justify-content: center;   /* only bites when the content does not fill the slide */
  gap: 12px;
  width: 100%;
  height: 100%;
}

.iw-canvas-wrap {
  flex: 1;
  min-height: 0;
  width: 100%;
}

.iw-canvas {
  width: 100%;
  height: 100%;
  min-height: 0;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.iw-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.iw-btn {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: rgba(74, 158, 255, 0.10);
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 6px;
  padding: 7px 16px;
  cursor: pointer;
}

.iw-btn:hover {
  background: rgba(74, 158, 255, 0.22);
}

.iw-btn.iw-primary,
.iw-btn.active {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: #0a0e1a;
  font-weight: 600;
}

.iw-btn.iw-reset {
  background: rgba(245, 166, 35, 0.12);
  border-color: rgba(245, 166, 35, 0.40);
  color: var(--secondary-color);
}

.iw-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.iw-label {
  font-size: 12pt;
  color: var(--muted-color);
  margin: 0 2px 0 10px;
}

.reveal .iw-readout {
  font-size: 13pt;
  color: var(--muted-color);
  text-align: center;
  margin: 0;
  min-height: 1.4em;
}

.reveal .iw-readout strong {
  color: var(--secondary-color);
}

.iw-sliders {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 4px 18px;
  width: 100%;
  max-width: 100%;
  margin: 0 auto;
}

.iw-slider {
  display: grid;
  grid-template-columns: minmax(72px, auto) 1fr 58px;
  align-items: center;
  gap: 9px;
}

.reveal .iw-slider label {
  font-size: 11.5pt;
  color: var(--primary-color);
  font-weight: 600;
  margin: 0;
}

.iw-slider input[type="range"] {
  width: 100%;
  accent-color: var(--primary-color);
}

.reveal .iw-slider .iw-val {
  font-size: 11.5pt;
  color: var(--text-color);
  font-family: monospace;
  text-align: right;
  margin: 0;
}

.iw-text-input {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: 6px;
  padding: 7px 12px;
  width: 100%;
  max-width: 620px;
}

/* DOM-based widget pieces: token chips, panels, and two-column bodies. */

.iw-body {
  flex: 1;

<!-- .slide: id="title" class="section-divider" data-state="is-section-divider" -->

# LLMs 0 to 100

Module 6: Finetuning

From base model to assistant

---

<!-- .slide: id="review-base-model" -->

## Review: Where Module 5 Left Us

Pretraining ran next-token prediction over billions of tokens and produced a **base model**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Can**

- Continue text fluently
- Sample plausible continuations of any prefix

</div>

<div>

**Cannot**

- Follow intent
- Asked to "list three colors," it may continue with more questions
- It was never trained to treat a prompt as a request

</div>

</div>

The base model has the **knowledge**. It lacks the **behavior** of an assistant. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<!-- .slide: id="review-same-machinery" -->

## Review: The Machinery Does Not Change

Finetuning reuses the machinery from Modules 2 and 5.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Same as pretraining**

- The forward pass through the transformer (Module 4)
- The **cross-entropy** loss (Module 5)
- **Backpropagation** and **AdamW** (Module 2)
- Batching, gradient clipping, learning-rate control

</div>

<div>

**What is new**

- The **data**: prompt&ndash;response pairs, not raw text
- The **behavioral target**: follow intent, not just continue
- A **loss mask**: train on the response, not the prompt
- A much **smaller** learning rate and **far fewer** steps

</div>

</div>

---

<!-- .slide: id="divider-what" class="section-divider" data-state="is-section-divider" -->

# What Finetuning Is

Specializing a pretrained model


---

<!-- .slide: id="finetuning-definition" -->

## Finetuning, Defined

**Finetuning**: continue training a pretrained model on narrower data to specialize its behavior or knowledge.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Pretraining**

- Learns language from **billions** of tokens
- Weeks on thousands of GPUs

</div>

<div>

**Finetuning**

- Nudges a capable model with **thousands to millions** of examples
- Hours on modest hardware

</div>

</div>

This is **transfer learning**: pretraining supplies the capability, finetuning teaches only format and behavior. That is why it is cheap. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="same-algorithm" -->

## The Same Algorithm, Almost

Identical optimization to pretraining. Three dials move:

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 22px;">

<div>

**Learning rate**

- Much **smaller**
- Large steps would destroy what the model learned

</div>

<div>

**Steps and data**

- **Far fewer** steps, **far less** data
- Often 1&ndash;3 passes over the set

</div>

<div>

**The objective**

- Still **cross-entropy** on next tokens
- Now masked to the response

</div>

</div>

Same forward pass, same loss, same backprop &mdash; the **same algorithm pointed at a new distribution**. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="finetuning-taxonomy" -->

## A Short Taxonomy

"Finetuning" covers several distinct things:

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 22px;">

<div>

**Continued pretraining**

- Next-token prediction on **domain text** (medicine, code)
- Shifts knowledge

</div>

<div>

**Supervised finetuning (SFT)**

- Learn to **follow instructions** from prompt&ndash;response pairs
- **This module**

</div>

<div>

**Preference optimization**

- Learn from **comparisons** of better vs worse responses
- RLHF, DPO &mdash; **Module 7**

</div>

</div>

---

<!-- .slide: id="catastrophic-forgetting" -->

## Catastrophic Forgetting

Push the weights too hard on narrow data and the model **loses general capability**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The failure**

- The finetuning set is tiny and skewed vs the pretraining corpus
- Aggressive updates overwrite broad features with narrow ones
- Better at your 1,000 examples, worse at everything else

</div>

<div>

**This one failure mode motivates:**

- the **small** learning rate
- the **few** epochs
- **parameter-efficient** methods, which freeze the base entirely

</div>

</div>

---

<!-- .slide: id="divider-sft" class="section-divider" data-state="is-section-divider" -->

# Supervised Finetuning

Teaching the model to follow instructions


---

<!-- .slide: id="prompt-response-pairs" -->

## The Data Unit Changes

Pretraining trained on raw text. SFT trains on **prompt&ndash;response pairs**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Pretraining example**

```text
...to be, or not to be, that is
the question: whether 'tis nobler...
```
A continuous stream. The target: the next character.

</div>

<div>

**SFT example**

```text
prompt:   uppercase: hello
response: HELLO
```
A demonstration of the behavior we want.

</div>

</div>

Collect many demonstrations. Train the model to **produce the response given the prompt**. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="instruction-tuning-generalizes" -->

## Instruction Tuning Generalizes

Train on **many tasks phrased as instructions** and the model learns **instruction-following itself**. It transfers to instructions it never saw.

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 22px;">

<div>

**FLAN**

- Wei et al., 2021
- 60+ tasks
- Strong **zero-shot** generalization to held-out tasks

</div>

<div>

**T0**

- Sanh et al., 2021
- Multitask prompted training
- Zero-shot task generalization

</div>

<div>

**Super-NaturalInstructions**

- 1,600+ tasks
- Task diversity drives generalization

</div>

</div>

You are not teaching every task. You are teaching **what it means to follow an instruction**. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="figure-wei" -->

<div class="figure-card">

![Jason Wei](module_06_finetuning/images/wei.jpg)

<div class="figure-info">

## Jason Wei <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Finetuned Language Models Are Zero-Shot Learners (FLAN, 2021)

- Showed that **instruction tuning** across many tasks produces **zero-shot generalization** to unseen instructions
- Reframed finetuning from "teach this task" to "teach the model to follow instructions"
- A direct ancestor of the instruction-following behavior in every modern chat assistant

</div>

</div>

</div>

---

<!-- .slide: id="chat-template-intro" -->

## Chat Templates and Special Tokens

- A conversation has **roles**: system, user, assistant
- The model sees only a **flat sequence of token ids** (Module 4)
- A **chat template** serializes roles into that stream with **special tokens**

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The markers (ChatML-style)**

- `<|user|>` starts a user turn
- `<|assistant|>` starts an assistant turn
- `<|end|>` ends a turn

</div>

<div>

**Atomic, not spelled out**

- Each marker is **one token id**, not seven characters
- One embedding per marker, as in real templates

</div>

</div>

Added to the Module 5 vocabulary: 65 characters become 69 tokens. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

  <div class="video-container">
    <video class="manim-stepper" data-manim-scene="chat-template" preload="auto"></video>
  </div>
</section>

---

<!-- .slide: id="generation-prompt" -->

## Prompting at Generation Time

To **ask** the model something: build the same template, stop right after the assistant marker.

```text
<|user|> uppercase: hello <|end|> <|assistant|>
```

- The model continues from there
- If it learned the format, it produces the **response**, then `<|end|>`
- The assistant marker now means **"your turn to answer"** &mdash; that is the whole difference between base model and assistant

---

<!-- .slide: id="loss-masking-intro" -->

## Loss Masking

The example holds both prompt and response. We only want to teach the **response**.

- Compute cross-entropy **only over response tokens**
- Ignore prompt positions

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Why not train on the prompt?**

- The model would learn to **generate user turns**
- We want it to answer prompts, not write them

</div>

<div>

**How**

- Set prompt targets to `-100`
- `ignore_index=-100` skips those terms

</div>

</div>

Same cross-entropy as Module 5, restricted to the completion. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="masked-ce-equation" -->

## The Masked Objective

$$\mathcal{L} = -\frac{1}{|R|}\sum_{t \in R}\log p_\theta\left(x_t \mid x_{<t}\right)$$

The Module 5 loss with one change: the sum runs only over $R$, the **response-token positions**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- $R$: the assistant's response tokens
- $|R|$: their count; the average is over these only
- $x_{<t}$: the full prefix &mdash; the model still **reads** the prompt

</div>

<div>

- The prompt is **conditioning**, not a **target**
- One forward pass; the mask zeroes the prompt's loss terms
- Multi-turn: mask every assistant turn, train several responses per sequence

</div>

</div>

<!-- .slide: id="side-quest-mask-ablation" -->

## Side Quest: What If You Skip the Mask?

Train on the **whole** sequence, prompt included, and the model learns to model user turns too.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The symptom**

- **Hallucinates its own prompts** at generation time
- Invents a `<|user|>` question and answers it
- Echoes instruction-shaped text instead of responding

</div>

<div>

**Why**

- You trained it to predict prompt tokens, so it generates them
- The mask tells the model **whose turn it is learning to write**

</div>

</div>

The mask encodes **what behavior we teach**. The exercise extra credit shows this directly. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="divider-instructgpt" class="section-divider" data-state="is-section-divider" -->

# InstructGPT

The birth of the assistant


---

<!-- .slide: id="instructgpt-recipe" -->

## The Three-Stage Recipe

InstructGPT (Ouyang et al., 2022) turned a base model into an instruction-follower in three stages.

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 22px;">

<div>

**1. Supervised finetuning**

- Human-written demonstrations
- **This module**

</div>

<div>

**2. Reward model**

- Score responses from human **preference rankings**
- Module 7

</div>

<div>

**3. RL from human feedback**

- Optimize against the reward model with PPO
- Module 7

</div>

</div>

---

<!-- .slide: id="instructgpt-result" -->

## The Result That Made the Point

Human raters preferred a **1.3B** InstructGPT model over the **175B** GPT-3. More than **100x smaller**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- Raw scale did not win. **Alignment to intent** won.
- The smaller model was not more knowledgeable, just more **useful**: it did what was asked.

</div>

<div>

- ChatGPT is the same SFT-plus-preference recipe, scaled up.
- A capable base model is necessary but not sufficient. **Finetuning** makes it an assistant.

</div>

</div>

---

<!-- .slide: id="hhh" -->

## The Behavioral Target: HHH

What are we finetuning **toward**? Askell et al.: three properties.

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 22px;">

<div>

**Helpful**

Does what the user asks; useful, relevant, complete.

</div>

<div>

**Honest**

Accurate; does not fabricate; expresses uncertainty.

</div>

<div>

**Harmless**

Declines to cause harm; safe, non-toxic.

</div>

</div>

Finetuning turns these into a **data problem**: which demonstrations you show, which behaviors you reward. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="figure-ouyang" -->

<div class="figure-card">

![Long Ouyang](module_06_finetuning/images/ouyang.jpg)

<div class="figure-info">

## Long Ouyang <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Training Language Models to Follow Instructions with Human Feedback (InstructGPT, 2022)

- Led InstructGPT (OpenAI): turned a base model into an instruction-follower with the **SFT-plus-RLHF** recipe
- Showed a **1.3B** model could beat **175B** GPT-3 at following intent
- The direct technical ancestor of ChatGPT

</div>

</div>

</div>

---

<!-- .slide: id="figure-askell" -->

<div class="figure-card">

![Amanda Askell](module_06_finetuning/images/askell.jpg)

<div class="figure-info">

## Amanda Askell <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### A General Language Assistant as a Laboratory for Alignment (2021)

- Articulated the **helpful, honest, and harmless** framing for assistants
- Defined the behavioral target that finetuning and preference optimization aim at
- Made "alignment" a concrete, measurable engineering objective

</div>

</div>

</div>

---

<!-- .slide: id="side-quest-alignment-tax" -->

## Side Quest: The Alignment Tax

**Alignment tax**: finetuning for helpfulness and safety can **reduce raw benchmark scores**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- Base capabilities were tuned for next-token prediction, not aligned behavior
- Alignment can trade a few benchmark points for large gains in usefulness and safety

</div>

<div>

**Mitigations**

- Mix **pretraining data** into the finetuning run
- Use parameter-efficient methods that perturb the base less
- Usually worth paying: a helpful, safe model beats a higher-scoring one nobody can use

</div>

</div>

---

<!-- .slide: id="divider-lora" class="section-divider" data-state="is-section-divider" -->

# Parameter-Efficient Finetuning

LoRA and the adapter family


---

<!-- .slide: id="full-ft-cost" -->

## The Problem With Full Finetuning

Updating **all** parameters is expensive three ways:

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 22px;">

<div>

**Optimizer state**

- AdamW: two moment buffers per parameter
- Roughly **3x** model memory just to train (Module 5)

</div>

<div>

**A full copy per task**

- Every finetune is a full-size checkpoint
- Ten tasks: ten copies of a 70B model

</div>

<div>

**Hardware**

- Model + gradients + optimizer state
- Needs a cluster, not a laptop

</div>

</div>

---

<!-- .slide: id="lora-insight" -->

## The LoRA Insight

Hu et al. (2021): the finetuning **update** to a weight matrix has **low intrinsic rank**. So freeze $W$ and learn a low-rank correction:

$$W' = W + \frac{\alpha}{r} BA, \qquad B \in \mathbb{R}^{d_{\text{out}} \times r}, \quad A \in \mathbb{R}^{r \times d_{\text{in}}}, \quad r \ll d_{\text{in}}, d_{\text{out}}$$

$BA$ has exactly $W$'s shape: $d_{\text{out}} \times d_{\text{in}}$. <!-- .element: class="text-lg" -->

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- Only $A$ and $B$ train &mdash; often **under 1%** of parameters
- The frozen base $W$ is **shared** across tasks
- $B$ starts at **zero**: the adapter begins as a no-op

</div>

<div>

- $\alpha/r$ is fixed, so changing $r$ needs no learning-rate retune
- Optimizer state is tiny: moments for $A$ and $B$ only
- Less perturbation of the base: **less catastrophic forgetting**

</div>

</div>

<!-- .slide: id="lora-merge-swap" -->

## Two Key Properties

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Merge: zero added latency**

- Compute $W + \frac{\alpha}{r}BA$ once, store the result
- Same shape as $W$: merged model runs at **exactly** base speed

</div>

<div>

**Swap: many behaviors, one base**

- Keep adapters separate over one frozen base
- Load a different megabyte-sized adapter to switch behaviors

</div>

</div>

Checkpoints shrink from **gigabytes to megabytes**. Finetuning fits on **consumer hardware**. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="qlora-peft" -->

## QLoRA and the PEFT Family

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**QLoRA** (Dettmers et al., 2023)

- Quantize the frozen base to **4-bit**, train LoRA adapters on top
- A **65B** model finetunes on a **single GPU**
- Quantization itself: Module 9

</div>

<div>

**The broader PEFT family**

- **Adapters** (Houlsby et al.): small trainable layers inserted between frozen ones
- **Prefix / prompt tuning**: learn soft tokens, leave weights frozen
- **(IA)^3**: learn to rescale activations

</div>

</div>

**Trade-off:** PEFT is slightly less expressive than full finetuning. For most instruction tuning the gap is small and the savings are large. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="figure-hu" -->

<div class="figure-card">

![Edward Hu](module_06_finetuning/images/hu.jpg)

<div class="figure-info">

## Edward Hu <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### LoRA: Low-Rank Adaptation of Large Language Models (Microsoft, 2021)

- Introduced **low-rank adaptation**, making finetuning of huge models cheap and modular
- Showed a tiny low-rank update can match full finetuning quality on many tasks
- Turned task-specific finetunes into **megabyte-sized** adapters over one shared base

</div>

</div>

</div>

---

<!-- .slide: id="figure-dettmers" -->

<div class="figure-card">

![Tim Dettmers](module_06_finetuning/images/dettmers.jpg)

<div class="figure-info">

## Tim Dettmers <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### QLoRA: Efficient Finetuning of Quantized LLMs (2023)

- Drove practical **quantization** and **QLoRA**, combining 4-bit base weights with LoRA adapters
- Put finetuning of very large models on a **single consumer GPU**
- Made finetuning possible without a datacenter

</div>

</div>

</div>

---

<!-- .slide: id="side-quest-adapters-as-diffs" -->

## Side Quest: Adapters as Diffs for Weights

A LoRA adapter is a **diff** against the frozen base: a code patch for model weights.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- Task-specific behaviors as **megabyte-sized files** you load and unload
- Ship a 3 MB adapter, not a 14 GB model

</div>

<div>

- Model hubs host thousands of community adapters per popular base
- Adapters can be **composed** or averaged, like merging branches

</div>

</div>

<!-- .slide: id="divider-craft" class="section-divider" data-state="is-section-divider" -->

# The Craft

Data and evaluation


---

<!-- .slide: id="data-quality" -->

## Data Quality Dominates Quantity

A small, clean, diverse set beats a large noisy one.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**LIMA** (Zhou et al., 2023)

- "Less Is More for Alignment"
- Roughly **1,000** curated examples
- Still produced a strong assistant

</div>

<div>

**Why so few works**

- The base model already has the knowledge
- Alignment teaches **format and style**; a small clean set conveys that
- Noise teaches contradictions

</div>

</div>

The expensive part of SFT is not compute. It is **curating good demonstrations**. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="data-sources" -->

## Where SFT Data Comes From

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 22px;">

<div>

**Human-written**

- People write good responses
- Highest quality, slowest, most expensive

</div>

<div>

**Distillation**

- Generate data from a **stronger model**
- Self-Instruct, Alpaca

</div>

<div>

**Filtered logs**

- Mine real conversations, keep the good ones
- Abundant; needs filtering and consent

</div>

</div>

Modern pipelines mix all three. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="sft-hyperparams" -->

## Hyperparameters That Matter

SFT only **nudges** a capable model. The settings are deliberately gentle.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Move gently**

- **Small** learning rate: often 10x below pretraining
- **1 to 3 epochs**; more overfits and forgets

</div>

<div>

**Watch generalization**

- Keep a **held-out set**: small data memorizes fast, training loss lies
- Stop when held-out quality stops improving

</div>

</div>

The failure mode is always **catastrophic forgetting**: too large a step, or too many passes. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="sft-evaluation" -->

## Evaluating a Finetuned Model

Pretraining had a clean validation loss. **"Did it become a better assistant?"** has no single number.

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 22px;">

<div>

**Preference judgments**

- Two responses, same prompt: which is better?
- Comparative, not absolute

</div>

<div>

**Downstream benchmarks**

- MMLU, GSM8K
- Objective, repeatable
- Miss style, helpfulness, tone

</div>

<div>

**Human or model graders**

- Rate quality directly
- LLM-as-judge: cheap, scalable, imperfect

</div>

</div>

Every option is partial and noisy. (How to evaluate: Module 11.) <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="side-quest-superficial-alignment" -->

## Side Quest: The Superficial Alignment Hypothesis

LIMA's claim: the base model **already contains** the knowledge; alignment teaches **format, style, and which behaviors to surface**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- If true, finetuning **reveals** capability more than it teaches
- It would explain why ~1,000 examples can align a model that saw trillions of tokens

</div>

<div>

**Critical-thinking question** (compare Module 5's "emergence: real or mirage?"):

If 1,000 examples align a model, how much is finetuning **teaching** vs **unlocking**?

</div>

</div>

---

<!-- .slide: id="side-quest-model-collapse" -->

## Side Quest: Synthetic Data and Model Collapse

Alpaca and Self-Instruct generate finetuning data from a **stronger model**. Cheap and scalable, with hard questions:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- **Quality and licensing**: the teacher's errors propagate; proprietary-model outputs may violate terms
- **Model collapse**: repeated training on model-generated text erodes diversity

</div>

<div>

- Ties to Module 5's **data-wall** side quest: scarce human data pushes models toward synthetic text
- Open question: how much synthetic data before the snake eats its own tail?

</div>

</div>

<!-- .slide: id="divider-limits" class="section-divider" data-state="is-section-divider" -->

# The Limits of SFT

And what reinforcement learning adds


---

<!-- .slide: id="sft-only-imitates" -->

## SFT Can Only Imitate

SFT learns **"produce responses like these"**, not **"this response is better than that one."**

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**No negative signal**

- Every demonstration is a positive example
- Nothing says "not that"

</div>

<div>

**Exposure bias**

- Trains on **ground-truth prefixes**
- At generation time it continues its **own** imperfect outputs
- Small early mistakes compound

</div>

</div>

SFT's ceiling is the quality of its demonstrations. Going higher needs **comparisons**. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="handoff-module-7" -->

## Next Class: Reinforcement Learning

**Preference optimization** and **reinforcement learning** address these limits.

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 22px;">

<div>

**RLHF**

- Reward model from human preferences, then optimize against it
- InstructGPT stages 2 and 3

</div>

<div>

**DPO**

- Learn from preference pairs
- No separate reward model

</div>

<div>

**GRPO**

- Group-relative policy optimization
- Used in recent reasoning models

</div>

</div>

**SFT shaped the format; RL shapes the preferences.** Same optimizer, same backprop, new data and target. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

<!-- .slide: id="divider-quiz" class="section-divider" data-state="is-section-divider" -->

# Quiz


---

<!-- .slide: id="quiz-small-lr" -->

## Why a Smaller Learning Rate?

<div class="quiz-prompt">

Why does finetuning use a **smaller learning rate** and **far fewer steps** than pretraining?

</div>

<div class="fragment note quiz-answer">

- Pretraining already found a good region of weight space
- Finetuning only **nudges** behavior; it does not learn language from scratch
- Large steps or many epochs on the small, skewed set overwrite broad features: **catastrophic forgetting**
- A small learning rate and 1&ndash;3 epochs teach format while preserving capability

</div>

---

<!-- .slide: id="quiz-why-mask" -->

## Why Mask the Prompt?

<div class="quiz-prompt">

Why do we mask the **prompt** tokens out of the SFT loss instead of training on the whole sequence?

</div>

<div class="fragment note quiz-answer">

- We want the model to **answer** prompts, not **write** them
- Loss on prompt positions trains it to predict user tokens; at generation time it invents its own questions
- Masking (targets = -100) rewards only the **response**
- The prompt stays as context the model reads; it is just not a target

</div>

---

<!-- .slide: id="quiz-lora-params" -->

## How LoRA Saves Parameters

<div class="quiz-prompt">

How does LoRA reduce the number of **trainable** parameters without changing the model's **architecture at inference**?

</div>

<div class="fragment note quiz-answer">

- LoRA freezes $W$ and trains a low-rank update $\frac{\alpha}{r}BA$ with $r$ far smaller than either dimension
- Trainable count: $r(d_{\text{in}} + d_{\text{out}})$ instead of $d_{\text{in}} d_{\text{out}}$, often under 1%
- At inference, merge $W + \frac{\alpha}{r}BA$ once; the result has the **same shape** as $W$
- Forward pass and architecture are identical; only the training-time count changed

</div>

---

<!-- .slide: id="quiz-1p3b-beats-175b" -->

## Smaller Beat Bigger

<div class="quiz-prompt">

Why was a **1.3B** InstructGPT model preferred over **175B** GPT-3 despite being far smaller?

</div>

<div class="fragment note quiz-answer">

- Scale buys knowledge and fluency, not the **behavior** of following intent
- GPT-3 was a base model: it continues text, which often is not what the user wanted
- InstructGPT was finetuned on demonstrations and preferences to **satisfy requests**
- Raters judge usefulness, not parameter count, so the aligned model won

</div>

---

<!-- .slide: id="quiz-preference-vs-sft" -->

## The SFT Ceiling

<div class="quiz-prompt">

A team keeps improving their SFT model by collecting **more and higher-quality** demonstrations. Progress stalls: it still occasionally produces fluent, confident answers that are subtly **wrong**, and more demonstrations barely help. Why does this ceiling exist, and what kind of training signal is needed to push past it?

</div>

<div class="fragment note quiz-answer">

- SFT learns only from **positive** examples: "produce responses like these"
- It pulls probability **toward** demonstrations, never **away** from plausible-but-wrong answers
- More demonstrations cannot teach **relative quality**, so the ceiling is the demonstrations themselves
- Pushing past it needs a **comparative** signal: preference rankings, reward modeling (Module 7)
- **Exposure bias** compounds this: trained on ground-truth prefixes, generating over its own imperfect text

</div>

---

<!-- .slide: id="quiz-forgetting" -->

## Forgetting and Adapters

<div class="quiz-prompt">

What is **catastrophic forgetting**, and why does freezing the base and training a small **adapter** help avoid it?

</div>

<div class="fragment note quiz-answer">

- Catastrophic forgetting: finetuning on narrow data overwrites the weights that encoded general capability
- LoRA freezes the pretrained matrix; those values **cannot change**
- The adapter is low-capacity and starts at zero, so it can only make a modest adjustment
- The base model's knowledge is structurally preserved

</div>

---

<!-- .slide: id="quiz-merge-latency" -->

## Why Merging Adds No Latency

<div class="quiz-prompt">

After **merging** a LoRA update $BA$ into the frozen weight $W$, why is there **no extra** inference latency?

</div>

<div class="fragment note quiz-answer">

- During training the layer computes $Wx + \frac{\alpha}{r}B(Ax)$: two extra multiplies
- $W + \frac{\alpha}{r}BA$ precomputes into a **single** matrix $W'$, same shape as $W$
- Merged, the layer computes $W'x$: same FLOPs, same memory as the base model
- The adapter is folded in; nothing extra runs at inference

</div>

  <!-- Per-module config: sets window.MODULE_CONFIG before the shared logic runs -->
  <script>
window.ASSET_BASE = "module_06_finetuning/";
(function () {
  // Module 6 config. Manim steppers are keyed by the `scene` slug used in the
  // :::manim fences; each maps to its ordered list of section clips.
  // ===================================================================
  // WIDGET: lossMask — toggle which chat-template spans contribute loss
  // and watch the trained-token count (and the taught behavior) change.
  // ===================================================================
  function lossMask(host) {
    var U = WIDGET_UTIL;
    // One two-turn conversation, already rendered in a chat template.
    var SPANS = [
      { kind: 'special', text: '<|system|>' },
      { kind: 'prompt', text: 'You are a helpful assistant.' },
      { kind: 'special', text: '<|user|>' },
      { kind: 'prompt', text: 'What is the capital of France?' },
      { kind: 'special', text: '<|assistant|>' },
      { kind: 'response', turn: 1, text: 'The capital of France is Paris.' },
      { kind: 'special', text: '<|user|>' },
      { kind: 'prompt', text: 'And of Japan?' },
      { kind: 'special', text: '<|assistant|>' },
      { kind: 'response', turn: 2, text: 'The capital of Japan is Tokyo.' }
    ];
    var state = { mode: 'all' };  // all | last | none

    host.innerHTML =
      '<div class="iw">' +
        '<div class="iw-body iw-hug">' +
          '<div class="iw-panel">' +
            '<h4>The training example, token by token</h4>' +
            '<div class="iw-tokens" data-el="seq"></div>' +
          '</div>' +
        '</div>' +
        '<div class="iw-stats">' +
          '<div class="iw-stat"><span class="iw-stat-num" data-el="tot">0</span><span class="iw-stat-lab">tokens in sequence</span></div>' +
          '<div class="iw-stat good"><span class="iw-stat-num" data-el="trained">0</span><span class="iw-stat-lab">tokens with loss</span></div>' +
          '<div class="iw-stat"><span class="iw-stat-num" data-el="pct">0</span><span class="iw-stat-lab">of the sequence</span></div>' +
        '</div>' +
        '<div class="iw-controls">' +
          '<span class="iw-label">loss on:</span>' +
          '<button class="iw-btn active" data-pick data-val="all">every assistant turn</button>' +
          '<button class="iw-btn" data-pick data-val="last">the last turn only</button>' +
          '<button class="iw-btn" data-pick data-val="none">no mask (whole sequence)</button>' +
        '</div>' +
        '<p class="iw-readout"></p>' +
      '</div>';
    U.stop(host);
    var seq = host.querySelector('[data-el="seq"]');
    var readout = host.querySelector('.iw-readout');
    var el = {};
    host.querySelectorAll('[data-el]').forEach(function (n) { el[n.getAttribute('data-el')] = n; });

    // Rough token split: words plus punctuation, enough to make the point.
    function tokens(text) { return text.match(/\S+/g) || []; }

    function trained(span) {
      if (state.mode === 'none') return true;
      if (span.kind !== 'response') return false;
      if (state.mode === 'all') return true;
      return span.turn === 2;
    }

    function draw() {
      var total = 0, hit = 0, html = '';
      SPANS.forEach(function (span) {
        var on = trained(span);
        tokens(span.text).forEach(function (t) {
          total++;
          if (on) hit++;
          var cls = on ? 'good' : (span.kind === 'special' ? 'hot' : 'dim');
          html += '<span class="iw-chip ' + cls + '">' + t.replace(/</g, '&lt;') + '</span>';
        });
      });
      seq.innerHTML = html;
      el.tot.textContent = total;
      el.trained.textContent = hit;
      el.pct.textContent = Math.round((hit / total) * 100) + '%';

      readout.innerHTML =
        state.mode === 'all'
          ? 'Green tokens carry loss; grey ones are set to <strong>-100</strong> and skipped. The prompt is still <strong>read</strong> as context, it is just never a target.'
          : state.mode === 'last'
            ? 'Training only the final turn wastes the earlier response: the same forward pass could have supplied <strong>' +
              (function () { var a = 0; SPANS.forEach(function (s) { if (s.kind === 'response' && s.turn === 1) a += tokens(s.text).length; }); return a; }()) +
              '</strong> more supervised tokens for free.'
            : 'With no mask the model is trained to produce <strong>user turns and system prompts too</strong>. At generation time it invents its own questions and answers them.';
    }

    U.bindToggle(host, '[data-pick]', function (val) { state.mode = val; draw(); });
    draw();
    return { resize: draw };
  }

  // ===================================================================
  // WIDGET: loraCalculator — rank r and the alpha/r scale against a full
  // weight matrix, in parameters, optimizer memory, and checkpoint size.
  // ===================================================================
  function loraCalculator(host) {
    var U = WIDGET_UTIL, COL = WIDGET_UTIL.COL;

    host.innerHTML =
      '<div class="iw">' +
        '<div class="iw-canvas-wrap"><canvas class="iw-canvas"></canvas></div>' +
        '<div class="iw-stats">' +
          '<div class="iw-stat"><span class="iw-stat-num" data-el="base">0</span><span class="iw-stat-lab">frozen parameters</span></div>' +
          '<div class="iw-stat good"><span class="iw-stat-num" data-el="tr">0</span><span class="iw-stat-lab">trainable parameters</span></div>' +
          '<div class="iw-stat"><span class="iw-stat-num" data-el="pct">0</span><span class="iw-stat-lab">trainable share</span></div>' +
          '<div class="iw-stat"><span class="iw-stat-num" data-el="ckpt">0</span><span class="iw-stat-lab">checkpoint per task</span></div>' +
          '<div class="iw-stat"><span class="iw-stat-num" data-el="scale">0</span><span class="iw-stat-lab">scale &alpha; / r</span></div>' +
        '</div>' +
        '<div class="iw-sliders">' +
          U.sliderHTML('d', 'hidden size d', 512, 8192, 256, 4096) +
          U.sliderHTML('r', 'rank r', 1, 256, 1, 8) +
          U.sliderHTML('alpha', 'alpha', 1, 256, 1, 16) +
          U.sliderHTML('L', 'layers', 4, 96, 4, 32) +
        '</div>' +
        '<p class="iw-readout"></p>' +
      '</div>';
    U.stop(host);
    var canvas = host.querySelector('.iw-canvas');
    var readout = host.querySelector('.iw-readout');
    var el = {};
    host.querySelectorAll('[data-el]').forEach(function (n) { el[n.getAttribute('data-el')] = n; });

    function draw() {
      var v = read();
      var d = v.d, r = v.r, L = v.L, alpha = v.alpha;
      var scale = alpha / r;
      // Adapters on the four attention projections, the common default.
      var perMat = d * d, mats = 4 * L;
      var base = perMat * mats;
      var lora = (2 * d * r) * mats;

      var f = U.fit(canvas); if (!f) return;
      var ctx = f.ctx, W = f.w, H = f.h;
      ctx.clearRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.font = '12px Inter, sans-serif';
      ctx.fillStyle = COL.muted;
      ctx.fillText('one attention projection, drawn to scale: W is d x d, A is r x d, B is d x r', W / 2, 18);

      var side = Math.min(H - 124, (W - 200) / 2.6);
      var wx = W / 2 - side - 90, wy = 40;

      ctx.fillStyle = 'rgba(136,146,164,0.14)';
      ctx.strokeStyle = COL.muted; ctx.lineWidth = 1.5;
      U.rounded(ctx, wx, wy, side, side, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = COL.muted;
      ctx.fillText('W (frozen)', wx + side / 2, wy + side / 2);
      ctx.fillText(d + ' x ' + d, wx + side / 2, wy + side / 2 + 18);

      ctx.fillStyle = COL.text;
      ctx.font = '20px Inter, sans-serif';
      ctx.fillText('+', wx + side + 30, wy + side / 2 + 6);
      // The alpha/r scale multiplies the low-rank product, not W.
      ctx.fillStyle = COL.secondary;
      ctx.font = '600 13px Inter, sans-serif';
      ctx.fillText('x ' + scale.toFixed(2), wx + side + 30, wy + side / 2 + 32);

      // B (d x r) then A (r x d), both drawn at the same pixels-per-unit as W.
      var unit = side / d;
      var bw = Math.max(3, r * unit), ah = Math.max(3, r * unit);
      var bx = wx + side + 68, by = wy;
      ctx.font = '12px Inter, sans-serif';
      ctx.fillStyle = 'rgba(63,185,80,0.35)';
      ctx.strokeStyle = COL.green; ctx.lineWidth = 1.5;
      U.rounded(ctx, bx, by, bw, side, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = COL.green;
      ctx.fillText('B', bx + bw / 2, by + side + 16);

      var ax = bx + bw + 30, ay = wy + side / 2 - ah / 2;
      ctx.fillStyle = 'rgba(74,158,255,0.35)';
      ctx.strokeStyle = COL.primary;
      U.rounded(ctx, ax, ay, side, ah, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = COL.primary;
      ctx.fillText('A', ax + side / 2, ay + ah + 16);

      ctx.fillStyle = COL.muted;
      ctx.fillText('trainable: 2 x d x r = ' + U.fmtCount(2 * d * r) + ' per matrix', ax + side / 2, wy + side + 40);
      ctx.fillStyle = COL.text;
      ctx.font = '600 15px Inter, sans-serif';
      ctx.fillText("W' = W + (" + alpha + ' / ' + r + ') BA = W + ' + scale.toFixed(2) + ' BA',
        W / 2, wy + side + 70);

      el.base.textContent = U.fmtCount(base);
      el.tr.textContent = U.fmtCount(lora);
      el.pct.textContent = (100 * lora / base).toFixed(lora / base < 0.001 ? 3 : 2) + '%';
      el.ckpt.textContent = U.fmtBytes(lora * 2 / 1e9);   // bf16 adapter weights
      el.scale.textContent = scale.toFixed(2);

      U.setVal(host, 'd', String(d));
      U.setVal(host, 'r', String(r));
      U.setVal(host, 'alpha', String(alpha));
      U.setVal(host, 'L', String(L));

      // AdamW keeps two fp32 moments per trainable parameter.
      var optFull = base * 8 / 1e9, optLora = lora * 8 / 1e9;
      readout.innerHTML = 'Optimizer state drops from <strong>' + U.fmtBytes(optFull) + '</strong> to <strong>' +
        U.fmtBytes(optLora) + '</strong>, and each task ships as a <strong>' + U.fmtBytes(lora * 2 / 1e9) +
        '</strong> adapter over one shared base.';
    }

    var read = U.bindSliders(host, draw);
    draw();
    return { resize: draw };
  }

  window.MODULE_CONFIG = {
    title: 'LLMs 0 to 100 - Module 6',
    manimSections: {
      'chat-template': [
        'ChatTemplateScene_0000_turns.mp4',
        'ChatTemplateScene_0001_markers.mp4',
        'ChatTemplateScene_0002_flatten.mp4',
        'ChatTemplateScene_0003_highlight.mp4'
      ],
      'loss-mask': [
        'LossMaskScene_0000_row.mp4',
        'LossMaskScene_0001_predict.mp4',
        'LossMaskScene_0002_mask.mp4',
        'LossMaskScene_0003_loss.mp4'
      ],
      'lora': [
        'LoRAScene_0000_weight.mp4',
        'LoRAScene_0001_freeze.mp4',
        'LoRAScene_0002_lowrank.mp4',
        'LoRAScene_0003_rank.mp4',
        'LoRAScene_0004_merge.mp4'
      ]
    },
    widgets: {
      lossMask: lossMask,
      loraCalculator: loraCalculator
    }
  };
}());

  </script>

  <!-- Shared deck logic for every module -->
  <script>
// =====================================================================
// Core deck infrastructure: Manim steppers, Reveal.js init, syntax
// highlighting, interactive widget plumbing, and per-module hooks.
// Loaded before any widget definitions.
// =====================================================================

// =====================================================================
// Shared deck logic for every module. Per-module data and hooks arrive
// via window.MODULE_CONFIG, set by each module's config.js (which the
// build inlines BEFORE this file):
//
//   window.MODULE_CONFIG = {
//     title:          'LLMs 0 to 100 - Module N',  // sets document.title
//     manimSections:  { scene: ['Clip_0000.mp4', ...], ... },
//     widgets:        { name: function(host){...}, ... },  // optional
//     onReady:        function(reveal){...},               // optional
//     onSlideChanged: function(event){...}                 // optional
//   };
// =====================================================================
var MODULE_CONFIG = window.MODULE_CONFIG || {};

// ---- Manim section step-through player ----
// Section video lists are inline to avoid fetch() issues with file:// protocol.
var MANIM_SECTIONS = MODULE_CONFIG.manimSections || {};

var manimSteppers = {};

function initManimStepper(video) {
  var scene = video.getAttribute('data-manim-scene');
  var sections = MANIM_SECTIONS[scene] || [];
  var state = { sections: sections, current: -1, playing: false, video: video, scene: scene };
  manimSteppers[scene] = state;

  // Set poster frame from first section
  if (sections.length > 0) {
    video.src = (window.ASSET_BASE || '') + 'media/sections/' + sections[0];
    video.load();
  }

  video.addEventListener('ended', function() {
    state.playing = false;
  });
}

function advanceManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state || state.playing) return false;
  if (state.current >= state.sections.length - 1) return false;

  state.current++;
  state.playing = true;
  var file = state.sections[state.current];
  state.video.src = (window.ASSET_BASE || '') + 'media/sections/' + file;
  state.video.load();
  state.video.play().then(function() {}).catch(function() { state.playing = false; });
  return true;
}

function resetManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state) return;
  state.current = -1;
  state.playing = false;
  state.video.pause();
  if (state.sections.length > 0) {
    state.video.src = (window.ASSET_BASE || '') + 'media/sections/' + state.sections[0];
    state.video.load();
  }
}

// Instantly finish the section that is currently playing by jumping to its
// final frame. This lets an impatient "next" complete the animation in
// place rather than leaking through to reveal and skipping the slide.
// Returns true if it consumed the action (a video was actually playing).
function skipManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state || !state.playing) return false;
  var v = state.video;
  v.pause();
  // Seek just shy of the end so the step's end state stays on screen.
  if (v.duration && isFinite(v.duration)) {
    try { v.currentTime = Math.max(0, v.duration - 0.04); } catch (e) {}
  }
  state.playing = false;
  return true;
}

// One forward action on a manim slide. If a section is mid-play, the press
// completes it (skip to the end frame); otherwise it advances to the next
// section. Returns false only when there is nothing left to animate, which
// is the signal that reveal.js may now move on to the next slide.
function manimForward(scene) {
  var state = manimSteppers[scene];
  if (!state) return false;
  if (state.playing) return skipManimStepper(scene);
  return advanceManimStepper(scene);
}

// ---- Initialize Reveal.js ----
Reveal.initialize({
  width: 1280,
  height: 720,
  margin: 0,
  controls: true,
  progress: true,
  slideNumber: false,
  hash: true,
  transition: 'none',
  center: false,
  autoAnimateDuration: 0.8,
  plugins: [ RevealHighlight, RevealMarkdown ]
});

// ---- Syntax highlighting ----
// reveal-markdown converts the inline <textarea> into <pre><code> blocks
// in a deferred microtask, AFTER the highlight plugin's init() has already
// run, so code ships un-highlighted. Re-trigger the plugin once the blocks
// exist (on ready) and for any added later (on slidechanged).
function highlightAllCodeBlocks() {
  if (!Reveal.getPlugin) return;
  var hl = Reveal.getPlugin('highlight');
  if (!hl || typeof hl.highlightBlock !== 'function') return;
  document.querySelectorAll('pre code').forEach(function(block) {
    if (block.dataset.highlighted === 'yes') return;
    hl.highlightBlock(block);
  });
}
// reveal-markdown may materialize blocks in waves, so re-run the
// (idempotent) pass across the startup window rather than once.
Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    highlightAllCodeBlocks();
    if (tries > 25) clearInterval(iv);
  }, 100);
});
Reveal.on('slidechanged', highlightAllCodeBlocks);

// ---- Overflow scrolling ----
// Sections scroll when their content is taller than the slide (styles.css).
// Start every slide at the top, and scroll a newly revealed fragment into
// view if it landed below the fold.
Reveal.on('slidechanged', function(event) {
  if (event.currentSlide) event.currentSlide.scrollTop = 0;
});
Reveal.on('fragmentshown', function(event) {
  var frag = event.fragment;
  if (!frag || !frag.scrollIntoView) return;
  var section = frag.closest('section');
  if (!section || section.scrollHeight <= section.clientHeight) return;
  frag.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
});
Reveal.on('fragmentshown', highlightAllCodeBlocks);

function initStepperClickHandlers() {
  document.querySelectorAll('.manim-stepper').forEach(function(video) {
    if (video.dataset.clickInit) return;
    video.dataset.clickInit = '1';
    video.style.cursor = 'pointer';
    video.addEventListener('click', function(e) {
      var scene = video.getAttribute('data-manim-scene');
      manimForward(scene);
      e.stopPropagation();
      e.preventDefault();
    });
  });
}

function initAllSteppers() {
  document.querySelectorAll('.manim-stepper').forEach(function(v) {
    if (!manimSteppers[v.getAttribute('data-manim-scene')]) {
      initManimStepper(v);
    }
  });
  initStepperClickHandlers();
}

function renderMath() {
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false}
      ]
    });
  }
}

// reveal-markdown loads slides asynchronously, so the 'ready' event may
// fire before the markdown content is in the DOM. Poll briefly.
Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    if (document.querySelectorAll('section').length > 5 || tries > 20) {
      clearInterval(iv);
      initAllSteppers();
      renderMath();
    }
  }, 100);
});

// Reset steppers when leaving a slide
Reveal.on('slidechanged', function(event) {
  initAllSteppers();
  Object.keys(manimSteppers).forEach(function(scene) {
    if (!event.currentSlide.querySelector('[data-manim-scene="' + scene + '"]')) {
      resetManimStepper(scene);
    }
  });
});

// Intercept right arrow / space / enter on manim slides to step through
// sections. manimForward consumes the press while there is still animation
// to play (completing the current section or starting the next), so reveal
// only advances the slide once every section has been shown.
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
    var currentSlide = Reveal.getCurrentSlide();
    var stepper = currentSlide ? currentSlide.querySelector('.manim-stepper') : null;
    if (stepper) {
      var scene = stepper.getAttribute('data-manim-scene');
      if (manimForward(scene)) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }
  }
}, true);

// The on-screen controls (controls: true) navigate directly and bypass the
// keydown handler above, so guard the forward arrows the same way: a forward
// control press on a manim slide steps the animation before leaving.
document.addEventListener('click', function(e) {
  var btn = e.target.closest ? e.target.closest('.navigate-right, .navigate-down') : null;
  if (!btn) return;
  var currentSlide = Reveal.getCurrentSlide();
  var stepper = currentSlide ? currentSlide.querySelector('.manim-stepper') : null;
  if (stepper && manimForward(stepper.getAttribute('data-manim-scene'))) {
    e.stopImmediatePropagation();
    e.preventDefault();
  }
}, true);

// =====================================================================
// Interactive widgets (:::interactive). Each widget is a factory keyed
// by its `data-widget` value; it owns its host element and (re)draws
// whenever its slide becomes visible or the window resizes.
// =====================================================================
var INTERACTIVE_WIDGETS = {};

function hydrateInteractiveWidgets() {
  document.querySelectorAll('.interactive-host[data-widget]').forEach(function(host) {
    if (host.dataset.hydrated) return;
    var factory = INTERACTIVE_WIDGETS[host.getAttribute('data-widget')];
    if (!factory) return;
    host.dataset.hydrated = '1';
    host._widget = factory(host) || null;
  });
}

function refreshInteractiveWidgets() {
  document.querySelectorAll('.interactive-host[data-widget]').forEach(function(host) {
    if (host._widget && typeof host._widget.resize === 'function') host._widget.resize();
  });
}

Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    if (document.querySelector('.interactive-host[data-widget]') || tries > 25) {
      clearInterval(iv);
      hydrateInteractiveWidgets();
      requestAnimationFrame(refreshInteractiveWidgets);
    }
  }, 100);
});
Reveal.on('slidechanged', function() {
  hydrateInteractiveWidgets();
  requestAnimationFrame(refreshInteractiveWidgets);
});
window.addEventListener('resize', refreshInteractiveWidgets);

// ---- Per-module hooks (from MODULE_CONFIG) ----
if (MODULE_CONFIG.title) document.title = MODULE_CONFIG.title;
if (MODULE_CONFIG.widgets) Object.assign(INTERACTIVE_WIDGETS, MODULE_CONFIG.widgets);
if (typeof MODULE_CONFIG.onReady === 'function') {
  Reveal.on('ready', function() { MODULE_CONFIG.onReady(Reveal); });
}
if (typeof MODULE_CONFIG.onSlideChanged === 'function') {
  Reveal.on('slidechanged', function(event) { MODULE_CONFIG.onSlideChanged(event); });
}

// =====================================================================
// Slide annotation / drawing overlay.
//
// A full-viewport <canvas> the presenter can draw on top of any slide.
// Strokes are stored per slide (keyed by Reveal indices, in normalized
// coordinates) so they survive navigation and window resizes. A small
// floating toolbar exposes pen colors, an eraser, undo, and clear.
//
// Keyboard:
//   d       toggle draw mode on/off
//   e       eraser (while in draw mode)
//   c       clear the current slide's drawing
//   u       undo the last stroke
//   Escape  exit draw mode
//
// While draw mode is active, Reveal's own keyboard/touch navigation is
// suspended so drawing gestures never flip the slide.
// =====================================================================
(function () {
  'use strict';

  var PALETTE = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#ffffff'];
  var PEN_WIDTH = 3;
  var ERASER_WIDTH = 28;

  // strokesBySlide[key] = [ {color, width, erase, points:[{x,y}, ...]}, ... ]
  // Points are normalized to [0,1] against the canvas so they rescale on resize.
  var strokesBySlide = {};

  var canvas, ctx, toolbar;
  var drawMode = false;
  var erasing = false;
  var color = PALETTE[0];
  var drawing = false;
  var currentStroke = null;

  // ---- slide identity + canvas geometry ----
  function slideKey() {
    var idx = (typeof Reveal !== 'undefined' && Reveal.getIndices) ? Reveal.getIndices() : { h: 0, v: 0 };
    return idx.h + '-' + (idx.v || 0);
  }

  function strokes() {
    var k = slideKey();
    if (!strokesBySlide[k]) strokesBySlide[k] = [];
    return strokesBySlide[k];
  }

  // Size the backing store to device pixels for crisp lines, keep the CSS
  // box at viewport size, then repaint the current slide's strokes.
  function resizeCanvas() {
    if (!canvas) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }

  function drawStroke(s) {
    if (!s.points.length) return;
    var w = window.innerWidth, h = window.innerHeight;
    ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.width;

    injectStyles();

    canvas = document.createElement('canvas');
    canvas.id = 'draw-canvas';
    document.body.appendChild(canvas);
    ctx = canvas.getContext('2d');

    buildToolbar();
    bindCanvasEvents();
    bindKeys();
    bindToolbarReveal();

    window.addEventListener('resize', resizeCanvas);
    if (typeof Reveal !== 'undefined' && Reveal.on) {

      Reveal.on('slidechanged', redraw);
      Reveal.on('ready', resizeCanvas);
    }
  }

    document.addEventListener('DOMContentLoaded', init);
  } else {

  }

// MLP Core — Shared neural-net library consumed by multiple widgets.
// Deterministic data generation, preset lookup-model geometry, and the
// Adam trainer (used by the debug harness; the deck uses lookupModel).
// =====================================================================

// =====================================================================
// Shared MLP core for the boundaryExplorer and mlpBoundary widgets.
// The slide widgets use deterministic lookup presets keyed by
// dataset/width/depth so a button click always loads the intended working

// helper for the debug harness, but the deck paths pass a dataset name and
