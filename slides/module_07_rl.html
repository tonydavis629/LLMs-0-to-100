<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMs 0 to 100</title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <!-- KaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>

  <!-- Module-specific <head> includes (e.g. Chart.js); empty for most modules -->
  

  <!-- Shared styles + per-module overrides, inlined by the build -->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

/* ===========================================
   CSS VARIABLES
   =========================================== */
:root {
  --background-color: #0a0e1a;
  --section-divider-bg: #0d1225;

  --heading-font: "Space Grotesk", Helvetica, sans-serif;
  --body-font: "Inter", Helvetica, sans-serif;
  --base-font-size: 32px;
  --text-size: 16pt;
  --h1-size: 48pt;
  --h2-size: 36pt;
  --h3-size: 24pt;
  --footnote-size: 11pt;

  --primary-color: #4a9eff;
  --secondary-color: #f5a623;
  --text-color: #e8eaf0;
  --muted-color: #8892a4;
  --line-color: #2a3450;

  --slide-padding: 60px;
  --slide-padding-top: 24px;
  --content-gap: 18px;

  --box-radius: 8px;
}

/* ===========================================
   BASE STYLES
   =========================================== */

.reveal {
  font-family: var(--body-font);
  font-size: var(--base-font-size);
}

.reveal strong,
.reveal b {
  font-weight: bold;
}

.reveal a {
  color: var(--primary-color);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.reveal a:hover {
  color: var(--text-color);
}

.reveal-viewport {
  background-color: var(--background-color);
}

.reveal-viewport.is-section-divider .slide-background.present {
  background-color: var(--section-divider-bg) !important;
}

.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4,
.reveal h5,
.reveal h6 {
  font-family: var(--heading-font);
  text-transform: none;
  color: var(--text-color);
  font-weight: 600;
  line-height: 1.2;
}

.reveal h1 { font-size: var(--h1-size); }
.reveal h2 { font-size: var(--h2-size); margin-bottom: 0; }
.reveal h3 { font-size: var(--h3-size); }

.reveal p,
.reveal li,
.reveal td,
.reveal th,
.reveal blockquote {
  font-size: var(--text-size);
  color: var(--text-color);
  line-height: 1.5;
}

/* Vertical separation between newline-separated sentences on text slides.
   Scoped to a slide's top-level paragraphs (the prose flow); paragraphs
   nested inside components (terminal captions, figure cards, grid columns)
   keep their own tighter spacing so dense component slides do not overflow.
   Adjacent margins collapse, so the gap between two paragraphs is 0.9em. */
.reveal .slides section > p {
  margin: 0.4em 0 0.9em 0;
}

/* ===========================================
   LISTS
   =========================================== */

.reveal ul {
  list-style: none;
  padding-left: 0;
  margin: 15px 0;
}

.reveal ul li {
  position: relative;
  padding-left: 25px;
  margin-bottom: 10px;
}

.reveal ul li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.6em;
  width: 8px;
  height: 8px;
  background: var(--primary-color);
  border-radius: 50%;
}

.reveal ul ul li::before {
  background: var(--muted-color);
  width: 6px;
  height: 6px;
}

.reveal blockquote p {
  font-size: inherit;
}

/* ===========================================
   SLIDE LAYOUT
   =========================================== */

.reveal .slides section {
  height: 100%;
  display: flex !important;
  flex-direction: column !important;
  padding: var(--slide-padding-top) var(--slide-padding) var(--slide-padding) var(--slide-padding) !important;
  box-sizing: border-box;
  text-align: left;
}

.reveal .slides section.stack {
  padding: 0 !important;
}

.reveal .slides section > .content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: var(--content-gap);
  text-align: left;
}

.reveal .slides section > .footnote {
  position: absolute;
  bottom: 15px;
  left: var(--slide-padding);
  right: var(--slide-padding);
  font-size: var(--footnote-size);
  color: var(--muted-color);
}

/* ===========================================
   SECTION DIVIDERS
   =========================================== */

.reveal .slides section.section-divider {
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}

.reveal .slides section.section-divider h1 {
  font-size: 56pt;
  text-align: center;
  color: var(--primary-color);
}

.reveal .slides section.section-divider p {
  font-size: 20pt;
  color: var(--muted-color);
}

/* ===========================================
   TEXT SIZE UTILITIES
   =========================================== */

.text-lg { font-size: 18pt !important; }
.text-xl { font-size: 20pt !important; }
.text-2xl { font-size: 24pt !important; }
.text-3xl { font-size: 28pt !important; }
.text-4xl { font-size: 32pt !important; }

.text-muted { color: var(--muted-color) !important; }
.text-center { text-align: center !important; }
.text-uppercase { text-transform: uppercase; letter-spacing: 0.1em; }
.font-light { font-weight: 300; }
.font-bold { font-weight: 600; }

/* ===========================================
   BLOCKQUOTES
   =========================================== */

.reveal blockquote {
  border-left: 4px solid var(--primary-color);
  padding-left: 20px;
  margin: 20px 0;
  font-style: italic;
  background: none;
  box-shadow: none;
  width: 100%;
  max-width: none;
}

.reveal blockquote cite {
  display: block;
  margin-top: 10px;
  font-style: normal;
  color: var(--muted-color);
}

/* ===========================================
   ACCENT UNDERLINE ON TITLES
   =========================================== */

.reveal .slides section > h2 {
  flex-shrink: 0;
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line-color);
}

/* ===========================================
   FIGURE CARD - for notable figures slides
   =========================================== */

.figure-card {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  align-items: start;
}

.figure-card img {
  border-radius: var(--box-radius);
  width: 100%;
  box-shadow: 0 4px 20px rgba(74, 158, 255, 0.15);
}

.figure-card .figure-info h3 {
  margin: 0 0 5px 0;
  color: var(--secondary-color);
  font-size: 14pt;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ===========================================
   ERA BADGE - for timeline labels
   =========================================== */

.era-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12pt;
  font-weight: 500;
}

.era-badge.summer {
  background: rgba(245, 166, 35, 0.2);
  color: var(--secondary-color);
}

.era-badge.winter {
  background: rgba(74, 158, 255, 0.15);
  color: #6cb4ff;
}

.era-badge.spring {
  background: rgba(80, 200, 120, 0.2);
  color: #50c878;
}

/* ===========================================
   HIGHLIGHT BOX
   =========================================== */

.highlight-box {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
}

/* Exercise hint: a single fragment that reveals the whole hint at once.
   The wrapping .fragment div is what animates; this just sizes the text
   (matching the old text-lg intent) and removes the global paragraph
   margin so the one-line hint is not double-spaced. */
.reveal .hint-box p {
  font-size: 18pt;
  margin: 0;
}

/* ===========================================
   COURSE STRUCTURE
   =========================================== */

.course-summary {
  max-width: 1120px;
  margin: 0 0 16px 0;
  color: #f0f4fb;
  font-size: 18pt !important;
  line-height: 1.4 !important;
}

.course-track-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

.module-track-card {
  background: rgba(74, 158, 255, 0.07);
  border: 1px solid rgba(74, 158, 255, 0.22);
  border-radius: var(--box-radius);
  padding: 20px 22px;
}

.module-track-kicker {
  font-size: 12pt;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--secondary-color);
  margin-bottom: 8px;
}

.module-track-card h3 {
  margin: 0 0 8px 0;
}

.module-track-intro {
  font-size: 14pt !important;
  color: #d7ddea !important;
  margin: 0 0 10px 0;
  line-height: 1.4 !important;
}

.compact-list {
  margin: 0;
}

.reveal ul.compact-list li {
  font-size: 16pt;
  line-height: 1.35;
  margin-bottom: 7px;
  padding-left: 20px;
}

.course-note {
  margin-top: 14px;
  color: #d7ddea;
  font-size: 15pt !important;
  line-height: 1.35 !important;
}

.course-glossary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  margin-top: 14px;
}

.glossary-item {
  background: rgba(245, 166, 35, 0.08);
  border: 1px solid rgba(245, 166, 35, 0.18);
  border-radius: var(--box-radius);
  padding: 12px 14px;
}

.glossary-item strong {
  color: var(--secondary-color);
}

.glossary-item p {
  font-size: 13pt !important;
  color: #d7ddea !important;
  margin: 6px 0 0 0;
  line-height: 1.4;
}

/* ===========================================
   TERMINAL OUTPUT
   =========================================== */

.terminal-output {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 0;
  max-width: 800px;
  margin: 0 auto;
  text-align: left;
}

.terminal-output .terminal-bar {
  background: #161b22;
  border-radius: 8px 8px 0 0;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.terminal-output .terminal-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.terminal-output .terminal-dot.red { background: #ff5f57; }
.terminal-output .terminal-dot.yellow { background: #febc2e; }
.terminal-output .terminal-dot.green { background: #28c840; }

.terminal-output .terminal-title {
  color: #8b949e;
  font-family: monospace;
  font-size: 10pt;
  margin-left: 8px;
}

.terminal-output .terminal-body {
  padding: 15px 20px;
}

.terminal-output .terminal-body pre {
  margin: 0;
  background: none !important;
  box-shadow: none !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output.dense .terminal-body {
  padding: 10px 20px;
}

.reveal .terminal-output.dense .terminal-body pre.terminal-pre {
  font-size: 9pt;
  line-height: 1.28;
}

.reveal .terminal-output .terminal-body pre.terminal-pre span {
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre p {
  display: inline;
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
  margin: 0 !important;
  color: inherit;
}

.reveal .terminal-output .terminal-body pre code {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output .terminal-body .prompt {
  color: #8b949e;
}

.terminal-output .terminal-body .success {
  color: #3fb950;
}

.terminal-output .terminal-body .header {
  font-weight: bold;
}

.terminal-output .terminal-body .skipped {
  color: #8b949e;
  font-style: italic;
}

/* ===========================================
   TURNING POINT SLIDE
   =========================================== */

.turning-point h2 {
  border-bottom-color: var(--secondary-color) !important;
}

/* ===========================================
   CODE BLOCKS
   =========================================== */

.reveal pre {
  margin-bottom: 0;
  width: 100%;
  box-sizing: border-box;
  box-shadow: none !important;
  background: none !important;
}

.reveal pre code {
  font-size: 14pt;
  line-height: 1.4;
  padding: 10px 20px;
  border-radius: var(--box-radius);
  background: rgba(20, 25, 45, 0.8);
  color: var(--text-color);
  max-height: 400px;
}

.reveal pre code .hljs-keyword,
.reveal pre code .hljs-built_in {
  color: #c792ea;
}

.reveal pre code .hljs-string {
  color: #c3e88d;
}

.reveal pre code .hljs-comment {
  color: #546e7a;
}

.reveal pre code .hljs-number {
  color: #f78c6c;
}

.reveal code {
  color: var(--text-color);
}

/* ===========================================
   MATH (KaTeX)
   =========================================== */

.katex {
  color: var(--text-color);
  font-size: 1.1em;
}

.katex-display {
  margin: 15px 0;
}

.katex-display > .katex {
  font-size: 1.3em;
}

/* ===========================================
   VIDEO CONTAINERS
   =========================================== */

.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-container video,
.video-container img {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--box-radius);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
}

/* ===========================================
   SIDE QUEST BADGE
   =========================================== */

.side-quest-badge {
  display: inline-block;
  background: rgba(245, 166, 35, 0.15);
  color: var(--secondary-color);
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12pt;
  font-weight: 500;
  margin-bottom: 10px;
}

/* ===========================================
   TERMINAL OUTPUT - ANSI COLOR PALETTE
   Replaces inline `style="color:#..."` on spans
   inside .terminal-pre. A rule on the span itself
   overrides the color inherited from .terminal-pre.
   =========================================== */

.terminal-output .terminal-body .t-red    { color: #e06c75; }
.terminal-output .terminal-body .t-orange { color: #d19a66; }
.terminal-output .terminal-body .t-yellow { color: #e5c07b; }
.terminal-output .terminal-body .t-green  { color: #98c379; }
.terminal-output .terminal-body .t-cyan   { color: #56b6c2; }
.terminal-output .terminal-body .t-blue   { color: #61afef; }
.terminal-output .terminal-body .t-gray   { color: #8b949e; }
.terminal-output .terminal-body .t-fg     { color: #e8eaf0; }
.terminal-output .terminal-body .t-fail   { color: #e74c3c; }

.terminal-caption {
  margin-top: 15px;
  text-align: center;
}

/* ===========================================
   TIMELINE (module 1) - per-node structure
   Positional left/width and per-era colors stay
   inline; this captures the repeated boilerplate.
   =========================================== */

.tl-node  { position: absolute; transform: translateX(-50%); text-align: center; }
/* .reveal prefix needed: `.reveal p` (0,1,1) sets color/font-size and would
   otherwise beat a bare .tl-* class. The original used inline styles. */
.reveal .tl-label { font-size: 10pt; color: var(--muted-color); white-space: nowrap; margin: 0; }
.reveal .tl-year  { font-size: 11pt; font-weight: 600; margin: 2px 0 0 0; }
.tl-stem  { width: 1px; opacity: 0.5; margin: 2px auto 0; }
.tl-dot   { width: 10px; height: 10px; border-radius: 50%; margin: 0 auto; }

.tl-node.below .tl-stem  { margin: 0 auto; }
.tl-node.below .tl-year  { margin: 0; }
.tl-node.below .tl-label { margin: 2px 0 0 0; }

/* ===========================================
   CANONICAL SLIDE TYPES
   Backs the :::divider / :::columns / :::note /
   :::quiz / :::step / :::interactive fences so
   slides.md carries no inline layout styles.
   (.section-divider, .figure-card, .terminal-output,
    .hint-box are defined above and reused.)
   =========================================== */

/* :::columns - grid; template/gap/valign supplied by the build */
.reveal .slide-columns {
  display: grid;
  align-items: start;
  margin: 10px 0;
}

/* :::note - callout box (canonical replacement for .highlight-box) */
.reveal .note {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
  margin: 20px 0;
}

.reveal .note p {
  font-size: 18pt;
  margin: 0;
}

.reveal .note p + p {
  margin-top: 0.6em;
}

/* :::note variant="hint" - lighter, boxless (also used inside :::step) */
.reveal .note.hint-box {
  background: none;
  border: none;
  padding: 0;
}

/* :::quiz - prompt scales up; its last line is the question */
.reveal .quiz-prompt p {
  font-size: 18pt;
  margin: 0 0 0.6em 0;
}

.reveal .quiz-prompt p:last-child {
  font-size: 24pt;
  color: var(--text-color);
  margin: 0.5em 0 0 0;
}

.reveal .quiz-answer {
  margin-top: 30px;
}

/* :::step - spacing between code, hint, and answer */
.reveal .hint-box {
  margin-top: 22px;
}

.reveal .hint-box + .note {
  margin-top: 8px;
  padding: 12px 18px;
}

/* :::interactive - widget fills the slide body like a video */
.reveal .interactive-host {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

/* ===========================================
   FOLDING WIDGET  (:::interactive widget="folding")
   Linked input-space / hidden-space views with
   per-neuron weight & bias sliders.
   =========================================== */

.fold-widget {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  height: 100%;
}

.fold-views {
  display: grid;
  grid-template-columns: 1fr 1fr 0.85fr;
  gap: 18px;
  flex: 1;
  min-height: 0;
}

.fold-view {
  display: flex;
  flex-direction: column;
  margin: 0;
  min-height: 0;
}

.reveal .fold-view figcaption {
  font-size: 14pt;
  color: var(--primary-color);
  font-weight: 600;
  text-align: center;
  margin-bottom: 6px;
}

.fold-canvas {
  flex: 1;
  min-height: 0;
  width: 100%;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.fold-controls {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.fold-modes {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.fold-modes button {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: rgba(74, 158, 255, 0.10);
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
}

.fold-modes button.active {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: #0a0e1a;
  font-weight: 600;
}

.fold-modes button.fold-reset {
  background: rgba(245, 166, 35, 0.12);
  border-color: rgba(245, 166, 35, 0.40);
  color: var(--secondary-color);
}

.fold-sliders {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px 24px;
}

.fold-slider {
  display: grid;
  grid-template-columns: 70px 1fr 52px;
  align-items: center;
  gap: 10px;
}

.reveal .fold-slider label {
  font-size: 12pt;
  margin: 0;
  font-family: var(--body-font);
  font-weight: 600;
}

.fold-slider input[type="range"] {
  width: 100%;
  accent-color: var(--primary-color);
}

.reveal .fold-slider .fold-val {
  font-size: 12pt;
  color: var(--text-color);
  font-family: monospace;
  text-align: right;
  margin: 0;
}

.reveal .fold-readout {
  font-size: 13pt;
  color: var(--muted-color);
  text-align: center;
  margin: 0;
}

.reveal .fold-readout strong {
  color: var(--secondary-color);
}

/* ===========================================
   MLP BOUNDARY WIDGET  (:::interactive widget="mlpBoundary")
   =========================================== */

.mlp-widget {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  height: 100%;
}

.mlp-canvas-wrap {
  flex: 1;
  min-height: 0;
}

.mlp-canvas,
.land-canvas {
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.mlp-controls,
.land-controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(240px, 1fr));
  gap: 10px 24px;
  align-items: center;
}

.mlp-slider {
  display: grid;
  grid-template-columns: 70px 1fr 58px;
  align-items: center;
  gap: 10px;
}

.reveal .mlp-slider label,

<!-- .slide: id="title" class="section-divider" data-state="is-section-divider" -->

# LLMs 0 to 100

Module 7: Reinforcement Learning Post-Training

From imitation to feedback

---

<!-- .slide: id="review-sft" -->

## Review: Where Module 6 Left Us

SFT turned the base model into an **instruct model**: it treats a prompt as a request.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**What SFT gave us**

- Imitates good demonstrations
- Same machinery as pretraining: cross-entropy on fixed target tokens

</div>

<div>

**Three limits SFT cannot fix**

- Can only **imitate** demonstrations, never exceed them
- No way to use **negative** signal ("this answer is worse")
- **Exposure bias**: trained on ground-truth prefixes, generates from its own outputs

</div>

</div>

This module fixes all three by changing the **training signal**, not the machinery. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="review-machinery" -->

## Review: The Machinery Does Not Change

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Same as Modules 2, 5, 6**

- Forward pass through the transformer (Module 4)
- **Backpropagation** and **AdamW** (Module 2)
- Gradient clipping, batching, learning-rate control

</div>

<div>

**New in RL**

- No fixed correct token at each position
- Signal: a **scalar reward** on the model's **own samples**
- Objective: **expected reward**, not cross-entropy to a label

</div>

</div>

---

<!-- .slide: id="divider-what-is-rl" class="section-divider" data-state="is-section-divider" -->

# What Reinforcement Learning Is, Really


---

<!-- .slide: id="rl-vocabulary" -->

## The Classical RL Loop

An **agent** interacts with an **environment** in a loop.

<div class="rl-loop-figure">
<svg viewBox="0 0 880 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent-environment interaction loop">
<defs>
<marker id="rl-ah" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8892a4"></path></marker>
</defs>
<rect x="70" y="64" width="250" height="92" rx="14" fill="#4a9eff" fill-opacity="0.12" stroke="#4a9eff" stroke-width="2"></rect>
<text x="195" y="103" text-anchor="middle" fill="#e8eaf0" font-size="26" font-weight="700">Agent</text>
<text x="195" y="133" text-anchor="middle" fill="#8892a4" font-size="17">policy &#960;(a | s)</text>
<rect x="560" y="64" width="250" height="92" rx="14" fill="#f5a623" fill-opacity="0.12" stroke="#f5a623" stroke-width="2"></rect>
<text x="685" y="103" text-anchor="middle" fill="#e8eaf0" font-size="26" font-weight="700">Environment</text>
<text x="685" y="133" text-anchor="middle" fill="#8892a4" font-size="17">world / verifier</text>
<path d="M320,96 L552,96" fill="none" stroke="#8892a4" stroke-width="2.5" marker-end="url(#rl-ah)"></path>
<text x="436" y="82" text-anchor="middle" fill="#4a9eff" font-size="19" font-weight="600">action a</text>
<path d="M560,128 L328,128" fill="none" stroke="#8892a4" stroke-width="2.5" marker-end="url(#rl-ah)"></path>
<text x="436" y="152" text-anchor="middle" fill="#f5a623" font-size="19" font-weight="600">reward r &#43; next state s</text>
</svg>
</div>

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- **State** $s$: what the agent observes
- **Action** $a$: what the agent does
- **Reward** $r$: a scalar score for the outcome
- **Policy** $\pi(a \mid s)$: the rule mapping states to actions

</div>

<div>

- **Trajectory** (episode): a full sequence $s_0, a_0, s_1, a_1, \dots$
- **Return**: total reward over an episode
- Goal: **maximize expected return**

</div>

</div>

No labeled "correct action." The agent learns only from the **reward** its own choices earn. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="rl-as-llm" -->

## Mapping RL Onto a Language Model

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

**Classical RL**

- Policy
- State
- Action
- Episode
- Reward

</div>

<div>

**Language model**

- The **model** itself, $\pi_\theta$
- The **prompt + tokens so far**
- Emitting the **next token**
- One full **completion**
- A scalar **score on the finished output**

</div>

</div>

The policy *is* the model. Training the policy *is* updating the weights. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="credit-assignment" -->

## The Defining Difference: Credit Assignment

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Supervised finetuning (Module 6)**

- Every position has a **known correct token**
- Minimize cross-entropy against it
- Dense, local signal

</div>

<div>

**Reinforcement learning**

- **No correct token**
- One scalar reward on the **whole** output
- One number must become a per-token gradient

</div>

</div>

Turning one end-of-sequence reward into an update for every token is the **credit-assignment problem**: the central challenge of this module. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="bandit-vs-mdp" -->

## The Resolution: Collapse to a Bandit

Classical RL is a multi-step **Markov decision process (MDP)**: every action lands in a new state and earns its own reward. LLM post-training **collapses this to a one-step contextual bandit**:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- The whole completion is a **single action**
- **One terminal reward** at the end
- **No** intermediate rewards; discount factor effectively **1**

</div>

<div>

- This is why GRPO assigns **one advantage** to the sequence and broadcasts it to **every token**
- Multi-step RL returns later: **process rewards** and **agentic RL**

</div>

</div>

The credit-assignment problem is sidestepped: no per-token credit at all. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

![Richard Sutton and Andrew Barto](module_07_rl/images/sutton_barto.jpg)

<div class="figure-info">

## Richard Sutton and Andrew Barto <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Reinforcement Learning: An Introduction (1998, 2018); 2024 Turing Award

- Wrote the foundational textbook that defined modern RL vocabulary
- Sutton's **"The Bitter Lesson"**: general methods that scale with **search and learning** beat hand-engineered knowledge
- RL post-training is that lesson applied to language models

</div>

</div>

</div>

<!-- .slide: id="policy-gradient" -->

## Policy Gradient: REINFORCE

The objective: the policy's **expected reward** over its own samples.

$$J(\theta) = \mathbb{E}_{y \sim \textcolor{#4a9eff}{\pi_\theta(\cdot \mid x)}}\big[ \textcolor{#f5a623}{R(x, y)} \big]$$

- One sampled completion earns an **actual reward** $R(x,y)$
- Training changes a **distribution**, so we optimize the **average** reward over its possible samples

With a baseline $b$, the REINFORCE estimator:

$$\nabla_\theta J(\theta) = \mathbb{E}_{y \sim \pi_\theta}\big[ \textcolor{#50c878}{(R(x,y) - b)} \nabla_\theta \log \textcolor{#4a9eff}{\pi_\theta(y \mid x)} \big]$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- $\textcolor{#50c878}{R(x,y) - b}$ is the **advantage**: better or worse than expected
- $\nabla_\theta \log \textcolor{#4a9eff}{\pi_\theta(y)}$: the direction that makes $y$ more likely
- Positive advantage pushes probability **up**; negative pushes it **down**

</div>

<div>

- The baseline reduces variance **without adding bias**
- PPO learns $b$ with a value network; GRPO uses the group mean
- Same gradient machinery as Module 2g, now doing ascent on reward

</div>

</div>

<!-- .slide: id="two-axes" -->

## Two Axes, Often Conflated

Every method in this module sits on **two orthogonal axes**:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Online vs offline** &mdash; *where does the data come from?*

- **Online**: generate fresh data during training (sample, score, update, repeat)
- **Offline**: learn from a **fixed dataset** collected ahead of time, like SFT

</div>

<div>

**On-policy vs off-policy** &mdash; *who produced the data?*

- **On-policy**: the **current** policy (or one negligibly different)
- **Off-policy**: a **different or older** policy; the update must correct for the mismatch

</div>

</div>

---

<!-- .slide: id="two-axes-grid" -->

## The Two Axes as a Grid

<div class="axes-grid">
<table>
<thead>
<tr><th></th><th>On-policy</th><th>Off-policy</th></tr>
</thead>
<tbody>
<tr>
<th>Online</th>
<td><strong>REINFORCE, PPO, GRPO</strong><br/>sample from the live policy, score, update</td>
<td>PPO with stale batches<br/>(importance-ratio clipping)</td>
</tr>
<tr>
<th>Offline</th>
<td>rare in practice</td>
<td><strong>DPO</strong> and SFT<br/>a fixed, pre-collected dataset</td>
</tr>
</tbody>
</table>
</div>

The common cases **pair up**. PPO's importance-ratio clipping exists to reuse each batch for a few steps **without drifting off-policy**. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

---

<!-- .slide: id="why-axes-matter" -->

## Why The Axes Matter

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Online + on-policy**

- Explores **beyond** any fixed dataset
- Can **exceed the demonstrations** and discover reasoning strategies
- Cost: the data distribution **moves** as the model changes; less stable, harder to debug

</div>

<div>

**Offline + off-policy**

- **Cheaper and more stable**: reuses the SFT machinery exactly
- Cost: can only **rank the responses already in its data**
- No exploration, no exceeding the dataset

</div>

</div>

---

<!-- .slide: id="exploration-exploitation" -->

## Exploration vs Exploitation

The oldest tension in RL: try **varied** outputs to discover high-reward ones (explore), or lean on **what already works** (exploit).

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- In LLM RL, exploration happens through **sampling**
- The decoding knobs from Module 4f (**temperature, top-k, top-p**) are now **training hyperparameters**

</div>

<div>

- Too little exploration: the policy never finds better answers
- Too much: the gradient is pure noise
- The sampling distribution **is** the search strategy

</div>

</div>

---

<!-- .slide: id="entropy-collapse" -->

Training sharpens the policy toward a few high-reward outputs, so the distribution's **entropy falls**.

<!-- .slide: id="divider-why-rl" class="section-divider" data-state="is-section-divider" -->

# Why RL for LLMs


---

<!-- .slide: id="resolve-three-limits" -->

## Resolving the Three Limits of SFT

RL optimizes an **outcome** instead of copying a target:

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 22px;">

<div>

**Exceed demonstrations**

A reward can select answers **better** than anything in the data.

</div>

<div>

**Use negative signal**

Reward **ranks** better against worse, pushing probability **away** from bad answers.

</div>

<div>

**Close exposure bias**

The model trains on its **own generations**: the same distribution it faces at inference.

</div>

</div>

---

<!-- .slide: id="eval-easier-than-gen" -->

## Evaluation Is Easier Than Generation

We often **cannot write the ideal target token**, but we **can judge** an output after the fact.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- Writing a perfect essay is hard; **recognizing** one is easier
- Producing a correct proof is hard; **checking** it is easier

</div>

<div>

- A **reward** is easier to specify than a full **demonstration**
- This is why RL can reach behaviors SFT cannot

</div>

</div>

---

<!-- .slide: id="reward-spectrum" -->

## Where Does the Reward Come From?

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 30px;">

<div>

- **Human preference comparisons**: RLHF
- **A learned reward model** imitating those preferences
- **A strong LLM scoring outputs directly**: LLM-as-judge, the dominant reward for tasks no program can check

</div>

<div>

- **An AI judge guided by written principles**: RLAIF
- **A programmatic verifier** for checkable answers: RLVR

</div>

</div>

The harder the answer is to check by program, the more the reward leans on **judgment**, and the more it can be gamed. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="rejection-sampling" -->

## The Gentlest RL: Rejection Sampling

Also called **Best-of-N**:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The loop**

1. Sample $N$ completions
2. Score them with the reward
3. Keep only the **best** (or those above a threshold)
4. Finetune on those with ordinary **cross-entropy**

</div>

<div>

**Why teach it first**

- No policy gradient, no critic
- **Offline** and **off-policy**
- The core RL move, made concrete: **reward selects among the model's own samples**
- Inference-time Best-of-N needs a **scorer**: verifier, reward model, LLM judge, or task metric

</div>

</div>

Limitation: rejected samples provide no gradient. Policy gradient can push **down** on losers as well as up on winners. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="reward-cheaper-supervision" -->

## Reward Is Sparser but Cheaper Supervision

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Demonstrations**

- **Dense**: a target token at every position
- A human writes each ideal response, so the data is expensive and finite

</div>

<div>

**Reward**

- **Sparse**: one scalar for a whole sequence, which is why credit assignment is hard
- Pairwise comparisons are **cheaper** to collect, and one reward grades **many** sampled outputs

</div>

</div>

RL trades supervision density for supervision cost. Sampling is the **engine**: decoding is now part of the **training loop**, and exploration depends on sampling diversity. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

<!-- .slide: id="reward-model" -->

## Stage 2: The Reward Model

Humans rank two responses to the same prompt. A model learns to predict the preferred one.

The **Bradley-Terry** loss turns pairwise preferences into a scalar reward:

$$\mathcal L_{\text{RM}} = -\mathbb E_{(x, y_w, y_l)}\big[\log \sigma\big(\textcolor{#50c878}{r_\phi}(x, \textcolor{#4a9eff}{y_w}) - \textcolor{#50c878}{r_\phi}(x, \textcolor{#f5a623}{y_l})\big)\big]$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- $\textcolor{#4a9eff}{y_w}$: the preferred (winning) response
- $\textcolor{#f5a623}{y_l}$: the rejected (losing) response

</div>

<div>

- $\textcolor{#50c878}{r_\phi}$: the learned reward model
- The loss rises when the winner scores below the loser

</div>

</div>

The reward model is a **learned, imperfect proxy** for human judgment. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="rlhf-objective" -->

## Stage 3: Optimize the Policy

PPO maximizes the learned reward. A **KL penalty** to the frozen SFT reference blocks drift into degenerate text that games it.

$$\max_{\textcolor{#4a9eff}{\pi_\theta}} \textcolor{#f5a623}{\mathbb E_{y \sim \pi_\theta}\big[ r_\phi(x, y) \big]} - \textcolor{#50c878}{\beta \mathrm{KL}\big(\pi_\theta(\cdot \mid x) \| \pi_{\text{ref}}(\cdot \mid x)\big)}$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- First term: $\textcolor{#f5a623}{\mathbb E[r_\phi]}$ means **maximize reward**
- Second term: $\textcolor{#50c878}{\mathrm{KL}}$ means **stay close** to the reference policy

</div>

<div>

- $\textcolor{#50c878}{\beta}$: how hard to pull back toward the reference
- Without the KL leash, the policy finds gibberish the proxy loves

</div>

</div>

---

<!-- .slide: id="ppo-conceptually" -->

## PPO, Conceptually

PPO is the algorithm behind the original RLHF recipe.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- **Actor-critic**: a separate **value network** (critic) estimates expected reward as the baseline
- **Clipped surrogate objective**: limits how far the policy moves per update (the off-policy leash again)

</div>

<div>

- **Generalized advantage estimation (GAE)**: a smoothed advantage estimate
- The takeaway is the **shape** of the objective, not the clipping algebra

</div>

</div>

This recipe is how a **1.3B** InstructGPT model beat **175B** GPT-3 in human preference (Module 6). <!-- .element: class="text-lg" style="margin-top: 12px;" -->

<!-- .slide: id="divider-dpo" class="section-divider" data-state="is-section-divider" -->

# Direct Preference Optimization

Skipping the RL loop


---

<!-- .slide: id="dpo-insight" -->

## The DPO Insight

Rafailov et al. (2023): the KL-regularized RL objective from RLHF has a **closed-form optimal policy**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- Rearranged, the **reward becomes implicit** in the policy's own log-probabilities relative to the reference

</div>

<div>

- So: no separate **reward model**, no **RL loop**

</div>

</div>

The reward model and the policy were two views of the same thing. DPO optimizes the policy **directly** from preferences. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="dpo-loss" -->

## The DPO Loss

One **supervised classification loss** on chosen-vs-rejected pairs, against a frozen reference:

$$\mathcal L_{\text{DPO}} = -\mathbb E_{(x, y_w, y_l)}\Big[\log \sigma\Big(\textcolor{#4a9eff}{\beta \log \tfrac{\pi_\theta(y_w \mid x)}{\pi_{\text{ref}}(y_w \mid x)}} - \textcolor{#f5a623}{\beta \log \tfrac{\pi_\theta(y_l \mid x)}{\pi_{\text{ref}}(y_l \mid x)}}\Big)\Big]$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- Raise the policy's probability of the **winner** $\textcolor{#4a9eff}{y_w}$ relative to the reference
- Lower it for the **loser** $\textcolor{#f5a623}{y_l}$

</div>

<div>

- $\beta$ controls how far the policy may move from the reference
- No sampling, no reward model, no PPO &mdash; just **SFT-style** gradient descent

</div>

</div>

## Why DPO Mattered

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

**What it removed**

# Value-Free RL and GRPO

The algorithm you will build


---

<!-- .slide: id="ppo-cost" -->

## The Cost of PPO

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- The **critic** (value network) is roughly the **size of the policy**
- Doubles memory; a second model to train and tune

</div>

<div>

- A bad value estimate destabilizes the whole run
- Can we get the baseline **without** a learned value network?

</div>

</div>

---

<!-- .slide: id="grpo-insight" -->

## The GRPO Insight

Shao et al. (DeepSeekMath, 2024): **drop the critic entirely.** Use the **group itself** as the baseline.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The loop**

1. For each prompt, sample a **group** of $G$ completions
2. Score them all
3. The group's $\textcolor{#4a9eff}{\operatorname{mean}}$ reward is the baseline

</div>

<div>

**The advantage**

Each completion's advantage is its reward minus the group $\textcolor{#4a9eff}{\operatorname{mean}}$, normalized by the group $\textcolor{#50c878}{\operatorname{std}}$.

</div>

</div>

$$A_i = \frac{\textcolor{#f5a623}{R_i} - \textcolor{#4a9eff}{\operatorname{mean}(R_1, \dots, R_G)}}{\textcolor{#50c878}{\operatorname{std}(R_1, \dots, R_G)}}$$

---

<!-- .slide: id="grpo-baseline" -->

## The Baseline Comes For Free

The same variance-reduction idea as the learned baseline, at **no extra cost**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**PPO**

Baseline = a **learned value network**, as big as the policy, trained alongside it.

</div>

<div>

**GRPO**

Baseline = the **group mean reward**, computed from samples you already drew.

</div>

</div>

The update keeps PPO's ratio clipping and KL penalty, with **no value network**. A completion is rewarded only for beating its **peers** on the same prompt. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

## DPO vs PPO vs GRPO

<!-- .slide: id="divider-rlvr" class="section-divider" data-state="is-section-divider" -->

# RLVR and the Reasoning Revolution


---

<!-- .slide: id="rlvr-definition" -->

## Reinforcement Learning from Verifiable Rewards

When an answer is **checkable**, the reward is a **deterministic program**, not a learned model.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- Math problems have **known answers**
- Code can be **run against tests**
- Formatted outputs can be **parsed**

</div>

<div>

- No human preferences, no reward model
- No learned proxy to hack: the verifier is ground truth

</div>

</div>

The exercise uses exactly this: a Python function that reverses the string and compares. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="rlvr-breakthrough" -->

## The Breakthrough

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**OpenAI o1** (September 2024)

- RL on chain-of-thought
- More **inference-time compute**
- Sharply better reasoning

</div>

<div>

**DeepSeek-R1** (January 2025)

- Reproduced it **openly**
- **GRPO** + **verifiable rewards**: the algorithm you build in the exercise

</div>

</div>

The scaling story shifts: from **pretraining** compute (Module 5g) to **RL and inference-time** compute. The model thinks longer before answering. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="reward-is-curriculum" -->

## The Reward Is the Curriculum

With a verifiable signal, the model **self-improves by exploration**, graded only by whether the final answer checks out.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- No one demonstrates the reasoning
- The reward selects whatever **chain of thought happens to work**

</div>

<div>

- The **"exceed the demonstrations"** promise, realized
- The exercise shows it in miniature: reward climbs as the policy discovers reliable reversals

</div>

</div>

---

<!-- .slide: id="why-cot-grows" -->

## Why Reward Alone Grows a Chain of Thought

Nothing in the reward says "reason step by step". It grades only the **final answer**. Selection grows the chain anyway:

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Selection**

- Some sampled completions work through intermediate steps
- Those are **correct more often**, so they earn positive advantage more often

</div>

<div>

**Broadcast**

- The bandit collapse assigns that advantage to **every token**
- Reasoning tokens get pushed up with the answer they led to, though the verifier never read them

</div>

</div>

Longer chains also buy **compute per problem**: each token is another forward pass, another chance to catch a mistake. So length itself is selected for. In DeepSeek-R1-Zero, response length climbs through training with **no length reward anywhere**. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="r1-zero" -->

## R1-Zero

DeepSeek-R1-Zero applied RL **directly to a base model, no SFT at all**:

- Emergent long chains of thought and self-correction (the **"aha moment"**)
- A capability nobody demonstrated, surfaced by reward alone

Is the model **discovering** new reasoning, or **surfacing latent ability** the reward selects for? The next slides take this apart. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="passk-definition" -->

## A Sharper Lens: pass@k

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**pass@1**

- **One** attempt: is it correct?
- What improves most visibly after RL

</div>

<div>

**pass@k**

- **k** samples: is **any** correct?
- Measures the **coverage** of the model's distribution, not just its top guess

</div>

</div>

High pass@1, low pass@k: confident and narrow. Low pass@1, high pass@k: uncertain but broad. Optimizing one can shrink the other. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="yue-counterpoint" -->

## The Critical Counterpoint

Yue et al. (2025), *"Does RL Really Incentivize Reasoning Capacity in LLMs Beyond the Base Model?"*

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The finding**

- RLVR-trained models beat their base model at **small k**
- The base model **catches up and often overtakes at large k**

</div>

<div>

**The interpretation**

- RLVR **sharpens the sampling distribution** toward paths the base model could **already** produce
- The reasoning boundary can even **narrow** as training proceeds

</div>

</div>

**RL trades coverage for sampling efficiency.** Optimizing pass@1 shrinks the diversity pass@k rewards: **entropy collapse**. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

  <div class="video-container">
    <video class="manim-stepper" data-manim-scene="passk" preload="auto"></video>

<!-- .slide: id="side-quest-r1-debate" -->

## Side Quest: R1-Zero and the Skeptic

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The R1-Zero claim**

RL on a base model produced **emergent** self-correction and lengthening chains of thought: new ability.

</div>

<div>

**The Yue et al. rebuttal**

RLVR **amplifies** the base model rather than transcending it. The "new" reasoning was already in the base distribution.

</div>

</div>

pass@1 and pass@k point in opposite directions because RL **reweights** probability mass; it does not add paths the base model never had. Compare Module 5's "emergence: real or mirage?" <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="agentic-rl" -->

## When the Bandit Becomes an MDP Again

**Recall:** an **MDP** is multi-step RL (each step has state, action, reward); a **bandit** is the one-step case. Single-turn LLM RL collapsed into a bandit. **Agentic RL** brings the MDP back.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**The loop returns**

- The model takes an action: a **tool call**, a search, a code execution
- It observes a real **intermediate state** (the tool's output) and acts again

</div>

<div>

**Credit assignment returns**

- Credit spans **many steps**
- Genuine **intermediate rewards**
- The full MDP, not a bandit

</div>

</div>

Yue et al. point here as the route **past the base-model ceiling** single-turn RLVR hits. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="process-reward" -->

## Process vs Outcome Rewards

Reward only the **final answer** (outcome), or every **reasoning step** (process)?

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Outcome reward**

- One scalar at the end
- Cheap
- Credit assignment is hard: which step mattered?

</div>

<div>

**Process reward**

- A **process reward model** grades the chain step by step
- Dense signal, easier credit assignment
- Far more expensive to label

</div>

</div>

The credit-assignment trade-off again: denser reward, easier learning, higher labeling cost. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="divider-dark-side" class="section-divider" data-state="is-section-divider" -->

# The Dark Side

Reward hacking, over-optimization, and alignment


---

<!-- .slide: id="goodhart" -->

## Goodhart's Law

> When a measure becomes a target, it ceases to be a good measure.

Every reward in this module, **even a verifier**, is a **proxy** for what we actually want.

- Optimize the proxy hard enough and the policy **games it** instead of achieving the real goal
- The better the optimizer, the more dangerous a **misspecified** reward

---

<!-- .slide: id="over-optimization" -->

## Reward Over-Optimization, Quantified

As the policy's **KL from the reference grows**: **proxy** reward keeps rising, **true** (held-out human) reward eventually **falls**.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- Gao et al. (2023) fit **scaling laws** to this gap
- Proxy and truth agree at first, then **diverge**

</div>

<div>

- The **KL penalty** holds the policy near the reference
- Too little leash: proxy-pleasing nonsense

</div>

</div>

The exercise reproduces this: set $\beta = 0$. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="reward-hacking-modes" -->

## Concrete Reward-Hacking Failure Modes

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- **Length / verbosity bias**: longer answers score higher, so the model pads
- **Sycophancy**: telling users what they want to hear rather than what is true

</div>

<div>

- **Format exploitation**: gaming the rubric's surface features
- **Verifier loopholes**: satisfying the checker without solving the task

</div>

</div>

Even a verifiable reward can be hacked: an output the **checker** accepts may not be what you **meant**. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="rlaif" -->

## RLAIF and Constitutional AI

Bai et al. (2022): replace or augment human feedback with an **AI judge** guided by written principles (a **constitution**).

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- Human labeling does **not scale** to every comparison
- **AI feedback does**: a route toward **scalable oversight**

</div>

<div>

- The model critiques and revises its own outputs against the principles
- A learned judge for the open-ended tasks no verifier can check

</div>

</div>

---

<!-- .slide: id="figure-bai" -->

<div class="figure-card">

![Anthropic logo](module_07_rl/images/anthropic.svg)

<div class="figure-info">

## Yuntao Bai and the Anthropic team <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### Constitutional AI: Harmlessness from AI Feedback (2022)

- Introduced **RLAIF**: AI feedback guided by written principles
- Showed an assistant could be made harmless with far less human labeling
- A concrete step toward **scalable oversight** of models that may exceed us

</div>

</div>

</div>

---

<!-- .slide: id="alignment-framing" -->

## RL Is Where Alignment Becomes Explicit

RL makes **helpful, honest, and harmless** (Module 6's HHH target) an explicit **optimization objective**.

- The power: we can directly optimize behavior we want
- The danger: a **misspecified** objective gets **actively optimized** against us

Reward specification **is** value specification. What you reward is what you get, and stating human values as a scalar is hard. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="alignment-tax" -->

## The Alignment Tax

RLHF can **measurably degrade raw capability** on some benchmarks.

- The InstructGPT paper named this tax; it partly mitigated it by **mixing pretraining gradients** back into RL
- Compare pass@k: RL can **narrow the reasoning boundary** even as it improves single-shot behavior

The question is never "tax or no tax" but "is the trade worth it?" Usually it is. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

---

<!-- .slide: id="honest-limits" -->

## Honest Limits

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- Reward models are **imperfect proxies** for messy, contested human values
- Verifiable rewards exist **only for checkable domains**

</div>

<div>

- RL is **less stable**, more **compute-hungry**, and **harder to debug** than SFT
- None of this is solved; it is the active frontier

</div>

</div>

<div class="slide-columns" style="grid-template-columns: repeat(3, 1fr); gap: 22px;">

<div>

**Pretrain** (Module 5)

Next-token prediction over broad text. Builds the **engine**: knowledge and fluency.

</div>

Prompt&ndash;response pairs. Teaches the model to **follow intent**.

Gradients, backpropagation, AdamW. From the perceptron in Module 2 to reasoning models here, the optimizer is the same.

</div>

<div>

**What changed each module**

The **data** and the **target**.

- Module 5: raw text, next token
- Module 6: pairs, masked response
- Module 7: a **scalar reward** on the model's own samples

## From Policy Gradient to `pg_loss`

The lecture used gradient **ascent** on expected reward. PyTorch optimizers do **descent**, so the exercise negates:

$$\mathcal L_{\text{PG}} = -\textcolor{#50c878}{A_i} \sum_t \textcolor{#4a9eff}{m_t}\log \pi_\theta(y_t \mid x, y_{<t})$$

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

- `token_log_probs` are the per-token $\log \pi_\theta$ values from Step 6
- `pg_loss()` returns one scalar for one sampled completion

# Quiz


---

<!-- .slide: id="quiz-exceed-sft" -->

## Why Can RL Beat SFT?

<div class="quiz-prompt">

Why can RL improve on a task that SFT learned only imperfectly, when **both start from the same model**?

</div>

<div class="fragment note quiz-answer">

**Short answer: RL optimizes an outcome and can push probability *down* on bad answers; SFT can only copy fixed target tokens.**

- SFT copies fixed target tokens; it cannot express that one answer beats another
- RL samples the model's **own** completions, scores them, and pushes probability **up** on winners and **down** on losers
- Negative signal plus search beyond the demonstrations reinforces answers SFT never reliably produced
- No new labeled data needed, just a reward

</div>

---

<!-- .slide: id="quiz-grpo-baseline" -->

## The GRPO Baseline

<div class="quiz-prompt">

You sample a group of four completions for one prompt and the verifier returns rewards $[1, 1, 0, 0]$. GRPO sets the baseline to the **group mean**. What advantage does each completion receive, and why does subtracting this baseline **reduce variance without biasing** the gradient?

</div>

<div class="fragment note quiz-answer">

**Short answer: the advantages are $[+0.5, +0.5, -0.5, -0.5]$; a baseline independent of the sampled completion is unbiased, and recentering shrinks the update magnitude.**

- Group mean $= 0.5$, so $A_i = R_i - 0.5 = [+0.5, +0.5, -0.5, -0.5]$, then normalized by the group std
- Any baseline independent of the sampled completion leaves the gradient's **expectation unchanged**, because $\mathbb{E}[\nabla_\theta \log \pi_\theta] = 0$
- Recentering weights better-than-average completions positive and worse-than-average negative, shrinking update magnitude and cutting variance

</div>

---

<!-- .slide: id="quiz-why-group" -->

## Why a Group?

<div class="quiz-prompt">

Why sample a **group** of completions per prompt instead of just one?

</div>

<div class="fragment note quiz-answer">

**Short answer: one sample has no reference point; a group supplies the baseline (its mean) and the scale (its spread), and guarantees a within-group learning signal.**

- One sample gives a reward but no reference: is that reward good or bad for this prompt?
- No baseline to subtract means a high-variance gradient
- A group lets completions **compete**: the mean is the baseline, the spread sets the scale
- When some succeed and others fail, the within-group variance is exactly the signal that says which behaviors to raise and which to lower

</div>

---

<!-- .slide: id="quiz-kl-leash" -->

## The KL Leash

<div class="quiz-prompt">

What is the KL-to-reference penalty protecting against, and what happens to the completions if you remove it?

</div>

<div class="fragment note quiz-answer">

**Short answer: it protects against reward over-optimization; remove it and the policy drifts into high-reward gibberish that games the proxy.**

- The reward is only a proxy; a strong optimizer drifts far from the reference to find outputs that score highly but are not what we want
- The KL term penalizes moving away from the frozen reference, keeping the policy on fluent, sensible text
- Set $\beta = 0$ and the policy drifts into **degenerate, high-reward gibberish** that games the verifier or reward model
- The exercise extra credit shows exactly this

</div>

---

<!-- .slide: id="quiz-verifier-hack" -->

## Hacking a Verifier

<div class="quiz-prompt">

Why is a **verifiable** reward harder to hack than a learned reward model, and what can **still** be hacked?

</div>

<div class="fragment note quiz-answer">

**Short answer: a verifier is deterministic ground truth with no learned proxy to fool, but the gap between what the checker accepts and what you meant can still be exploited.**

- A learned reward model is a neural network with blind spots; hard optimization finds inputs that light up the proxy without being good
- A verifier is **deterministic ground truth** for a checkable answer: no learned proxy to fool
- Still hackable: the **gap between the check and the intent** (passing visible tests without solving the problem, exploiting a parser)
- And verifiable rewards only exist for domains you can actually check

</div>

---

<!-- .slide: id="quiz-no-critic" -->

## No Critic

<div class="quiz-prompt">

How does GRPO avoid the separate **value network** that PPO requires?

</div>

<div class="fragment note quiz-answer">

**Short answer: it replaces PPO's learned value network with an empirical baseline &mdash; the mean reward of a sampled group.**

- PPO's critic estimates the baseline (expected reward from a state) for computing advantages; it is roughly policy-sized and trained alongside
- GRPO replaces the learned estimate with an **empirical** one: the mean (and std) of a sampled group for the same prompt
- The baseline comes from samples you already drew: no value network to build, train, or tune
- That cuts memory and a major source of instability

</div>

---

<!-- .slide: id="quiz-instability" -->

## Why RL Is Harder Than SFT

<div class="quiz-prompt">

Why is RL training less stable and harder to debug than the supervised finetuning of Module 6?

</div>

<div class="fragment note quiz-answer">

**Short answer: RL is online and on-policy, so the model generates its own training data and the data distribution moves as the weights change &mdash; there is no fixed loss curve to watch.**

- SFT: fixed data, stable cross-entropy against known labels
- RL is **online and on-policy**: the model generates its own training data, so the **distribution moves** as the weights change
- The reward is sparse and noisy; the gradient is high-variance; temperature, group size, KL weight, and learning rate all interact
- A bad setting triggers entropy collapse or reward hacking that surfaces only after many steps; you debug a moving target

</div>

---

<!-- .slide: id="quiz-passk" -->

## pass@1 Rises, pass@k Does Not

<div class="quiz-prompt">

A model's pass@1 rises after GRPO but its pass@k at large k does **not**. What does this tell you about whether RL created new ability or reweighted existing ability, and how does it connect to **entropy collapse**?

</div>

<div class="fragment note quiz-answer">

**Short answer: RL reweighted existing ability rather than creating new ability; entropy collapse raises pass@1 while shrinking the diversity that large-k pass@k depends on.**

- Flat pass@k at large k means the set of problems solvable **with enough tries** has not grown
- RL **reweighted** probability toward paths the base model could already sample; one sample now lands on them more often
- The mechanism is entropy collapse: concentrating mass on a few high-reward outputs raises pass@1 but **shrinks the diversity** large-k pass@k depends on
- The Yue et al. (2025) finding: RL trades coverage for sampling efficiency

</div>

---

<!-- .slide: id="quiz-rejection-vs-grpo" -->

## What Rejection Sampling Throws Away

<div class="quiz-prompt">

Rejection-sampling finetuning and GRPO both use reward to improve the model. What information does GRPO use that rejection sampling **throws away**?

</div>

<div class="fragment note quiz-answer">

**Short answer: GRPO uses the negative signal &mdash; pushing probability *down* on worse-than-average completions &mdash; which rejection sampling throws away along with all the losers.**

- Rejection sampling keeps only the **winners** and finetunes on them with cross-entropy; everything about the rejected samples is discarded
- GRPO uses the **full reward vector**: each completion's advantage relative to the group
- It pushes probability **up on better-than-average** completions **and down on worse-than-average** ones
- That **negative signal** is what rejection sampling cannot express: it never trains on the losers at all

</div>

---

<!-- .slide: id="quiz-bandit-mdp" -->

## Bandit vs MDP

<div class="quiz-prompt">

Why is single-turn LLM RL usually framed as a one-step **bandit** rather than a multi-step **MDP**, and what changes when the model can call **tools** mid-generation?

</div>

<div class="fragment note quiz-answer">

**Short answer: single-turn generation is one action earning one terminal reward (a bandit); tool calls add real intermediate states and rewards, making it a multi-step MDP.**

- Single-turn generation: **one action**, **one terminal reward**, no intermediate states from the environment (the model just samples its own tokens)
- That is a contextual bandit, which is why GRPO assigns one advantage to the whole sequence
- A **tool call** produces a genuine **intermediate state** (the tool's output) the model must react to, plus possible **intermediate rewards**
- The problem becomes a real multi-step **MDP**: harder credit assignment, and the agentic frontier beyond single-turn RLVR

</div>

      var pw = W - padL - padR, ph = H - padT - padB;
      var mid = padT + ph / 2;
      var step = pw / G, bw = Math.min(56, step - 16);
      var scale = (ph / 2) / 2.0;   // advantages of +/-2 fill the half-height

      ctx.textAlign = 'center';
      ctx.font = '12px Inter, sans-serif';
      ctx.fillStyle = COL.muted;
      ctx.fillText('advantage per completion, measured from the group mean (click a bar to flip it)', W / 2, 16);

      ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, mid); ctx.lineTo(W - padR, mid); ctx.stroke();
      ctx.textAlign = 'left';
      ctx.fillText('group mean', padL, mid - 8);
      ctx.textAlign = 'center';

      bars = [];
      for (var i = 0; i < G; i++) {
        var cx = padL + step * i + step / 2;
        var a = s.adv[i];
        var h = Math.abs(a) * scale;
        var y = a >= 0 ? mid - h : mid;
        ctx.fillStyle = a > 0.001 ? 'rgba(63,185,80,0.75)' : a < -0.001 ? 'rgba(231,76,60,0.7)' : 'rgba(136,146,164,0.35)';

        else { U.rounded(ctx, cx - bw / 2, y, bw, h, 3); ctx.fill(); }

        ctx.fillStyle = COL.text;
        ctx.font = '600 12px Inter, sans-serif';
        ctx.fillText(a.toFixed(2), cx, a >= 0 ? y - 6 : y + h + 15);

        ctx.fillStyle = rewards[i] ? COL.green : COL.muted;
        ctx.font = '11px Inter, sans-serif';
        ctx.fillText('R = ' + rewards[i], cx, H - 12);

        bars.push({ x: cx - step / 2, w: step, i: i });
      }

      el.mean.textContent = s.mean.toFixed(3);
      el.std.textContent = s.std.toFixed(3);
      var dead = s.std < 1e-8;
      el.sig.textContent = dead ? 'none' : 'yes';
      el.sigbox.className = 'iw-stat ' + (dead ? 'warn' : 'good');

      readout.innerHTML = dead
        ? 'Every completion scored the same, so the mean equals every reward and <strong>every advantage is zero</strong>. This group contributes <strong>no gradient at all</strong> &mdash; wasted samples, and the reason prompt difficulty has to be tuned.'
        : 'The baseline is just the group mean, so a completion is rewarded only for <strong>beating its peers on the same prompt</strong>. No value network computed any of this.';
    }

    canvas.addEventListener('click', function (e) {
      var rect = canvas.getBoundingClientRect();
      var x = e.clientX - rect.left;

          draw();

        }

    U.bindToggle(host, '[data-pick]', function (val) {
      if (val === 'mixed') rewards = [1, 1, 0, 0, 1, 0, 0, 0];
      else if (val === 'allright') rewards = [1, 1, 1, 1, 1, 1, 1, 1];
      else if (val === 'allwrong') rewards = [0, 0, 0, 0, 0, 0, 0, 0];
      else rewards = [0, 0, 0, 0, 0, 0, 0, 1];

    draw();
    return { resize: draw };

  window.MODULE_CONFIG = {

  <!-- Shared deck logic for every module -->
  <script>
// =====================================================================
// Core deck infrastructure: Manim steppers, Reveal.js init, syntax
// highlighting, interactive widget plumbing, and per-module hooks.
// Loaded before any widget definitions.
// =====================================================================

// =====================================================================
// Shared deck logic for every module. Per-module data and hooks arrive
// via window.MODULE_CONFIG, set by each module's config.js (which the
// build inlines BEFORE this file):
//
//   window.MODULE_CONFIG = {
//     title:          'LLMs 0 to 100 - Module N',  // sets document.title
//     manimSections:  { scene: ['Clip_0000.mp4', ...], ... },
//     widgets:        { name: function(host){...}, ... },  // optional
//     onReady:        function(reveal){...},               // optional
//     onSlideChanged: function(event){...}                 // optional
//   };
// =====================================================================
var MODULE_CONFIG = window.MODULE_CONFIG || {};

// ---- Manim section step-through player ----
// Section video lists are inline to avoid fetch() issues with file:// protocol.
var MANIM_SECTIONS = MODULE_CONFIG.manimSections || {};

var manimSteppers = {};

function initManimStepper(video) {
  var scene = video.getAttribute('data-manim-scene');
  var sections = MANIM_SECTIONS[scene] || [];
  var state = { sections: sections, current: -1, playing: false, video: video, scene: scene };
  manimSteppers[scene] = state;

  // Set poster frame from first section
  if (sections.length > 0) {
    video.src = (window.ASSET_BASE || '') + 'media/sections/' + sections[0];
    video.load();
  }

  video.addEventListener('ended', function() {
    state.playing = false;
  });
}

function advanceManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state || state.playing) return false;
  if (state.current >= state.sections.length - 1) return false;

  state.current++;
  state.playing = true;
  var file = state.sections[state.current];
  state.video.src = (window.ASSET_BASE || '') + 'media/sections/' + file;
  state.video.load();
  state.video.play().then(function() {}).catch(function() { state.playing = false; });
  return true;
}

function resetManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state) return;
  state.current = -1;
  state.playing = false;
  state.video.pause();
  if (state.sections.length > 0) {
    state.video.src = (window.ASSET_BASE || '') + 'media/sections/' + state.sections[0];
    state.video.load();
  }
}

// Instantly finish the section that is currently playing by jumping to its
// final frame. This lets an impatient "next" complete the animation in
// place rather than leaking through to reveal and skipping the slide.
// Returns true if it consumed the action (a video was actually playing).
function skipManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state || !state.playing) return false;
  var v = state.video;
  v.pause();
  // Seek just shy of the end so the step's end state stays on screen.
  if (v.duration && isFinite(v.duration)) {
    try { v.currentTime = Math.max(0, v.duration - 0.04); } catch (e) {}
  }
  state.playing = false;
  return true;
}

// One forward action on a manim slide. If a section is mid-play, the press
// completes it (skip to the end frame); otherwise it advances to the next
// section. Returns false only when there is nothing left to animate, which
// is the signal that reveal.js may now move on to the next slide.
function manimForward(scene) {
  var state = manimSteppers[scene];
  if (!state) return false;
  if (state.playing) return skipManimStepper(scene);
  return advanceManimStepper(scene);
}

// ---- Initialize Reveal.js ----
Reveal.initialize({
  width: 1280,
  height: 720,
  margin: 0,
  controls: true,
  progress: true,
  slideNumber: false,
  hash: true,
  transition: 'none',
  center: false,
  autoAnimateDuration: 0.8,
  plugins: [ RevealHighlight, RevealMarkdown ]
});

// ---- Syntax highlighting ----
// reveal-markdown converts the inline <textarea> into <pre><code> blocks
// in a deferred microtask, AFTER the highlight plugin's init() has already
// run, so code ships un-highlighted. Re-trigger the plugin once the blocks
// exist (on ready) and for any added later (on slidechanged).
function highlightAllCodeBlocks() {
  if (!Reveal.getPlugin) return;
  var hl = Reveal.getPlugin('highlight');
  if (!hl || typeof hl.highlightBlock !== 'function') return;
  document.querySelectorAll('pre code').forEach(function(block) {
    if (block.dataset.highlighted === 'yes') return;
    hl.highlightBlock(block);
  });
}
// reveal-markdown may materialize blocks in waves, so re-run the
// (idempotent) pass across the startup window rather than once.
Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    highlightAllCodeBlocks();
    if (tries > 25) clearInterval(iv);
  }, 100);
});
Reveal.on('slidechanged', highlightAllCodeBlocks);
Reveal.on('fragmentshown', highlightAllCodeBlocks);

function initStepperClickHandlers() {
  document.querySelectorAll('.manim-stepper').forEach(function(video) {
    if (video.dataset.clickInit) return;
    video.dataset.clickInit = '1';
    video.style.cursor = 'pointer';
    video.addEventListener('click', function(e) {
      var scene = video.getAttribute('data-manim-scene');
      manimForward(scene);
      e.stopPropagation();
      e.preventDefault();
    });
  });
}

function initAllSteppers() {
  document.querySelectorAll('.manim-stepper').forEach(function(v) {
    if (!manimSteppers[v.getAttribute('data-manim-scene')]) {
      initManimStepper(v);
    }
  });
  initStepperClickHandlers();
}

function renderMath() {
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false}
      ]
    });
  }
}

// reveal-markdown loads slides asynchronously, so the 'ready' event may
// fire before the markdown content is in the DOM. Poll briefly.
Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    if (document.querySelectorAll('section').length > 5 || tries > 20) {
      clearInterval(iv);
      initAllSteppers();
      renderMath();
    }
  }, 100);
});

// Reset steppers when leaving a slide
Reveal.on('slidechanged', function(event) {
  initAllSteppers();
  Object.keys(manimSteppers).forEach(function(scene) {
    if (!event.currentSlide.querySelector('[data-manim-scene="' + scene + '"]')) {
      resetManimStepper(scene);
    }
  });

// Intercept right arrow / space / enter on manim slides to step through
// sections. manimForward consumes the press while there is still animation
// to play (completing the current section or starting the next), so reveal
// only advances the slide once every section has been shown.
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
    var currentSlide = Reveal.getCurrentSlide();
    var stepper = currentSlide ? currentSlide.querySelector('.manim-stepper') : null;
    if (stepper) {
      var scene = stepper.getAttribute('data-manim-scene');
      if (manimForward(scene)) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }
  }
}, true);

// The on-screen controls (controls: true) navigate directly and bypass the
// keydown handler above, so guard the forward arrows the same way: a forward
// control press on a manim slide steps the animation before leaving.
document.addEventListener('click', function(e) {
  var btn = e.target.closest ? e.target.closest('.navigate-right, .navigate-down') : null;
  if (!btn) return;
  var currentSlide = Reveal.getCurrentSlide();
  var stepper = currentSlide ? currentSlide.querySelector('.manim-stepper') : null;
  if (stepper && manimForward(stepper.getAttribute('data-manim-scene'))) {
    e.stopImmediatePropagation();
    e.preventDefault();
  }
}, true);

// =====================================================================
// Interactive widgets (:::interactive). Each widget is a factory keyed
// by its `data-widget` value; it owns its host element and (re)draws
// whenever its slide becomes visible or the window resizes.
// =====================================================================
var INTERACTIVE_WIDGETS = {};

function hydrateInteractiveWidgets() {
  document.querySelectorAll('.interactive-host[data-widget]').forEach(function(host) {
    if (host.dataset.hydrated) return;
    var factory = INTERACTIVE_WIDGETS[host.getAttribute('data-widget')];
    if (!factory) return;
    host.dataset.hydrated = '1';
    host._widget = factory(host) || null;
  });
}

function refreshInteractiveWidgets() {
  document.querySelectorAll('.interactive-host[data-widget]').forEach(function(host) {
    if (host._widget && typeof host._widget.resize === 'function') host._widget.resize();
  });
}

Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    if (document.querySelector('.interactive-host[data-widget]') || tries > 25) {
      clearInterval(iv);
      hydrateInteractiveWidgets();
      requestAnimationFrame(refreshInteractiveWidgets);
    }
  }, 100);
});
Reveal.on('slidechanged', function() {
  hydrateInteractiveWidgets();
  requestAnimationFrame(refreshInteractiveWidgets);
});
window.addEventListener('resize', refreshInteractiveWidgets);

// ---- Per-module hooks (from MODULE_CONFIG) ----
if (MODULE_CONFIG.title) document.title = MODULE_CONFIG.title;
if (MODULE_CONFIG.widgets) Object.assign(INTERACTIVE_WIDGETS, MODULE_CONFIG.widgets);
if (typeof MODULE_CONFIG.onReady === 'function') {
  Reveal.on('ready', function() { MODULE_CONFIG.onReady(Reveal); });
}
if (typeof MODULE_CONFIG.onSlideChanged === 'function') {
  Reveal.on('slidechanged', function(event) { MODULE_CONFIG.onSlideChanged(event); });
}

// =====================================================================
// Slide annotation / drawing overlay.
//
// A full-viewport <canvas> the presenter can draw on top of any slide.
// Strokes are stored per slide (keyed by Reveal indices, in normalized
// coordinates) so they survive navigation and window resizes. A small
// floating toolbar exposes pen colors, an eraser, undo, and clear.
//
// Keyboard:
//   d       toggle draw mode on/off
//   e       eraser (while in draw mode)
//   c       clear the current slide's drawing
//   u       undo the last stroke
//   Escape  exit draw mode
//
// While draw mode is active, Reveal's own keyboard/touch navigation is
// suspended so drawing gestures never flip the slide.
// =====================================================================

  var PEN_WIDTH = 3;
  var ERASER_WIDTH = 28;

  var strokesBySlide = {};

  var drawMode = false;
  var erasing = false;
  var color = PALETTE[0];

  // box at viewport size, then repaint the current slide's strokes.

    if (!drawMode) setDrawMode(true);
    updateToolbar();

      '#draw-canvas{position:fixed;inset:0;z-index:40;pointer-events:none;touch-action:none;}',
