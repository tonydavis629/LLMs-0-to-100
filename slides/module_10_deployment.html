<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMs 0 to 100</title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <!-- KaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>

  <!-- Module-specific <head> includes (e.g. Chart.js); empty for most modules -->
  

  <!-- Shared styles + per-module overrides, inlined by the build -->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

/* ===========================================
   CSS VARIABLES
   =========================================== */
:root {
  --background-color: #0a0e1a;
  --section-divider-bg: #0d1225;

  --heading-font: "Space Grotesk", Helvetica, sans-serif;
  --body-font: "Inter", Helvetica, sans-serif;
  --base-font-size: 32px;
  --text-size: 16pt;
  --h1-size: 48pt;
  --h2-size: 36pt;
  --h3-size: 24pt;
  --footnote-size: 11pt;

  --primary-color: #4a9eff;
  --secondary-color: #f5a623;
  --text-color: #e8eaf0;
  --muted-color: #8892a4;
  --line-color: #2a3450;

  --slide-padding: 60px;
  --slide-padding-top: 24px;
  --content-gap: 18px;

  --box-radius: 8px;
}

/* ===========================================
   BASE STYLES
   =========================================== */

.reveal {
  font-family: var(--body-font);
  font-size: var(--base-font-size);
}

.reveal strong,
.reveal b {
  font-weight: bold;
}

.reveal a {
  color: var(--primary-color);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.reveal a:hover {
  color: var(--text-color);
}

.reveal-viewport {
  background-color: var(--background-color);
}

.reveal-viewport.is-section-divider .slide-background.present {
  background-color: var(--section-divider-bg) !important;
}

.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4,
.reveal h5,
.reveal h6 {
  font-family: var(--heading-font);
  text-transform: none;
  color: var(--text-color);
  font-weight: 600;
  line-height: 1.2;
}

.reveal h1 { font-size: var(--h1-size); }
.reveal h2 { font-size: var(--h2-size); margin-bottom: 0; }
.reveal h3 { font-size: var(--h3-size); }

.reveal p,
.reveal li,
.reveal td,
.reveal th,
.reveal blockquote {
  font-size: var(--text-size);
  color: var(--text-color);
  line-height: 1.5;
}

/* Vertical separation between newline-separated sentences on text slides.
   Scoped to a slide's top-level paragraphs (the prose flow); paragraphs
   nested inside components (terminal captions, figure cards, grid columns)
   keep their own tighter spacing so dense component slides do not overflow.
   Adjacent margins collapse, so the gap between two paragraphs is 0.9em. */
.reveal .slides section > p {
  margin: 0.4em 0 0.9em 0;
}

/* ===========================================
   LISTS
   =========================================== */

.reveal ul {
  list-style: none;
  padding-left: 0;
  margin: 15px 0;
}

.reveal ul li {
  position: relative;
  padding-left: 25px;
  margin-bottom: 10px;
}

.reveal ul li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.6em;
  width: 8px;
  height: 8px;
  background: var(--primary-color);
  border-radius: 50%;
}

.reveal ul ul li::before {
  background: var(--muted-color);
  width: 6px;
  height: 6px;
}

.reveal blockquote p {
  font-size: inherit;
}

/* ===========================================
   SLIDE LAYOUT
   =========================================== */

.reveal .slides section {
  height: 100%;
  display: flex !important;
  flex-direction: column !important;
  padding: var(--slide-padding-top) var(--slide-padding) var(--slide-padding) var(--slide-padding) !important;
  box-sizing: border-box;
  text-align: left;
}

.reveal .slides section.stack {
  padding: 0 !important;
}

.reveal .slides section > .content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: var(--content-gap);
  text-align: left;
}

.reveal .slides section > .footnote {
  position: absolute;
  bottom: 15px;
  left: var(--slide-padding);
  right: var(--slide-padding);
  font-size: var(--footnote-size);
  color: var(--muted-color);
}

/* ===========================================
   SECTION DIVIDERS
   =========================================== */

.reveal .slides section.section-divider {
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}

.reveal .slides section.section-divider h1 {
  font-size: 56pt;
  text-align: center;
  color: var(--primary-color);
}

.reveal .slides section.section-divider p {
  font-size: 20pt;
  color: var(--muted-color);
}

/* ===========================================
   TEXT SIZE UTILITIES
   =========================================== */

.text-lg { font-size: 18pt !important; }
.text-xl { font-size: 20pt !important; }
.text-2xl { font-size: 24pt !important; }
.text-3xl { font-size: 28pt !important; }
.text-4xl { font-size: 32pt !important; }

.text-muted { color: var(--muted-color) !important; }
.text-center { text-align: center !important; }
.text-uppercase { text-transform: uppercase; letter-spacing: 0.1em; }
.font-light { font-weight: 300; }
.font-bold { font-weight: 600; }

/* ===========================================
   BLOCKQUOTES
   =========================================== */

.reveal blockquote {
  border-left: 4px solid var(--primary-color);
  padding-left: 20px;
  margin: 20px 0;
  font-style: italic;
  background: none;
  box-shadow: none;
  width: 100%;
  max-width: none;
}

.reveal blockquote cite {
  display: block;
  margin-top: 10px;
  font-style: normal;
  color: var(--muted-color);
}

/* ===========================================
   ACCENT UNDERLINE ON TITLES
   =========================================== */

.reveal .slides section > h2 {
  flex-shrink: 0;
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line-color);
}

/* ===========================================
   FIGURE CARD - for notable figures slides
   =========================================== */

.figure-card {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  align-items: start;
}

.figure-card img {
  border-radius: var(--box-radius);
  width: 100%;
  box-shadow: 0 4px 20px rgba(74, 158, 255, 0.15);
}

.figure-card .figure-info h3 {
  margin: 0 0 5px 0;
  color: var(--secondary-color);
  font-size: 14pt;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ===========================================
   ERA BADGE - for timeline labels
   =========================================== */

.era-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12pt;
  font-weight: 500;
}

.era-badge.summer {
  background: rgba(245, 166, 35, 0.2);
  color: var(--secondary-color);
}

.era-badge.winter {
  background: rgba(74, 158, 255, 0.15);
  color: #6cb4ff;
}

.era-badge.spring {
  background: rgba(80, 200, 120, 0.2);
  color: #50c878;
}

/* ===========================================
   HIGHLIGHT BOX
   =========================================== */

.highlight-box {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
}

/* Exercise hint: a single fragment that reveals the whole hint at once.
   The wrapping .fragment div is what animates; this just sizes the text
   (matching the old text-lg intent) and removes the global paragraph
   margin so the one-line hint is not double-spaced. */
.reveal .hint-box p {
  font-size: 18pt;
  margin: 0;
}

/* ===========================================
   COURSE STRUCTURE
   =========================================== */

.course-summary {
  max-width: 1120px;
  margin: 0 0 16px 0;
  color: #f0f4fb;
  font-size: 18pt !important;
  line-height: 1.4 !important;
}

.course-track-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

.module-track-card {
  background: rgba(74, 158, 255, 0.07);
  border: 1px solid rgba(74, 158, 255, 0.22);
  border-radius: var(--box-radius);
  padding: 20px 22px;
}

.module-track-kicker {
  font-size: 12pt;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--secondary-color);
  margin-bottom: 8px;
}

.module-track-card h3 {
  margin: 0 0 8px 0;
}

.module-track-intro {
  font-size: 14pt !important;
  color: #d7ddea !important;
  margin: 0 0 10px 0;
  line-height: 1.4 !important;
}

.compact-list {
  margin: 0;
}

.reveal ul.compact-list li {
  font-size: 16pt;
  line-height: 1.35;
  margin-bottom: 7px;
  padding-left: 20px;
}

.course-note {
  margin-top: 14px;
  color: #d7ddea;
  font-size: 15pt !important;
  line-height: 1.35 !important;
}

.course-glossary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  margin-top: 14px;
}

.glossary-item {
  background: rgba(245, 166, 35, 0.08);
  border: 1px solid rgba(245, 166, 35, 0.18);
  border-radius: var(--box-radius);
  padding: 12px 14px;
}

.glossary-item strong {
  color: var(--secondary-color);
}

.glossary-item p {
  font-size: 13pt !important;
  color: #d7ddea !important;
  margin: 6px 0 0 0;
  line-height: 1.4;
}

/* ===========================================
   TERMINAL OUTPUT
   =========================================== */

.terminal-output {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 0;
  max-width: 800px;
  margin: 0 auto;
  text-align: left;
}

.terminal-output .terminal-bar {
  background: #161b22;
  border-radius: 8px 8px 0 0;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.terminal-output .terminal-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.terminal-output .terminal-dot.red { background: #ff5f57; }
.terminal-output .terminal-dot.yellow { background: #febc2e; }
.terminal-output .terminal-dot.green { background: #28c840; }

.terminal-output .terminal-title {
  color: #8b949e;
  font-family: monospace;
  font-size: 10pt;
  margin-left: 8px;
}

.terminal-output .terminal-body {
  padding: 15px 20px;
}

.terminal-output .terminal-body pre {
  margin: 0;
  background: none !important;
  box-shadow: none !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output.dense .terminal-body {
  padding: 10px 20px;
}

.reveal .terminal-output.dense .terminal-body pre.terminal-pre {
  font-size: 9pt;
  line-height: 1.28;
}

.reveal .terminal-output .terminal-body pre.terminal-pre span {
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
}

.reveal .terminal-output .terminal-body pre.terminal-pre p {
  display: inline;
  font-size: inherit !important;
  line-height: inherit !important;
  font-family: inherit !important;
  margin: 0 !important;
  color: inherit;
}

.reveal .terminal-output .terminal-body pre code {
  font-size: 11pt;
  line-height: 1.5;
  color: #e8eaf0;
  background: none !important;
  padding: 0;
  box-shadow: none !important;
  font-family: monospace;
}

.terminal-output .terminal-body .prompt {
  color: #8b949e;
}

.terminal-output .terminal-body .success {
  color: #3fb950;
}

.terminal-output .terminal-body .header {
  font-weight: bold;
}

.terminal-output .terminal-body .skipped {
  color: #8b949e;
  font-style: italic;
}

/* ===========================================
   TURNING POINT SLIDE
   =========================================== */

.turning-point h2 {
  border-bottom-color: var(--secondary-color) !important;
}

/* ===========================================
   CODE BLOCKS
   =========================================== */

.reveal pre {
  margin-bottom: 0;
  width: 100%;
  box-sizing: border-box;
  box-shadow: none !important;
  background: none !important;
}

.reveal pre code {
  font-size: 14pt;
  line-height: 1.4;
  padding: 10px 20px;
  border-radius: var(--box-radius);
  background: rgba(20, 25, 45, 0.8);
  color: var(--text-color);
  max-height: 400px;
}

.reveal pre code .hljs-keyword,
.reveal pre code .hljs-built_in {
  color: #c792ea;
}

.reveal pre code .hljs-string {
  color: #c3e88d;
}

.reveal pre code .hljs-comment {
  color: #546e7a;
}

.reveal pre code .hljs-number {
  color: #f78c6c;
}

.reveal code {
  color: var(--text-color);
}

/* ===========================================
   MATH (KaTeX)
   =========================================== */

.katex {
  color: var(--text-color);
  font-size: 1.1em;
}

.katex-display {
  margin: 15px 0;
}

.katex-display > .katex {
  font-size: 1.3em;
}

/* ===========================================
   VIDEO CONTAINERS
   =========================================== */

.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-container video,
.video-container img {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--box-radius);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
}

/* ===========================================
   SIDE QUEST BADGE
   =========================================== */

.side-quest-badge {
  display: inline-block;
  background: rgba(245, 166, 35, 0.15);
  color: var(--secondary-color);
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12pt;
  font-weight: 500;
  margin-bottom: 10px;
}

/* ===========================================
   TERMINAL OUTPUT - ANSI COLOR PALETTE
   Replaces inline `style="color:#..."` on spans
   inside .terminal-pre. A rule on the span itself
   overrides the color inherited from .terminal-pre.
   =========================================== */

.terminal-output .terminal-body .t-red    { color: #e06c75; }
.terminal-output .terminal-body .t-orange { color: #d19a66; }
.terminal-output .terminal-body .t-yellow { color: #e5c07b; }
.terminal-output .terminal-body .t-green  { color: #98c379; }
.terminal-output .terminal-body .t-cyan   { color: #56b6c2; }
.terminal-output .terminal-body .t-blue   { color: #61afef; }
.terminal-output .terminal-body .t-gray   { color: #8b949e; }
.terminal-output .terminal-body .t-fg     { color: #e8eaf0; }
.terminal-output .terminal-body .t-fail   { color: #e74c3c; }

.terminal-caption {
  margin-top: 15px;
  text-align: center;
}

/* ===========================================
   TIMELINE (module 1) - per-node structure
   Positional left/width and per-era colors stay
   inline; this captures the repeated boilerplate.
   =========================================== */

.tl-node  { position: absolute; transform: translateX(-50%); text-align: center; }
/* .reveal prefix needed: `.reveal p` (0,1,1) sets color/font-size and would
   otherwise beat a bare .tl-* class. The original used inline styles. */
.reveal .tl-label { font-size: 10pt; color: var(--muted-color); white-space: nowrap; margin: 0; }
.reveal .tl-year  { font-size: 11pt; font-weight: 600; margin: 2px 0 0 0; }
.tl-stem  { width: 1px; opacity: 0.5; margin: 2px auto 0; }
.tl-dot   { width: 10px; height: 10px; border-radius: 50%; margin: 0 auto; }

.tl-node.below .tl-stem  { margin: 0 auto; }
.tl-node.below .tl-year  { margin: 0; }
.tl-node.below .tl-label { margin: 2px 0 0 0; }

/* ===========================================
   CANONICAL SLIDE TYPES
   Backs the :::divider / :::columns / :::note /
   :::quiz / :::step / :::interactive fences so
   slides.md carries no inline layout styles.
   (.section-divider, .figure-card, .terminal-output,
    .hint-box are defined above and reused.)
   =========================================== */

/* :::columns - grid; template/gap/valign supplied by the build */
.reveal .slide-columns {
  display: grid;
  align-items: start;
  margin: 10px 0;
}

/* :::note - callout box (canonical replacement for .highlight-box) */
.reveal .note {
  background: rgba(74, 158, 255, 0.08);
  border: 1px solid rgba(74, 158, 255, 0.25);
  border-radius: var(--box-radius);
  padding: 20px 25px;
  margin: 20px 0;
}

.reveal .note p {
  font-size: 18pt;
  margin: 0;
}

.reveal .note p + p {
  margin-top: 0.6em;
}

/* :::note variant="hint" - lighter, boxless (also used inside :::step) */
.reveal .note.hint-box {
  background: none;
  border: none;
  padding: 0;
}

/* :::quiz - prompt scales up; its last line is the question */
.reveal .quiz-prompt p {
  font-size: 18pt;
  margin: 0 0 0.6em 0;
}

.reveal .quiz-prompt p:last-child {
  font-size: 24pt;
  color: var(--text-color);
  margin: 0.5em 0 0 0;
}

.reveal .quiz-answer {
  margin-top: 30px;
}

/* :::step - spacing between code, hint, and answer */
.reveal .hint-box {
  margin-top: 22px;
}

.reveal .hint-box + .note {
  margin-top: 8px;
  padding: 12px 18px;
}

/* :::interactive - widget fills the slide body like a video */
.reveal .interactive-host {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

/* ===========================================
   FOLDING WIDGET  (:::interactive widget="folding")
   Linked input-space / hidden-space views with
   per-neuron weight & bias sliders.
   =========================================== */

.fold-widget {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  height: 100%;
}

.fold-views {
  display: grid;
  grid-template-columns: 1fr 1fr 0.85fr;
  gap: 18px;
  flex: 1;
  min-height: 0;
}

.fold-view {
  display: flex;
  flex-direction: column;
  margin: 0;
  min-height: 0;
}

.reveal .fold-view figcaption {
  font-size: 14pt;
  color: var(--primary-color);
  font-weight: 600;
  text-align: center;
  margin-bottom: 6px;
}

.fold-canvas {
  flex: 1;
  min-height: 0;
  width: 100%;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.fold-controls {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.fold-modes {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.fold-modes button {
  font-family: var(--body-font);
  font-size: 13pt;
  color: var(--text-color);
  background: rgba(74, 158, 255, 0.10);
  border: 1px solid rgba(74, 158, 255, 0.35);
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
}

.fold-modes button.active {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: #0a0e1a;
  font-weight: 600;
}

.fold-modes button.fold-reset {
  background: rgba(245, 166, 35, 0.12);
  border-color: rgba(245, 166, 35, 0.40);
  color: var(--secondary-color);
}

.fold-sliders {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px 24px;
}

.fold-slider {
  display: grid;
  grid-template-columns: 70px 1fr 52px;
  align-items: center;
  gap: 10px;
}

.reveal .fold-slider label {
  font-size: 12pt;
  margin: 0;
  font-family: var(--body-font);
  font-weight: 600;
}

.fold-slider input[type="range"] {
  width: 100%;
  accent-color: var(--primary-color);
}

.reveal .fold-slider .fold-val {
  font-size: 12pt;
  color: var(--text-color);
  font-family: monospace;
  text-align: right;
  margin: 0;
}

.reveal .fold-readout {
  font-size: 13pt;
  color: var(--muted-color);
  text-align: center;
  margin: 0;
}

.reveal .fold-readout strong {
  color: var(--secondary-color);
}

/* ===========================================
   MLP BOUNDARY WIDGET  (:::interactive widget="mlpBoundary")
   =========================================== */

.mlp-widget {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  height: 100%;
}

.mlp-canvas-wrap {
  flex: 1;
  min-height: 0;
}

.mlp-canvas,
.land-canvas {
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  background: #0d1225;
  border: 1px solid var(--line-color);
  border-radius: var(--box-radius);
}

.mlp-controls,
.land-controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(240px, 1fr));
  gap: 10px 24px;
  align-items: center;
}

.mlp-slider {
  display: grid;
  grid-template-columns: 70px 1fr 58px;
  align-items: center;
  gap: 10px;
}

.reveal .mlp-slider label,

## Review: The Pieces This Module Serves

Weights are frozen from here. The problem: run them fast, for many users, at low cost.

<div class="card-grid cols-3">
<div class="card"><h4>Module 4 &middot; Architecture</h4><p>Generation is the forward pass <strong>in a loop</strong>: predict a token, append it, run again. Attention needs every earlier key and value.</p></div>

## Review: The Question This Module Answers

**What does it take to put a good checkpoint behind an API, and what does each token cost?**

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

# The Serving Problem

Many users, shared hardware, a meter that never stops


---

<!-- .slide: id="serving-metrics" -->

## Four Numbers Define the Problem

Serving: many users, one API, and a hardware bill that runs whether or not anyone calls.

<div class="card-grid cols-4">
<div class="card"><h4>Time to first token</h4><p><strong>TTFT.</strong> Wait before text appears.</p></div>
<div class="card"><h4>Per-user rate</h4><p><strong>Tokens/sec, one stream.</strong> How fast the reply flows.</p></div>
<div class="card"><h4>Throughput</h4><p><strong>Tokens/sec, whole machine.</strong> All users combined.</p></div>
<div class="card"><h4>Cost per token</h4><p><strong>Hardware $/hour &divide; throughput.</strong> Every API price comes from this division.</p></div>
</div>

The first two belong to the user. The last two belong to whoever pays for the GPU. <!-- .element: class="text-lg" style="margin-top: 10px;" -->

---

<!-- .slide: id="serving-tension" -->

## The Central Tension: Latency vs Throughput

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Make one user fast**

- Whole machine for one request
- Fastest reply, idle GPU
- Enormous cost per token

</div>

<div>

**Make the machine productive**

- Pack requests together
- Far more tokens per second
- Each reply slightly slower

</div>

</div>

Every technique in this lecture is a position in this trade. Ask of each: **who gets faster, and who pays?** <!-- .element: class="text-lg" style="margin-top: 14px;" -->

<div class="note">

Streaming: the model makes tokens one at a time anyway, so send each as it is made. Decent TTFT plus a tolerable stream rate feels fast even when the full reply takes ten seconds.

</div>

Why the bottleneck is memory, not math

<!-- .slide: id="hbm-napkin" -->

## The Napkin Math for One Decoded Token

One decoded token: about 2 floating point operations per parameter, and **every parameter read from GPU memory**.

<div class="metric-box">

$$\text{7B model in fp16:}\quad 14\ \text{GB read from memory}\ \longrightarrow\ 14\ \text{GFLOPs of work}$$

<p>Roughly <strong>one arithmetic operation per byte moved</strong>.</p>
</div>

The hardware is built the other way around: <!-- .element: class="text-lg" -->

<div class="bench-table">
<table>
<thead><tr><th>NVIDIA H100 SXM</th><th>Peak</th></tr></thead>
<tbody>
<tr><td>fp16 compute</td><td class="num">~1,000 TFLOP/s</td></tr>
<tr><td>HBM memory bandwidth</td><td class="num">3.35 TB/s</td></tr>
<tr><td><strong>Compute available per byte moved</strong></td><td class="num"><strong>~300 operations</strong></td></tr>
</tbody>
</table>
</div>

Decode uses one operation per byte. The other 299 sit idle while the memory system streams weights. <!-- .element: class="text-lg" -->

---

<!-- .slide: id="hbm-speed-limit" -->

## The Decode Speed Limit

During decode, HBM bandwidth sets the speed limit:

<div class="metric-box">

$$\text{tokens/sec} \approx \frac{\text{memory bandwidth}}{\text{bytes of weights read per token}}$$

<p>A 14 GB model on a 3.35 TB/s card tops out near <strong>240 tokens/sec for one user</strong>, no matter how much compute the card has.</p>
</div>

<div class="fragment note">

- Predicts real single-user speeds well (you test it in the exercise)
- Only two levers: **more bandwidth**, or **fewer bytes per token**
- The second half of this lecture pulls the second lever

</div>

# The KV Cache

The memory a conversation takes up

<!-- .slide: id="kvcache-what" -->

## Attention Remembers So You Don't Recompute

Attention at position t needs the **keys and values of every earlier position** (Module 3). Recomputing them every step is quadratic waste. The server keeps them: the **KV cache**.

<!-- .slide: id="kvcache-cost" -->

## Work It Out for a 7B-Class Model

32 layers, 32 heads of dimension 128, fp16. That is 2 &times; 32 &times; 32 &times; 128 &times; 2 bytes, about **0.5 MB per token of context**.

<div class="card-grid cols-3">
<div class="card"><h4>One user, 4K context</h4><p>4,096 tokens &times; 0.5 MB = <strong>about 2 GB</strong> of GPU memory, for one conversation.</p></div>
<div class="card warn"><h4>Eight such users</h4><p><strong>16 GB of cache</strong>: more memory than the entire 14 GB model. The cache, not compute, decides how many users fit.</p></div>
<div class="card"><h4>And it is traffic too</h4><p>Every decode step <strong>reads the whole cache</strong> on top of the weights, so long conversations also decode slower.</p></div>
</div>

This is why long contexts cost more: expensive in memory and bandwidth even when the arithmetic is cheap. <!-- .element: class="text-lg" style="margin-top: 10px;" -->

## Architecture Fights Back: MQA and GQA

The cache scales with the number of **KV heads**, so shrink that number.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Multi-query attention (2019)**

- All query heads share **one** K/V set
- Cache divided by 32 in our example
- Shazeer, years ahead of the field

</div>

<div>

**Grouped-query attention (2023)**

- The compromise that won: a few KV heads (Llama 3 8B uses 8)
- Most of the saving, almost none of the quality loss
- Module 4's modern block

</div>

</div>

Serving costs reached back and **changed model architecture**. Watch for this again with MoE. <!-- .element: class="text-lg" style="margin-top: 12px;" -->

## Woosuk Kwon <!-- .element: class="fragment fade-in" -->

<div class="fragment fade-in">

### vLLM and PagedAttention (2023), with Zhuohan Li and the Berkeley team

Serving engines gave each request one **contiguous slab** of cache memory, sized for the maximum context. Measured waste: 60-80% of cache memory sat empty.

The fix imported a fifty-year-old operating systems idea: manage the cache in small **pages** with a lookup table, like virtual memory. Near-zero waste, far more concurrent users per card. vLLM became the open-source default; you run it in the exercise.

</div>

</div>

</div>

<!-- .slide: id="kvcache-prefix" -->

## Prefix Caching: The Part Users Actually Meet

Requests that share a prefix (system prompt, long document, the conversation so far) can **share the cache** for those tokens. Only the new suffix needs prefill.

<div class="card-grid cols-2">
<div class="card good"><h4>Why providers sell "prompt caching"</h4><p>Prefill for a stable prefix is computed once, then billed at a discount. The KV cache, productized.</p></div>
<div class="card"><h4>The design rule</h4><p><strong>Stable content first</strong> (system prompt, tools, examples), variable content last. Module 11 builds on this.</p></div>
</div>

## Static Batching Fails; Continuous Batching Won

Replies finish at wildly different lengths, and that kills the convoy. Continuous batching (Orca, 2022) reschedules **every decode step**:

## What the Operator Actually Tunes

- The knobs: batch size and cache memory, against a latency promise
- More concurrency: more throughput, slower streams
- Somewhere there is a line the user experience must not cross

**Goodput** is the honest metric: throughput that still meets the latency target. Raw throughput can always be inflated by making everyone wait. <!-- .element: class="text-lg" -->

## Quantization: Fewer Bits per Weight

Inference weights tolerate 8-bit and even 4-bit integers, with one scale factor per small group preserving the range:

<div class="metric-box">

$$w \approx s \cdot q, \qquad q \in \lbrace -8, \dots, 7 \rbrace\ \text{for 4-bit}$$

<p>Store small integers; keep one fp16 scale <strong>s</strong> per group of ~32 weights; multiply back at compute time.</p>
</div>

## The Catch, and the Module 9 Connection

Quantization is a quality trade, and the loss is **uneven**: small on average, occasionally large on a specific capability.

<div class="card-grid cols-2">
<div class="card warn"><h4>Do not trust the average</h4><p>A tiny perplexity delta can hide a real regression on, say, math or a low-resource language. Aggregates hide exactly what you need to know; Module 9's oldest lesson.</p></div>
<div class="card good"><h4>The honest procedure</h4><p><strong>Re-run the evaluation suite on the quantized model.</strong> Ship it like a new model, because it is one.</p></div>
</div>

Names on download pages: <!-- .element: class="text-lg" style="margin-top: 10px;" -->

- **GPTQ**, **AWQ**: weight-only quantization, computed after training
- **GGUF**: llama.cpp's file family
- **fp8**: the emerging served-model default; frontier labs increasingly train at low precision from the start

<div class="note">

Distillation is the other shrink: train a small model on a large model's outputs (Module 6 machinery). It cuts parameter count, not bytes per parameter. Most small production models are distilled from larger siblings.

</div>

## Speculative Decoding: Spend Prefill to Save Decode

A small **draft model** guesses ahead; the large model **verifies all k guesses in one prefill-shaped pass**:

<div style="display: flex; justify-content: center; margin: 6px 0;">

    <rect x="504" y="42" width="110" height="34" rx="6" fill="rgba(232,163,76,0.15)" stroke="#e8a34c"/><text x="559" y="64" fill="#e6edf3">green</text>
  </g>
  <text x="700" y="64" fill="#8b98b8" font-size="14">k = 4 drafted tokens</text>

  </g>
  <rect x="150" y="132" width="464" height="44" rx="8" fill="rgba(76,155,232,0.15)" stroke="#4c9be8" stroke-width="2"/>
  <text x="382" y="160" fill="#e6edf3" font-size="16" text-anchor="middle">large model: one parallel pass checks all four</text>
  <g font-size="20" text-anchor="middle">
    <text x="205" y="215" fill="#50c878">&#10003;</text><text x="323" y="215" fill="#50c878">&#10003;</text><text x="441" y="215" fill="#50c878">&#10003;</text><text x="559" y="215" fill="#e06c75">&#10007;</text>

- Accept/reject rule leaves the output distribution **provably unchanged**

## The Accounting, with Mixtral as the Worked Example

Module 4's MoE: many expert FFNs, a router picking a few per token. The serving numbers are why it took over.

<div class="bench-table">
<table>
<thead><tr><th>Mixtral 8x7B</th><th>Count</th><th>What scales with it</th></tr></thead>
<tbody>
<tr><td>Total parameters</td><td class="num">47B</td><td>Quality (roughly), and <strong>memory footprint</strong></td></tr>

The router buys a big model's knowledge at a fraction of the per-token cost. <!-- .element: class="text-lg" -->

<div class="fragment note hint-box">

The fine print: all 47B must be resident, because which experts a token wants is not known until its router runs. MoE trades cheap tokens for an expensive footprint.

<!-- .slide: id="moe-deepseek" -->

## The State of the Art Compounds These Ideas

DeepSeek-V3 (2024): **hundreds of fine-grained experts**, a handful active per token, plus **multi-head latent attention**, which compresses the KV cache into a small latent vector.

<div class="card-grid cols-2">
<div class="card"><h4>Why you have heard of it</h4><p>Frontier-class quality at unusually low training and serving cost. Not one invention: serving ideas <strong>compounding</strong>.</p></div>
<div class="card"><h4>The summary</h4><p>Dense models spend HBM <strong>bandwidth</strong> on every parameter, every token. MoE spends HBM <strong>capacity</strong> on parameters it mostly does not touch. Which wins depends on your bottleneck.</p></div>
</div>

## Rent the API, or Run Your Own?

The crossover is a spreadsheet. You know every row in it.

<div class="slide-columns" style="grid-template-columns: repeat(2, 1fr); gap: 34px;">

<div>

**Rent when**

- Load is small or spiky (you pay only for tokens)
- You need frontier-class models
- Undifferentiated ops work is not your job

</div>

<div>

**Self-host when**

- Token volume is high and steady; at scale the crossover comes fast
- Data cannot leave, or latency must be controlled
- The model is your own finetune (Module 6)

## Production Hygiene, and the Next Class

- Run the **Module 9 regression suite** before swapping any model or quantization into production; a quantized model ships like a new model
- **Canary** a new model on a slice of traffic before it takes all of it
- **Log per-request latency and token counts**: they are the cost model and the debugging record in one

The model is now a URL: tokens in, tokens out, at a price per token. Everything in Module 11 (prompting, retrieval, tools, agents) is engineering built on top of that URL. <!-- .element: class="text-lg" style="margin-top: 14px;" -->

# Quiz

<!-- .slide: id="quiz-idle-gpu" -->

## The Idle Supercomputer

<div class="quiz-prompt">

A GPU has roughly 300 times more compute per second than bytes of memory bandwidth per second, yet it sits mostly idle while generating text for one user. Reconcile those two facts.

</div>

<div class="fragment note quiz-answer">

**Short answer: decode has an arithmetic intensity of about one operation per byte, so the memory system is saturated while 299 of every 300 arithmetic slots go unused.**

- Each decoded token: every weight read from HBM, but only ~2 operations per parameter
- The workload sits far below the hardware's compute-to-bandwidth ratio
- The memory bus is full; the arithmetic units the spec sheet advertises sit idle

</div>

---

<!-- .slide: id="quiz-two-phases" -->

## Same Weights, Different Bottleneck

<div class="quiz-prompt">

Prefill and decode run the same weights through the same layers. Why is one compute bound and the other memory bound?

</div>

<div class="fragment note quiz-answer">

**Short answer: prefill amortizes each weight read over the whole prompt; decode reads all the weights to produce one token.**

- Prefill: all prompt tokens in one parallel pass, so each weight read does a thousand tokens' worth of arithmetic. Compute bound.
- Decode: sequential, so each read serves exactly one token. Intensity near one, memory bound.
- Same weights; different number of tokens sharing each byte.

</div>

---

<!-- .slide: id="quiz-slow-start" -->

## Slow to Start, Fast Once Going

<div class="quiz-prompt">

A user complains the chatbot takes ages before text appears but streams quickly once it starts. Which phase is slow, and what property of their prompts would explain it?

</div>

<div class="fragment note quiz-answer">

**Short answer: prefill is slow, and long prompts explain it.**

- TTFT is prefill: the whole prompt runs through the model before the first output token exists
- Prefill cost grows with prompt length; pasted documents produce exactly this signature
- Decode rate depends on bandwidth and model size, not prompt length, so the stream feels fine
- Server-side fix for repeated long prefixes: prefix caching

</div>

---

<!-- .slide: id="quiz-kv-gqa" -->

## The Cache and the Heads

<div class="quiz-prompt">

Estimate the KV cache per token for a model with 32 layers, 8 KV heads of dimension 128, in fp16. Why does grouped-query attention change this number a lot but barely change the parameter count?

</div>

<div class="fragment note quiz-answer">

**Short answer: 2 &times; 32 &times; 8 &times; 128 &times; 2 bytes = 128 KB per token, about 1 GB for an 8K context. GQA divides the cache by the head reduction, but K/V projection weights are a small slice of total parameters.**

- The cache scales directly with KV head count: 32 heads to 8 cuts it 4x
- Parameters barely move: K/V projections are a small slice of a model dominated by FFN weights
- GQA shrinks what is stored per token, not what the model knows

</div>

---

<!-- .slide: id="quiz-free-lunch" -->

## Where Batching's Free Lunch Comes From

<div class="quiz-prompt">

Batching 32 users onto one GPU raises decode throughput nearly 32x. Where does that come from, and when does it stop?

</div>

<div class="fragment note quiz-answer">

**Short answer: the weights were being read anyway; a batch makes one read produce 32 tokens instead of one. It stops when the workload becomes compute bound or the KV caches exhaust memory.**

- Single-user decode wastes almost all the compute the memory traffic could feed
- Batching shares each weight read across every sequence: higher arithmetic intensity, near-free tokens
- Two walls: arithmetic becomes the limit, or 32 conversations' KV caches no longer fit next to the weights

</div>

---

<!-- .slide: id="quiz-continuous" -->

## Why Static Batching Died

<div class="quiz-prompt">

What property of LLM requests, absent from most other web workloads, made static batching so wasteful that every serving engine replaced it within about a year?

</div>

<div class="fragment note quiz-answer">

**Short answer: wildly variable and unpredictable output lengths.**

- A web request does bounded work; a generation runs anywhere from three tokens to three thousand
- Static batch: everyone waits for the longest reply while finished slots idle
- Continuous batching reschedules at every decode step, the workload's natural granularity

</div>

---

<!-- .slide: id="quiz-quant" -->

## 4-bit Quantization

<div class="quiz-prompt">

Quantizing from fp16 to 4-bit roughly quadruples decode speed. Which formula predicts this, and what must you do before shipping the quantized model?

</div>

<div class="fragment note quiz-answer">

**Short answer: the speed limit, bandwidth over bytes per token: one quarter the bytes means four times the ceiling. Before shipping, re-run the full Module 9 evaluation suite on the quantized model.**

- The speedup is pure arithmetic
- The asterisk is quality: loss is uneven, small on average, sometimes concentrated in one capability
- Average perplexity can hide a real regression
- A quantized model is a different model and ships like one: regression suite, per-task breakdown, canary

</div>

---

<!-- .slide: id="quiz-speculative" -->

## Verifying Is Cheaper Than Generating

<div class="quiz-prompt">

Speculative decoding uses a small model to draft k tokens and the large model to verify them. Why is verifying k tokens so much cheaper than generating them?

</div>

<div class="fragment note quiz-answer">

**Short answer: verification checks all k drafts in one parallel forward pass, which is prefill-shaped; generating them would take k sequential memory-bound passes.**

- Given the drafts as input, the large model scores every position at once: one weight read amortized across all k, exactly like prefill
- Generation cannot parallelize that way: token n+1 needs token n
- The accept/reject rule preserves the output distribution exactly, so the speedup costs no quality

</div>

---

<!-- .slide: id="quiz-moe" -->

## Cheaper and Exactly as Expensive

<div class="quiz-prompt">

A 47B-parameter MoE activates 13B parameters per token. In what sense is it cheaper than a dense 47B model, and in what sense is it exactly as expensive?

</div>

<div class="fragment note quiz-answer">

**Short answer: cheaper per token (compute and weight traffic scale with the 13B active), exactly as expensive in memory footprint (all 47B must be resident).**

- The router decides per token which experts fire, so every expert must stay reachable
- MoE converts a bandwidth problem into a capacity problem
- Hence hybrid GPU/CPU layouts (cold experts in cheap RAM), and serving math unlike a dense model of either size

</div>

---

<!-- .slide: id="quiz-buy-build" -->

## The Self-Hosting Spreadsheet

<div class="quiz-prompt">

Your startup serves 50 million tokens a day at a steady rate through a rented API. What numbers would you gather to decide whether to self-host?

</div>

<div class="fragment note quiz-answer">

**Short answer: your current API bill per month; a candidate model that passes your Module 9 evals; its measured batched throughput on a rentable GPU; that GPU's cost per hour; and the ops cost you'd take on.**

- Core comparison, cost per million tokens: GPU $/hour &divide; batched throughput, against the API price
- Apply a utilization factor: you pay for peak capacity, the API bills per token
- Steady volume favors self-hosting; spiky load, frontier-model needs, and the ops line favor renting

</div>

          '<button class="iw-btn active" data-gpu data-val="a100">A100 80GB</button>' +
          '<button class="iw-btn" data-gpu data-val="l40s">L40S 48GB</button>' +
          '<button class="iw-btn" data-gpu data-val="rtx">RTX 4090 24GB</button>' +
          '<span class="iw-label">attention:</span>' +
          '<button class="iw-btn active" data-attn data-val="32">MHA (32 KV heads)</button>' +
          '<button class="iw-btn" data-attn data-val="8">GQA (8)</button>' +
          '<button class="iw-btn" data-attn data-val="1">MQA (1)</button>' +
        '</div>' +
        '<p class="iw-readout"></p>' +
      '</div>';
    U.stop(host);
    var canvas = host.querySelector('.iw-canvas');
    var readout = host.querySelector('.iw-readout');
    var el = {};
    host.querySelectorAll('[data-el]').forEach(function (n) { el[n.getAttribute('data-el')] = n; });

    function compute() {
      var v = read();
      var dHead = 128;                      // fixed, as in most production models
      // 2 (K and V) * layers * kv-heads * head-dim * 2 bytes (fp16 cache)
      var perTok = 2 * v.layers * state.kvheads * dHead * 2;
      var perReq = perTok * v.ctx * 1024 / 1e9;                 // GB
      var weights = v.params * 1e9 * (state.wbits / 8) / 1e9;   // GB
      var hbm = GPUS[state.gpu].hbm;
      var overhead = hbm * 0.08;            // activations, fragmentation, runtime
      var free = Math.max(0, hbm - weights - overhead);
      return {
        v: v, perTok: perTok, perReq: perReq, weights: weights,
        hbm: hbm, overhead: overhead, free: free,
        used: perReq * v.conc,
        fit: perReq > 0 ? Math.floor(free / perReq) : 0
      };
    }

    function draw() {
      var c = compute();
      var f = U.fit(canvas); if (!f) return;
      var ctx = f.ctx, W = f.w, H = f.h;
      ctx.clearRect(0, 0, W, H);

      var padL = 26, padR = 26, barY = 62, barH = 62;
      var bw = W - padL - padR;
      var scale = bw / c.hbm;

      ctx.textAlign = 'center'; ctx.font = '12px Inter, sans-serif'; ctx.fillStyle = COL.muted;
      ctx.fillText(GPUS[state.gpu].name + ' memory, allocated left to right', W / 2, 22);

      // `gb` is the drawn width; `shown` is the number to print when the
      // segment had to be clipped to the edge of the card.
      function seg(x, gb, fill, stroke, label, shown) {
        var w = Math.max(0, gb * scale);
        if (w <= 0) return x;
        ctx.fillStyle = fill;
        ctx.fillRect(x, barY, Math.min(w, padL + bw - x), barH);
        ctx.strokeStyle = stroke; ctx.lineWidth = 1;
        ctx.strokeRect(x, barY, Math.min(w, padL + bw - x), barH);
        if (w > 60) {
          ctx.fillStyle = stroke;
          ctx.font = '600 12px Inter, sans-serif';
          ctx.fillText(label, x + Math.min(w, padL + bw - x) / 2, barY + barH / 2 + 4);
          ctx.font = '11px Inter, sans-serif';
          ctx.fillStyle = COL.muted;
          ctx.fillText(U.fmtBytes(shown === undefined ? gb : shown) +
            (shown !== undefined && shown > gb + 1e-9 ? ' needed' : ''),
            x + Math.min(w, padL + bw - x) / 2, barY + barH / 2 + 20);
        }
        return x + w;
      }

      ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5;
      ctx.strokeRect(padL, barY, bw, barH);

      var x = padL;
      x = seg(x, c.weights, 'rgba(74,158,255,0.55)', COL.primary, 'weights');
      x = seg(x, c.overhead, 'rgba(136,146,164,0.30)', COL.muted, 'runtime');
      var overflow = c.used > c.free;
      x = seg(x, Math.min(c.used, c.free), 'rgba(245,166,35,0.6)', COL.secondary, 'KV cache', c.used);
      if (overflow) {
        ctx.fillStyle = 'rgba(231,76,60,0.35)';
        ctx.fillRect(padL, barY, bw, barH);
        ctx.fillStyle = COL.red;
        ctx.font = '600 15px Inter, sans-serif';
        ctx.fillText('out of memory: needs ' + U.fmtBytes(c.weights + c.overhead + c.used) +
          ' on a ' + c.hbm + ' GB card', W / 2, barY + barH + 34);
      } else {
        ctx.fillStyle = COL.muted; ctx.font = '12px Inter, sans-serif';
        ctx.fillText(U.fmtBytes(c.free - c.used) + ' still free for more requests', W / 2, barY + barH + 30);
      }

      // Second row: how the cache grows with concurrency at this context length.
      var gy = barY + barH + 58;
      var gh = H - gy - 24;
      if (gh > 40) {
        ctx.textAlign = 'left'; ctx.fillStyle = COL.muted; ctx.font = '11px Inter, sans-serif';
        ctx.fillText('cache demand vs concurrent requests', padL, gy - 6);
        ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(padL, gy + gh); ctx.lineTo(W - padR, gy + gh); ctx.stroke();
        var maxR = 128, maxGB = Math.max(c.free, c.perReq * maxR);
        ctx.strokeStyle = COL.secondary; ctx.lineWidth = 2;
        ctx.beginPath();
        for (var r = 1; r <= maxR; r++) {
          var px = padL + ((r - 1) / (maxR - 1)) * (W - padL - padR);
          var py = gy + gh - Math.min(1, (c.perReq * r) / maxGB) * gh;
          if (r === 1) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
        var fy = gy + gh - Math.min(1, c.free / maxGB) * gh;
        ctx.strokeStyle = COL.green; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(padL, fy); ctx.lineTo(W - padR, fy); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = COL.green;
        ctx.fillText('memory left after weights', padL + 6, fy - 6);
        ctx.fillStyle = COL.muted;
        ctx.textAlign = 'left';
        ctx.fillText('1 request', padL, gy + gh + 14);
        ctx.textAlign = 'right';
        ctx.fillText(maxR + ' requests', W - padR, gy + gh + 14);
        ctx.textAlign = 'center';
      }

      el.perTok.textContent = U.fmtBytes(c.perTok / 1e9);
      el.perReq.textContent = U.fmtBytes(c.perReq);
      el.fit.textContent = String(c.fit);
      el.fitbox.className = 'iw-stat ' + (c.fit < 1 ? 'warn' : c.fit >= c.v.conc ? 'good' : 'warn');

      U.setVal(host, 'params', c.v.params + 'B');
      U.setVal(host, 'layers', String(c.v.layers));
      U.setVal(host, 'ctx', c.v.ctx + 'K');
      U.setVal(host, 'conc', String(c.v.conc));

      readout.innerHTML = c.fit < 1
        ? 'The weights alone leave no room for a single request at this context length.'
        : 'At <strong>' + c.v.ctx + 'K context</strong> this card serves <strong>' + c.fit +
          '</strong> concurrent requests. The cache, not the arithmetic, sets that ceiling &mdash; which is why GQA and paging exist.';
    }

    var read = U.bindSliders(host, draw);
    U.bindToggle(host, '[data-gpu]', function (val) { state.gpu = val; draw(); });
    U.bindToggle(host, '[data-attn]', function (val) { state.kvheads = parseInt(val, 10); draw(); });
    draw();
    return { resize: draw };
  }

  // ===================================================================
  // WIDGET: quantExplorer — round a weight distribution onto a grid of
  // 2^bits levels and watch both the file size and the error move.
  // ===================================================================
  function quantExplorer(host) {
    var U = WIDGET_UTIL, COL = WIDGET_UTIL.COL;
    var state = { bits: 8, outlier: false, params: 7 };

    // A fixed bell-shaped sample of weights, plus a couple of far outliers.
    var WEIGHTS = (function () {
      var rand = U.rng(31337), out = [];
      for (var i = 0; i < 600; i++) {
        var u = rand(), v = rand();
        out.push(Math.sqrt(-2 * Math.log(u + 1e-9)) * Math.cos(2 * Math.PI * v) * 0.25);
      }
      return out;
    }());
    var OUTLIERS = [2.9, -2.6, 3.4];

    host.innerHTML =
      '<div class="iw">' +
        '<div class="iw-canvas-wrap"><canvas class="iw-canvas"></canvas></div>' +
        '<div class="iw-stats">' +
          '<div class="iw-stat"><span class="iw-stat-num" data-el="lv">0</span><span class="iw-stat-lab">distinct levels</span></div>' +
          '<div class="iw-stat"><span class="iw-stat-num" data-el="sz">0</span><span class="iw-stat-lab">7B checkpoint</span></div>' +
          '<div class="iw-stat" data-el="errbox"><span class="iw-stat-num" data-el="err">0</span><span class="iw-stat-lab">RMS error</span></div>' +
        '</div>' +
        '<div class="iw-sliders">' +
          U.sliderHTML('bits', 'bits per weight', 2, 16, 1, 8) +
        '</div>' +
        '<div class="iw-controls">' +
          '<button class="iw-btn" data-act="outlier">Add three outlier weights</button>' +
        '</div>' +
        '<p class="iw-readout"></p>' +
      '</div>';
    U.stop(host);
    var canvas = host.querySelector('.iw-canvas');
    var readout = host.querySelector('.iw-readout');
    var el = {};
    host.querySelectorAll('[data-el]').forEach(function (n) { el[n.getAttribute('data-el')] = n; });

    function values() { return state.outlier ? WEIGHTS.concat(OUTLIERS) : WEIGHTS; }

    // Absmax scaling: one scale for the whole tensor, so the range is set by
    // the largest magnitude present, outliers included.
    function quantize(vals, bits) {
      var maxAbs = 0;
      vals.forEach(function (w) { maxAbs = Math.max(maxAbs, Math.abs(w)); });
      var levels = Math.pow(2, bits);
      var step = (2 * maxAbs) / (levels - 1);
      var err = 0;
      var q = vals.map(function (w) {
        var r = Math.round((w + maxAbs) / step) * step - maxAbs;
        err += (r - w) * (r - w);
        return r;
      });
      return { q: q, step: step, maxAbs: maxAbs, rms: Math.sqrt(err / vals.length), levels: levels };
    }

    function draw() {
      var v = read();
      state.bits = v.bits;
      var vals = values();
      var res = quantize(vals, state.bits);

      var f = U.fit(canvas); if (!f) return;
      var ctx = f.ctx, W = f.w, H = f.h;
      ctx.clearRect(0, 0, W, H);

      var padL = 30, padR = 30, padT = 28, padB = 40;
      var pw = W - padL - padR, ph = H - padT - padB;
      var lim = res.maxAbs * 1.05;
      function X(w) { return padL + ((w + lim) / (2 * lim)) * pw; }

      ctx.textAlign = 'center'; ctx.font = '12px Inter, sans-serif'; ctx.fillStyle = COL.muted;
      ctx.fillText('weight values (bars) snapped onto the representable grid (ticks below)', W / 2, 16);

      // Histogram of the original weights.
      var BINS = 90, hist = new Array(BINS).fill(0);
      vals.forEach(function (w) {
        var b = Math.floor(((w + lim) / (2 * lim)) * BINS);
        if (b >= 0 && b < BINS) hist[b]++;
      });
      var hmax = Math.max.apply(null, hist);
      var bw = pw / BINS;
      for (var i = 0; i < BINS; i++) {
        if (!hist[i]) continue;
        var h = (hist[i] / hmax) * (ph - 46);
        ctx.fillStyle = 'rgba(74,158,255,0.55)';
        ctx.fillRect(padL + i * bw, padT + (ph - 46) - h, Math.max(1, bw - 1), h);
      }

      // Grid ticks; drawn only when sparse enough to read.
      var gy = padT + ph - 34;
      ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(W - padR, gy); ctx.stroke();
      if (res.levels <= 256) {
        ctx.strokeStyle = 'rgba(245,166,35,0.85)'; ctx.lineWidth = res.levels <= 32 ? 1.6 : 0.7;
        for (var L = 0; L < res.levels; L++) {
          var val = -res.maxAbs + L * res.step;
          var x = X(val);
          ctx.beginPath(); ctx.moveTo(x, gy - 8); ctx.lineTo(x, gy + 8); ctx.stroke();
        }
      } else {
        ctx.fillStyle = COL.secondary; ctx.font = '12px Inter, sans-serif';
        ctx.fillText(res.levels.toLocaleString() + ' levels: the grid is finer than the pixels', W / 2, gy + 5);
      }

      ctx.fillStyle = COL.muted; ctx.font = '11px Inter, sans-serif';
      ctx.fillText('-' + res.maxAbs.toFixed(2), padL + 12, gy + 26);
      ctx.fillText('+' + res.maxAbs.toFixed(2), W - padR - 12, gy + 26);
      ctx.fillText('0', X(0), gy + 26);

      el.lv.textContent = res.levels >= 1000 ? U.fmtCount(res.levels) : String(res.levels);
      el.sz.textContent = U.fmtBytes(state.params * 1e9 * state.bits / 8 / 1e9);
      el.err.textContent = res.rms.toFixed(4);
      el.errbox.className = 'iw-stat ' + (res.rms > 0.05 ? 'warn' : res.rms < 0.005 ? 'good' : '');
      U.setVal(host, 'bits', state.bits + '-bit');

      readout.innerHTML = state.outlier
        ? 'Three outliers stretched the range to <strong>&plusmn;' + res.maxAbs.toFixed(2) +
          '</strong>, so every ordinary weight now shares a coarser grid and RMS error jumps to <strong>' +
          res.rms.toFixed(4) + '</strong>. Handling outliers separately is the whole trick behind LLM.int8 and NF4.'
        : 'A 7B model in fp16 is <strong>14 GB</strong>; at <strong>' + state.bits + '-bit</strong> it is <strong>' +
          U.fmtBytes(state.params * 1e9 * state.bits / 8 / 1e9) +
          '</strong>. Below about 4 bits the grid gets coarse enough that quality starts to move.';
    }

    var read = U.bindSliders(host, draw);
    host.querySelector('[data-act="outlier"]').addEventListener('click', function (e) {
      state.outlier = !state.outlier;
      e.currentTarget.classList.toggle('active', state.outlier);
      e.currentTarget.textContent = state.outlier ? 'Remove the outlier weights' : 'Add three outlier weights';
      draw();
    });
    draw();
    return { resize: draw };
  }

  window.MODULE_CONFIG = {
    title: 'LLMs 0 to 100 - Module 10',
    manimSections: {},
    widgets: {
      kvBudget: kvBudget,
      quantExplorer: quantExplorer
    }
  };
}());

  </script>

  <!-- Shared deck logic for every module -->
  <script>
// =====================================================================
// Core deck infrastructure: Manim steppers, Reveal.js init, syntax
// highlighting, interactive widget plumbing, and per-module hooks.
// Loaded before any widget definitions.
// =====================================================================

// =====================================================================
// Shared deck logic for every module. Per-module data and hooks arrive
// via window.MODULE_CONFIG, set by each module's config.js (which the
// build inlines BEFORE this file):
//
//   window.MODULE_CONFIG = {
//     title:          'LLMs 0 to 100 - Module N',  // sets document.title
//     manimSections:  { scene: ['Clip_0000.mp4', ...], ... },
//     widgets:        { name: function(host){...}, ... },  // optional
//     onReady:        function(reveal){...},               // optional
//     onSlideChanged: function(event){...}                 // optional
//   };
// =====================================================================
var MODULE_CONFIG = window.MODULE_CONFIG || {};

// ---- Manim section step-through player ----
// Section video lists are inline to avoid fetch() issues with file:// protocol.
var MANIM_SECTIONS = MODULE_CONFIG.manimSections || {};

var manimSteppers = {};

function initManimStepper(video) {
  var scene = video.getAttribute('data-manim-scene');
  var sections = MANIM_SECTIONS[scene] || [];
  var state = { sections: sections, current: -1, playing: false, video: video, scene: scene };
  manimSteppers[scene] = state;

  // Set poster frame from first section
  if (sections.length > 0) {
    video.src = (window.ASSET_BASE || '') + 'media/sections/' + sections[0];
    video.load();
  }

  video.addEventListener('ended', function() {
    state.playing = false;
  });
}

function advanceManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state || state.playing) return false;
  if (state.current >= state.sections.length - 1) return false;

  state.current++;
  state.playing = true;
  var file = state.sections[state.current];
  state.video.src = (window.ASSET_BASE || '') + 'media/sections/' + file;
  state.video.load();
  state.video.play().then(function() {}).catch(function() { state.playing = false; });
  return true;
}

function resetManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state) return;
  state.current = -1;
  state.playing = false;
  state.video.pause();
  if (state.sections.length > 0) {
    state.video.src = (window.ASSET_BASE || '') + 'media/sections/' + state.sections[0];
    state.video.load();
  }
}

// Instantly finish the section that is currently playing by jumping to its
// final frame. This lets an impatient "next" complete the animation in
// place rather than leaking through to reveal and skipping the slide.
// Returns true if it consumed the action (a video was actually playing).
function skipManimStepper(scene) {
  var state = manimSteppers[scene];
  if (!state || !state.playing) return false;
  var v = state.video;
  v.pause();
  // Seek just shy of the end so the step's end state stays on screen.
  if (v.duration && isFinite(v.duration)) {
    try { v.currentTime = Math.max(0, v.duration - 0.04); } catch (e) {}
  }
  state.playing = false;
  return true;
}

// One forward action on a manim slide. If a section is mid-play, the press
// completes it (skip to the end frame); otherwise it advances to the next
// section. Returns false only when there is nothing left to animate, which
// is the signal that reveal.js may now move on to the next slide.
function manimForward(scene) {
  var state = manimSteppers[scene];
  if (!state) return false;
  if (state.playing) return skipManimStepper(scene);
  return advanceManimStepper(scene);
}

// ---- Initialize Reveal.js ----
Reveal.initialize({
  width: 1280,
  height: 720,
  margin: 0,
  controls: true,
  progress: true,
  slideNumber: false,
  hash: true,
  transition: 'none',
  center: false,
  autoAnimateDuration: 0.8,
  plugins: [ RevealHighlight, RevealMarkdown ]
});

// ---- Syntax highlighting ----
// reveal-markdown converts the inline <textarea> into <pre><code> blocks
// in a deferred microtask, AFTER the highlight plugin's init() has already
// run, so code ships un-highlighted. Re-trigger the plugin once the blocks
// exist (on ready) and for any added later (on slidechanged).
function highlightAllCodeBlocks() {
  if (!Reveal.getPlugin) return;
  var hl = Reveal.getPlugin('highlight');
  if (!hl || typeof hl.highlightBlock !== 'function') return;
  document.querySelectorAll('pre code').forEach(function(block) {
    if (block.dataset.highlighted === 'yes') return;
    hl.highlightBlock(block);
  });
}
// reveal-markdown may materialize blocks in waves, so re-run the
// (idempotent) pass across the startup window rather than once.
Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    highlightAllCodeBlocks();
    if (tries > 25) clearInterval(iv);
  }, 100);
});
Reveal.on('slidechanged', highlightAllCodeBlocks);
Reveal.on('fragmentshown', highlightAllCodeBlocks);

function initStepperClickHandlers() {
  document.querySelectorAll('.manim-stepper').forEach(function(video) {
    if (video.dataset.clickInit) return;
    video.dataset.clickInit = '1';
    video.style.cursor = 'pointer';
    video.addEventListener('click', function(e) {
      var scene = video.getAttribute('data-manim-scene');
      manimForward(scene);
      e.stopPropagation();
      e.preventDefault();
    });
  });
}

function initAllSteppers() {
  document.querySelectorAll('.manim-stepper').forEach(function(v) {
    if (!manimSteppers[v.getAttribute('data-manim-scene')]) {
      initManimStepper(v);
    }
  });
  initStepperClickHandlers();
}

function renderMath() {
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false}
      ]
    });
  }
}

// reveal-markdown loads slides asynchronously, so the 'ready' event may
// fire before the markdown content is in the DOM. Poll briefly.
Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    if (document.querySelectorAll('section').length > 5 || tries > 20) {
      clearInterval(iv);
      initAllSteppers();
      renderMath();
    }
  }, 100);
});

// Reset steppers when leaving a slide
Reveal.on('slidechanged', function(event) {
  initAllSteppers();
  Object.keys(manimSteppers).forEach(function(scene) {
    if (!event.currentSlide.querySelector('[data-manim-scene="' + scene + '"]')) {
      resetManimStepper(scene);
    }
  });
});

// Intercept right arrow / space / enter on manim slides to step through
// sections. manimForward consumes the press while there is still animation
// to play (completing the current section or starting the next), so reveal
// only advances the slide once every section has been shown.
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
    var currentSlide = Reveal.getCurrentSlide();
    var stepper = currentSlide ? currentSlide.querySelector('.manim-stepper') : null;
    if (stepper) {
      var scene = stepper.getAttribute('data-manim-scene');
      if (manimForward(scene)) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }
  }
}, true);

// The on-screen controls (controls: true) navigate directly and bypass the
// keydown handler above, so guard the forward arrows the same way: a forward
// control press on a manim slide steps the animation before leaving.
document.addEventListener('click', function(e) {
  var btn = e.target.closest ? e.target.closest('.navigate-right, .navigate-down') : null;
  if (!btn) return;
  var currentSlide = Reveal.getCurrentSlide();
  var stepper = currentSlide ? currentSlide.querySelector('.manim-stepper') : null;
  if (stepper && manimForward(stepper.getAttribute('data-manim-scene'))) {
    e.stopImmediatePropagation();
    e.preventDefault();
  }
}, true);

// =====================================================================
// Interactive widgets (:::interactive). Each widget is a factory keyed
// by its `data-widget` value; it owns its host element and (re)draws
// whenever its slide becomes visible or the window resizes.
// =====================================================================
var INTERACTIVE_WIDGETS = {};

function hydrateInteractiveWidgets() {
  document.querySelectorAll('.interactive-host[data-widget]').forEach(function(host) {
    if (host.dataset.hydrated) return;
    var factory = INTERACTIVE_WIDGETS[host.getAttribute('data-widget')];
    if (!factory) return;
    host.dataset.hydrated = '1';
    host._widget = factory(host) || null;
  });
}

function refreshInteractiveWidgets() {
  document.querySelectorAll('.interactive-host[data-widget]').forEach(function(host) {
    if (host._widget && typeof host._widget.resize === 'function') host._widget.resize();
  });
}

Reveal.on('ready', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    if (document.querySelector('.interactive-host[data-widget]') || tries > 25) {
      clearInterval(iv);
      hydrateInteractiveWidgets();
      requestAnimationFrame(refreshInteractiveWidgets);
    }
  }, 100);
});
Reveal.on('slidechanged', function() {
  hydrateInteractiveWidgets();
  requestAnimationFrame(refreshInteractiveWidgets);
});
window.addEventListener('resize', refreshInteractiveWidgets);

// ---- Per-module hooks (from MODULE_CONFIG) ----
if (MODULE_CONFIG.title) document.title = MODULE_CONFIG.title;
if (MODULE_CONFIG.widgets) Object.assign(INTERACTIVE_WIDGETS, MODULE_CONFIG.widgets);
if (typeof MODULE_CONFIG.onReady === 'function') {
  Reveal.on('ready', function() { MODULE_CONFIG.onReady(Reveal); });
}
if (typeof MODULE_CONFIG.onSlideChanged === 'function') {
  Reveal.on('slidechanged', function(event) { MODULE_CONFIG.onSlideChanged(event); });
}

// =====================================================================
// Slide annotation / drawing overlay.
//
// A full-viewport <canvas> the presenter can draw on top of any slide.
// Strokes are stored per slide (keyed by Reveal indices, in normalized
// coordinates) so they survive navigation and window resizes. A small
// floating toolbar exposes pen colors, an eraser, undo, and clear.
//
// Keyboard:
//   d       toggle draw mode on/off
//   e       eraser (while in draw mode)
//   c       clear the current slide's drawing
//   u       undo the last stroke
//   Escape  exit draw mode
//
// While draw mode is active, Reveal's own keyboard/touch navigation is
// suspended so drawing gestures never flip the slide.
// =====================================================================
(function () {
  'use strict';

  var PALETTE = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#ffffff'];
  var PEN_WIDTH = 3;
  var ERASER_WIDTH = 28;

  // strokesBySlide[key] = [ {color, width, erase, points:[{x,y}, ...]}, ... ]
  // Points are normalized to [0,1] against the canvas so they rescale on resize.
  var strokesBySlide = {};

  var canvas, ctx, toolbar;
  var drawMode = false;
  var erasing = false;
  var color = PALETTE[0];
  var drawing = false;
  var currentStroke = null;

  // ---- slide identity + canvas geometry ----
  function slideKey() {
    var idx = (typeof Reveal !== 'undefined' && Reveal.getIndices) ? Reveal.getIndices() : { h: 0, v: 0 };
    return idx.h + '-' + (idx.v || 0);
  }

  function strokes() {
    var k = slideKey();
    if (!strokesBySlide[k]) strokesBySlide[k] = [];
    return strokesBySlide[k];
  }

  // Size the backing store to device pixels for crisp lines, keep the CSS
  // box at viewport size, then repaint the current slide's strokes.
  function resizeCanvas() {
    if (!canvas) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }

  function drawStroke(s) {
    if (!s.points.length) return;
    var w = window.innerWidth, h = window.innerHeight;
    ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.points[0].x * w, s.points[0].y * h);
    for (var i = 1; i < s.points.length; i++) {
      ctx.lineTo(s.points[i].x * w, s.points[i].y * h);
    }
    // A single tap should still leave a visible dot.
    if (s.points.length === 1) ctx.lineTo(s.points[0].x * w + 0.01, s.points[0].y * h);
    ctx.stroke();
  }

  function redraw() {
    if (!ctx) return;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    strokes().forEach(drawStroke);
  }

  // While drawing, the canvas captures pointer events. Arrow/space keys still
  // navigate slides (they never conflict with pointer drawing), so keyboard
  // nav stays on; only touch/swipe is suspended so finger-drawing on a
  // touchscreen can't flip the slide out from under the pen.
  function setDrawMode(on) {
    drawMode = on;
    if (!on) erasing = false;
    document.body.classList.toggle('draw-mode', on);
    if (canvas) canvas.style.pointerEvents = on ? 'auto' : 'none';
    if (typeof Reveal !== 'undefined' && Reveal.configure) {
      Reveal.configure({ touch: !on });
    }
    updateToolbar();
  }

  function setColor(c) {
    color = c;
    erasing = false;
    if (!drawMode) setDrawMode(true);
    updateToolbar();
  }

  function setEraser() {
    erasing = true;
    if (!drawMode) setDrawMode(true);
    updateToolbar();
  }

  function clearSlide() {
    strokesBySlide[slideKey()] = [];
    redraw();
  }

  function undo() {
    strokes().pop();
    redraw();
  }

      'body.draw-mode #draw-canvas{cursor:crosshair;}',
      // Hidden by default; slides up into view only while the pointer is in
      // the bottom hover band (see the mousemove handler that toggles .visible).
      '#draw-toolbar{position:fixed;bottom:14px;left:50%;',
      '  transform:translateX(-50%) translateY(24px);',
      '  z-index:60;display:flex;align-items:center;gap:8px;padding:7px 10px;',
      '  background:rgba(20,20,24,0.92);border:1px solid rgba(255,255,255,0.18);',
      '  border-radius:10px;opacity:0;pointer-events:none;',
      '  transition:opacity 0.15s,transform 0.15s;font-family:sans-serif;}',
      '#draw-toolbar.visible{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}',
      '.draw-btn{width:26px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,0.25);',
      '  background:transparent;cursor:pointer;padding:0;display:flex;align-items:center;',
      '  justify-content:center;color:#fff;font-size:14px;line-height:1;}',
      '.draw-btn:hover{background:rgba(255,255,255,0.15);}',
      '.draw-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}',
      '.draw-swatch.active{border-color:#fff;}',
      '.draw-btn.active{background:rgba(255,255,255,0.28);}',
      '.draw-sep{width:1px;height:22px;background:rgba(255,255,255,0.2);}'
    ].join('\n');
    var style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);
  }

  function buildToolbar() {
    toolbar = document.createElement('div');
    toolbar.id = 'draw-toolbar';

    // Pen toggle
    var penBtn = document.createElement('button');
    penBtn.className = 'draw-btn';
    penBtn.dataset.role = 'pen';
    penBtn.title = 'Draw (d)';
    penBtn.textContent = '✎'; // pencil
    penBtn.addEventListener('click', function () { setDrawMode(!drawMode); });
    toolbar.appendChild(penBtn);

    toolbar.appendChild(sep());

    // Color swatches
    PALETTE.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'draw-swatch';
      b.dataset.color = c;
      b.style.background = c;
      b.title = 'Pen color';
      b.addEventListener('click', function () { setColor(c); });
      toolbar.appendChild(b);
    });

    toolbar.appendChild(sep());

    // Eraser / undo / clear
    toolbar.appendChild(iconBtn('⊘', 'Eraser (e)', 'eraser', setEraser));
    toolbar.appendChild(iconBtn('↶', 'Undo (u)', 'undo', undo));
    toolbar.appendChild(iconBtn('✕', 'Clear slide (c)', 'clear', clearSlide));

    document.body.appendChild(toolbar);
    updateToolbar();
  }

  function sep() {
    var s = document.createElement('span');
    s.className = 'draw-sep';
    return s;
  }

  function iconBtn(glyph, title, role, handler) {
    var b = document.createElement('button');
    b.className = 'draw-btn';
    b.dataset.role = role;
    b.title = title;
    b.textContent = glyph;
    b.addEventListener('click', handler);
    return b;
  }

  function updateToolbar() {
    if (!toolbar) return;
    toolbar.querySelectorAll('.draw-swatch').forEach(function (b) {
      b.classList.toggle('active', drawMode && !erasing && b.dataset.color === color);
    });
    var pen = toolbar.querySelector('[data-role="pen"]');
    if (pen) pen.classList.toggle('active', drawMode);
    var er = toolbar.querySelector('[data-role="eraser"]');
    if (er) er.classList.toggle('active', drawMode && erasing);
  }

  // ---- pointer drawing ----
  function point(e) {
    return { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight };
  }

  function startStroke(e) {
    if (!drawMode) return;
    drawing = true;
    currentStroke = {
      color: color,
      width: erasing ? ERASER_WIDTH : PEN_WIDTH,
      erase: erasing,
      points: [point(e)]
    };
    strokes().push(currentStroke);
    if (canvas.setPointerCapture && e.pointerId != null) {
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
    e.preventDefault();
  }

  function extendStroke(e) {
    if (!drawing || !currentStroke) return;
    currentStroke.points.push(point(e));
    redraw();
    e.preventDefault();
  }

  function endStroke() {
    drawing = false;
    currentStroke = null;
  }

  function bindCanvasEvents() {
    canvas.addEventListener('pointerdown', startStroke);
    canvas.addEventListener('pointermove', extendStroke);
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);
    canvas.addEventListener('pointerleave', endStroke);
  }

  function bindKeys() {
    // Capture phase so we act before Reveal, but only for our bare shortcuts
    // (ignore when a modifier is held or focus is in a text field).
    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;

      if (e.key === 'd' || e.key === 'D') {
        setDrawMode(!drawMode);
        e.preventDefault(); e.stopImmediatePropagation();
      } else if (!drawMode) {
        return; // remaining shortcuts only apply while drawing
      } else if (e.key === 'e' || e.key === 'E') {
        setEraser(); e.preventDefault(); e.stopImmediatePropagation();
      } else if (e.key === 'c' || e.key === 'C') {
        clearSlide(); e.preventDefault(); e.stopImmediatePropagation();
      } else if (e.key === 'u' || e.key === 'U') {
        undo(); e.preventDefault(); e.stopImmediatePropagation();
      } else if (e.key === 'Escape') {
        setDrawMode(false); e.preventDefault(); e.stopImmediatePropagation();
      }
    }, true);
  }

  // Reveal the toolbar only while the pointer is within a band along the
  // bottom of the viewport (or hovering the toolbar itself).
  function bindToolbarReveal() {
    var BAND = 90; // px from the bottom edge
    window.addEventListener('mousemove', function (e) {
      var near = e.clientY >= window.innerHeight - BAND;
      toolbar.classList.toggle('visible', near);
    });
    // Keep it up while the cursor is actually on the toolbar (drawing gestures
    // never fire mousemove there, but plain hover to click a tool should hold).
    toolbar.addEventListener('mouseenter', function () { toolbar.classList.add('visible'); });
  }

  function init() {
    injectStyles();

    canvas = document.createElement('canvas');
    canvas.id = 'draw-canvas';
    document.body.appendChild(canvas);
    ctx = canvas.getContext('2d');

    buildToolbar();
    bindCanvasEvents();
    bindKeys();
    bindToolbarReveal();
    resizeCanvas();

    window.addEventListener('resize', resizeCanvas);
    if (typeof Reveal !== 'undefined' && Reveal.on) {
      // Repaint the destination slide's stored strokes after navigation.
      Reveal.on('slidechanged', redraw);
      Reveal.on('ready', resizeCanvas);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

// MLP Core — Shared neural-net library consumed by multiple widgets.
// Deterministic data generation, preset lookup-model geometry, and the
// Adam trainer (used by the debug harness; the deck uses lookupModel).
// =====================================================================

// =====================================================================
// Shared MLP core for the boundaryExplorer and mlpBoundary widgets.
// The slide widgets use deterministic lookup presets keyed by
// dataset/width/depth so a button click always loads the intended working
// or under-capacity example. The older Adam trainer is kept as a fallback
// helper for the debug harness, but the deck paths pass a dataset name and
// therefore use lookupModel() rather than browser-time training.
// =====================================================================
var MLP = (function () {

  function mulberry32(a) {

      a |= 0; a = a + 0x6D2B79F5 | 0;

      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

      clusters.forEach(function (c) {
        for (var i = 0; i < 20; i++) {
          pts.push({ x: c[0] + (rnd() - 0.5) * 0.6, y: c[1] + (rnd() - 0.5) * 0.6, cls: c[2] });
        }

      for (var i = 0; i < 50; i++) {

        pts.push({ x: Math.cos(t) + (rnd() - 0.5) * 0.12, y: Math.sin(t) + (rnd() - 0.5) * 0.12, cls: 1, idx: i });
        pts.push({ x: 1.1 - Math.cos(t) + (rnd() - 0.5) * 0.12, y: 0.4 - Math.sin(t) + (rnd() - 0.5) * 0.12, cls: 0, idx: i });
      }

        pts.push({ x: -r * Math.cos(t) + (rnd() - 0.5) * 0.04, y: -r * Math.sin(t) + (rnd() - 0.5) * 0.04, cls: 0, idx: i });
